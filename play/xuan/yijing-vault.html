:"从或戕之，凶如何也。","yang":true,"dangwei":"当位","dezhong":"","time":"三位·人位危惧","judge":"凶"},{"pos":4,"title":"九四","yao":"无咎，弗过遇之，往厉必戒，勿用永贞。","xiang":"弗过遇之，位不当也；往厉必戒，终不可长也。","yang":true,"dangwei":"不当位","dezhong":"","time":"四位·近君","judge":"无咎·厉"},{"pos":5,"title":"六五","yao":"密云不雨，自我西郊，公弋取彼在穴。","xiang":"密云不雨，已上也。","yang":false,"dangwei":"不当位","dezhong":"得中","time":"五位·天位君位","judge":"平"},{"pos":6,"title":"上六","yao":"弗遇过之，飞鸟离之，凶，是谓灾眚。","xiang":"弗遇过之，已亢也。","yang":false,"dangwei":"当位","dezhong":"","time":"上位·穷极","judge":"凶"}]},{"no":63,"name":"既济","trigram":"","guaci":"既济，亨小，利贞。","daxiang":"水在火上，既济，君子以思患而豫防之。","lines":[{"pos":1,"title":"初九","yao":"曳其轮，濡其尾，无咎。","xiang":"曳其轮，义无咎也。","yang":true,"dangwei":"当位","dezhong":"","time":"初位·潜藏","judge":"无咎"},{"pos":2,"title":"六二","yao":"妇丧其茀，勿逐，七日得。","xiang":"七日得，以中道也。","yang":false,"dangwei":"当位","dezhong":"得中","time":"二位·地上","judge":"平"},{"pos":3,"title":"九三","yao":"高宗伐鬼方，三年克之，小人勿用。","xiang":"三年克之，惫也。","yang":true,"dangwei":"当位","dezhong":"","time":"三位·人位危惧","judge":"平"},{"pos":4,"title":"六四","yao":"𦈡有衣袽，终日戒。","xiang":"终日戒，有所疑也。","yang":false,"dangwei":"当位","dezhong":"","time":"四位·近君","judge":"平"},{"pos":5,"title":"九五","yao":"东邻杀牛，不如西邻之禴祭，实受其福。","xiang":"东邻杀牛，不如西邻之时也，实受其福，吉大来也。","yang":true,"dangwei":"当位","dezhong":"得中","time":"五位·天位君位","judge":"平"},{"pos":6,"title":"上六","yao":"濡其首，厉。","xiang":"濡其首厉，何可久也。","yang":false,"dangwei":"当位","dezhong":"","time":"上位·穷极","judge":"厉"}]},{"no":64,"name":"未济","trigram":"","guaci":"未济，亨。","daxiang":"火在水上，未济，君子以慎辨物居方。","lines":[{"pos":1,"title":"初六","yao":"濡其尾，吝。","xiang":"濡其尾，亦不知极也。","yang":false,"dangwei":"不当位","dezhong":"","time":"初位·潜藏","judge":"吝"},{"pos":2,"title":"九二","yao":"曳其轮，贞吉。","xiang":"九二贞吉，中以行正也。","yang":true,"dangwei":"不当位","dezhong":"得中","time":"二位·地上","judge":"吉"},{"pos":3,"title":"六三","yao":"未济，征凶，利涉大川。","xiang":"未济征凶，位不当也。","yang":false,"dangwei":"不当位","dezhong":"","time":"三位·人位危惧","judge":"凶"},{"pos":4,"title":"九四","yao":"贞吉，悔亡，震用伐鬼方，三年有赏于大国。","xiang":"贞吉悔亡，志行也。","yang":true,"dangwei":"不当位","dezhong":"","time":"四位·近君","judge":"吉·悔"},{"pos":5,"title":"六五","yao":"贞吉无悔，君子之光，有孚，吉。","xiang":"君子之光，其晖吉也。","yang":false,"dangwei":"不当位","dezhong":"得中","time":"五位·天位君位","judge":"吉·悔"},{"pos":6,"title":"上九","yao":"有孚于饮酒，无咎。濡其首，有孚，失是。","xiang":"饮酒濡首，亦不知节也。","yang":true,"dangwei":"不当位","dezhong":"","time":"上位·穷极","judge":"无咎"}]}];
const IMG=(function(){var o={};for(var g=1;g<=64;g++){for(var i=0;i<=6;i++){o[g+'-'+i]='yao/img/'+g+'-'+i+'.jpg';}}return o;})();
function gua(lines,pos){
  let h='<div class="gua">';
  lines.forEach((l,i)=>{
    const hl=(pos>0&&i+1===pos);
    if(l.yang) h+='<div class="l'+(hl?' hl':'')+'"></div>';
    else h+='<div class="l yin'+(hl?' hl':'')+'"><span></span><span></span></div>';
  });
  return h+'</div>';
}
let cur=1;
function renderNav(){
  const n=document.getElementById('nav');n.innerHTML='';
  DATA.forEach(h=>{
    const b=document.createElement('button');
    b.innerHTML=h.name+'<small>'+h.no+'</small>';
    if(h.no===cur)b.className='active';
    b.onclick=()=>{cur=h.no;render()};
    n.appendChild(b);
  });
}
function render(){
  renderNav();
  const hx=DATA.find(x=>x.no===cur);
  document.getElementById('hhead').innerHTML=
    '<div><span class="t">'+hx.no+' · '+hx.name+'</span><span class="tr">'+hx.trigram+'</span></div>'+
    '<div class="gc">'+hx.guaci+'</div>'+
    (hx.daxiang?'<div class="dx">《象》曰：'+hx.daxiang+'</div>':'');
  const g=document.getElementById('grid');g.innerHTML='';
  // 卦辞总图卡
  g.appendChild(makeCard(null,{title:hx.name,y:"卦 辞",meta:hx.trigram,g:hx.guaci,
    line:hx.guaci,xiang:hx.daxiang,eshuo:"",yong:"",pos:0},hx));
  hx.lines.forEach(l=>g.appendChild(makeCard(l,{title:l.title,y:l.yao.replace(/。$/,''),meta:[l.dangwei,l.dezhong,l.time,l.judge].filter(Boolean).join(' · '),
    g:hx.name+' · '+l.title,line:l.yao,xiang:l.xiang,eshuo:"当位："+l.dangwei+(l.dezhong?' · '+l.dezhong:'')+'；'+l.time+'。',
    yong:"",pos:l.pos},hx)));
}
function makeCard(l,c,hx){
  const el=document.createElement('div');el.className='card';
  const key=hx.no+'-'+(l?l.pos:'0');
  const img=IMG[key]||IMG[hx.no+'-0']||'';
  const imgHtml=img?'<div class="fr-img"><img src="'+img+'"></div>':'<div class="fr-nopic"><div class="gua" style="width:54px;gap:6px">'+
     hx.lines.map(x=>x.yang?'<div class="l"></div>':'<div class="l yin"><span></span><span></span></div>').join('')+'</div></div>';
  el.innerHTML='<div class="inner">'+
    '<div class="face">'+imgHtml+'<div class="fr-veil"></div>'+
    '<div class="fr-top"><div><div class="fr-title">'+c.title+'</div><div class="fr-sub">'+(c.meta||'')+'</div></div>'+
    gua(hx.lines,c.pos)+'</div>'+
    '<div class="fr-foot"><div class="y">'+c.y+'</div><div class="meta">'+(c.meta||'')+'</div></div></div>'+
    '<div class="face back-face"><div class="bk-pos">'+hx.no+' · '+hx.name+' · '+hx.trigram+'</div>'+
    '<div class="bk-title">'+c.title+'</div>'+
    '<div class="bk-line">'+c.line+'</div>'+
    (c.xiang?'<div class="bk-xiang">《象》曰：'+c.xiang+'</div>':'')+
    (c.eshuo?'<div class="bk-block"><h4>象 数 时 位</h4><p>'+c.eshuo+'</p></div>':'')+
    '<div class="bk-tag"><span>第'+hx.no+'卦</span><span>'+c.g+'</span></div></div></div>';
  el.onclick=()=>el.classList.toggle('flip');
  return el;
}
render();
</script>
