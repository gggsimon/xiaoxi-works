<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- 本地版已移除平台注入脚本 /page/page_comm/inject.js：该脚本仅在线托管环境需要，本地打开不影响功能 -->
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<meta content="#1E1610" name="theme-color">
<title>相遇 · 一卦</title>
<link href="https://miaoda.feishu.cn" rel="preconnect">
<link href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1E1610; --bg2:#15100b; --card:#2C2118; --card2:#241a12;
  --gold:#D4A853; --gold-hi:#e7c884; --gold-deep:#9a7338;
  --cinn:#C0563E; --jade:#8FA98C; --ink:#E8DCC8; --mute:#A08E72;
  --line:rgba(212,168,83,.22); --line-soft:rgba(232,220,200,.10);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:var(--serif); color:var(--ink); background:#0c0906;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  display:flex; justify-content:center; overflow-x:hidden;
}
/* 手机画布 */
.stage{
  position:relative; width:100%; max-width:460px; min-height:100dvh;
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(212,168,83,.14), transparent 60%),
    radial-gradient(140% 50% at 50% 110%, rgba(192,86,62,.10), transparent 55%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  box-shadow:0 0 80px rgba(0,0,0,.6); overflow:hidden;
}
/* 星象罗盘暗纹 */
.stage::before{
  content:""; position:fixed; top:50%; left:50%; width:760px; height:760px;
  transform:translate(-50%,-50%); pointer-events:none; opacity:.10;
  background:
    repeating-conic-gradient(from 0deg, rgba(212,168,83,.5) 0deg .4deg, transparent .4deg 11.25deg),
    radial-gradient(circle, transparent 60%, rgba(212,168,83,.35) 60.3%, transparent 60.8%,
      transparent 72%, rgba(212,168,83,.3) 72.3%, transparent 72.8%,
      transparent 86%, rgba(212,168,83,.28) 86.3%, transparent 86.8%);
  -webkit-mask-image:radial-gradient(circle,#000 30%,transparent 72%);
          mask-image:radial-gradient(circle,#000 30%,transparent 72%);
}
.view{display:none; position:relative; z-index:1; padding:34px 26px calc(40px + env(safe-area-inset-bottom)); animation:fade .5s ease both;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* ===== 通用 ===== */
.eyebrow{letter-spacing:.42em; font-size:11px; color:var(--gold); text-indent:.42em; text-align:center; font-weight:500;}
.divider{display:flex;align-items:center;gap:12px;color:var(--gold-deep);margin:22px 0;}
.divider::before,.divider::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--line));}
.divider::after{background:linear-gradient(90deg,var(--line),transparent);}
.btn{
  font-family:var(--serif); cursor:pointer; display:block; width:100%;
  border:1px solid var(--gold); color:var(--gold-hi); background:rgba(212,168,83,.08);
  padding:15px 18px; border-radius:14px; font-size:16px; letter-spacing:.18em; text-indent:.18em;
  transition:.2s; position:relative; overflow:hidden;
}
.btn:active{transform:scale(.985); background:rgba(212,168,83,.18);}
.btn.solid{background:linear-gradient(180deg,var(--gold-hi),var(--gold-deep)); color:#241809; font-weight:700; border-color:var(--gold-hi);}
.btn.ghost{border-color:var(--line-soft); color:var(--mute);}
.hairline{border:1px solid var(--line); border-radius:16px;}

/* ===== 开场 ===== */
#view-home{min-height:100dvh; display:none; flex-direction:column; align-items:center; text-align:center; padding-top:14dvh;}
#view-home.active{display:flex;}
.seal{
  width:62px;height:62px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(160deg,var(--cinn),#8e3a29); color:#f3e6cf;
  font-size:30px;font-weight:900; box-shadow:0 6px 22px rgba(192,86,62,.35), inset 0 0 0 2px rgba(243,230,207,.25);
  margin-bottom:26px;
}
.home-title{font-size:40px;font-weight:900;letter-spacing:.14em; color:var(--ink); text-indent:.14em; line-height:1.1;}
.home-en{margin-top:10px;font-size:10px;letter-spacing:.34em;text-indent:.34em;color:var(--mute);}
.compass{position:relative;width:230px;height:230px;margin:34px 0 30px;}
.compass .ring{position:absolute;inset:0;border-radius:50%;border:1px solid var(--line);}
.compass .r2{inset:22px;border-style:dashed;animation:spin 60s linear infinite;}
.compass .r3{inset:46px;border:1px solid rgba(212,168,83,.16);}
.compass .tick{position:absolute;left:50%;top:50%;width:1px;height:115px;transform-origin:50% 0;}
.compass .tick::after{content:"";position:absolute;top:0;left:0;width:1px;height:9px;background:var(--gold);opacity:.55;}
.compass .coin-big{
  position:absolute;inset:64px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,var(--gold-hi),var(--gold-deep) 70%);
  box-shadow:0 8px 26px rgba(154,115,56,.4), inset 0 0 0 3px rgba(36,24,9,.25);
  animation:breathe 3.4s ease-in-out infinite;
}
.compass .coin-big span{width:26px;height:26px;background:var(--bg2);border-radius:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
.home-sub{font-size:14px;line-height:2;color:var(--mute);max-width:300px;margin-bottom:32px;}
.home-foot{margin-top:auto;padding-top:30px;font-size:10px;letter-spacing:.2em;color:var(--gold-deep);}

/* ===== 摇卦 ===== */
#view-cast{min-height:100dvh;display:none;flex-direction:column;align-items:center;text-align:center;padding-top:16dvh;}
#view-cast.active{display:flex;}
.coins{display:flex;gap:22px;height:96px;align-items:flex-end;margin-bottom:18px;}
.coin{
  width:58px;height:58px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 34% 28%,var(--gold-hi),var(--gold) 45%,var(--gold-deep));
  box-shadow:0 6px 16px rgba(154,115,56,.45), inset 0 0 0 2px rgba(36,24,9,.2);
}
.coin::after{content:"";position:absolute;inset:0;margin:auto;width:17px;height:17px;background:var(--bg2);border-radius:4px;}
.coin.toss{animation:toss 1.1s cubic-bezier(.3,.7,.4,1) infinite;}
.coin:nth-child(2).toss{animation-delay:.18s;} .coin:nth-child(3).toss{animation-delay:.36s;}
@keyframes toss{0%{transform:translateY(0) rotateY(0);}40%{transform:translateY(-40px) rotateY(360deg);}100%{transform:translateY(0) rotateY(720deg);}}
.cast-tip{color:var(--mute);letter-spacing:.2em;font-size:13px;margin-bottom:34px;}
.yao-slot{display:flex;flex-direction:column-reverse;gap:11px;align-items:center;min-height:240px;justify-content:flex-start;}
.slot-row{height:11px;display:flex;gap:14px;opacity:0;transform:translateY(8px);}
.slot-row.drop{animation:drop .35s ease forwards;}
.slot-row i{display:block;height:9px;width:50px;border-radius:3px;background:linear-gradient(180deg,var(--gold-hi),var(--gold-deep));box-shadow:0 2px 6px rgba(0,0,0,.4);}
.slot-row.solid i{width:114px;}
@keyframes drop{to{opacity:1;transform:none;}}

/* ===== 结果 ===== */
.result-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);letter-spacing:.12em;margin-bottom:8px;}
.hex-visual{display:flex;flex-direction:column;gap:10px;align-items:center;margin:18px 0 6px;}
.hyao{height:11px;display:flex;gap:16px;position:relative;justify-content:center;}
.hyao i{display:block;height:10px;width:54px;border-radius:3px;background:linear-gradient(180deg,#cdA455,#8f6a33);}
.hyao.solid i{width:124px;}
.hyao.moving i{background:linear-gradient(180deg,#d97a63,var(--cinn));box-shadow:0 0 12px rgba(192,86,62,.5);}
.hyao.moving::before{content:"动";position:absolute;left:calc(50% + 76px);top:50%;transform:translateY(-50%);font-size:10px;color:var(--cinn);border:1px solid var(--cinn);border-radius:4px;padding:1px 4px;}
.hex-name{text-align:center;margin:18px 0 4px;}
.hex-name .big{font-size:34px;font-weight:900;letter-spacing:.1em;text-indent:.1em;}
.hex-name .sym{font-size:30px;color:var(--gold);margin-left:8px;vertical-align:2px;}
.hex-name .meta{font-size:11px;color:var(--mute);letter-spacing:.2em;margin-top:6px;}
.guaci{background:var(--card);border:1px solid var(--line-soft);border-left:3px solid var(--gold);border-radius:12px;padding:16px 18px;margin-top:18px;font-size:15px;line-height:1.95;}
.guaci .lab{font-size:11px;color:var(--gold);letter-spacing:.24em;display:block;margin-bottom:6px;}
.guaci.baihua{border-left-color:var(--jade);background:var(--card2);color:var(--ink);font-size:14.5px;}
.guaci.baihua .lab{color:var(--jade);}
.fortune{
  margin-top:18px;border:1px solid var(--cinn);border-radius:14px;padding:20px 20px 18px;
  background:linear-gradient(180deg,rgba(192,86,62,.12),rgba(192,86,62,.04));position:relative;
}
.fortune::before{content:"相遇签";position:absolute;top:-10px;left:18px;background:var(--cinn);color:#f6e7d2;font-size:10px;letter-spacing:.2em;padding:2px 9px;border-radius:5px;}
.fortune p{font-size:16.5px;line-height:2;letter-spacing:.02em;}
.change{margin-top:14px;text-align:center;font-size:13px;color:var(--mute);letter-spacing:.06em;}
.change b{color:var(--gold);font-weight:600;}
.result-actions{display:flex;gap:12px;margin-top:22px;}
.result-actions .btn{padding:13px 10px;font-size:14px;}

/* ===== 名片 ===== */
.meet-card{margin-top:6px;background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:20px;padding:26px 22px;text-align:center;}
.avatar{
  width:76px;height:76px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;font-size:32px;font-weight:900;
  background:radial-gradient(circle at 34% 28%,var(--gold-hi),var(--gold-deep));color:#241809;
  box-shadow:0 8px 22px rgba(154,115,56,.4), inset 0 0 0 3px rgba(36,24,9,.18);
}
.m-name{font-size:24px;font-weight:700;letter-spacing:.08em;}
.m-role{margin-top:7px;font-size:13px;color:var(--gold);letter-spacing:.06em;}
.m-project{margin:16px 0 4px;padding:13px 14px;border:1px dashed var(--line);border-radius:12px;font-size:12.5px;line-height:1.85;color:var(--mute);text-align:left;}
.m-project b{color:var(--ink);font-weight:600;}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:18px;}
.cbtn{
  font-family:var(--serif);cursor:pointer;border:1px solid var(--line-soft);background:rgba(232,220,200,.03);
  color:var(--ink);border-radius:12px;padding:13px 8px;font-size:13.5px;letter-spacing:.05em;display:flex;align-items:center;justify-content:center;gap:7px;transition:.2s;
}
.cbtn:active{transform:scale(.97);border-color:var(--gold);color:var(--gold-hi);}
.cbtn svg{width:15px;height:15px;stroke:var(--gold);fill:none;stroke-width:1.7;}
.cbtn.full{grid-column:1 / -1;}
.greet{text-align:center;font-size:12px;color:var(--mute);letter-spacing:.1em;margin:22px 0 6px;line-height:1.9;}
.foot-note{text-align:center;font-size:10px;color:var(--gold-deep);letter-spacing:.18em;margin-top:10px;}
.toast{
  position:fixed;left:50%;bottom:12%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:rgba(20,14,9,.94);border:1px solid var(--gold);color:var(--gold-hi);padding:11px 20px;border-radius:30px;
  font-size:13px;letter-spacing:.08em;transition:.28s;z-index:99;max-width:84%;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;}}
</style>
</head>
<body>
<div class="stage">

  <!-- ============ 视图：开场 ============ -->
  <section class="view active" id="view-home">
    <div class="seal">易</div>
    <h1 class="home-title">相遇 · 一卦</h1>
    <div class="home-en">A HEXAGRAM FOR THIS MEETING</div>
    <div class="compass" id="compass">
      <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
      <div class="coin-big"><span></span></div>
    </div>
    <p class="home-sub">轻触之间，为你我这场相遇<br>起一卦，留个念想</p>
    <button class="btn solid" id="btn-start" style="max-width:280px">屏 息 · 起 一 卦</button>
    <div class="home-foot">AI PASSPORT · 易经口袋</div>
  </section>

  <!-- ============ 视图：摇卦 ============ -->
  <section class="view" id="view-cast">
    <div class="eyebrow">铜 钱 起 卦</div>
    <div class="coins" style="margin-top:30px">
      <div class="coin toss"></div><div class="coin toss"></div><div class="coin toss"></div>
    </div>
    <div class="cast-tip" id="cast-tip">凝神，六爻自下而生……</div>
    <div class="yao-slot" id="yao-slot"></div>
  </section>

  <!-- ============ 视图：结果 + 名片 ============ -->
  <section class="view" id="view-result">
    <div class="result-meta"><span id="r-shichen"></span><span id="r-count"></span></div>
    <div class="hex-visual" id="r-yao"></div>
    <div class="hex-name">
      <div><span class="big" id="r-name"></span><span class="sym" id="r-sym"></span></div>
      <div class="meta" id="r-meta"></div>
    </div>
    <div class="guaci"><span class="lab">卦 辞</span><span id="r-guaci"></span></div>
    <div class="guaci baihua"><span class="lab">白 话</span><span id="r-baihua"></span></div>
    <div class="fortune"><p id="r-fortune"></p></div>
    <div class="change" id="r-change"></div>
    <div class="result-actions">
      <button class="btn ghost" id="btn-again">再 起 一 卦</button>
      <button class="btn" id="btn-save">存 下 此 签</button>
    </div>

    <div class="divider">留 下 我</div>

    <div class="meet-card">
      <div class="avatar" id="m-avatar"></div>
      <div class="m-name" id="m-name"></div>
      <div class="m-role" id="m-role"></div>
      <div class="m-project" id="m-project"></div>
      <div class="contact" id="m-contact"></div>
    </div>
    <div class="greet" id="m-greet"></div>
    <div class="foot-note">AI PASSPORT · I CHING POCKET · OFFLINE</div>
  </section>

  <div class="toast" id="toast"></div>
</div>
<script>

/* ---------- 小工具 ---------- */
const $=s=>document.querySelector(s);
const ZHI=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
function shichenOf(d){return ZHI[Math.floor(((d.getHours()+1)%24)/2)];}
function pad(n){return String(n).padStart(2,"0");}
function weekday(d){return ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];}
function greetOf(d){
  const h=d.getHours();
  let seg = h<4?"夜深了":h<8?"清晨":h<11?"上午":h<13?"正午":h<17?"午后":h<19?"傍晚":h<23?"晚上":"夜深了";
  return `${weekday(d)}${seg}，幸会。`;
}
let toastTimer;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),1900);}
function view(id){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));$("#"+id).classList.add("active");window.scrollTo(0,0);}
const real=v=>!!v && !/你的|example\.com/i.test(v) && !/^https?:\/\/$/.test(v);

/* ---------- 罗盘 24 山向刻度 ---------- */
(function(){const c=$("#compass");for(let i=0;i<24;i++){const t=document.createElement("div");t.className="tick";t.style.transform=`rotate(${i*15}deg)`;c.appendChild(t);}})();

/* ---------- 铜钱起卦（三枚铜钱，自下而上六爻） ----------
   每枚：字(正面)=3，背=2；三枚之和 6老阴(阴,动) 7少阳(阳) 8少阴(阴) 9老阳(阳,动) */
function tossYao(){
  let sum=0;for(let i=0;i<3;i++) sum += Math.random()<0.5?3:2;
  return {yang: sum===7||sum===9, moving: sum===6||sum===9, code:sum};
}
function keyOf(bu){ // bu: 初->上；下卦=初二三，上卦=四五上
  const bit=(i)=>bu[i].yang?1:0;
  const lo=bit(0)+2*bit(1)+4*bit(2), hi=bit(3)+2*bit(4)+4*bit(5);
  return lo+8*hi;
}
function cast(){
  view("view-cast");
  $("#yao-slot").innerHTML="";
  const bu=Array.from({length:6},tossYao);
  const slot=$("#yao-slot"), tip=$("#cast-tip");
  const phases=["初爻，事之始","二爻，见端倪","三爻，下卦成","四爻，转入外","五爻，近其成","上爻，势已定"];
  let i=0;
  const timer=setInterval(()=>{
    const y=bu[i];
    const row=document.createElement("div");
    row.className="slot-row drop"+(y.yang?" solid":"");
    row.innerHTML = y.yang?"<i></i>":"<i></i><i></i>";
    slot.appendChild(row);
    tip.textContent=phases[i];
    i++;
    if(i===6){
      clearInterval(timer);
      setTimeout(()=>render(bu),520);
    }
  },330);
}

/* ---------- 渲染结果 ---------- */
function render(bu){
  const now=new Date();
  const ben=HEX[KEY2IDX[keyOf(bu)]];
  const moved=bu.map(y=>({yang:y.moving?!y.yang:y.yang,moving:false}));
  const hasMove=bu.some(y=>y.moving);
  const bian=hasMove?HEX[KEY2IDX[keyOf(moved)]]:null;
  const moveN=bu.filter(y=>y.moving).length;

  // 卦画：上爻在最上
  const yaoBox=$("#r-yao");yaoBox.innerHTML="";
  for(let k=5;k>=0;k--){
    const y=bu[k];const d=document.createElement("div");
    d.className="hyao"+(y.yang?" solid":"")+(y.moving?" moving":"");
    d.innerHTML=y.yang?"<i></i>":"<i></i><i></i>";
    yaoBox.appendChild(d);
  }
  const benIdx=KEY2IDX[keyOf(bu)]+1;
  $("#r-name").textContent=ben.t;
  $("#r-sym").textContent=ben.s;
  $("#r-meta").textContent=`周易第 ${benIdx} 卦 · 本卦`;
  $("#r-guaci").textContent=ben.g;
  $("#r-baihua").textContent=ben.b;
  $("#r-fortune").textContent=ben.q;
  $("#r-shichen").textContent=`${shichenOf(now)}时 · ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  let count=parseInt(localStorage.getItem("meet_count")||"0",10)+1;
  localStorage.setItem("meet_count",String(count));
  $("#r-count").textContent=`与你的第 ${count} 次相逢`;
  $("#r-change").innerHTML = hasMove
    ? `${moveN} 爻发动，变为 <b>「${bian.t}」${bian.s}</b>——那是这段缘分接下来的走向。`
    : "六爻安静、无动爻，便以本卦看去，当下平稳，顺势即可。";

  window.__last={bu,ben,bian,hasMove,moveN,now};
  view("view-result");
}

/* ---------- 存下此签：优先系统分享，否则复制 ---------- */
function saveSign(){
  const L=window.__last;if(!L)return;
  const z=shichenOf(L.now);
  const change=L.hasMove?`${L.moveN}爻动，变为「${L.bian.t}」${L.bian.s}`:"六爻安静";
  const text=`【相遇·一卦】${z}时得「${L.ben.t}」${L.ben.s}\n卦辞：${L.ben.g}\n${L.ben.q}\n（${change}）\n—— ${CONFIG.name}｜${CONFIG.role}`;
  if(navigator.share){navigator.share({title:"相遇·一卦",text}).catch(()=>{});}
  else if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>toast("签文已复制，去粘贴给对方")).catch(()=>toast("长按页面可手动复制"));}
  else toast("可截图保存这一卦");
}

/* ---------- 名片渲染 ---------- */
const ICON={
  wechat:'<svg viewBox="0 0 24 24"><path d="M9 4C5.1 4 2 6.6 2 9.8c0 1.8 1 3.4 2.6 4.5L4 16.5l2.4-1.2c.8.2 1.7.3 2.6.3h.4a5 5 0 0 1-.2-1.4c0-3 2.9-5.3 6.4-5.3h.4C15.4 6 12.5 4 9 4z"/><path d="M22 14.2c0-2.6-2.5-4.7-5.6-4.7s-5.6 2.1-5.6 4.7 2.5 4.7 5.6 4.7c.7 0 1.4-.1 2-.3l1.9 1-.5-1.7c1.4-.9 2.2-2.2 2.2-3.7z"/></svg>',
  mail:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
  link:'<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1.5 1.5"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1.5-1.5"/></svg>',
  save:'<svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M14 3v4h4"/><path d="M9 13h6"/></svg>'
};
function copyText(t,ok){navigator.clipboard?.writeText(t).then(()=>toast(ok)).catch(()=>toast(ok));}
function saveVCard(){
  const v=["BEGIN:VCARD","VERSION:3.0",`FN:${CONFIG.name}`,`TITLE:${CONFIG.role}`,
    real(CONFIG.email)?`EMAIL:${CONFIG.email}`:"",
    CONFIG.links[0]?`URL:${CONFIG.links[0].url}`:"",
    `NOTE:${CONFIG.project.title}`,"END:VCARD"].filter(Boolean).join("\r\n");
  const url=URL.createObjectURL(new Blob([v],{type:"text/vcard"}));
  const a=document.createElement("a");a.href=url;a.download=`${CONFIG.name}-名片.vcf`;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);toast("名片已生成，按提示存入通讯录");
}
function renderCard(){
  $("#m-name").textContent=CONFIG.name;
  $("#m-role").textContent=CONFIG.role;
  $("#m-avatar").textContent=CONFIG.avatarChar||CONFIG.name.slice(-1);
  $("#m-project").innerHTML=`<b>${CONFIG.project.title}</b><br>${CONFIG.project.desc}`;
  $("#m-greet").textContent=greetOf(new Date());
  const box=$("#m-contact");box.innerHTML="";
  const add=(html,onclick)=>{const b=document.createElement("button");b.className="cbtn";b.innerHTML=html;b.onclick=onclick;box.appendChild(b);return b;};
  if(real(CONFIG.wechat))add(`${ICON.wechat}加微信`,()=>copyText(CONFIG.wechat,"微信号已复制，去微信添加"));
  if(real(CONFIG.email))add(`${ICON.mail}发邮件`,()=>{location.href=`mailto:${CONFIG.email}`;});
  CONFIG.links.forEach(l=>{if(real(l.url))add(`${ICON.link}${l.label}`,()=>window.open(l.url,"_blank","noopener"));});
  add(`${ICON.save}存下联系`,saveVCard).classList.add("full");
}

/* ---------- 事件 ---------- */
$("#btn-start").onclick=cast;
$("#btn-again").onclick=cast;
$("#btn-save").onclick=saveSign;
renderCard();
})();

</script>
