被决除，果决而不偏；持中而行则无咎。","xiaoxiang":"小象 中行无咎，中未光也。"},{"label":"上六","type":"阴爻 · 穷极转化 / 收束","text":"上六：无号，终有凶。","baihua":"到终极而无人呼应，也无可号告；最终有凶。","xiaoxiang":"小象 无号之凶，终不可长也。"}],"special":[],"wenyan":[],"互卦":"䷀ 乾为天 · 第1卦","错卦":"䷖ 山地剥 · 第23卦","综卦":"䷫ 天风姤 · 第44卦","应位":"1/3 有应","中正":"1 中正 · 4 得正","changes":["初九 → ䷛ 泽风大过 · 第28卦","九二 → ䷰ 泽火革 · 第49卦","九三 → ䷹ 兑为泽 · 第58卦","九四 → ䷄ 水天需 · 第5卦","九五 → ䷡ 雷天大壮 · 第34卦","上六 → ䷀ 乾为天 · 第1卦"]},{"index":44,"section":"下经","title":"天风姤","eyebrow":"下经 · 巽下乾上","meta":"巽下乾上 · 巽下乾上","lines_top_down":[1,1,1,1,1,0],"symbol":"䷫","guaci":"姤：女壮，勿用取女。","guaci_baihua":"相遇之时，女子势盛，不宜娶这样的女子。","scriptures":[{"name":"彖曰","text":"姤，遇也，柔遇刚也。勿用取女，不可与长也。天地相遇，品物咸章也。刚遇中正，天下大行也。姤之时义大矣哉！","baihua":"《彖》说姤是相遇，一柔遇五刚。柔遇刚虽有天地品物彰明之象，但“勿用取女”提醒这种遇合不可长久放任；懂得遇合时义很重要。"},{"name":"大象","text":"天下有风，姤；后以施命诰四方。","baihua":"《大象》取象为“天下有风，姤”。白话说：观此卦象，后应当以施命诰四方。"}],"yaos":[{"label":"初六","type":"阴爻 · 初始萌动 / 根基","text":"初六：系于金柅，贞吉。有攸往，见凶，羸豕孚蹢躅。","baihua":"柔邪初遇，应系止于坚固金柅，守正则吉；若放任前往则凶，如瘦猪也会躁动。","xiaoxiang":"小象 系于金柅，柔道牵也。"},{"label":"九二","type":"阳爻 · 内在成形 / 中位","text":"九二：包有鱼，无咎，不利宾。","baihua":"包中有鱼，能制伏初阴之遇；无咎，但不宜让外宾分享或扩散。","xiaoxiang":"小象 包有鱼，义不及宾也。"},{"label":"九三","type":"阳爻 · 下卦成极 / 临界","text":"九三：臀无肤，其行次且，厉，无大咎。","baihua":"行动不安而艰难，有危险；但未与初阴相应，故无大咎。","xiaoxiang":"小象 其行次且，行未牵也。"},{"label":"九四","type":"阳爻 · 转入外卦 / 近上","text":"九四：包无鱼，起凶。","baihua":"包中无鱼，失去所应；由此发动会凶。","xiaoxiang":"小象 无鱼之凶，远民也。"},{"label":"九五","type":"阳爻 · 成熟主位 / 中正","text":"九五：以杞包瓜，含章，有陨自天。","baihua":"以高大杞树包覆瓜实，含藏文德；机缘成熟时如有物自天降。","xiaoxiang":"小象 九五含章，中正也。有陨自天，志不舍命也。"},{"label":"上九","type":"阳爻 · 穷极转化 / 收束","text":"上九：姤其角，吝，无咎。","baihua":"相遇到角端，刚亢而难合；有吝，但因不妄合而无咎。","xiaoxiang":"小象 姤其角，上穷吝也。"}],"special":[],"wenyan":[],"互卦":"䷀ 乾为天 · 第1卦","错卦":"䷗ 地雷复 · 第24卦","综卦":"䷪ 泽天夬 · 第43卦","应位":"1/3 有应","中正":"1 中正 · 2 得正","changes":["初六 → ䷀ 乾为天 · 第1卦","九二 → ䷠ 天山遁 · 第33卦","九三 → ䷅ 天水讼 · 第6卦","九四 → ䷸ 巽为风 · 第57卦","九五 → ䷱ 火风鼎 · 第50卦","上九 → ䷛ 泽风大过 · 第28卦"]},{"index":45,"section":"下经","title":"泽地萃","eyebrow":"下经 · 坤下兑上","meta":"坤下兑上 · 坤下兑上","lines_top_down":[0,1,1,0,0,0],"symbol":"䷬","guaci":"萃：亨。王假有庙，利见大人，亨。利贞。用大牲吉，利有攸往。","guaci_baihua":"聚集亨通。王来到宗庙；利见大人而亨通，利于守正。用大牲祭祀吉，利有所往。","scriptures":[{"name":"彖曰","text":"萃，聚也。顺以说，刚中而应，故聚也。王假有庙，致孝享也。利见大人亨，聚以正也。用大牲吉，利有攸往，顺天命也。观其所聚，而天地万物之情可见矣。","baihua":"《彖》说萃是聚，顺而悦、刚中有应，所以能聚。王至宗庙是致孝享，见大人、用大牲、利有所往，都必须以正聚众、顺天命。"},{"name":"大象","text":"泽上于地，萃；君子以除戎器，戒不虞。","baihua":"《大象》取象为“泽上于地，萃”。白话说：观此卦象，君子应当以除戎器，戒不虞。"}],"yaos":[{"label":"初六","type":"阴爻 · 初始萌动 / 根基","text":"初六：有孚不终，乃乱乃萃。若号，一握为笑。勿恤，往无咎。","baihua":"有诚信却不能终守，于是混乱而聚；若呼号求合，一握手便转笑，不必忧，前往无咎。","xiaoxiang":"小象 乃乱乃萃，其志乱也。"},{"label":"六二","type":"阴爻 · 内在成形 / 中位","text":"六二：引吉，无咎，孚乃利用禴。","baihua":"被引导而聚，吉且无咎；有诚信，则用薄祭也有利。","xiaoxiang":"小象 引吉无咎，中未变也。"},{"label":"六三","type":"阴爻 · 下卦成极 / 临界","text":"六三：萃如嗟如，无攸利；往无咎，小吝。","baihua":"聚集而叹息，无所利；前往可无咎，但小有羞吝。","xiaoxiang":"小象 往无咎，上巽也。"},{"label":"九四","type":"阳爻 · 转入外卦 / 近上","text":"九四：大吉，无咎。","baihua":"能聚众而近尊位，若公正无私则大吉无咎。","xiaoxiang":"小象 大吉无咎，位不当也。"},{"label":"九五","type":"阳爻 · 成熟主位 / 中正","text":"九五：萃有位，无咎；匪孚，元永贞，悔亡。","baihua":"聚于有位者，本无咎；若人未信服，须大而长久守正，悔可亡。","xiaoxiang":"小象 萃有位，志未光也。"},{"label":"上六","type":"阴爻 · 穷极转化 / 收束","text":"上六：赍咨涕洟，无咎。","baihua":"聚到终极而忧叹流涕，能以悲惧反省，不至有咎。","xiaoxiang":"小象 赍咨涕洟，未安上也。"}],"special":[],"wenyan":[],"互卦":"䷴ 风山渐 · 第53卦","错卦":"䷙ 山天大畜 · 第26卦","综卦":"䷭ 地风升 · 第46卦","应位":"2/3 有应","中正":"2 中正 · 3 得正","changes":["初六 → ䷐ 泽雷随 · 第17卦","六二 → ䷮ 泽水困 · 第47卦","六三 → ䷞ 泽山咸 · 第31卦","九四 → ䷇ 水地比 · 第8卦","九五 → ䷏ 雷地豫 · 第16卦","上六 → ䷋ 天地否 · 第12卦"]},{"index":46,"section":"下经","title":"地风升","eyebrow":"下经 · 巽下坤上","meta":"巽下坤上 · 巽下坤上","lines_top_down":[0,0,0,1,1,0],"symbol":"䷭","guaci":"升：元亨，用见大人，勿恤，南征吉。","guaci_baihua":"升进大亨通。宜见大人，不必忧虑；向南进发则吉。","scriptures":[{"name":"彖曰","text":"柔以时升，巽而顺，刚中而应，是以大亨。用见大人勿恤，有庆也。南征吉，志行也。","baihua":"《彖》说升是柔顺因时而上升，巽而顺、刚中有应，所以大亨。见大人不必忧虑，南征而吉，是因为志向得以施行。"},{"name":"大象","text":"地中生木，升；君子以顺德，积小以高大。","baihua":"《大象》取象为“地中生木，升”。白话说：观此卦象，君子应当以顺德，积小以高大。"}],"yaos":[{"label":"初六","type":"阴爻 · 初始萌动 / 根基","text":"初六：允升，大吉。","baihua":"升进之初得到信允，顺势上升；大吉。","xiaoxiang":"小象 允升大吉，上合志也。"},{"label":"九二","type":"阳爻 · 内在成形 / 中位","text":"九二：孚乃利用禴，无咎。","baihua":"有诚信，即使用薄祭也有利；升进贵诚，不贵繁饰，无咎。","xiaoxiang":"小象 九二之孚，有喜也。"},{"label":"九三","type":"阳爻 · 下卦成极 / 临界","text":"九三：升虚邑。","baihua":"上升进入空虚之邑，阻碍少；可顺利推进，但也须充实其虚。","xiaoxiang":"小象 升虚邑，无所疑也。"},{"label":"六四","type":"阴爻 · 转入外卦 / 近上","text":"六四：王用亨于岐山，吉无咎。","baihua":"王在岐山祭享，象征升进得礼、顺承天命；吉无咎。","xiaoxiang":"小象 王用亨于岐山，顺事也。"},{"label":"六五","type":"阴爻 · 成熟主位 / 中正","text":"六五：贞吉，升阶。","baihua":"守正则吉，如登阶而升；上进有序，不越级。","xiaoxiang":"小象 贞吉升阶，大得志也。"},{"label":"上六","type":"阴爻 · 穷极转化 / 收束","text":"上六：冥升，利于不息之贞。","baihua":"升到终极而昏冥，仍想上升；只有把不息之心用于正道才有利。","xiaoxiang":"小象 冥升在上，消不富也。"}],"special":[],"wenyan":[],"互卦":"䷵ 雷泽归妹 · 第54卦","错卦":"䷘ 天雷无妄 · 第25卦","综卦":"䷬ 泽地萃 · 第45卦","应位":"2/3 有应","中正":"0 中正 · 3 得正","changes":["初六 → ䷊ 地天泰 · 第11卦","九二 → ䷎ 地山谦 · 第15卦","九三 → ䷆ 地水师 · 第7卦","六四 → ䷟ 雷风恒 · 第32卦","六五 → ䷯ 水风井 · 第48卦","上六 → ䷑ 山风蛊 · 第18卦"]},{"index":47,"section":"下经","title":"泽水困","eyebrow":"下经 · 坎下兑上","meta":"坎下兑上 · 坎下兑上","lines_top_down":[0,1,1,0,1,0],"symbol":"䷮","guaci":"困：亨，贞大人吉，无咎，有言不信。","guaci_baihua":"困窘中仍可亨通；守正，大人吉，无咎。言语不被信任。","scriptures":[{"name":"彖曰","text":"困，刚揜也。险以说，困而不失其所，亨。其唯君子乎！贞大人吉，以刚中也。有言不信，尚口乃穷也。","baihua":"《彖》说困是阳刚被掩。处险而能悦，困而不失所守，只有君子能这样亨通；大人刚中守正则吉，徒尚口说只会困穷。"},{"name":"大象","text":"泽无水，困；君子以致命遂志。","baihua":"《大象》取象为“泽无水，困”。白话说：观此卦象，君子应当以致命遂志。"}],"yaos":[{"label":"初六","type":"阴爻 · 初始萌动 / 根基","text":"初六：臀困于株木，入于幽谷，三岁不觌。","baihua":"臀被困在树桩上，又入幽谷，长期不得见人；困境之初即闭塞孤绝。","xiaoxiang":"小象 入于幽谷，幽不明也。"},{"label":"九二","type":"阳爻 · 内在成形 / 中位","text":"九二：困于酒食，朱绂方来，利用亨祀。征凶，无咎。","baihua":"困于酒食丰盛之中，荣命将至；宜祭祀守诚，若出征则凶，但守分无咎。","xiaoxiang":"小象 困于酒食，中有庆也。"},{"label":"六三","type":"阴爻 · 下卦成极 / 临界","text":"六三：困于石，据于蒺藜，入于其宫，不见其妻，凶。","baihua":"被石所困，又据刺草，回到家也见不到妻；内外皆困，凶。","xiaoxiang":"小象 据于蒺藜，乘刚也。入于其宫，不见其妻，不祥也。"},{"label":"九四","type":"阳爻 · 转入外卦 / 近上","text":"九四：来徐徐，困于金车，吝，有终。","baihua":"来援迟缓，又困于金车；虽有吝，但最终可有结果。","xiaoxiang":"小象 来徐徐，志在下也。虽不当位，有与也。"},{"label":"九五","type":"阳爻 · 成熟主位 / 中正","text":"九五：劓刖，困于赤绂，乃徐有说，利用祭祀。","baihua":"受刑伤而困于官位荣饰，后来慢慢得以解脱；宜以祭祀诚敬化困。","xiaoxiang":"小象 劓刖，志未得也。乃徐有说，以中直也。利用祭祀，受福也。"},{"label":"上六","type":"阴爻 · 穷极转化 / 收束","text":"上六：困于葛藟，于臲卼，曰动悔。有悔，征吉。","baihua":"困于藤蔓和危动不安之处，自知行动会悔；有悔悟后再出征则吉。","xiaoxiang":"小象 困于葛藟，未当也。动悔有悔，吉行也。"}],"special":[],"wenyan":[],"互卦":"䷤ 风火家人 · 第37卦","错卦":"䷕ 山火贲 · 第22卦","综卦":"䷯ 水风井 · 第48卦","应位":"1/3 有应","中正":"1 中正 · 2 得正","changes":["初六 → ䷹ 兑为泽 · 第58卦","九二 → ䷬ 泽地萃 · 第45卦","六三 → ䷛ 泽风大过 · 第28卦","九四 → ䷜ 坎为水 · 第29卦","九五 → ䷧ 雷水解 · 第40卦","上六 → ䷅ 天水讼 · 第6卦"]},{"index":48,"section":"下经","title":"水风井","eyebrow":"下经 · 巽下坎上","meta":"巽下坎上 · 巽下坎上","lines_top_down":[0,1,0,1,1,0],"symbol":"䷯","guaci":"井：改邑不改井，无丧无得。往来井井。汔至，亦未繘井，羸其瓶，凶。","guaci_baihua":"城邑可以迁改，井不可改；井水无所谓丧失或获得。人们往来取井水；快到井口却未把井绳提出，又打破水瓶，则凶。","scriptures":[{"name":"彖曰","text":"巽乎水而上水，井；井养而不穷也。改邑不改井，乃以刚中也。汔至亦未繘井，未有功也。羸其瓶，是以凶也。","baihua":"《彖》说井是以木入水而上水，井能养人而不穷。邑可改而井不改，象征公共根本不变；将到井口而未汲、毁瓶则无功而凶。"},{"name":"大象","text":"木上有水，井；君子以劳民劝相。","baihua":"《大象》取象为“木上有水，井”。白话说：观此卦象，君子应当以劳民劝相。"}],"yaos":[{"label":"初六","type":"阴爻 · 初始萌动 / 根基","text":"初六：井泥不食，旧井无禽。","baihua":"井底污泥不能饮用，旧井连禽鸟也不来；根基污坏，不能养人。","xiaoxiang":"小象 井泥不食，下也。旧井无禽，时舍也。"},{"label":"九二","type":"阳爻 · 内在成形 / 中位","text":"九二：井谷射鲋，瓮敝漏。","baihua":"井谷只射到小鱼，汲水器又破漏；有水德而不能上济。","xiaoxiang":"小象 井谷射鲋，无与也。"},{"label":"九三","type":"阳爻 · 下卦成极 / 临界","text":"九三：井渫不食，为我心恻，可用汲，王明，并受其福。","baihua":"井已清理却无人饮用，使人心悲；若明王能用它汲水，大家都受福。","xiaoxiang":"小象 井渫不食，行恻也。求王明，受福也。"},{"label":"六四","type":"阴爻 · 转入外卦 / 近上","text":"六四：井甃，无咎。","baihua":"修砌井壁，完善设施；虽未直接供饮，却为可用打基础，无咎。","xiaoxiang":"小象 井甃无咎，修井也。"},{"label":"九五","type":"阳爻 · 成熟主位 / 中正","text":"九五：井冽，寒泉食。","baihua":"井水清冽，寒泉可饮；德位成熟，能真实养人。","xiaoxiang":"小象 寒泉之食，中正也。"},{"label":"上六","type":"阴爻 · 穷极转化 / 收束","text":"上六：井收勿幕，有孚元吉。","baihua":"井口收成而不加覆盖，开放给人取用；有诚信，大吉。","xiaoxiang":"小象 元吉在上，大成也。"}],"special":[],"wenyan":[],"互卦":"䷥ 火泽睽 · 第38卦","错卦":"䷔ 火雷噬嗑 · 第21卦","综卦":"䷮ 泽水困 · 第47卦","应位":"1/3 有应","中正":"1 中正 · 4 得正","changes":["初六 → ䷄ 水天需 · 第5卦","九二 → ䷦ 水山蹇 · 第39卦","九三 → ䷜ 坎为水 · 第29卦","六四 → ䷛ 泽风大过 · 第28卦","九五 → ䷭ 地风升 · 第46卦","上六 → ䷸ 巽为风 · 第57卦"]},{"index":49,"section":"下经","title":"泽火革","eyebrow":"下经 · 离下兑上","meta":"离下兑上 · 离下兑上","lines_top_down":[0,1,1,1,0,1],"symbol":"䷰","guaci":"革：巳日乃孚，元亨。利贞。悔亡。","guaci_baihua":"变革要到合宜之日才获得信任；大亨通，利守正，悔恨消亡。","scriptures":[{"name":"彖曰","text":"革，水火相息，二女同居，其志不相得，曰革。巳日乃孚，革而信也。文明以说，大亨以正，革而当，其悔乃亡。天地革而四时成。汤武革命，顺乎天而应乎人。革之时大矣哉！","baihua":"《彖》说革由水火相息、二女志不相得而成。变革要到可信之日才被相信；文明而悦、合正而当，才能悔亡。天地、汤武革命都说明革要顺天应人。"},{"name":"大象","text":"泽中有火，革；君子以治历明时。","baihua":"《大象》取象为“泽中有火，革”。白话说：观此卦象，君子应当以治历明时。"}],"yaos":[{"label":"初九","type":"阳爻 · 初始萌动 / 根基","text":"初九：巩用黄牛之革。","baihua":"改革之初不可轻动，要像用黄牛皮束缚一样坚固守中；先稳固根本。","xiaoxiang":"小象 巩用黄牛，不可以有为也。"},{"label":"六二","type":"阴爻 · 内在成形 / 中位","text":"六二：巳日乃革之，征吉，无咎。","baihua":"到了合适时日才改革，出征行动吉而无咎；贵在时机成熟。","xiaoxiang":"小象 巳日革之，行有嘉也。"},{"label":"九三","type":"阳爻 · 下卦成极 / 临界","text":"九三：征凶，贞厉。革言三就，有孚。","baihua":"贸然前进则凶，固执也危；改革之言反复三次成熟后，才有可信。","xiaoxiang":"小象 革言三就，又何之矣。"},{"label":"九四","type":"阳爻 · 转入外卦 / 近上","text":"九四：悔亡，有孚改命，吉。","baihua":"悔恨消亡，以诚信改变旧命；改革合信，吉。","xiaoxiang":"小象 改命之吉，信志也。"},{"label":"九五","type":"阳爻 · 成熟主位 / 中正","text":"九五：大人虎变，未占有孚。","baihua":"大人变革如虎纹鲜明，不用占问也有诚信可见；变革已显著而正当。","xiaoxiang":"小象 大人虎变，其文炳也。"},{"label":"上六","type":"阴爻 · 穷极转化 / 收束","text":"上六：君子豹变，小人革面，征凶，居贞吉。","baihua":"君子如豹变而文理成章，小人只改变外貌；继续进取则凶，安居守正则吉。","xiaoxiang":"小象 君子豹变，其文蔚也。小人革面，顺以从君也。"}],"special":[],"wenyan":[],"互卦":"䷫ 天风姤 · 第44卦","错卦":"䷃ 山水蒙 · 第4卦","综卦":"䷱ 火风鼎 · 第50卦","应位":"2/3 有应","中正":"2 中正 · 5 得正","changes":["初九 → ䷞ 泽山咸 · 第31卦","六二 → ䷪ 泽天夬 · 第43卦","九三 → ䷐ 泽雷随 · 第17卦","九四 → ䷾ 水火既济 · 第63卦","九五 → ䷶ 雷火丰 · 第55卦","上六 → ䷌ 天火同人 · 第13卦"]},{"index":50,"section":"下经","title":"火风鼎","eyebrow":"下经 · 巽下离上","meta":"巽下离上 · 巽下离上","lines_top_down":[1,0,1,1,1,0],"symbol":"䷱","guaci":"鼎：元吉，亨。","guaci_baihua":"鼎象征承载与更新，大吉而亨通。","scriptures":[{"name":"彖曰","text":"鼎，象也，以木巽火，亨饪也。圣人亨以享上帝，而大亨以养圣贤。巽而耳目聪明，柔进而上行，得中而应乎刚，是以元亨。","baihua":"《彖》说鼎取器象，以木入火而成烹饪。圣人用鼎享上帝、养圣贤；巽顺而耳目聪明，柔进得中应刚，所以元亨。"},{"name":"大象","text":"木上有火，鼎；君子以正位凝命。","baihua":"《大象》取象为“木上有火，鼎”。白话说：观此卦象，君子应当以正位凝命。"}],"yaos":[{"label":"初六","type":"阴爻 · 初始萌动 / 根基","text":"初六：鼎颠趾，利出否。得妾以其子，无咎。","baihua":"鼎足颠倒，反而有利于倒出秽物；像纳妾因其子而得用，去旧纳新可无咎。","xiaoxiang":"小象 鼎颠趾，未悖也。利出否，以从贵也。"},{"label":"九二","type":"阳爻 · 内在成形 / 中位","text":"九二：鼎有实，我仇有疾，不我能即，吉。","baihua":"鼎中有实物，虽有仇怨疾害，却不能接近伤我；自守充实则吉。","xiaoxiang":"小象 鼎有实，慎所之也。我仇有疾，终无尤也。"},{"label":"九三","type":"阳爻 · 下卦成极 / 临界","text":"九三：鼎耳革，其行塞，雉膏不食。方雨亏悔，终吉。","baihua":"鼎耳变化，移动受阻，美味不能食；待阴阳和雨，悔损而终吉。","xiaoxiang":"小象 鼎耳革，失其义也。"},{"label":"九四","type":"阳爻 · 转入外卦 / 近上","text":"九四：鼎折足，覆公餗，其形渥，凶。","baihua":"鼎足折断，倾覆公家美食，形貌污辱；任重而不能承，凶。","xiaoxiang":"小象 覆公餗，信如何也。"},{"label":"六五","type":"阴爻 · 成熟主位 / 中正","text":"六五：鼎黄耳金铉，利贞。","baihua":"鼎有黄耳金铉，中和而坚美，适合提举大器；利于守正。","xiaoxiang":"小象 鼎黄耳，中以为实也。"},{"label":"上九","type":"阳爻 · 穷极转化 / 收束","text":"上九：鼎玉铉，大吉，无不利。","baihua":"以玉为铉，刚柔清贵相济；鼎道至成，大吉无不利。","xiaoxiang":"小象 玉铉在上，刚柔节也。"}],"special":[],"wenyan":[],"互卦":"䷪ 泽天夬 · 第43卦","错卦":"䷂ 水雷屯 · 第3卦","综卦":"䷰ 泽火革 · 第49卦","应位":"2/3 有应","中正":"0 中正 · 1 得正","changes":["初六 → ䷍ 火天大有 · 第14卦","九二 → ䷷ 火山旅 · 第56卦","九三 → ䷿ 火水未济 · 第64卦","九四 → ䷑ 山风蛊 · 第18卦","六五 → ䷫ 天风姤 · 第44卦","上九 → ䷟ 雷风恒 · 第32卦"]},{"index":51,"section":"下经","title":"震为雷","eyebrow":"下经 · 震下震上","meta":"震下震上 · 震下震上","lines_top_down":[0,0,1,0,0,1],"symbol":"䷲","guaci":"震：亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。","guaci_baihua":"震动可以亨通。雷震来时恐惧警惕，之后笑谈如常；震动百里，也不丧失祭器，表示临震不失守。","scriptures":[{"name":"彖曰","text":"震亨，震来虩虩，恐致福也；笑言哑哑，后有则也。震惊百里，惊远而惧迩也；出可以守宗庙社稷，以为祭主也。","baihua":"《彖》说震动能亨，是因为恐惧可以带来福，震后笑语有法则。震惊百里而不失祭器，说明能在大震动中守住宗庙社稷的责任。"},{"name":"大象","text":"洊雷，震；君子以恐惧修省。","baihua":"《大象》取象为“洊雷，震”。白话说：观此卦象，君子应当以恐惧修省。"}],"yaos":[{"label":"初九","type":"阳爻 · 初始萌动 / 根基","text":"初九：震来虩虩，后笑言哑哑，吉。","baihua":"震动初来时恐惧戒慎，之后才能笑语安然；能敬畏则吉。","xiaoxiang":"小象 震来虩虩，恐致福也。笑言哑哑，后有则也。"},{"label":"六二","type":"阴爻 · 内在成形 / 中位","text":"六二：震来厉，亿丧贝，跻于九陵，勿逐，七日得。","baihua":"震动带来危险，似乎大量失财，逃上高陵；不必追逐，七日后可复得。","xiaoxiang":"小象 震来厉，乘刚也。"},{"label":"六三","type":"阴爻 · 下卦成极 / 临界","text":"六三：震苏苏，震行无眚。","baihua":"震动使人苏苏不安；因震而行动，若能警醒则无灾眚。","xiaoxiang":"小象 震苏苏，位不当也。"},{"label":"九四","type":"阳爻 · 转入外卦 / 近上","text":"九四：震遂泥。","baihua":"震动陷入泥中，力量不能畅达；动而受困。","xiaoxiang":"小象 震遂泥，未光也。"},{"label":"六五","type":"阴爻 · 成熟主位 / 中正","text":"六五：震往来厉，亿无丧，有事。","baihua":"震动往来也危险，但不至大丧；仍有事务需要谨慎处理。","xiaoxiang":"小象 震往来厉，危行也。其事在中，大无丧也。"},{"label":"上六","type":"阴爻 · 穷极转化 / 收束","text":"上六：震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言。","baihua":"震到终极而恐惧颤索、视线惊惶，出征凶；若震祸未到自身而在邻近时能警醒，则无咎，但婚媾关系会有言语纷扰。","xiaoxiang":"小象 震索索，中未得也。虽凶无咎，畏邻戒也。"}],"special":[],"wenyan":[],"互卦":"䷦ 水山蹇 · 第39卦","错卦":"䷸ 巽为风 · 第57卦","综卦":"䷳ 艮为山 · 第52卦","应位":"0/3 有应","中正":"1 中正 · 3 得正","changes":["初九 → ䷏ 雷地豫 · 第16卦","六二 → ䷵ 雷泽归妹 · 第54卦","六三 → ䷶ 雷火丰 · 第55卦","九四 → ䷗ 地雷复 · 第24卦","六五 → ䷐ 泽雷随 · 第17卦","上六 → ䷔ 火雷噬嗑 · 第21卦"]},{"index":52,"section":"下经","title":"艮为山","eyebrow":"下经 · 艮下艮上","meta":"艮下艮上 · 艮下艮上","lines_top_down":[1,0,0,1,0,0],"symbol":"䷳","guaci":"艮：艮其背，不获其身，行其庭，不见其人，无咎。","guaci_baihua":"止于其背，不为自身欲望所牵；行于庭中而不见其人，无咎。","scriptures":[{"name":"彖曰","text":"艮，止也。时止则止，时行则行，动静不失其时，其道光明。艮其止，止其所也。上下敌应，不相与也。是以不获其身，行其庭，不见其人，无咎也。","baihua":"《彖》说艮是止：该止则止，该行则行，动静不失时，道才光明。止在其所，上下不相应，所以不执著自身、庭中不见人而无咎。"},{"name":"大象","text":"兼山，艮；君子以思不出其位。","baihua":"《大象》取象为“兼山，艮”。白话说：观此卦象，君子应当以思不出其位。"}],"yaos":[{"label":"初六","type":"阴爻 · 初始萌动 / 根基","text":"初六：艮其趾，无咎，利永贞。","baihua":"止于脚趾，止在行动未发之前；无咎，利于长久守正。","xiaoxiang":"小象 艮其趾，未失正也。"},{"label":"六二","type":"阴爻 · 内在成形 / 中位","text":"六二：艮其腓，不拯其随，其心不快。","baihua":"止住小腿，却不能拯止随动之处；心中不快，说明止而未得其主。","xiaoxiang":"小象 不拯其随，未退听也。"},{"label":"九三","type":"阳爻 · 下卦成极 / 临界","text":"九三：艮其限，列其夤，厉薰心。","baihua":"止于腰限，强止过甚，如撕裂脊肉；危险而焦灼内心。","xiaoxiang":"小象 艮其限，危熏心也。"},{"label":"六四","type":"阴爻 · 转入外卦 / 近上","text":"六四：艮其身，无咎。","baihua":"止住身体整体，能自我约束；无咎。","xiaoxiang":"小象 艮其身，止诸躬也。"},{"label":"六五","type":"阴爻 · 成熟主位 / 中正","text":"六五：艮其辅，言有序，悔亡。","baihua":"止于口辅，言语有序不妄发；悔亡。","xiaoxiang":"小象 艮其辅，以中正也。"},{"label":"上九","type":"阳爻 · 穷极转化 / 收束","text":"上九：敦艮，吉。","baihua":"止道至终而敦厚，止得安稳深厚；吉。","xiaoxiang":"小象 敦艮之吉，以厚终也。"}],"special":[],"wenyan":[],"互卦":"䷧ 雷水解 · 第40卦","错卦":"䷹ 兑为泽 · 第58卦","综卦":"䷲ 震为雷 · 第51卦","应位":"0/3 有应","中正":"1 中正 · 3 得正","changes":["初六 → ䷕ 山火贲 · 第22卦","六二 → ䷑ 山风蛊 · 第18卦","九三 → ䷖ 山地剥 · 第23卦","六四 → ䷷ 火山旅 · 第56卦","六五 → ䷴ 风山渐 · 第53卦","上九 → ䷎ 地山谦 · 第15卦"]},{"index":53,"section":"下经","title":"风山渐","eyebrow":"下经 · 艮下巽上","meta":"艮下巽上 · 艮下巽上","lines_top_down":[1,1,0,1,0,0],"symbol":"䷴","guaci":"渐：女归吉，利贞。","guaci_baihua":"循序渐进，如女子出嫁则吉，利于守正。","scriptures":[{"name":"彖曰","text":"渐之进也，女归吉也。进得位，往有功也。进以正，可以正邦也。其位刚，得中也。止而巽，动不穷也。","baihua":"《彖》说渐是渐进，女归吉。渐进得位则往有功，以正进可以正邦；刚位得中，止而巽，所以行动不会穷尽。"},{"name":"大象","text":"山上有木，渐；君子以居贤德善俗。","baihua":"《大象》取象为“山上有木，渐”。白话说：观此卦象，君子应当以居贤德善俗。"}],"yaos":[{"label":"初六","type":"阴爻 · 初始萌动 / 根基","text":"初六：鸿渐于干，小子厉，有言，无咎。","baihua":"鸿鸟渐进到水边，位置初浅；小子有危厉并受责言，但渐进未失，故无咎。","xiaoxiang":"小象 小子之厉，义无咎也。"},{"label":"六二","type":"阴爻 · 内在成形 / 中位","text":"六二：鸿渐于磐，饮食衎衎，吉。","baihua":"鸿鸟渐进到磐石，安稳可居；饮食和乐，吉。","xiaoxiang":"小象 饮食衎衎，不素饱也。"},{"label":"九三","type":"阳爻 · 下卦成极 / 临界","text":"九三：鸿渐于陆，夫征不复，妇孕不育，凶；利御寇。","baihua":"鸿渐至陆而失其安，丈夫出征不返、妇孕不育，凶；但刚强可用于御寇。","xiaoxiang":"小象 夫征不复，离群丑也。妇孕不育，失其道也。利用御寇，顺相保也。"},{"label":"六四","type":"阴爻 · 转入外卦 / 近上","text":"六四：鸿渐于木，或得其桷，无咎。","baihua":"鸿鸟落木本非其所安，但或能得平直枝桷；择所而安，无咎。","xiaoxiang":"小象 或得其桷，顺以巽也。"},{"label":"九五","type":"阳爻 · 成熟主位 / 中正","text":"九五：鸿渐于陵，妇三岁不孕，终莫之胜，吉。","baihua":"鸿渐至高陵，虽长期受阻如妇三岁不孕，但正应终不可胜；最终吉。","xiaoxiang":"小象 终莫之胜吉，得所愿也。"},{"label":"上九","type":"阳爻 · 穷极转化 / 收束","text":"上九：鸿渐于陆，其羽可用为仪，吉。","baihua":"鸿鸟渐进到高远之处，羽毛可作礼仪装饰；渐进至成，成为文明仪范，吉。","xiaoxiang":"小象 其羽可用为仪，吉，不可乱也。"}],"special":[],"wenyan":[],"互卦":"䷿ 火水未济 · 第64卦","错卦":"䷵ 雷泽归妹 · 第54卦","综卦":"䷵ 雷泽归妹 · 第54卦","应位":"1/3 有应","中正":"2 中正 · 4 得正","changes":["初六 → ䷤ 风火家人 · 第37卦","六二 → ䷸ 巽为风 · 第57卦","九三 → ䷓ 风地观 · 第20卦","六四 → ䷠ 天山遁 · 第33卦","九五 → ䷳ 艮为山 · 第52卦","上九 → ䷦ 水山蹇 · 第39卦"]},{"index":54,"section":"下经","title":"雷泽归妹","eyebrow":"下经 · 兑下震上","meta":"兑下震上 · 兑下震上","lines_top_down":[0,0,1,0,1,1],"symbol":"䷵","guaci":"归妹：征凶，无攸利。","guaci_baihua":"归妹之事不正，征进则凶，没有什么有利。","scriptures":[{"name":"彖曰","text":"归妹，天地之大义也。天地不交而万物不兴。归妹，人之终始也。说以动，所归妹也。征凶，位不当也。无攸利，柔乘刚也。","baihua":"《彖》说归妹关乎天地交感和人的终始，但本卦悦而动、位多不当。征凶、无攸利，是因为位置不正且柔乘刚，婚合之事不可失礼失序。"},{"name":"大象","text":"泽上有雷，归妹；君子以永终知敝。","baihua":"《大象》取象为“泽上有雷，归妹”。白话说：观此卦象，君子应当以永终知敝。"}],"yaos":[{"label":"初九","type":"阳爻 · 初始萌动 / 根基","text":"初九：归妹以娣，跛能履，征吉。","baihua":"嫁妹以娣随嫁，地位不正却可辅助；如跛者尚能行，前往吉。","xiaoxiang":"小象 归妹以娣，以恒也。跛能履吉，相承也。"},{"label":"九二","type":"阳爻 · 内在成形 / 中位","text":"九二：眇能视，利幽人之贞。","baihua":"目眇而仍能视，能力有限；利于幽静守正之人，不宜张扬。","xiaoxiang":"小象 利幽人之贞，未变常也。"},{"label":"六三","type":"阴爻 · 下卦成极 / 临界","text":"六三：归妹以须，反归以娣。","baihua":"以等待或贱妾身份归妹，结果反以娣位返回；所处不当，婚合失序。","xiaoxiang":"小象 归妹以须，未当也。"},{"label":"九四","type":"阳爻 · 转入外卦 / 近上","text":"九四：归妹愆期，迟归有时。","baihua":"婚期延误，但迟归自有其时；宁可等待正时，不可苟合。","xiaoxiang":"小象 愆期之志，有待而行也。"},{"label":"六五","type":"阴爻 · 成熟主位 / 中正","text":"六五：帝乙归妹，其君之袂不如其娣之袂良，月几望，吉。","baihua":"帝乙嫁妹，正妻衣袖不如陪嫁者华美，象征尊者谦素；如月近望而未满，吉。","xiaoxiang":"小象 帝乙归妹，不如其娣之袂良也。其位在中，以贵行也。"},{"label":"上六","type":"阴爻 · 穷极转化 / 收束","text":"上六：女承筐无实，士刲羊无血，无攸利。","baihua":"女子捧筐无物，男子割羊无血，礼有其形而无其实；无所利。","xiaoxiang":"小象 上六无实，承虚筐也。"}],"special":[],"wenyan":[],"互卦":"䷾ 水火既济 · 第63卦","错卦":"䷴ 风山渐 · 第53卦","综卦":"䷴ 风山渐 · 第53卦","应位":"1/3 有应","中正":"0 中正 · 2 得正","changes":["初九 → ䷧ 雷水解 · 第40卦","九二 → ䷲ 震为雷 · 第51卦","六三 → ䷡ 雷天大壮 · 第34卦","九四 → ䷒ 地泽临 · 第19卦","六五 → ䷹ 兑为泽 · 第58卦","上六 → ䷥ 火泽睽 · 第38卦"]},{"index":55,"section":"下经","title":"雷火丰","eyebrow":"下经 · 离下震上","meta":"离下震上 · 离下震上","lines_top_down":[0,0,1,1,0,1],"symbol":"䷶","guaci":"丰：亨。王假之，勿忧，宜日中。","guaci_baihua":"丰盛亨通。王亲至，不必忧虑；宜如日中那样光明盛大。","scriptures":[{"name":"彖曰","text":"丰，大也。明以动，故丰。王假之，尚大也。勿忧宜日中，宜照天下也。日中则昃，月盈则食，天地盈虚，与时消息，而况于人乎？况于鬼神乎？","baihua":"《彖》说丰是盛大，明而动所以丰。盛大时不必忧，但要像日中一样照临天下；日中必昃、月满必食，盈虚消息人神皆然。"},{"name":"大象","text":"雷电皆至，丰；君子以折狱致刑。","baihua":"《大象》取象为“雷电皆至，丰”。白话说：观此卦象，君子应当以折狱致刑。"}],"yaos":[{"label":"初九","type":"阳爻 · 初始萌动 / 根基","text":"初九：遇其配主，虽旬无咎，往有尚。","baihua":"遇到相配的主人，即使相等十日也无咎；前往有可嘉。","xiaoxiang":"小象 虽旬无咎，过旬灾也。"},{"label":"六二","type":"阴爻 · 内在成形 / 中位","text":"六二：丰其蔀，日中见斗。往得疑疾，有孚发若，吉。","baihua":"遮蔽丰厚，正午却见北斗，光明被掩；前往会遭猜疑，但诚信发明则吉。","xiaoxiang":"小象 有孚发若，信以发志也。"},{"label":"九三","type":"阳爻 · 下卦成极 / 临界","text":"九三：丰其沛，日中见沬。折其右肱，无咎。","baihua":"遮蔽更盛，日中见小星，右臂折伤；虽不能施展，但非己咎。","xiaoxiang":"小象 丰其沛，不可大事也。折其右肱，终不可用也。"},{"label":"九四","type":"阳爻 · 转入外卦 / 近上","text":"九四：丰其蔀，日中见斗。遇其夷主，吉。","baihua":"仍在遮蔽中，日中见斗；若遇到平等相应的主人，吉。","xiaoxiang":"小象 丰其蔀，位不当也。日中见斗，幽不明也。遇其夷主，吉行也。"},{"label":"六五","type":"阴爻 · 成熟主位 / 中正","text":"六五：来章，有庆誉，吉。","baihua":"招来光明文采，有庆贺和名誉；丰盛而能纳明，吉。","xiaoxiang":"小象 六五之吉，有庆也。"},{"label":"上六","type":"阴爻 · 穷极转化 / 收束","text":"上六：丰其屋，蔀其家，窥其户，阒其无人，三岁不觌，凶。","baihua":"屋宇丰大却遮蔽其家，窥门无人，长期不相见；丰极而孤闭，凶。","xiaoxiang":"小象 丰其屋，天际翔也。窥其户，阒其无人，自藏也。"}],"special":[],"wenyan":[],"互卦":"䷛ 泽风大过 · 第28卦","错卦":"䷺ 风水涣 · 第59卦","综卦":"䷷ 火山旅 · 第56卦","应位":"1/3 有应","中正":"1 中正 · 4 得正","changes":["初九 → ䷽ 雷山小过 · 第62卦","六二 → ䷡ 雷天大壮 · 第34卦","九三 → ䷲ 震为雷 · 第51卦","九四 → ䷣ 地火明夷 · 第36卦","六五 → ䷰ 泽火革 · 第49卦","上六 → ䷝ 离为火 · 第30卦"]},{"index":56,"section":"下经","title":"火山旅","eyebrow":"下经 · 艮下离上","meta":"艮下离上 · 艮下离上","lines_top_down":[1,0,1,1,0,0],"symbol":"䷷","guaci":"旅：小亨。旅贞吉。","guaci_baihua":"旅居在外，小事亨通；旅途中守正则吉。","scriptures":[{"name":"彖曰","text":"旅，小亨，柔得中乎外而顺乎刚，止而丽乎明，是以小亨旅贞吉也。旅之时义大矣哉！","baihua":"《彖》说旅是羁旅在外，小亨。柔得外中而顺刚，止而附明，所以可小亨且守正吉；旅居之时义在于谨慎、顺时、不妄求大成。"},{"name":"大象","text":"山上有火，旅；君子以明慎用刑，而不留狱。","baihua":"《大象》取象为“山上有火，旅”。白话说：观此卦象，君子应当以明慎用刑，而不留狱。"}],"yaos":[{"label":"初六","type":"阴爻 · 初始萌动 / 根基","text":"初六：旅琐琐，斯其所取灾。","baihua":"旅居之初若猥琐计较、失其大方，灾祸由此自取。","xiaoxiang":"小象 旅琐琐，志穷灾也。"},{"label":"六二","type":"阴爻 · 内在成形 / 中位","text":"六二：旅即次，怀其资，得童仆，贞。","baihua":"旅人到达旅舍，怀有资财，得童仆相助；守正可安。","xiaoxiang":"小象 得童仆贞，终无尤也。"},{"label":"九三","type":"阳爻 · 下卦成极 / 临界","text":"九三：旅焚其次，丧其童仆，贞厉。","baihua":"旅舍被焚，又丧失童仆；即使守正也危险，说明刚躁失处。","xiaoxiang":"小象 旅焚其次，亦以伤矣。以旅与下，其义丧也。"},{"label":"九四","type":"阳爻 · 转入外卦 / 近上","text":"九四：旅于处，得其资斧，我心不快。","baihua":"旅居暂得处所和资斧，但心中仍不安；客居非久安之地。","xiaoxiang":"小象 旅于处，未得位也。得其资斧，心未快也。"},{"label":"六五","type":"阴爻 · 成熟主位 / 中正","text":"六五：射雉，一矢亡，终以誉命。","baihua":"射雉失一箭，先有所失；终因合礼中道而得名誉和命赏。","xiaoxiang":"小象 终以誉命，上逮也。"},{"label":"上九","type":"阳爻 · 穷极转化 / 收束","text":"上九：鸟焚其巢，旅人先笑后号咷。丧牛于易，凶。","baihua":"鸟巢被焚，旅人先笑后哭；在安易中丧牛，客居至极而失所，凶。","xiaoxiang":"小象 以旅在上，其义焚也。丧牛于易，终莫之闻也。"}],"special":[],"wenyan":[],"互卦":"䷛ 泽风大过 · 第28卦","错卦":"䷻ 水泽节 · 第60卦","综卦":"䷶ 雷火丰 · 第55卦","应位":"1/3 有应","中正":"1 中正 · 2 得正","changes":["初六 → ䷝ 离为火 · 第30卦","六二 → ䷱ 火风鼎 · 第50卦","九三 → ䷢ 火地晋 · 第35卦","九四 → ䷳ 艮为山 · 第52卦","六五 → ䷠ 天山遁 · 第33卦","上九 → ䷽ 雷山小过 · 第62卦"]},{"index":57,"section":"下经","title":"巽为风","eyebrow":"下经 · 巽下巽上","meta":"巽下巽上 · 巽下巽上","lines_top_down":[1,1,0,1,1,0],"symbol":"䷸","guaci":"巽：小亨。利有攸往。利见大人。","guaci_baihua":"巽顺入微，小有亨通；利有所往，利见大人。","scriptures":[{"name":"彖曰","text":"重巽以申命，刚巽乎中正而志行。柔皆顺乎刚，是以小亨，利有攸往，利见大人。","baihua":"《彖》说重巽是反复申命，刚能巽入中正而志得施行，柔都顺从刚。巽顺能小亨，利有所往，也利见大人。"},{"name":"大象","text":"随风，巽；君子以申命行事。","baihua":"《大象》取象为“随风，巽”。白话说：观此卦象，君子应当以申命行事。"}],"yaos":[{"label":"初六","type":"阴爻 · 初始萌动 / 根基","text":"初六：进退，利武人之贞。","baihua":"巽入之初进退不决；利于像武人一样坚定守正，补其柔疑。","xiaoxiang":"小象 进退，志疑也。利武人之贞，志治也。"},{"label":"九二","type":"阳爻 · 内在成形 / 中位","text":"九二：巽在床下，用史巫纷若，吉无咎。","baihua":"谦入到床下，姿态极低；以史巫纷然沟通神人，诚敬则吉无咎。","xiaoxiang":"小象 纷若之吉，得中也。"},{"label":"九三","type":"阳爻 · 下卦成极 / 临界","text":"九三：频巽，吝。","baihua":"反复卑巽，失去稳定和诚意；吝。","xiaoxiang":"小象 频巽之吝，志穷也。"},{"label":"六四","type":"阴爻 · 转入外卦 / 近上","text":"六四：悔亡，田获三品。","baihua":"悔恨消亡，田猎获三类收获；巽顺得位而有成果。","xiaoxiang":"小象 田获三品，有功也。"},{"label":"九五","type":"阳爻 · 成熟主位 / 中正","text":"九五：贞吉悔亡，无不利。无初有终。先庚三日，后庚三日，吉。","baihua":"守正吉而悔亡，无不利；起初虽不足，最终有成。变革前后都要反复申命，吉。","xiaoxiang":"小象 九五之吉，位正中也。"},{"label":"上九","type":"阳爻 · 穷极转化 / 收束","text":"上九：巽在床下，丧其资斧，贞凶。","baihua":"卑巽过度到床下，连资斧都丧失；即使守持也凶。","xiaoxiang":"小象 巽在床下，上穷也。丧其资斧，正乎凶也。"}],"special":[],"wenyan":[],"互卦":"䷥ 火泽睽 · 第38卦","错卦":"䷲ 震为雷 · 第51卦","综卦":"䷹ 兑为泽 · 第58卦","应位":"0/3 有应","中正":"1 中正 · 3 得正","changes":["初六 → ䷈ 风天小畜 · 第9卦","九二 → ䷴ 风山渐 · 第53卦","九三 → ䷺ 风水涣 · 第59卦","六四 → ䷫ 天风姤 · 第44卦","九五 → ䷑ 山风蛊 · 第18卦","上九 → ䷯ 水风井 · 第48卦"]},{"index":58,"section":"下经","title":"兑为泽","eyebrow":"下经 · 兑下兑上","meta":"兑下兑上 · 兑下兑上","lines_top_down":[0,1,1,0,1,1],"symbol":"䷹","guaci":"兑：亨。利贞。","guaci_baihua":"悦顺亨通，利于守正。","scriptures":[{"name":"彖曰","text":"兑，说也。刚中而柔外，说以利贞，是以顺乎天而应乎人。说以先民，民忘其劳；说以犯难，民忘其死。说之大，民劝矣哉！","baihua":"《彖》说兑是悦，刚中而柔外，悦而守正，故顺天应人。以悦先民，民忘其劳；以悦赴难，民忘其死，真正的悦能勉励民心。"},{"name":"大象","text":"丽泽，兑；君子以朋友讲习。","baihua":"《大象》取象为“丽泽，兑”。白话说：观此卦象，君子应当以朋友讲习。"}],"yaos":[{"label":"初九","type":"阳爻 · 初始萌动 / 根基","text":"初九：和兑，吉。","baihua":"喜悦以和为始，不偏不私；吉。","xiaoxiang":"小象 和兑之吉，行未疑也。"},{"label":"九二","type":"阳爻 · 内在成形 / 中位","text":"九二：孚兑，吉，悔亡。","baihua":"以诚信为悦，喜悦有根；吉而悔亡。","xiaoxiang":"小象 孚兑之吉，信志也。"},{"label":"六三","type":"阴爻 · 下卦成极 / 临界","text":"六三：来兑，凶。","baihua":"主动来求取悦，偏于谄媚或外悦；凶。","xiaoxiang":"小象 来兑之凶，位不当也。"},{"label":"九四","type":"阳爻 · 转入外卦 / 近上","text":"九四：商兑未宁，介疾有喜。","baihua":"商量取悦而未安，能隔绝疾邪则有喜；悦不可失其界限。","xiaoxiang":"小象 九四之喜，有庆也。"},{"label":"九五","type":"阳爻 · 成熟主位 / 中正","text":"九五：孚于剥，有厉。","baihua":"诚信却施于剥害之人或事，虽诚也有危险；悦道须辨对象。","xiaoxiang":"小象 孚于剥，位正当也。"},{"label":"上六","type":"阴爻 · 穷极转化 / 收束","text":"上六：引兑。","baihua":"引诱成悦，兑到终极流于牵引诱惑；须防悦极失正。","xiaoxiang":"小象 上六引兑，未光也。"}],"special":[],"wenyan":[],"互卦":"䷤ 风火家人 · 第37卦","错卦":"䷳ 艮为山 · 第52卦","综卦":"䷸ 巽为风 · 第57卦","应位":"0/3 有应","中正":"1 中正 · 3 得正","changes":["初九 → ䷮ 泽水困 · 第47卦","九二 → ䷐ 泽雷随 · 第17卦","六三 → ䷪ 泽天夬 · 第43卦","九四 → ䷻ 水泽节 · 第60卦","九五 → ䷵ 雷泽归妹 · 第54卦","上六 → ䷉ 天泽履 · 第10卦"]},{"index":59,"section":"下经","title":"风水涣","eyebrow":"下经 · 坎下巽上","meta":"坎下巽上 · 坎下巽上","lines_top_down":[1,1,0,0,1,0],"symbol":"䷺","guaci":"涣：亨。王假有庙，利涉大川，利贞。","guaci_baihua":"涣散中可亨通。王来到宗庙，利涉大川，利于守正。","scriptures":[{"name":"彖曰","text":"涣亨，刚来而不穷，柔得位乎外而上同。王假有庙，王乃在中也。利涉大川，乘木有功也。","baihua":"《彖》说涣是离散而能亨，刚来不穷，柔得外位而与上同。王至宗庙是居中凝聚人心；利涉大川，是因为借木舟而有功。"},{"name":"大象","text":"风行水上，涣；先王以享于帝立庙。","baihua":"《大象》取象为“风行水上，涣”。白话说：观此卦象，先王应当以享于帝立庙。"}],"yaos":[{"label":"初六","type":"阴爻 · 初始萌动 / 根基","text":"初六：用拯马壮，吉。","baihua":"涣散之初，用强壮之马救援，行动有力；吉。","xiaoxiang":"小象 初六之吉，顺也。"},{"label":"九二","type":"阳爻 · 内在成形 / 中位","text":"九二：涣奔其机，悔亡。","baihua":"涣散时奔向凭依之机座，找到依托；悔亡。","xiaoxiang":"小象 涣奔其机，得愿也。"},{"label":"六三","type":"阴爻 · 下卦成极 / 临界","text":"六三：涣其躬，无悔。","baihua":"涣散自身私我，能放下自执；无悔。","xiaoxiang":"小象 涣其躬，志在外也。"},{"label":"六四","type":"阴爻 · 转入外卦 / 近上","text":"六四：涣其群，元吉。涣有丘，匪夷所思。","baihua":"涣散私群小党，大吉；散小群而成大丘，非平常思虑所及。","xiaoxiang":"小象 涣其群，元吉，光大也。"},{"label":"九五","type":"阳爻 · 成熟主位 / 中正","text":"九五：涣汗其大号，涣王居，无咎。","baihua":"像汗出而发布大号令，散去王居积弊；号令通达，无咎。","xiaoxiang":"小象 王居无咎，正位也。"},{"label":"上九","type":"阳爻 · 穷极转化 / 收束","text":"上九：涣其血，去逖出，无咎。","baihua":"涣散血伤，使危险远去而出离；终能无咎。","xiaoxiang":"小象 涣其血，远害也。"}],"special":[],"wenyan":[],"互卦":"䷚ 山雷颐 · 第27卦","错卦":"䷶ 雷火丰 · 第55卦","综卦":"䷻ 水泽节 · 第60卦","应位":"1/3 有应","中正":"1 中正 · 2 得正","changes":["初六 → ䷼ 风泽中孚 · 第61卦","九二 → ䷓ 风地观 · 第20卦","六三 → ䷸ 巽为风 · 第57卦","六四 → ䷅ 天水讼 · 第6卦","九五 → ䷃ 山水蒙 · 第4卦","上九 → ䷜ 坎为水 · 第29卦"]},{"index":60,"section":"下经","title":"水泽节","eyebrow":"下经 · 兑下坎上","meta":"兑下坎上 · 兑下坎上","lines_top_down":[0,1,0,0,1,1],"symbol":"䷻","guaci":"节：亨。苦节不可贞。","guaci_baihua":"节制可以亨通；过分痛苦苛刻的节制不可固守。","scriptures":[{"name":"彖曰","text":"节亨，刚柔分而刚得中。苦节不可贞，其道穷也。说以行险，当位以节，中正以通。天地节而四时成，节以制度，不伤财，不害民。","baihua":"《彖》说节是刚柔分而刚得中，所以亨。苦节不可长期固守，节要悦而行险、当位中正；天地有节四时成，人间制度有节则不伤财害民。"},{"name":"大象","text":"泽上有水，节；君子以制数度，议德行。","baihua":"《大象》取象为“泽上有水，节”。白话说：观此卦象，君子应当以制数度，议德行。"}],"yaos":[{"label":"初九","type":"阳爻 · 初始萌动 / 根基","text":"初九：不出户庭，无咎。","baihua":"节制之初，不出户庭，谨慎守限；无咎。","xiaoxiang":"小象 不出户庭，知通塞也。"},{"label":"九二","type":"阳爻 · 内在成形 / 中位","text":"九二：不出门庭，凶。","baihua":"本应出门而仍不出，节制过当；凶。","xiaoxiang":"小象 不出门庭凶，失时极也。"},{"label":"六三","type":"阴爻 · 下卦成极 / 临界","text":"六三：不节若，则嗟若，无咎。","baihua":"不能节制就会叹息；能因叹息而反省，则无咎。","xiaoxiang":"小象 不节之嗟，又谁咎也。"},{"label":"六四","type":"阴爻 · 转入外卦 / 近上","text":"六四：安节，亨。","baihua":"安于节度，不勉强也不过分；亨通。","xiaoxiang":"小象 安节之亨，承上道也。"},{"label":"九五","type":"阳爻 · 成熟主位 / 中正","text":"九五：甘节，吉；往有尚。","baihua":"节制变成甘美可行的制度，吉；前往有嘉尚。","xiaoxiang":"小象 甘节之吉，居位中也。"},{"label":"上六","type":"阴爻 · 穷极转化 / 收束","text":"上六：苦节，贞凶，悔亡。","baihua":"节制过苦，即使坚持也凶；若知其苦而悔悟，悔可亡。","xiaoxiang":"小象 苦节贞凶，其道穷也。"}],"special":[],"wenyan":[],"互卦":"䷚ 山雷颐 · 第27卦","错卦":"䷷ 火山旅 · 第56卦","综卦":"䷺ 风水涣 · 第59卦","应位":"1/3 有应","中正":"1 中正 · 4 得正","changes":["初九 → ䷜ 坎为水 · 第29卦","九二 → ䷂ 水雷屯 · 第3卦","六三 → ䷄ 水天需 · 第5卦","六四 → ䷹ 兑为泽 · 第58卦","九五 → ䷒ 地泽临 · 第19卦","上六 → ䷼ 风泽中孚 · 第61卦"]},{"index":61,"section":"下经","title":"风泽中孚","eyebrow":"下经 · 兑下巽上","meta":"兑下巽上 · 兑下巽上","lines_top_down":[1,1,0,0,1,1],"symbol":"䷼","guaci":"中孚：豚鱼吉，利涉大川，利贞。","guaci_baihua":"中诚信实，连豚鱼这样微小之物也可感通而吉；利涉大川，利守正。","scriptures":[{"name":"彖曰","text":"中孚，柔在内而刚得中。说而巽，孚乃化邦也。豚鱼吉，信及豚鱼也。利涉大川，乘木舟虚也。中孚以利贞，乃应乎天也。","baihua":"《彖》说中孚是柔在内、刚得中，悦而巽，诚信能化邦国。诚信能及豚鱼，涉川如乘虚舟；中孚而利贞，是因为与天道相应。"},{"name":"大象","text":"泽上有风，中孚；君子以议狱缓死。","baihua":"《大象》取象为“泽上有风，中孚”。白话说：观此卦象，君子应当以议狱缓死。"}],"yaos":[{"label":"初九","type":"阳爻 · 初始萌动 / 根基","text":"初九：虞吉，有他不燕。","baihua":"开始有诚信而能安虑则吉；若另有他心，就不能安宁。","xiaoxiang":"小象 初九虞吉，志未变也。"},{"label":"九二","type":"阳爻 · 内在成形 / 中位","text":"九二：鸣鹤在阴，其子和之。我有好爵，吾与尔靡之。","baihua":"鹤在幽处鸣叫，其子相和；真诚能感通同类，有美酒愿与人共享。","xiaoxiang":"小象 其子和之，中心愿也。"},{"label":"六三","type":"阴爻 · 下卦成极 / 临界","text":"六三：得敌，或鼓或罢，或泣或歌。","baihua":"遇到相敌相应者，情绪或鼓动或罢息、或哭或歌；诚信未定而摇摆。","xiaoxiang":"小象 或鼓或罢，位不当也。"},{"label":"六四","type":"阴爻 · 转入外卦 / 近上","text":"六四：月几望，马匹亡，无咎。","baihua":"月近满而未满，马匹失去同伴；舍私党而从正应，无咎。","xiaoxiang":"小象 马匹亡，绝类上也。"},{"label":"九五","type":"阳爻 · 成熟主位 / 中正","text":"九五：有孚挛如，无咎。","baihua":"诚信相系不散，居中感通；无咎。","xiaoxiang":"小象 有孚挛如，位正当也。"},{"label":"上九","type":"阳爻 · 穷极转化 / 收束","text":"上九：翰音登于天，贞凶。","baihua":"鸡鸣之声想登天，声高而实不足；即使固守也凶。","xiaoxiang":"小象 翰音登于天，何可长也。"}],"special":[],"wenyan":[],"互卦":"䷚ 山雷颐 · 第27卦","错卦":"䷽ 雷山小过 · 第62卦","综卦":"䷼ 风泽中孚 · 第61卦","应位":"2/3 有应","中正":"1 中正 · 3 得正","changes":["初九 → ䷺ 风水涣 · 第59卦","九二 → ䷩ 风雷益 · 第42卦","六三 → ䷈ 风天小畜 · 第9卦","六四 → ䷉ 天泽履 · 第10卦","九五 → ䷨ 山泽损 · 第41卦","上九 → ䷻ 水泽节 · 第60卦"]},{"index":62,"section":"下经","title":"雷山小过","eyebrow":"下经 · 艮下震上","meta":"艮下震上 · 艮下震上","lines_top_down":[0,0,1,1,0,0],"symbol":"䷽","guaci":"小过：亨。利贞。可小事，不可大事。飞鸟遗之音，不宜上宜下，大吉。","guaci_baihua":"小过可亨通，利守正。可以做小事，不可做大事；飞鸟留下声音，不宜上而宜下，大吉。","scriptures":[{"name":"彖曰","text":"小过，小者过而亨也。过以利贞，与时行也。柔得中，是以小事吉也。刚失位而不中，是以不可大事也。有飞鸟之象焉。飞鸟遗之音，不宜上宜下，大吉，上逆而下顺也。","baihua":"《彖》说小过是小者有所超过而亨，过要合时守正。柔得中所以小事吉，刚失位不中所以不可大事；飞鸟之象提醒宜下不宜上。"},{"name":"大象","text":"山上有雷，小过；君子以行过乎恭，丧过乎哀，用过乎俭。","baihua":"《大象》取象为“山上有雷，小过”。白话说：观此卦象，君子应当以行过乎恭，丧过乎哀，用过乎俭。"}],"yaos":[{"label":"初六","type":"阴爻 · 初始萌动 / 根基","text":"初六：飞鸟以凶。","baihua":"小过之初就如鸟飞过高，越分而动；凶。","xiaoxiang":"小象 飞鸟以凶，不可如何也。"},{"label":"六二","type":"阴爻 · 内在成形 / 中位","text":"六二：过其祖，遇其妣；不及其君，遇其臣；无咎。","baihua":"越过祖父而遇祖母，不及君主而遇臣下；不过分上求，得其中间，无咎。","xiaoxiang":"小象 不及其君，臣不可过也。"},{"label":"九三","type":"阳爻 · 下卦成极 / 临界","text":"九三：弗过防之，从或戕之，凶。","baihua":"不能过度防备，反被随从者伤害；凶。","xiaoxiang":"小象 从或戕之，凶如何也。"},{"label":"九四","type":"阳爻 · 转入外卦 / 近上","text":"九四：无咎，弗过遇之。往厉必戒，勿用永贞。","baihua":"不过分而相遇可无咎；前往有危必须警戒，不宜永远固执一种做法。","xiaoxiang":"小象 弗过遇之，位不当也。往厉必戒，终不可长也。"},{"label":"六五","type":"阴爻 · 成熟主位 / 中正","text":"六五：密云不雨，自我西郊。公弋取彼在穴。","baihua":"密云不雨，仍未施泽；公以弋射取穴中之物，象征小有所获而大化未成。","xiaoxiang":"小象 密云不雨，已上也。"},{"label":"上六","type":"阴爻 · 穷极转化 / 收束","text":"上六：弗遇过之，飞鸟离之，凶，是谓灾眚。","baihua":"没有相遇却越过太远，如飞鸟遭罗网；凶，这是灾眚。","xiaoxiang":"小象 弗遇过之，已亢也。"}],"special":[],"wenyan":[],"互卦":"䷛ 泽风大过 · 第28卦","错卦":"䷼ 风泽中孚 · 第61卦","综卦":"䷽ 雷山小过 · 第62卦","应位":"2/3 有应","中正":"1 中正 · 3 得正","changes":["初六 → ䷶ 雷火丰 · 第55卦","六二 → ䷟ 雷风恒 · 第32卦","九三 → ䷏ 雷地豫 · 第16卦","九四 → ䷎ 地山谦 · 第15卦","六五 → ䷞ 泽山咸 · 第31卦","上六 → ䷷ 火山旅 · 第56卦"]},{"index":63,"section":"下经","title":"水火既济","eyebrow":"下经 · 离下坎上","meta":"离下坎上 · 离下坎上","lines_top_down":[0,1,0,1,0,1],"symbol":"䷾","guaci":"既济：亨小。利贞。初吉终乱。","guaci_baihua":"事情已经完成，小处亨通，利于守正；开始吉，最终若不谨慎会乱。","scriptures":[{"name":"彖曰","text":"既济亨小者，亨也。利贞，刚柔正而位当也。初吉，柔得中也。终止则乱，其道穷也。","baihua":"《彖》说既济是小者亨通，刚柔各正而位置相当。开始吉是因为柔得中；若到终点便停止警戒，则会转乱而道穷。"},{"name":"大象","text":"水在火上，既济；君子以思患而预防之。","baihua":"《大象》取象为“水在火上，既济”。白话说：观此卦象，君子应当以思患而预防之。"}],"yaos":[{"label":"初九","type":"阳爻 · 初始萌动 / 根基","text":"初九：曳其轮，濡其尾，无咎。","baihua":"车轮被拖，尾巴沾湿，前进受阻；既济之初能谨慎缓行，无咎。","xiaoxiang":"小象 曳其轮，义无咎也。"},{"label":"六二","type":"阴爻 · 内在成形 / 中位","text":"六二：妇丧其茀，勿逐，七日得。","baihua":"妇人丢失车帘，不必追逐，七日可得；已济之时小失会自复。","xiaoxiang":"小象 七日得，以中道也。"},{"label":"九三","type":"阳爻 · 下卦成极 / 临界","text":"九三：高宗伐鬼方，三年克之，小人勿用。","baihua":"高宗征伐鬼方，三年才取胜；大功艰难，不能任用小人。","xiaoxiang":"小象 三年克之，惫也。"},{"label":"六四","type":"阴爻 · 转入外卦 / 近上","text":"六四：繻有衣袽，终日戒。","baihua":"华美衣物中备着破布以防漏，整日戒惧；既济中仍须防患。","xiaoxiang":"小象 终日戒，有所疑也。"},{"label":"九五","type":"阳爻 · 成熟主位 / 中正","text":"九五：东邻杀牛，不如西邻之禴祭，实受其福。","baihua":"东邻杀牛盛祭，不如西邻薄祭而诚；真正受福在诚不在丰。","xiaoxiang":"小象 东邻杀牛，不如西邻之时也。实受 function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

const HEX_BY_LINES = {};
HEX_DATA.forEach(h=>{

function findHexByLines(bottomUp){
  return HEX_BY_LINES[bottomUp.join('')] || null;
}

/* 卦画渲染：lines 从下到上，dong 为动爻位（1-6，从下到上） */
function guaLinesHtml(lines, dongSet){
  const topDown = lines.slice().reverse();
  return '<div class="gua-lines">'+topDown.map((v,i)=>{
    const pos = topDown.length - i; /* 从下到上编号 */
    const d = dongSet && dongSet.has(pos);
    return '<div class="yline '+(v?'yang':'yin')+(d?' dong':'')+'"><i></i><i></i></div>';
  }).join('')+'</div>';
}

/* 拆上下卦：lines 从下到上，下卦=1-3爻，上卦=4-6爻 */
function splitTrigrams(linesBottomUp){
  const lower = linesBottomUp.slice(0,3).join('');
  const upper = linesBottomUp.slice(3,6).join('');
  return {lower:TRIGRAMS[lower], upper:TRIGRAMS[upper]};
}

/* ===== 梅花易数引擎 ===== */
/* 除8取卦（余0=8），除6取动爻（余0=6） */
function guaFromNum(n){ const r=n%8; return r===0?8:r; }
function yaoFromNum(n){ const r=n%6; return r===0?6:r; }
function trigramByNum(n){ const nm = NUM_TO_TRIGRAM[n]; return Object.values(TRIGRAMS).find(t=>t.name===nm) || null; }

/* 由上下卦+动爻 构造六爻（从下到上） */
function buildHex(lowerTri, upperTri, dongYao){
  const lines = lowerTri.lines.concat(upperTri.lines);
  const hex = findHexByLines(lines);
  /* 变卦 */
  const newLines = lines.slice();
  newLines[dongYao-1] = newLines[dongYao-1]===1?0:1;
  const bianHex = findHexByLines(newLines);
  /* 互卦：2,3,4爻为下互；3,4,5爻为上互 */
  const huxia = lines.slice(1,4);
  const hushang = lines.slice(2,5);
  const huLower = TRIGRAMS[huxia.join('')];
  const huUpper = TRIGRAMS[hushang.join('')];
  const huLines = huxia.concat(hushang);
  const huHex = findHexByLines(huLines);
  return {lines, hex, bianHex, huLower, huUpper, huHex, dongYao};
}

/* 五行生克判定 */
function shengKe(useWX, tiWX){

/* 体党用党：互卦与变卦的五行归党 */
/* 归党规则：与体/用五行相同者→同党；生体/用者→帮党（半党）；克体/用者→敌党（对方加分） */
function dangAnalysis(useWX, tiWX, huLower, huUpper, bianLower, bianUpper){
  let tiDang = 0, yongDang = 0;
  const items = [
    {wx:huLower.wuxing, name:huLower.name, tag:'互卦·下'},
    {wx:huUpper.wuxing, name:huUpper.name, tag:'互卦·上'},
  ];
  if(bianLower) items.push({wx:bianLower.wuxing, name:bianLower.name, tag:'变卦·下'});
  if(bianUpper) items.push({wx:bianUpper.wuxing, name:bianUpper.name, tag:'变卦·上'});
  const rows = items.map(it=>{
    const wx = it.wx;
    let toTi = 0, toYong = 0, tiRole = '', yongRole = '';
    if(wx === tiWX){ toTi = 2; tiRole = '同党'; }
    else if(WUXING_SHENG[wx] === tiWX){ toTi = 1; tiRole = '生体'; }
    else if(WUXING_KE[wx] === tiWX){ toTi = -1; tiRole = '克体'; }
    if(wx === useWX){ toYong = 2; yongRole = '同党'; }
    else if(WUXING_SHENG[wx] === useWX){ toYong = 1; yongRole = '生用'; }
    else if(WUXING_KE[wx] === useWX){ toYong = -1; yongRole = '克用'; }
    tiDang += Math.max(0, toTi); yongDang += Math.max(0, toYong);
    return {name:it.name, tag:it.tag, wx, tiRole, yongRole};
  });
  let trend = '';
  if(tiDang > yongDang) trend = '体党势强，对「体」有利，外部助力多于阻力，局势偏主动。';
  else if(yongDang > tiDang) trend = '用党势强，外势较盛，须提防被形势裹挟，宜顺势而谋。';
  else trend = '体用党势相当，胜负取决于当事人能否守正用情、把握时机。';
  return {tiDang, yongDang, rows, trend};
}

/* 时间起卦（梅花易数）：农历年支序+月+日 = 上卦；+时支序 = 下卦；总数 = 动爻 */
function castByTime(lunarYear, lunarMonth, lunarDay, hour){
  const yearZhi = (lunarYear - 4) % 12; /* 0=子 */
  const yz = yearZhi + 1;
  const shichen = hourToShichen(hour);
  const shiNum = ZHI_NUM[shichen];
  const shang = guaFromNum(yz + lunarMonth + lunarDay);
  const xia = guaFromNum(yz + lunarMonth + lunarDay + shiNum);
  const dong = yaoFromNum(yz + lunarMonth + lunarDay + shiNum);
  const lower = trigramByNum(xia);
  const upper = trigramByNum(shang);
  return {lower, upper, dong, shang, xia, yz, lunarYear, lunarMonth, lunarDay, shichen, shiNum};
}
function hourToShichen(hour){
  if(hour >= 23 || hour < 1) return '子';
  return ZHI[Math.floor((hour+1)/2)];
}

/* 数字起卦 */
function castByNumber(n1, n2, n3){
  const shang = guaFromNum(n1);
  const xia = guaFromNum(n2);
  const dong = yaoFromNum(n3 || (n1+n2));
  return {lower:trigramByNum(xia), upper:trigramByNum(shang), dong, shang, xia};
}

/* 随机起卦：三枚铜钱六次，或直接随机 */
function castRandom(){
  /* 每次 3 枚铜钱：字=2 花=3，4=老阴(动) 5=少阳 6=少阴 7=老阳(动) */
  const lines=[], dongs=[];
  for(let i=0;i<6;i++){
    let sum=0;
    for(let j=0;j<3;j++) sum += Math.random()<0.5?2:3;
    let v;
    if(sum===6){v=0;dongs.push(i+1);}
    else if(sum===7){v=1;}
    else if(sum===8){v=0;}
    else {v=1;dongs.push(i+1);}
    lines.push(v);
  }
  const lower = TRIGRAMS[lines.slice(0,3).join('')];
  const upper = TRIGRAMS[lines.slice(3,6).join('')];
  const dong = dongs.length?dongs[0]:Math.floor(Math.random()*6)+1;
  return {lower, upper, dong, lines, dongs, random:true};
}

function lunarGetBit(data, length, shift){ return (data & (((1 << length) - 1) << shift)) >> shift; }
function solarToInt(y, m, d){
  m = (m + 9) % 12;
  y = parseInt(y) - parseInt(m / 10);
  return 365 * y + parseInt(y / 4) - parseInt(y / 100) + parseInt(y / 400) + parseInt((m * 306 + 5) / 10) + (d - 1);
}
function solar2lunar(y, m, d){
  if(!LUNAR_MONTH_DAYS.length) return null;
  let index = y - LUNAR_SOLAR_11[0];
  const data = (y << 9) | (m << 5) | d;
  if(LUNAR_SOLAR_11[index] > data) index--;
  if(index < 0 || index >= LUNAR_MONTH_DAYS.length - 1) return null;
  const solar11 = LUNAR_SOLAR_11[index];
  const y11 = lunarGetBit(solar11, 12, 9);
  const m11 = lunarGetBit(solar11, 4, 5);
  const d11 = lunarGetBit(solar11, 5, 0);
  let offset = solarToInt(y, m, d) - solarToInt(y11, m11, d11);
  const days = LUNAR_MONTH_DAYS[index];
  const leap = lunarGetBit(days, 4, 13);
  const lunarYear = index + LUNAR_SOLAR_11[0];
  let lunarMonth = 1;
  offset += 1;
  for(let i=0; i<13; i++){
    const dm = lunarGetBit(days, 1, 12-i) === 1 ? 30 : 29;
    if(offset > dm){ lunarMonth++; offset -= dm; }
    else break;
  }
  let isLeap = false;
  if(leap !== 0 && lunarMonth > leap){
    lunarMonth = lunarMonth - 1;
    if(lunarMonth === leap) isLeap = true;
  }
  return {year:lunarYear, month:lunarMonth, day:offset, isLeap};
}

        '<div class="item"><div class="k">互卦</div><div class="v">'+esc(h.互卦||'—')+'</div></div>'+
        '<div class="item"><div class="k">错卦</div><div class="v">'+esc(h.错卦||'—')+'</div></div>'+
        '<div class="item"><div class="k">综卦</div><div class="v">'+esc(h.综卦||'—')+'</div></div>'+
        '<div class="item"><div class="k">应位</div><div class="v">'+esc(h.应位||'—')+'</div></div>'+
        '<div class="item"><div class="k">中正</div><div class="v">'+esc(h.中正||'—')+'</div></div>'+
      '</div>'+
      changesHtml+
      '<div class="divider"></div>'+
      '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">'+
        (prev?'<button class="btn ghost" data-nav="'+(idx-1)+'">← 前卦 · '+esc(prev.title)+'</button>':'<span></span>')+
        (next?'<button class="btn ghost" data-nav="'+(idx+1)+'">后卦 · '+esc(next.title)+' →</button>':'<span></span>')+
      '</div>'+
    '</div>';
  $('#view').innerHTML = elHtml;
  $('#view').querySelectorAll('.yao-item').forEach(it=>{
    it.addEventListener('click', ()=>{
      it.classList.toggle('open');
    });
  });
  $('#view').querySelectorAll('[data-nav]').forEach(b=>{
    b.addEventListener('click', ()=>location.hash='#/gua/'+b.dataset.nav);
  });
}

/* 起卦 */
function renderCast(){
  $('#view').innerHTML =
    '<div class="card">'+
      '<h2>梅花易数 · 起卦</h2>'+
      '<div class="hint">三种起卦法 → 本卦 / 互卦 / 变卦 / 体用生克 / 体党用党。梅花起卦取数：先天八卦数 乾1 兑2 离3 震4 巽5 坎6 艮7 坤8。</div>'+
      '<div class="cast-methods">'+
        '<div class="cast-card">'+
          '<h3>时间起卦</h3>'+
          '<p>农历年（地支序）+月+日 得上卦；再+时辰序 得下卦与动爻。</p>'+
          '<input id="c-solar" placeholder="公历日期，如 2026-09-11">'+
          '<input id="c-hour" type="number" min="0" max="23" placeholder="时辰（0-23时）">'+
          '<button class="btn" id="btn-time">以此刻起卦</button>'+
        '</div>'+
        '<div class="cast-card">'+
          '<h3>数字起卦</h3>'+
          '<p>第一个数除8得外卦（上），第二个数除8得内卦（下），第三个数（或两数之和）除6得动爻。</p>'+
          '<input id="c-n1" type="number" placeholder="第一个数">'+
          '<input id="c-n2" type="number" placeholder="第二个数">'+
          '<input id="c-n3" type="number" placeholder="第三个数（可选）">'+
          '<button class="btn" id="btn-num">起卦</button>'+
        '</div>'+
        '<div class="cast-card">'+
          '<h3>铜钱摇卦</h3>'+
          '<p>模拟三枚铜钱掷六次：字字字=老阴(动)、花花花=老阳(动)、其余为少阴少阳。有动爻取第一动爻。</p>'+
          '<button class="btn" id="btn-random">摇一卦</button>'+
        '</div>'+
      '</div>'+
      '<div id="cast-result"></div>'+
    '</div>';
  const fillNow = ()=>{
    const now = new Date();
    const lm = solar2lunar(now.getFullYear(), now.getMonth()+1, now.getDate());
    $('#c-solar').value = now.getFullYear()+'-'+pad2(now.getMonth()+1)+'-'+pad2(now.getDate());
    $('#c-hour').value = now.getHours();
  };
  fillNow();
  $('#btn-time').addEventListener('click', ()=>{
    const s = $('#c-solar').value.trim();
    const hh = parseInt($('#c-hour').value,10);
    if(!s){toast('请填写公历日期');return;}
    const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if(!m){toast('日期格式：YYYY-MM-DD');return;}
    const lm = solar2lunar(+m[1], +m[2], +m[3]);
    if(!lm){toast('农历转换失败，日期超出支持范围');return;}
    const r = castByTime(lm.year, lm.month, lm.day, isNaN(hh)?12:hh);
    const lunarDesc = ganZhiYear(lm.year)+'年（'+lm.year+'年）'+LUNAR_MONTH_CN[lm.month]+(lm.isLeap?'（闰）':'')+lm.day+'日 · '+r.shichen+'时';
    showCastResult(r, {method:'时间起卦', desc:lunarDesc});
  });
  $('#btn-num').addEventListener('click', ()=>{
    const n1 = parseInt($('#c-n1').value,10);
    const n2 = parseInt($('#c-n2').value,10);
    const n3 = parseInt($('#c-n3').value,10);
    if(isNaN(n1)||isNaN(n2)){toast('请填写前两个数');return;}
    const r = castByNumber(n1, n2, isNaN(n3)?null:n3);
    showCastResult(r, {method:'数字起卦', desc:n1+' / '+n2+(isNaN(n3)?'':' / '+n3)});
  });
  $('#btn-random').addEventListener('click', ()=>{
    const r = castRandom();
    const desc = r.dongs && r.dongs.length ? ('动爻：'+r.dongs.map(i=>'第'+i+'爻').join('、')) : '六爻安静（重摇或取随机动爻）';
    showCastResult(r, {method:'铜钱摇卦', desc});
  });
}

function showCastResult(r, info){
  const b = buildHex(r.lower, r.upper, r.dong);
  if(!b.hex){toast('起卦失败，请重试');return;}
  /* 体用：无动爻之卦为体，有动爻之卦为用。动爻在下卦→下卦为用上卦为体；在上卦→上卦为用下卦为体 */
  const dongInLower = r.dong <= 3;
  const ti = dongInLower ? r.upper : r.lower;
  const yong = dongInLower ? r.lower : r.upper;
  const sk = shengKe(yong.wuxing, ti.wuxing);

  /* 动爻爻辞 */
  const dongYao = b.hex.yaos[r.dong-1];
  /* 互卦五行 */
  const huWX = [b.huLower.wuxing, b.huUpper.wuxing];
  /* 变卦上下卦 */
  const bianTri = b.bianHex ? splitTrigrams(b.bianHex.lines_top_down.slice().reverse()) : null;
  const bianWX = bianTri ? bianTri.lower.wuxing : null;
  /* 体党用党 */
  const dang = dangAnalysis(yong.wuxing, ti.wuxing, b.huLower, b.huUpper, bianTri?bianTri.lower:null, bianTri?bianTri.upper:null);
  const dangRows = dang.rows.map(r=>
    '<tr><td>'+esc(r.tag)+'</td><td>'+esc(r.name)+'（'+esc(r.wx)+'）</td>'+
    '<td class="'+(r.tiRole.includes('克')?'bad':(r.tiRole?'good':''))+'">'+(r.tiRole||'—')+'</td>'+
    '<td class="'+(r.yongRole.includes('克')?'bad':(r.yongRole?'good':''))+'">'+(r.yongRole||'—')+'</td></tr>'
  ).join('');

  $('#cast-result').innerHTML =
    '<div class="divider"></div>'+
    '<div class="note-box">起卦法：'+esc(info.method)+'（'+esc(info.desc)+'）· 动爻：第'+r.dong+'爻</div>'+
    '<div class="card">'+
      '<h3>本卦 · '+esc(b.hex.title)+' <span class="tag red">第'+b.hex.index+'卦</span></h3>'+
      '<div class="result-hex">'+
        '<div class="sym">'+esc(b.hex.symbol)+'</div>'+
        guaLinesHtml(b.lines, new Set([r.dong]))+
        '<div class="meta"><h4>'+esc(b.hex.title)+'</h4>'+
        '<div class="sub">'+esc(r.upper.name)+'上 '+esc(r.lower.name)+'下 · '+esc(r.upper.nature)+esc(r.lower.nature)+' · 外'+esc(r.upper.wuxing)+' 内'+esc(r.lower.wuxing)+'</div></div>'+
      '</div>'+
      '<blockquote>'+esc(b.hex.guaci)+'</blockquote>'+
      '<div class="baihua">'+esc(b.hex.guaci_baihua)+'</div>'+
      '<div class="ti-yong">'+
        '<div class="pill"><b>体 · '+esc(ti.name)+'</b><span>'+esc(ti.wuxing)+' · 无动爻</span></div>'+
        '<div class="pill yong"><b>用 · '+esc(yong.name)+'</b><span>'+esc(yong.wuxing)+' · 有动爻</span></div>'+
      '</div>'+
      '<div class="verdict">'+
        '<div class="v-title">体用关系 · '+esc(sk.label)+'（'+esc(sk.grade)+'）</div>'+
        '<div style="font-size:13.5px">'+esc(sk.desc)+'</div>'+
      '</div>'+
      '<table class="shengke-table">'+
        '<tr><th>分析项</th><th>内容</th><th>判断</th></tr>'+
        '<tr><td>体卦</td><td>'+esc(ti.name)+'（'+esc(ti.nature)+'，'+esc(ti.wuxing)+'）</td><td>自身 / 所问之事主体</td></tr>'+
        '<tr><td>用卦</td><td>'+esc(yong.name)+'（'+esc(yong.nature)+'，'+esc(yong.wuxing)+'）</td><td>外势 / 所问之事客体</td></tr>'+
        '<tr><td>互卦</td><td>'+esc(b.huLower.name)+'（'+esc(huWX[0])+'）· '+esc(b.huUpper.name)+'（'+esc(huWX[1])+'）</td><td>过程中的中间态势</td></tr>'+
        (b.bianHex?'<tr><td>变卦</td><td>'+esc(b.bianHex.title)+'（'+esc(bianWX)+'）· 第'+b.bianHex.index+'卦</td><td>事态发展趋势</td></tr>':'')+
      '</table>'+
      '<h3 style="margin-top:16px">体党 · 用党</h3>'+
      '<div class="hint">互卦、变卦各卦五行，看其生克归属：同党（+2）、生体/生用（+1）、克体/克用（外势压内）。</div>'+
      '<table class="shengke-table">'+
        '<tr><th>来源</th><th>卦 · 五行</th><th>对体</th><th>对用</th></tr>'+
        dangRows+
      '</table>'+
      '<div style="font-size:13px;color:var(--ink2);margin-top:8px">体党 '+dang.tiDang+' 势 · 用党 '+dang.yongDang+' 势 —— '+esc(dang.trend)+'</div>'+
    '</div>'+
    '<div class="card">'+
      '<h3>动爻解读 · '+esc(dongYao.label)+'</h3>'+
      '<blockquote>'+esc(dongYao.text)+'</blockquote>'+
      '<div class="baihua">'+esc(dongYao.baihua)+'</div>'+
      (dongYao.xiaoxiang?'<div class="yao-xx">'+esc(dongYao.xiaoxiang)+'</div>':'')+
    '</div>'+
    (b.bianHex?'<div class="card">'+
      '<h3>变卦 · '+esc(b.bianHex.title)+' <span class="tag jade">趋势</span></h3>'+
      '<div class="result-hex">'+
        '<div class="sym">'+esc(b.bianHex.symbol)+'</div>'+
        '<div class="meta"><h4>'+esc(b.bianHex.title)+'</h4><div class="sub">动爻变后所成之卦，预示事态走向</div></div>'+
      '</div>'+
      '<blockquote>'+esc(b.bianHex.guaci)+'</blockquote>'+
      '<div class="baihua">'+esc(b.bianHex.guaci_baihua)+'</div>'+
    '</div>':'')+
    '<div class="note-box">体用生克为传统梅花断卦框架，吉凶需结合所问之事具体判断，不宜机械套用。</div>';
  $('#cast-result').scrollIntoView({behavior:'smooth'});
}

/* toast */
function toast(msg){
  let t = $('#toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast';
    t.style.cssText='position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--cinnabar);color:#f7ead0;padding:10px 22px;border-radius:8px;font-size:13px;z-index:99;box-shadow:var(--shadow);transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity=1;
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.style.opacity=0, 2200);
}

/* 路由 */
function router(){
  bindTabs();
  const m = location.hash.match(/^#\/gua\/(\d+)/);
  if(m){ renderGua(+m[1]); return; }
  render();
}
window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', router);
