<style>
:root{
  --paper:#faf8f5; --paper2:#f3eee7; --ink:#2a2622; --ink2:#6b6055; --ink3:#9c9086;
  --line:#e7ddd1; --line2:#d8ccbb; --accent:#8b5e3c; --accent2:#b07d52;
  --shadow:0 1px 2px rgba(60,44,28,.06),0 8px 24px -12px rgba(60,44,28,.18);
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","Source Han Serif SC","Noto Serif SC",SimSun,"PingFang SC",serif;
  --fs:1.06rem; --lh:1.95; --indent:2em;
}
html[data-theme="dark"]{
  --paper:#12100e; --paper2:#1a1714; --ink:#e9e3d9; --ink2:#a79d90; --ink3:#7a7268;
  --line:#2c2620; --line2:#3a3229; --accent:#d9a86c; --accent2:#e8c08a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);
  -webkit-font-smoothing:antialiased;transition:background .22s,color .22s}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line)}
.hb{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;
  height:54px;padding:0 14px}
.bk{display:flex;align-items:baseline;gap:9px;min-width:0;flex:1}
.bk b{font-size:.98rem;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk span{font-size:.7rem;color:var(--ink3);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  border:1px solid var(--line2);color:var(--ink2);font-size:.82rem;flex:none;transition:.16s}
.ico:hover{background:var(--paper2);color:var(--accent);border-color:var(--accent)}
.ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
.tools{display:flex;align-items:center;gap:6px;flex:none}
.fsz{display:flex;align-items:center;gap:2px;border:1px solid var(--line2);border-radius:9px;padding:1px 2px}
.fsz button{width:26px;height:28px;border-radius:7px;font-size:.8rem;color:var(--ink2)}
.fsz button:hover{background:var(--paper2);color:var(--accent)}
#prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0;transition:width .1s linear}

/* ---------- 目录抽屉 ---------- */
.mask{position:fixed;inset:0;background:rgba(20,14,8,.42);opacity:0;pointer-events:none;
  transition:opacity .24s;z-index:50}
body.toc .mask{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;left:0;bottom:0;width:min(84vw,322px);background:var(--paper2);
  border-right:1px solid var(--line);z-index:60;transform:translateX(-102%);
  transition:transform .28s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column}
body.toc aside{transform:none}
.ah{padding:15px 16px 11px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.ah b{font-size:.86rem;letter-spacing:.06em}
.ah small{display:block;color:var(--ink3);font-size:.7rem;margin-top:3px;letter-spacing:0}
.toc{flex:1;overflow-y:auto;padding:8px 8px 40px}
.toc h4{margin:15px 8px 6px;font-size:.7rem;letter-spacing:.13em;color:var(--ink3);
  text-transform:uppercase;font-weight:600}
.toc button{display:flex;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;
  font-size:.875rem;color:var(--ink2);line-height:1.4;transition:.14s}
.toc button i{font-style:normal;color:var(--ink3);font-size:.72rem;min-width:1.9em;
  font-variant-numeric:tabular-nums;padding-top:.16em}
.toc button:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink)}
.toc button.on{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);font-weight:600}
.toc button.on i{color:var(--accent)}

/* ---------- 正文 ---------- */
main{max-width:44rem;margin:0 auto;padding:26px 20px 8px}
.head{padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:26px}
.kind{display:inline-block;font-size:.68rem;letter-spacing:.18em;color:var(--accent);
  border:1px solid var(--line2);border-radius:999px;padding:3px 10px;margin-bottom:12px;text-transform:uppercase}
h1.bk-t{margin:0 0 10px;font-size:clamp(1.5rem,5.2vw,2.05rem);font-weight:800;letter-spacing:-.01em;line-height:1.25}
h1.bk-t em{font-style:normal;color:var(--accent)}
.head p{margin:0;color:var(--ink2);font-size:.88rem;line-height:1.7}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}
.meta span{font-size:.72rem;color:var(--ink2);background:var(--paper2);border:1px solid var(--line);
  border-radius:7px;padding:4px 9px}
.meta span b{color:var(--accent);font-weight:700}

article{font-family:var(--serif);font-size:var(--fs);line-height:var(--lh);
  color:var(--ink);letter-spacing:.012em}
article h2{font-family:var(--ui);font-size:1.16rem;font-weight:700;margin:0 0 6px;
  letter-spacing:.01em;line-height:1.4}
article h3{font-family:var(--ui);font-size:.82rem;font-weight:600;color:var(--accent);
  letter-spacing:.13em;text-transform:uppercase;margin:0 0 14px;padding-bottom:0}
.chap{padding-top:8px}
.chap + .chap{margin-top:54px;padding-top:40px;border-top:1px solid var(--line)}
.chap .no{font-family:var(--ui);font-size:.7rem;letter-spacing:.16em;color:var(--ink3);
  display:block;margin-bottom:8px}
article p{margin:0 0 .42em;text-indent:var(--indent);text-align:justify}
article p.flat{text-indent:0}
article p.q{text-indent:0;padding-left:1.1em;color:var(--ink2)}
article p.item{text-indent:0;padding-left:1.6em;margin-bottom:.34em}
article p.item b{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;margin-right:.35em}
.divider{text-align:center;color:var(--ink3);letter-spacing:.6em;margin:26px 0;font-family:var(--ui);font-size:.8rem;text-indent:0}

.chapnav{display:flex;gap:10px;align-items:stretch;margin:44px 0 0;padding-top:22px;border-top:1px solid var(--line);font-family:var(--ui)}
.chapnav button{flex:1;border:1px solid var(--line2);border-radius:11px;padding:11px 13px;
  text-align:left;color:var(--ink2);font-size:.82rem;line-height:1.45;transition:.16s;background:var(--paper)}
.chapnav button:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--paper2)}
.chapnav button:disabled{opacity:.34;cursor:default}
.chapnav button small{display:block;font-size:.66rem;color:var(--ink3);letter-spacing:.1em;margin-bottom:3px}
.chapnav .nx{text-align:right}
.chapnav .md{flex:0 0 auto;display:grid;place-items:center;padding:11px 15px;font-size:.78rem}

footer{max-width:44rem;margin:0 auto;padding:30px 20px 46px;color:var(--ink3);
  font-size:.76rem;line-height:1.8;font-family:var(--ui);border-top:1px solid var(--line);margin-top:36px}
footer a{color:var(--ink2);border-bottom:1px solid var(--line2)}
.top{position:fixed;right:16px;bottom:18px;z-index:30;width:40px;height:40px;border-radius:50%;
  background:var(--paper2);border:1px solid var(--line2);color:var(--ink2);display:grid;place-items:center;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.22s}
.top.on{opacity:1;pointer-events:auto}
.top:hover{color:var(--accent);border-color:var(--accent)}
.top svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

@media (min-width:900px){
  main{max-width:46rem;padding-top:40px}
  .hb{height:58px}
}
@media (max-width:520px){
  :root{--fs:1.02rem;--lh:1.9}
  main{padding:20px 15px 4px}
  .bk span{display:none}
  article p{text-align:left}
}
@media print{
  header,aside,.top,.chapnav,.mask{display:none}
  body{background:#fff}
}
</style>

<script>
var BOOK = {"slug":"long-jin-ya-ou","title":"龙烬亚欧","en":"DRAGON EMBERS OVER EURASIA","titleHtml":"《<em>龙烬亚欧<\/em>》","kind":"长篇小说 · 架空历史","blurb":"建文秘脉五百年。1402 年南京宫城大火之后，一支火种没有熄灭 —— 它西行、渡海、入欧罗巴，潜伏进文艺复兴、宗教改革、科学革命与哈布斯堡的血脉里。当他们重新回到东方，已是五百年后。","tags":["架空历史","建文秘脉","全本 35 章 + 终章","多智能共创"],"parts":[{"name":"设定与大纲","chapters":[{"t":"世界观核心设定","ps":["一句话：1402 年南京宫城大火之后，华夏明初的文明火种没有熄灭 —— 它西行、渡海、入欧罗巴，潜伏进文艺复兴、宗教改革、科学革命与哈布斯堡的血脉里。五百年后，它随列强的炮舰回到故乡。",{"x":"全书是「明线正史 + 暗线秘脉」的双线叙事，两条线在 1911 年武昌枪响时闭环。","k":"q"},"公理 · 火种守恒","华夏明初的巅峰文明（永乐大典、大明礼制、本草星象、帝王心术）并未消亡，只是脱离中原正统，向西迁徙蛰伏。西方文艺复兴不是单纯古希腊复苏，而是「拜占庭西传火种 + 华夏流亡火种」双叠爆发。","规则 · 明暗双线","明线是正史：明清迭代、大航海、殖民扩张、八国联军、清末落幕。暗线是本书架空：建文秘脉五百年潜伏亚欧，以知识、血脉、联姻暗中撬动欧洲王室、文艺复兴与工业萌芽，最终反向影响华夏国运。","闭环 · 龙母原型","坦格利安龙族 ＝ 建文秘脉 × 拜占庭流亡贵族混血。流亡末代王族、举国覆灭、孤身携血脉蛰伏东方、银发紫眸（哈布斯堡近亲变异叠加东亚血脉稀释）、不怕火（建文一脉浴火逃生的传说演绎）、跨海归来夺回王座（秘脉五百年反向归华）—— 六个特征逐条对应本宇宙史实。","物证 · 伏尼契手稿","不是欧洲造假，也不是外星文字。是建文帝与贴身心腹文官，结合大明皇家本草、星象、礼制、养生秘术，融合拜占庭残存天文知识，自创的加密秘文。三个用途：规避追杀、留存火种、作联姻信物。碳十四测年 1404–1438，正落在建文流亡中欧的核心岁月；笔迹为多人群体（建文 + 三名心腹文官 + 两名中欧画师），与手稿的多作者痕迹吻合。","人物 · 四代血脉链",{"x":"初代 朱允炆（建文帝）：非软弱书生，精通经史、本草、星象、帝王权谋。出逃带 3 名翰林心腹、2 名护卫僧人、少量皇室秘宝 —— 1402 南京破城 → 剃度假死 → 闽越出海 → 南洋蛰伏 → 印度洋 → 拜占庭旧土 → 1408 抵达中欧哈布斯堡治区。","k":"item"},{"x":"第一代混血 建文 × 拜占庭没落公主：1453 拜占庭亡国，残余贵族流亡中欧，与建文一脉抱团。华夏帝王血脉 + 东罗马皇室血脉。","k":"item"},{"x":"二代至十代 哈布斯堡隐匿旁支：以东方知识、秘典秘术为筹码持续通婚，不争明面王权，只掌控知识、医术、星象与底层制度，成为欧洲王室背后的「隐秘帝师」。","k":"item"},{"x":"末代双命 朱宸 × 伊丽莎白·哈布斯堡：男主表面是奥匈帝国底层学者，实则手握五百年秘脉、完整解读伏尼契手稿；女主看似娇贵公主，实则背负亚欧双脉宿命。二人双向救赎。","k":"item"}]},{"t":"五卷全本大纲","ps":["第一卷：龙遁沧海（1402–1438）","核心：建文出逃，火种西迁，手稿成书","第一章 · 金陵焚天",{"x":"1402年六月十三，李景隆开金川门，燕军入城。南京皇宫大火。朱允炆在御前太监王钺、翰林编修程济、应天能仁寺主僧溥洽的协助下，剃度换装，从鬼门出宫。朱元璋留下的铁匣中：度牒三张、袈裟、剃刀、白银十锭。朱允炆改名“应文”，杨应能、叶希贤随行。","k":"q"},"第二章 · 鬼门夜遁",{"x":"六人从鬼门出，神乐观道士王升已备舟。朱允炆回望金陵火光，立下誓言：不复国，但存文脉。他带走的不是传国玉玺，而是洪武、建文两朝皇家秘藏的手抄本——《本草集要》《天文祥异赋》《皇明祖训》节录，以及他亲手摘抄的永乐大典初稿秘篇。","k":"q"},"第三章 · 闽越漂萍",{"x":"辗转云南、四川、贵州，最终在福建泉州登船。郑和下西洋的船队正在集结，朱棣密令沿海卫所严查“可疑僧人”。朱允炆一行搭乘阿拉伯商人的商船，航向南洋。","k":"q"},"第四章 · 三佛齐蛰伏",{"x":"在南洋三佛齐（今苏门答腊）停留两年。朱允炆以医术、星象立足，结识当地华人首领。他第一次接触到阿拉伯天文学、印度数学，意识到世界之大远超华夏认知。郑和舰队两次到访三佛齐，朱允炆远远望见大明龙旗，心如刀绞。","k":"q"},"第五章 · 印度洋的风",{"x":"1405年，搭乘阿拉伯商船穿越印度洋。途经锡兰（斯里兰卡）、印度卡利卡特、波斯湾忽鲁谟斯。朱允炆记录沿途风土，将大明本草与阿拉伯药物对照。在忽鲁谟斯，他遇到拜占庭流亡商人，第一次听说“罗马帝国”的故事。","k":"q"},"第六章 · 君士坦丁堡的黄昏",{"x":"1407年，抵达君士坦丁堡。此时拜占庭帝国已缩至城市一隅，奥斯曼土耳其兵临城下。朱允炆结识拜占庭贵族学者，接触到古希腊典籍、罗马法、东正教神学。他震惊于这个千年帝国的衰落，看到了大明的镜像。","k":"q"},"第七章 · 哈布斯堡的鹰堡",{"x":"1408年，穿越巴尔干，抵达神圣罗马帝国境内的奥地利地区。此时哈布斯堡家族刚丢掉神圣罗马帝国皇位（卢森堡家族在位），只是奥地利地方诸侯。朱允炆在维也纳附近的小镇定居，以“东方医师”身份行医。","k":"q"},"第八章 · 羊皮纸上的密码",{"x":"1409年起，朱允炆开始著书。他结合大明皇家本草、星象、养生秘术，融合拜占庭天文知识，自创一套加密文字。用中欧犊皮羊皮纸、铁胆墨水、矿物颜料绘制插图。心腹程济负责誊抄，当地画师负责绘图。","k":"q"},"第九章 · 龙与鹰的初遇",{"x":"1420年，哈布斯堡家族的年轻继承人（后来的腓特烈三世）到访小镇，被“东方医师”的学识折服。朱允炆向他讲述“以婚姻取天下”的东方权谋逻辑——不战而屈人之兵，通过联姻继承领土。腓特烈三世后来成为神圣罗马帝国皇帝，哈布斯堡联姻霸权由此起步。","k":"q"},"第十章 · 伏尼契成书",{"x":"1438年，历时近三十年，手稿终篇定稿。全书约240页，分为草药、天文、生物、宇宙、制药、配方六大部分。朱允炆在手稿最后一页，用加密文字写下：“吾乃大明建文皇帝朱允炆，国破家亡，流落西土，以此书存华夏文脉，待后世有缘人解之。”同年，朱允炆病逝，享年61岁。","k":"q"},"卷末伏笔：朱允炆的独子朱文奎（出逃时年仅7岁，在南洋长大），与拜占庭流亡贵族之女成婚。混血龙脉第一代诞生。","第二卷：暗哺欧罗巴（1453–1700）","核心：拜占庭覆灭，双火叠爆，文艺复兴隐秘真相","第十一章 · 君士坦丁堡的陷落",{"x":"1453年，奥斯曼苏丹穆罕默德二世攻破君士坦丁堡，千年东罗马帝国灭亡。大批拜占庭学者携带古希腊手稿逃往意大利。朱文奎（建文之子）的家族收容了一批流亡学者，中西典籍在维也纳郊外的庄园中第一次大规模碰撞。","k":"q"},"第十二章 · 美第奇的暗线",{"x":"佛罗伦萨美第奇家族的人文主义学园，通过拜占庭学者辗转获得“东方秘典”的部分抄本——伏尼契手稿中的天文、医药章节被翻译成拉丁文。哥白尼、伽利略的天文学研究，底层存在东方星象学的隐秘影响。","k":"q"},"第十三章 · 哈布斯堡的联姻帝国",{"x":"腓特烈三世之子马克西米利安一世，将“联姻取天下”玩到极致。娶勃艮第独女玛丽，获得尼德兰；安排儿子娶西班牙公主，孙子继承西班牙帝国。哈布斯堡成为日不落帝国。建文家族作为“隐秘帝师”，深度参与每一次联姻策划。","k":"q"},"第十四章 · 龙族的变异",{"x":"哈布斯堡家族为保血统纯粹，疯狂近亲通婚，产生标志性的“哈布斯堡大下巴”。而混入建文血脉的旁支，出现了罕见的变异：银发、紫眸、体质异常强健。这些孩子被视为“神选之子”，成为家族秘密武器。","k":"q"},"第十五章 · 宗教改革的暗手",{"x":"1517年马丁·路德宗教改革。建文家族的后人以“东方学者”身份，暗中向改革派提供“君权高于教权”的东方政治哲学——中国千年皇权至上的制度经验，成为欧洲世俗王权对抗教皇的思想武器。","k":"q"},"第十六章 · 三十年战争",{"x":"1618–1648年，欧洲三十年战争。哈布斯堡霸权被打碎。建文家族的后人在战争中意识到：欧洲的分裂与战乱，恰是华夏大一统的反面教材。他们开始系统整理“东方治国之道”，秘密流传于欧洲王室。","k":"q"},"第十七章 · 科学革命的火种",{"x":"1687年牛顿发表《自然哲学的数学原理》。很少有人知道，牛顿的炼金术研究中，参考了来自“东方秘典”的化学配方。伏尼契手稿的制药章节，通过隐秘渠道流入欧洲炼金术士圈子。","k":"q"},"卷末伏笔：1700年，西班牙哈布斯堡末代国王卡洛斯二世去世，西班牙王位继承战争爆发。建文家族的一支随西班牙王室迁往马德里，另一支留在维也纳。秘脉开始分散。","第三卷：鹰龙共生（1700–1850）","核心：哈布斯堡鼎盛，秘脉寄生，东西方国运反转","第十八章 · 启蒙运动的东方影子",{"x":"18世纪法国启蒙运动。伏尔泰、魁奈等思想家推崇“中国模式”——开明君主制、科举取士、儒家伦理。这些知识表面来自传教士报告，底层实则是建文家族五百年间秘密传播的“东方治国术”。","k":"q"},"第十九章 · 工业革命的暗线",{"x":"1760年代英国工业革命。蒸汽机的发明、工厂制度的建立，背后有“东方工程思维”的隐秘输入——《天工开物》的部分内容通过伏尼契手稿的“配方”章节传入欧洲。","k":"q"},"第二十章 · 大清的黄昏",{"x":"同一时期，中国处于乾隆盛世。但建文家族的后人通过东印度公司商人的报告，看到了大清的僵化：文字狱、闭关锁国、科技停滞。他们痛心疾首：五百年前先祖带走的火种，在西方生根发芽，而故土却在自我阉割。","k":"q"},"第二十一章 · 茜茜公主的诞生",{"x":"1837年，伊丽莎白·亚美莉·欧根妮（茜茜公主）出生于慕尼黑。她的母系血脉中，混入了建文家族的基因。她天生异质：厌恶宫廷繁文缛节、热爱自由、有神秘的东方气质。她的曾祖母留下的遗物中，有一本无人能解的“东方手抄本”——伏尼契手稿的副本。","k":"q"},"第二十二章 · 朱宸的觉醒",{"x":"1840年，鸦片战争爆发。同年，朱宸出生于维也纳一个底层学者家庭。他的父亲是建文第十九世孙，母亲是奥地利平民。父亲在他十岁时去世，留下遗训：“吾家本中华帝王之胄，流落西土五百年，待中华有变，当归。”","k":"q"},"卷末伏笔：1850年，朱宸十岁，在父亲的遗物中发现一本加密手抄本——伏尼契手稿的家族传承副本。他开始破译先祖的密码。","第四卷：万国伐夏（1850–1900）","核心：列强崛起，故土沉沦，火种反噬故国","第二十三章 · 破译天书",{"x":"朱宸用了十年时间，结合家族口传的“建文密码”，破译了伏尼契手稿。他震惊地发现：这部被欧洲学者视为“天书”的神秘手稿，竟是先祖建文帝的亲笔著作，里面封存着大明皇家的本草、星象、礼制、治国术，以及五百年家族流亡史。","k":"q"},"第二十四章 · 茜茜的婚礼",{"x":"1854年，茜茜公主与奥地利皇帝弗朗茨·约瑟夫一世结婚。朱宸作为宫廷学者的助手，第一次见到茜茜。两人在宫廷图书馆相遇，茜茜手中正拿着那本“无人能解的东方手抄本”。四目相对，宿命的齿轮开始转动。","k":"q"},"第二十五章 · 双脉相认",{"x":"朱宸向茜茜揭示了手稿的秘密，以及两人共同的血脉渊源——五百年前，建文帝与拜占庭公主的联姻，是他们共同的祖先。茜茜震惊之余，感到一种奇异的归属感：她一直厌恶的欧洲宫廷，原来不是她的根。","k":"q"},"第二十六章 · 普奥战争",{"x":"1866年普奥战争，奥地利战败，被排除出德意志。哈布斯堡帝国摇摇欲坠。1867年，奥匈二元帝国成立。朱宸作为皇帝的“东方事务顾问”，参与了帝国改革的秘密策划。他意识到：这个拼凑的多民族帝国，和五百年前的拜占庭何其相似。","k":"q"},"第二十七章 · 远东的炮声",{"x":"1894年，甲午中日战争，大清惨败。朱宸在维也纳的报纸上看到消息，彻夜未眠。五百年先祖带走的火种，滋养了西方的崛起，而故国却在被西方列强欺凌。他做出决定：归华。","k":"q"},"第二十八章 · 八国联军",{"x":"1900年，八国联军侵华。朱宸发现，攻入北京的八国贵族中，至少有三国的王室血脉里，流淌着建文家族的基因——哈布斯堡（奥匈）、罗曼诺夫（俄国，通过联姻混入）、萨克森-科堡-哥达（英国，通过维多利亚女王的联姻网络）。最讽刺的历史闭环：先祖的血脉，正在屠戮先祖的故土。","k":"q"},"第二十九章 · 北京的灰烬",{"x":"1900年8月，联军攻入北京，翰林院被焚，永乐大典副本大部分损毁，残卷被联军劫掠。朱宸以奥匈帝国翻译官身份随军进入北京。他站在翰林院的废墟上，捡起半本烧焦的《永乐大典》残页，与怀中的伏尼契手稿放在一起。五百年的分离，在灰烬中重逢。","k":"q"},"卷末高潮：朱宸在紫禁城的太和殿广场上，对着西方列强的旗帜，用中文低声说：“五百年了，该回家了。”","第五卷：龙烬归华（1900–1911）","核心：宿命救赎，文明归位，旧世落幕新生","第三十章 · 茜茜之死",{"x":"1898年，茜茜公主在日内瓦被意大利无政府主义者刺杀。朱宸收到消息时正在北京。茜茜临死前，将那本伏尼契手稿副本和一封信交给了侍女，信中只有一句话：“把它交给那个能读懂它的人。”朱宸知道，西方的龙母已经陨落，东方的龙该醒了。","k":"q"},"第三十一章 · 留在中国",{"x":"1901年，朱宸辞去奥匈帝国职务，留在中国。他化名“朱明远”，在上海、广州、武汉等地游历，接触维新派、革命党人。他将伏尼契手稿中的西方科学知识、五百年积累的欧洲治国经验，翻译成中文，秘密流传。","k":"q"},"第三十二章 · 火种的传播",{"x":"朱宸在上海创办“明夷学社”（明夷，《易经》卦名，意为“光明受损，韬光养晦”），表面是学术团体，实则是文明火种的传播站。他翻译的西方科学、政治、法律著作，比官方译本早十年流入中国知识界。","k":"q"},"第三十三章 · 最后的哈布斯堡",{"x":"1914年（伏笔），萨拉热窝事件，一战爆发，奥匈帝国解体。朱宸在上海的报纸上看到消息，长叹一声：“鹰的帝国，终于也落了。”五百年的鹰龙共生，以鹰的陨落告终。","k":"q"},"第三十四章 · 武昌枪响",{"x":"1911年10月10日，武昌起义爆发。朱宸正在武汉的明夷学社分部。他听到枪声，走到窗前，看到长江对岸的火光。五百年前，南京皇宫的火光中，先祖带着火种出逃；五百年后，武昌的火光中，旧王朝覆灭，新文明诞生。","k":"q"},"第三十五章 · 龙烬归华",{"x":"1912年2月12日，清帝退位。朱宸将伏尼契手稿的完整译本、五百年家族流亡史、以及他整理的中西文明融合方案，装入一个铁匣，埋在南京明孝陵的朱元璋墓前。他在铁匣上刻下：“建文后裔朱宸，奉还火种于中华。”","k":"q"},"终章 · 五百年的轮回",{"x":"朱宸站在明孝陵的松柏间，回望来路：1402年，南京火光，建文出逃，带走华夏火种；1438年，伏尼契成书，火种封存于中欧羊皮；1453年，拜占庭覆灭，双火种叠加，文艺复兴爆发；1600年，哈布斯堡联姻霸权，秘脉寄生欧洲王权；1800年，工业革命，西方崛起，东方沉沦；1900年，八国联军，火种反噬故土；1911年，武昌枪响，旧王朝覆灭，火种归位。","k":"q"},"五百年的流亡，五百年的蛰伏，五百年的文明暗战，终于在这一刻闭环。","朱宸转身，走向晨光中的南京城。他知道，这不是结束，而是新的开始。龙烬已归，中华待兴。","（全书完）"]}]},{"name":"正文 · 全本","chapters":[{"t":"第一章 · 金陵焚天","ps":["建文四年六月十三，南京。天是灰的。不是江南梅雨那种湿漉漉的灰，而是被烟火熏过的、带着焦糊味的灰。金川门方向的喊杀声已经持续了整整一个上午，此刻忽然安静下来。那种安静比喊杀声更可怕。","朱允炆站在奉天殿的丹陛上，穿着一身明黄色的常服，手里捏着一封刚刚送到的军报。军报上的字他已经看了三遍，每个字都像烧红的铁钉，一颗一颗钉进他的眼睛里。","——李景隆开金川门，燕军入城。他的表兄弟，他亲手加封的太子太师，在最关键的时刻，打开了南京的北大门。朱允炆没有愤怒。他只是觉得冷。六月的南京，湿热得像蒸笼，他却觉得有一股寒气从脚底升上来，顺着脊椎爬到后脑勺，让他的牙齿开始打颤。","“陛下。”","一个苍老的声音从身后传来。朱允炆回头，看见王钺跪在丹陛下。这个跟了朱元璋三十年、又跟了他四年的老太监，此刻满脸是泪，手里捧着一个铁匣。","“太祖高皇帝临终时，留下这个铁匣，说：‘若大难临头，可开此匣。’”","朱允炆看着那个铁匣。黑漆，铜锁，边角已经磨得发亮。他认得这个东西——小时候在奉先殿见过，朱元璋把它供在香案旁边，不许任何人碰。他一直以为那是什么传国之宝，或者兵符印信。","“打开。”","王钺颤抖着手，用一把生锈的钥匙打开铜锁。铁匣里没有玉玺，没有兵符，只有三样东西：三张度牒三件袈裟三把剃刀。度牒上已经写好了法名：应文、应能、应贤。","朱允炆拿起第一张度牒，看着“应文”两个字，忽然笑了。笑声很轻，像风吹过纸页。他的爷爷，那个从乞丐做到皇帝的男人，在临死前就已经预料到了这一天。他没有给孙子留下翻盘的筹码，只留下了一条活路——出家为僧，隐姓埋名。","“陛下……”王钺泣不成声。","“剃吧。”朱允炆把度牒放在一边，解开发冠。乌黑的长发散下来，披在明黄色的常服上，像一道黑色的瀑布。","王钺拿起剃刀，手抖得几乎握不住。刀锋触到头皮的那一刻，朱允炆闭上了眼睛。他听见头发一缕一缕落在地上的声音，沙沙的，像春蚕啃食桑叶。他想起四年前，他也是这样站在奉天殿里，接受百官的朝贺。那时候他二十一岁，年轻得像春天的柳枝，满脑子都是“仁政”“复古”“井田制”。他废掉了朱元璋的严刑峻法，减轻了江南的赋税，重用方孝孺、齐泰、黄子澄一群读书人，以为只要以德服人，天下自然太平。","然后他开始削藩。他的叔叔们，那些手握重兵的塞王，一个接一个被他废掉。周王、齐王、湘王、代王、岷王……他以为这是加强中央集权，是为了大明的长治久安。他忘了他的四叔朱棣，那个镇守北平二十年、跟蒙古人打了无数仗的燕王，不是那些只会吟诗作对的废物藩王。","靖难之役打了三年。他派了百万大军，换了四个统帅，从耿炳文到李景隆，每一个都输得一塌糊涂。他甚至下了一道“毋使朕有杀叔之名”的圣旨，让前线将士投鼠忌器，眼睁睁看着朱棣在战场上七进七出。","现在，朱棣进了南京。头发剃完了。朱允炆摸了摸自己的光头，头皮凉凉的。王钺递过袈裟，他接过来，脱下明黄色的常服，换上那件灰扑扑的僧衣。","“程济呢？”他问。","“在偏殿候着。”","“叫他来。还有杨应能、叶希贤。”","不多时三个人走进来。程济是翰林编修，精通术数，早在靖难之初就劝过朱允炆“燕王必反”，被他下了大狱，直到燕军渡江才放出来。杨应能和叶希贤是两个年轻的监察御史，都是建文二年的进士，书生气十足，城破之日没有逃跑，而是穿好了朝服，坐在都察院里等死。","“陛下。”三个人跪下。","“起来吧。”朱允炆指了指铁匣里的另外两张度牒，“从今日起，没有陛下，只有僧人应文。你们两个，应能、应贤。程济你不用剃度，做我的俗人弟子就行。”","程济抬起头，看着已经剃了光头、穿上袈裟的皇帝，忽然泪如雨下：“陛下……臣早知有今日……”","“早知今日，何必当初。”朱允炆淡淡地说，“你劝过我我没听。现在说什么都晚了。”","他走到奉天殿的御座前，伸手摸了摸那把雕龙刻凤的椅子。紫檀木的，冰凉。他坐了四年，从来没有觉得它舒服过。现在要离开了，反而有一丝不舍。","“王钺，”他头也不回地说，“去把奉先殿里那个樟木箱子拿来。”","“陛下……那是……”","“快去。”","王钺去了。不多时，抱着一个半人高的樟木箱子回来，箱子上了三道锁，封着洪武年间的封条。朱允炆从怀里掏出一把钥匙——那是他登基那天，马皇后亲手交给他的，说是“朱家的命根子”。","打开箱子，里面没有金银珠宝，只有一摞手抄本，用黄绫包裹着。《本草集要》——洪武年间宫廷御医编的本草书，比李时珍的《本草纲目》早了两百年，只抄了三部，一部在太医院，一部在奉先殿，一部被朱允炆带走。","《天文祥异赋》——朱元璋命人编的星象书，记录了从三皇五帝到洪武年间的所有天象异变，以及对应的占卜解读。《皇明祖训》节录——朱元璋亲自写的家法，朱允炆亲手抄了一遍，在旁边加了自己的批注。","还有一个薄薄的册子，封面没有字。朱允炆把它拿起来，手指摩挲着封面。这是他的手抄本——永乐元年，解缙等人开始编纂《文献大成》（后来的《永乐大典》），朱允炆虽然已经退位，但他在宫中时看过初稿，亲手摘抄了其中最精华的部分：天文、地理、医药、工艺、制度。","他本来想等永乐大典编成，要做一套完整的抄本，藏在民间，让后世子孙都能看到。现在他只能带走这薄薄的一册。","“这些东西，比传国玉玺重要。”朱允炆把册子放回箱子，合上箱盖，“玉玺丢了可以再刻，文脉断了就再也接不上了。”","程济看着那个樟木箱子，忽然明白了什么：“陛下……您是要……”","“走。”朱允炆说，“从鬼门走。王钺已经安排好了，神乐观的船在城外等着。”","“去哪？”","“先去云南，再去福建，然后……”朱允炆顿了顿，抬头看向窗外。窗外的天空已经被烟火染成了暗红色，远处传来燕军的号角声。","“然后出海。”他说，“天下之大，总有我等容身之处。”"]},{"t":"第二章 · 鬼门夜遁","ps":["鬼门在皇宫的东北角，是一个不起眼的小门，平时只有倒泔水、运粪便的杂役走。门很矮，要低着头才能过去，门上的漆早就剥落了，露出里面发黑的木头。朱允炆抱着樟木箱子弯着腰从鬼门里钻出来。门外是一条狭窄的巷子，巷子里堆满了垃圾，散发着恶臭。巷口停着一辆破牛车，车上盖着茅草，赶车的是一个驼背老头，脸上全是皱纹，看不出年纪。","“应文师父。”老头低声说，声音沙哑，“上车吧。”","朱允炆认出来了——这是神乐观的老道士王升。朱元璋还没当皇帝的时候，王升就跟着他，后来朱元璋做了皇帝，封他做了神乐观的提点，掌管皇家祭祀。这个老头，看着疯疯癫癫，其实比谁都清醒。","“王公公。”朱允炆叫了一声。","“别叫我公公。”王升咧嘴一笑，露出一口黄牙，“我是道士，不是太监。快上车燕军的巡逻队马上就到。”","朱允炆上了牛车，程济、杨应能、叶希贤跟着上来，王钺也要上，被朱允炆拦住了。","“你留下。”","“陛下！”王钺急了，“老奴伺候了太祖三十年，伺候了陛下四年，您不能丢下老奴！”","“正因为你伺候了我爷爷三十年，所以你必须留下。”朱允炆看着他，眼神很平静，“燕军进城，必然要找你问话。你告诉他们，朕已经在火里烧死了。你是唯一的证人你的话朱棣会信。”","“可是……”","“没有可是。”朱允炆从怀里掏出一块玉佩，塞到王钺手里，“这是朕的贴身之物，你交给朱棣，就说是在火堆里捡的。他看到这个，就会相信朕死了。”","王钺捧着玉佩，双手发抖。那是一块和田羊脂玉，上面刻着“允炆”两个字，是朱元璋在他出生时亲手刻的。","“陛下……”老太监扑通一声跪下，额头磕在青石板上，咚咚作响，“老奴……老奴遵旨。”","牛车动了。朱允炆坐在茅草堆里，回头看着王钺跪在巷口的身影，越来越小，最后消失在拐角处。他没有流泪。从剃度的那一刻起，他就告诉自己，不能再哭了。牛车出了南京城，沿着秦淮河往东南走。夜色已经降临，河面上飘着一层薄雾，远处的南京城被火光映得通红，像一座燃烧的熔炉。","“陛下，我们去哪？”程济问。","“先去吴江，再去浙江，然后转道福建。”朱允炆说，“云南有沐晟，是我爷爷的义子，不会出卖我。但云南太远，路上不安全。福建靠海，万一走投无路，还能出海。”","“出海？”杨应能吃了一惊，“陛下海外都是蛮夷之地……”","“蛮夷？”朱允炆笑了笑，“你以为我大明就是天下中心？我读过《岛夷志略》，汪大渊在元朝的时候就坐船到过非洲，海外的世界大得很。我们这一套，在大明是死罪，在海外，说不定还能活下去。”","他拍了拍身边的樟木箱子：“这些东西，在大明是禁书在海外就是宝贝。”牛车走了一夜，天亮时到了吴江的一个小镇。王升把牛车停在一座破庙前，从怀里掏出几两碎银子，递给朱允炆。","“师父我只能送到这儿了。”王升说，“再往南就是燕军的地盘，我一个道士，带着你们太扎眼。你们换上便服，装成云游的僧人往南走。到了泉州，找一个叫蒲寿庚的后人，他们家世代做海商，在南洋有人脉。”","“蒲寿庚？”程济皱起眉头，“那是宋朝的叛臣……”","“叛臣？”朱允炆摆摆手，“都什么时候了还管什么叛臣忠臣。能活下去，才是最重要的。”","他接过银子，向王升行了一个僧礼：“多谢道长。”","“别谢我。”王升摆摆手，转身上了牛车，“我是奉了太祖的遗命。他老人家算到了这一天，让我在这儿等着。”","牛车走了。朱允炆站在破庙前，看着牛车消失在晨雾里，忽然觉得自己像一片被风吹走的叶子，无根无底，不知道要飘到哪里去。","“陛下，”程济低声说，“我们……真的不回去了吗？”","“回去？”朱允炆回头看了一眼南京的方向，“回去做什么？做朱棣的阶下囚？还是做他的刀下鬼？”","他顿了顿，声音低了下来：“程济你记住从今天起，没有朱允炆，只有僧人应文。我们不是在逃命，我们是在存文脉。这些书，”他拍了拍樟木箱子，“比我的命重要。只要这些书还在大明的文脉就没有断。”","程济看着他，忽然觉得这个年轻的前皇帝，一夜之间变了。以前的朱允炆，是个温文尔雅的书生，说话轻声细语，做事优柔寡断。现在的应文，眼神里有一种东西，像淬火之后的钢冷硬锋利。","“是。”程济低下头，“弟子记住了。”"]},{"t":"第三章 · 闽越漂萍","ps":["从吴江到泉州，他们走了三个月。一路上，朱允炆以“云游僧人”的身份，带着三个弟子，昼伏夜出，专走小路。沿途的州县都贴了燕王的告示：“有僧人行迹可疑者，立即报官。”朱棣显然不相信他烧死了，正在全国搜捕。","好在朱允炆准备充分。他剃了光头，穿上袈裟，脸上抹了灶灰，看上去就是一个普通的游方僧。程济装成他的俗人弟子，挑着担子，担子一头是樟木箱子，一头是简单的行李。杨应能和叶希贤也剃了度，装成小和尚，跟在后面。","他们在浙江的一座寺庙里住了一个月。那座寺庙叫东明寺，在杭州城外的山上，香火不旺，只有几个老和尚。朱允炆在寺里帮着抄经、做法事，老和尚们都喜欢这个识字又勤快的“应文师父”。","在东明寺，朱允炆第一次听到了外面的消息。一个来上香的香客说，燕军进城后，方孝孺被灭了十族，齐泰、黄子澄被凌迟处死，建文朝的官员杀的杀流放的流放，整个南京城血流成河。","杨应能和叶希贤听到消息，躲在禅房里哭了一夜。朱允炆没有哭。他坐在禅房的窗前，看着窗外的月亮，坐了一夜。第二天早上，他对程济说：“走。”","“去哪？”","“福建。”","他们从浙江进入福建，沿着海岸线往南走。福建多山，山路崎岖，人烟稀少，反而安全。他们在一个叫“白云寺”的小庙里住了下来，一住就是半年。白云寺在泉州城外的清源山上，寺里只有一个老和尚，法号“虚空”，已经八十多岁了耳朵背眼睛花每天除了念经就是睡觉。朱允炆帮着打理寺庙，老和尚乐得清闲，把什么都交给他。","在白云寺，朱允炆开始系统地整理他带出来的那些书。他把《本草集要》从头到尾抄了一遍，在旁边加了自己的批注——他在宫里时，跟太医院的院使学过三年医理，虽然不能说是名医，但基础扎实。他把大明的草药和他在沿途见到的南方草药做了对照，发现很多南方草药，《本草集要》里没有记载。","他还开始读《岛夷志略》。这是元朝人汪大渊写的，记录了他两次出海的见闻，从东南亚到印度，从波斯湾到东非，一共写了九十九个国家和地区。朱允炆读得如痴如醉，他第一次知道，原来大海的另一边，有那么多国家，那么多文明。","“程济，”他把书递给程济，“你看看这个叫‘忽鲁谟斯’的地方，在波斯湾，是东西方贸易的枢纽。还有这个‘麻林’在东非出产长颈鹿和象牙。我们如果能到这些地方，就安全了。”","程济翻了翻书，皱起眉头：“陛下……这些地方太远了。而且语言不通，风俗不同……”","“远怕什么。”朱允炆说，“汪大渊一个元朝的商人，都能走到非洲，我们为什么不能？语言不通可以学；风俗不同可以适应。只要活着就有希望。”","他顿了顿，声音低了下来：“而且朱棣不会放过我的。他现在在全国搜捕，等他坐稳了皇位，就会派人出海找我。我们待在大明，迟早会被抓到。只有出海，到了他找不到的地方，才能真正安全。”","程济沉默了。他知道朱允炆说的是对的。就在这时，一个消息传到了白云寺。永乐元年七月，朱棣派太监郑和，率领两百多艘海船、两万七千多人，从苏州刘家港出发下西洋。名义上是“宣德化而柔远人”，实际上所有人都知道，是为了找建文帝。","朱允炆听到这个消息，正在抄《本草集要》。他手里的笔停了一下，墨水滴在纸上，晕开一团黑。","“来了。”他淡淡地说。","“陛下……”程济急了，“郑和的船队有两万多人我们……”","“怕什么。”朱允炆放下笔，“他的船队再大，也不可能搜遍整个南洋。我们只要赶在他之前出海，就安全了。”","他站起来走到窗前，看着窗外的大海。清源山不高，站在窗前就能看到泉州湾的海面，海面上有几艘帆船，像几片树叶，在波浪里起伏。","“明天，”他说，“我们去泉州港，找蒲家的船。”"]},{"t":"第四章 · 三佛齐蛰伏","ps":["泉州港是当时世界上最大的港口之一。码头上停满了帆船，有中国的福船，有阿拉伯的三角帆船，有印度的平底船，还有一些叫不出名字的异域船只。码头上人来人往，操着各种语言，汉语、阿拉伯语、波斯语、印度语、马来语，混在一起，像一锅煮沸的粥。","朱允炆穿着一身半旧的僧衣，站在码头边，看着这一切。他在宫里时，读过《泉州府志》，知道泉州是“东方第一大港”，但书上的文字，远不如亲眼所见来得震撼。","“师父，”程济凑过来低声说，“蒲家的人找到了。”","一个穿着丝绸长袍、戴着白色头巾的中年男人走过来，皮肤黝黑眼睛深陷鼻梁高挺，是典型的阿拉伯-波斯混血。他叫蒲和日，是蒲寿庚的曾孙，蒲家现在的当家人之一，专门跑南洋航线。","“应文师父。”蒲和日拱手，用一口流利的汉语说，“王升道长的信，我收到了。你们要去三佛齐？”","“是。”朱允炆说，“我们是云游僧人，想去南洋弘扬佛法。”","蒲和日上下打量了他一眼，嘴角露出一丝意味深长的笑：“弘扬佛法？师父，我蒲家跑了三代海商，什么人没见过。您这双手，细皮嫩肉，不像干过活的；您这三个弟子，一个像书生，两个像官差。您要真是云游僧人，我把脑袋割下来给您当球踢。”","朱允炆心里一紧，但脸上没有表露出来。他平静地说：“蒲老板既然看出来了，那我也不瞒你。我们是建文朝的遗民，燕贼篡位，我们在大明待不下去了，想出海避祸。”","“建文朝的遗民？”蒲和日的眼睛亮了一下，“您是……”","“一个普通的翰林。”朱允炆没有暴露身份，“这是我的三个弟子。我们带了一些书，想在南洋找个地方安顿下来。”","蒲和日盯着他看了很久，忽然笑了：“行，我不管你是谁。王升道长的面子，我不能不给。而且，”他压低声音，“我蒲家在元朝的时候就跟朝廷不对付，朱元璋得了天下，把我们蒲家的男人都充军了女人都卖了。我跟朱家有仇。你是建文朝的人，跟朱棣有仇，我们算是同路人。”","他拍了拍朱允炆的肩膀：“上我的船，三天后出发，去三佛齐。船费我免了到了三佛齐，我给你们找地方住。”","“多谢蒲老板。”","“别谢我。”蒲和日摆摆手，“我是生意人，不做亏本买卖。你带的那些书，到了三佛齐，说不定能派上用场。南洋那边，缺的就是识字的人。”","三天后，朱允炆一行登上了蒲和日的商船。那是一艘阿拉伯式的三角帆船，排水量不大，但速度快，适合在印度洋上航行。船上有二十多个水手，都是阿拉伯人和马来人，只有蒲和日会说汉语。","船出了泉州港，一路向南。朱允炆站在船尾，看着大陆越来越远，最后变成一条模糊的线，消失在海平线上。他没有回头。航行很顺利。经过台湾海峡，穿过南海，十五天后，到达了三佛齐的旧港（今印度尼西亚巨港）。","三佛齐是南洋的大国，控制着马六甲海峡的咽喉，是东西方贸易的枢纽。旧港是三佛齐的首都，城里住着华人、马来人、阿拉伯人、印度人，各种文化混杂在一起，热闹非凡。","蒲和日把朱允炆一行安顿在旧港的华人区。那里有一座妈祖庙，庙祝是一个姓梁的广东人，蒲和日跟他很熟。梁庙祝听说朱允炆是“识字的僧人”，很高兴，把庙里的偏殿收拾出来，让他们住。","“应文师父，”梁庙祝说，“我们这儿缺的就是识字的人。您要是愿意，帮着庙里抄抄经，教教孩子们读书，管您吃住。”","“多谢梁施主。”朱允炆合掌行礼。","就这样，朱允炆在三佛齐住了下来。他在妈祖庙里办了一个私塾，教华人的孩子读书识字。他的学生从最初的五六个，增加到后来的三十多个。他教的不是四书五经，而是更实用的东西：算术、地理、草药、航海知识。他把《本草集要》里的草药知识，结合南洋当地的草药，编成了一本《南洋本草》，用汉字和马来文双语写成，在当地华人中流传。","他还教孩子们天文。晚上，他带着孩子们在海边看星星，教他们辨认星座，用星象判断方向和季节。他把《天文祥异赋》里的星象知识，简化成口诀，让孩子们背下来。","在三佛齐，朱允炆第一次感受到了自由。这里没有朱棣的追杀，没有朝廷的规矩，没有君臣的名分。他只是一个普通的教书先生，一个识字的僧人。他的学生们喜欢他，当地的华人尊重他，连马来人和阿拉伯人也愿意跟他打交道。","但他知道，这不是终点。郑和的船队已经到了南洋。永乐三年，郑和第一次下西洋，船队经过三佛齐，剿灭了海盗陈祖义，在旧港设立了宣慰司。朱允炆远远地看到了郑和的船队——两百多艘大船，遮天蔽日，船上的大明旗帜，在海风里猎猎作响。","他站在妈祖庙的屋顶上，看着那支庞大的舰队，心里五味杂陈。那是他的国家的舰队，是他的堂弟派来的舰队，是来抓他的舰队。","“师父，”程济站在他身边低声说，“郑和的人在城里搜查，说是找‘可疑僧人’。我们……”","“走。”朱允炆说。","“去哪？”","“继续往西。”朱允炆看着西方的海平线，“印度洋那么大，他郑和再厉害，也不可能搜遍每一个港口。我们去印度去波斯去更远的地方。”","他顿了顿，声音低了下来：“而且我想看看，汪大渊书里写的那些地方，到底是什么样子。”"]},{"t":"第五章 · 印度洋的风","ps":["永乐五年，朱允炆一行搭乘一艘阿拉伯商船，从三佛齐出发，穿越印度洋。船上有三十多个商人，大部分是阿拉伯人，还有几个印度人和波斯人。朱允炆以“东方医师”的身份上船，免费给船员看病，换取船费。他的医术在三佛齐已经小有名气，阿拉伯商人都愿意带他。","航行的第一站是锡兰（今斯里兰卡）。锡兰是印度洋上的明珠，岛上有茂密的热带雨林，有洁白的沙滩，还有古老的佛教寺庙。朱允炆在锡兰的首都科伦坡住了一个月，他参观了当地的佛教寺庙，跟斯里兰卡的僧人交流佛法。他发现，斯里兰卡的佛教，跟中国的佛教很不一样——这里的佛教更原始，更接近佛陀时代的样子，没有中国佛教那么多的宗派和仪轨。","他还在锡兰见到了郑和的船队。永乐五年，郑和第二次下西洋，船队在锡兰停靠。锡兰国王亚烈苦奈儿想抢劫郑和的船队，被郑和打败，俘虏了国王和王后，带回南京。朱允炆在科伦坡的港口，远远地看到了郑和的大船，还有被押上船的锡兰国王。","“他越来越厉害了。”朱允炆对程济说，“灭了陈祖义，又抓了锡兰国王。南洋已经没有人敢跟他作对了。”","“陛下，”程济说，“我们是不是走得越远越好？”","“嗯。”朱允炆点点头，“去印度。”","从锡兰出发，航行七天，到达了印度的卡利卡特（今科泽科德）。卡利卡特是印度西海岸的重要港口，是香料贸易的中心。城里到处都是香料市场，胡椒、肉桂、丁香、豆蔻，各种香料堆成小山，空气里弥漫着浓烈的香味。阿拉伯商人、波斯商人、中国商人，在这里买进卖出，热闹非凡。","朱允炆在卡利卡特住了两个月。他跟着当地的印度医生学习，了解印度的医学体系——阿育吠陀。他发现，印度医学跟中医有很多相似之处：都讲究整体观念，都用草药治病，都重视饮食和养生。但也有很多不同：印度医学更强调体质的分类，用三种“能量”（瓦塔、皮塔、卡法）来解释人体的健康和疾病。","他把印度医学的知识记录下来，跟《本草集要》做对照，发现很多印度草药，中医里没有记载，但疗效很好。他开始编写一本《西域本草》，记录他在海外见到的各种草药。","在卡利卡特，朱允炆还遇到了一个改变他命运的人。那是一个拜占庭商人，叫狄奥多西，来自君士坦丁堡。他是一个希腊人，穿着罗马式的长袍，说着一口流利的阿拉伯语和波斯语，还会一点拉丁语。他的家族世代做东西方贸易，从君士坦丁堡到印度，再到中国，都有他的商队。","狄奥多西在卡利卡特生病了，发高烧，昏迷不醒。当地的印度医生束手无策，说他活不过三天。朱允炆听说后，主动去给他看病。他用中医的方法——针灸、汤药、物理降温，把狄奥多西从鬼门关拉了回来。","狄奥多西醒来后，对朱允炆感激涕零。他听说朱允炆是“来自东方的医师”，非常好奇，跟他聊了整整一夜。","“师父，”狄奥多西说，“您的医术太神奇了。我走过很多地方，见过阿拉伯医生、印度医生、波斯医生，但从来没有见过您这样的医术。您是从哪里学来的？”","“我的国家。”朱允炆说，“一个叫中国的地方。”","“中国？”狄奥多西眼睛一亮，“我知道！我年轻的时候，听我祖父说过，在遥远的东方，有一个伟大的帝国，叫‘契丹’或者‘秦’，那里有繁华的城市，有聪明的人民，有神奇的医术。我的祖父还说，他年轻的时候，见过一个从中国来的商人，那个商人会用一根银针治病，跟您一样！”","朱允炆笑了笑：“那是针灸。”","“针灸……”狄奥多西喃喃地重复着这个词，“师父，您愿意跟我去君士坦丁堡吗？我的家族在那里有很大的产业，您可以在那里行医，传播您的医术。而且，”他压低声音，“君士坦丁堡是罗马帝国的首都，有很多古老的书籍和学者，您一定会感兴趣的。”","“罗马帝国？”朱允炆吃了一惊，“罗马帝国不是早就灭亡了吗？”","“西罗马灭亡了，但东罗马还在。”狄奥多西说，“我们的首都在君士坦丁堡，我们的皇帝是罗马人的皇帝。我们的帝国已经存在了一千多年了。”","朱允炆沉默了。他读过《后汉书》，知道“大秦”就是罗马帝国，但他一直以为罗马帝国早就灭亡了。没想到，在遥远的西方，还有一个“罗马帝国”存在。","“君士坦丁堡……”他喃喃地说，“离这里有多远？”","“坐船的话，从卡利卡特出发，经过波斯湾，再走陆路，大概需要三个月。”狄奥多西说，“师父您跟我去吧。我保证您不会后悔的。”","朱允炆看了看程济。程济点了点头。","“好。”朱允炆说，“我跟你去。”"]},{"t":"第六章 · 君士坦丁堡的黄昏","ps":["从卡利卡特到君士坦丁堡，他们走了四个月。先坐船到波斯湾的忽鲁谟斯，然后换乘小船，沿着底格里斯河而上，到达巴格达。再从巴格达出发，骑骆驼穿越安纳托利亚高原，最后到达君士坦丁堡。","一路上，朱允炆见识了一个完全不同的世界。忽鲁谟斯是波斯湾的咽喉，是东西方贸易的枢纽。城里有壮观的清真寺，有繁华的市场，有来自世界各地的商人。朱允炆在忽鲁谟斯住了半个月，跟当地的波斯学者交流，学习波斯的天文学和数学。他发现，波斯人的天文学非常发达，他们有精确的星表，有复杂的天文仪器，比大明的天文学更精确。","巴格达是阿拔斯王朝的旧都，虽然已经衰落，但仍然有很多古老的图书馆和学者。朱允炆在巴格达的“智慧宫”遗址前站了很久——那是阿拉伯帝国时期最大的图书馆和学术中心，收藏了从古希腊到波斯到印度的各种书籍。虽然智慧宫已经被蒙古人摧毁了，但它的传说仍然在学者中流传。","“蒙古人……”朱允炆对程济说，“他们摧毁了巴格达，也摧毁了阿拉伯的文明。但他们也打通了东西方的道路，让东西方的文化可以交流。”","“陛下，”程济说，“蒙古人不是也征服了中国吗？元朝就是蒙古人建立的。”","“是啊。”朱允炆叹了口气，“所以我爷爷才要推翻元朝，恢复中华。但有时候我想，如果元朝没有灭亡，东西方的交流会不会更顺畅？我们会不会更早地了解西方？”","程济没有说话。他知道这个问题没有答案。经过四个月的跋涉，他们终于到达了君士坦丁堡。当君士坦丁堡的城墙出现在地平线上时，朱允炆惊呆了。那是一座巨大的城市，坐落在博斯普鲁斯海峡的岸边，三面环海，一面是陆地。城墙上有密密麻麻的塔楼和堡垒，城墙高大得像一座山。城市的中心，是圣索菲亚大教堂，巨大的穹顶在阳光下闪闪发光，像一颗落在大地上的星星。","“这就是……君士坦丁堡？”朱允炆喃喃地说。","“是。”狄奥多西骄傲地说，“这是世界的中心，是新罗马，是上帝在人间的居所。”","但朱允炆很快就发现，这座伟大的城市，已经是黄昏了。城墙上有很多裂缝，有些塔楼已经倒塌，没有修复。街上的行人不多，很多店铺关着门。城市的人口，据说已经从鼎盛时期的一百万，减少到了现在的不到十万。城外，奥斯曼土耳其人的军队，已经包围了城市的外围，随时可能发动进攻。","“罗马帝国……”朱允炆对狄奥多西说，“已经衰落了。”","狄奥多西的脸色暗了下来：“是啊。我们的帝国，已经不是当年的那个帝国了。现在，我们能控制的，只有君士坦丁堡这座城市，和周围的一点点土地。城外，都是土耳其人的地盘。”","“为什么会这样？”","“原因很多。”狄奥多西叹了口气，“十字军东征的时候，西方人洗劫了君士坦丁堡，我们的帝国从此一蹶不振。然后，土耳其人崛起，一步步蚕食我们的领土。现在，我们的皇帝，只能靠向西方求援，才能勉强维持。但西方人……”他苦笑了一下，“他们只想要我们的土地和财富，不想真的帮我们。”","朱允炆沉默了。他想起了大明。如果他没有削藩，如果朱棣没有造反，如果大明能够继续发展，会不会也像罗马帝国一样，盛极而衰？他在君士坦丁堡住了下来。狄奥多西把他安排在自己的庄园里，那是一个在城市郊区的小庄园，有葡萄园，有橄榄树，还有一个小图书馆。朱允炆在庄园里行医，同时跟狄奥多西家族的学者学习。","他学习希腊语，阅读古希腊的典籍——柏拉图、亚里士多德、欧几里得、托勒密。他震惊地发现，这些两千年前的希腊人，已经有了如此深刻的哲学思想，如此精确的数学和天文学。欧几里得的《几何原本》，逻辑严密，体系完整，比大明的算学更系统；托勒密的《天文学大成》，虽然是地心说，但计算精确，数据详实，比大明的天文历法更先进。","他还学习罗马法。查士丁尼的《国法大全》，把罗马一千多年的法律系统整理成了一个完整的体系，逻辑严密，条文清晰。朱允炆读了之后，深受启发——大明的法律，是朱元璋的《大明律》，虽然也很完备，但更多的是刑法，缺乏民法和商法的内容。而罗马法，对财产、契约、婚姻、继承，都有详细的规定，更适合商业社会。","“原来西方也有这么发达的文明。”朱允炆对程济说，“我以前以为只有华夏才是文明的中心，其他地方都是蛮夷。现在看来我错了。”","“陛下……”程济说，“那我们……”","“我们要把这些知识都学下来。”朱允炆的眼睛里闪着光，“然后，把华夏的知识和西方的知识结合起来，创造一种新的文明。”","他顿了顿，声音低了下来：“也许，这就是我流亡的意义。”"]},{"t":"第七章 · 哈布斯堡的鹰堡","ps":["永乐六年，朱允炆做出了一个决定：离开君士坦丁堡，去中欧。原因有两个。第一君士坦丁堡的局势越来越紧张，奥斯曼土耳其人的进攻越来越频繁，这座城市迟早会被攻破。第二狄奥多西告诉他，在中欧的神圣罗马帝国，有更多的古希腊典籍，有更发达的学术，还有一个叫“哈布斯堡”的家族，正在崛起。","“哈布斯堡？”朱允炆问，“那是什么？”","“是一个贵族家族。”狄奥多西说，“他们的老家在瑞士的鹰堡，后来搬到了奥地利。现在，他们是奥地利的公爵，势力很大。他们家族有一个传统——喜欢用联姻的方式获取领土。他们的家族格言是：‘让别人打仗去吧，幸福的奥地利，你去结婚！’”","“联姻获取领土？”朱允炆的眼睛亮了，“不战而屈人之兵？”","“对。”狄奥多西说，“他们不怎么打仗，而是把女儿嫁给其他国家的继承人，等对方没有儿子的时候，他们的外孙就可以继承对方的领土。这样不用打仗，就能获得大片土地。”","朱允炆沉默了。他想起了朱元璋。朱元璋打了一辈子仗，从一个乞丐做到皇帝，靠的是武力。而这个哈布斯堡家族，靠的是婚姻，就能获得大片领土。这两种方式，哪一种更高明？","“我想去看看。”朱允炆说。","“好。”狄奥多西说，“我有一个商队，下个月要去维也纳。您跟我的商队一起去吧。到了维也纳，我给您写一封信，介绍您认识哈布斯堡家族的人。”","永乐六年秋天，朱允炆一行从君士坦丁堡出发，跟随狄奥多西的商队，穿越巴尔干半岛，前往维也纳。巴尔干半岛是一个民族混杂的地方，有希腊人、塞尔维亚人、保加利亚人、克罗地亚人，还有土耳其人。这里的局势很混乱，各个民族之间经常打仗，土匪也很多。商队有武装护卫，一路还算顺利。","经过两个月的跋涉，他们到达了维也纳。维也纳是神圣罗马帝国的重要城市，是奥地利公爵的驻地。城市不大，但很整洁，有壮观的教堂，有繁华的市场，还有一座宏伟的公爵宫殿。城市的周围，是连绵的葡萄园和森林，风景很美。","但朱允炆很快就发现，维也纳跟君士坦丁堡比起来，差得太远了。君士坦丁堡有上千年的历史，有壮观的城墙，有圣索菲亚大教堂，有丰富的藏书。而维也纳，只是一个新兴的边境城市，没有什么历史底蕴，也没有什么学术氛围。","“这就是……奥地利？”朱允炆对狄奥多西的商队队长说。","“是。”商队队长说，“奥地利公爵的领地。现在的公爵叫恩斯特，是哈布斯堡家族的人。他的儿子腓特烈，很有才华，将来可能会成为神圣罗马帝国的皇帝。”","“腓特烈？”","“对。腓特烈三世。他现在才二十多岁，但已经很有政治手腕了。”商队队长压低声音，“听说，他正在跟波希米亚国王和匈牙利国王谈判，想通过联姻的方式，获得他们的领土。”","朱允炆的眼睛亮了：“我能见见他吗？”","“这个……”商队队长犹豫了一下，“公爵不是谁都能见的。不过，狄奥多西老爷的信，应该能起作用。您先在城里住下来，我去帮您递信。”","朱允炆在维也纳的一个小旅馆里住了下来。他以“东方医师”的身份，在城里行医，很快就有了名气。维也纳的市民们都知道，城里来了一个“东方来的医师”，医术高明，什么病都能治。","半个月后，商队队长带来了消息：腓特烈公爵同意见他。见面的地点在公爵宫殿的书房里。腓特烈三世是一个高个子的年轻人，金发碧眼，穿着华丽的贵族长袍，气质儒雅，但眼神里有一种精明和锐利。他的书房很大，四面都是书架，上面摆满了书籍，有拉丁文的有希腊文的还有阿拉伯文的。","“你就是那个东方来的医师？”腓特烈用拉丁语说。","“是。”朱允炆用刚学的拉丁语回答，“我叫应文，来自遥远的东方。”","“东方？”腓特烈饶有兴趣地看着他，“是那个叫‘契丹’的地方吗？我读过马可·波罗的游记，他说那里有繁华的城市，有无数的财富，还有聪明的人民。”","“是。”朱允炆说，“马可·波罗没有说谎。我的国家，确实很繁华。”","“那你为什么要离开你的国家，来到这里？”","朱允炆沉默了一下，说：“我的国家发生了内乱，我是一个学者，不想参与政治，所以出来游历，想看看世界。”","“学者？”腓特烈的眼睛亮了，“你懂什么学问？”","“医学、天文学、数学、历史、法律。”朱允炆说，“我还懂一些治国之道。”","“治国之道？”腓特烈来了兴趣，“你说说，怎么治理一个国家？”","朱允炆想了想，说：“治理国家，有上中下三策。下策是用武力，靠军队征服和镇压；中策是用法律，靠制度规范和约束；上策是用婚姻，靠血缘融合和继承。”","“婚姻？”腓特烈吃了一惊，“婚姻也能治理国家？”","“当然。”朱允炆说，“在我的国家，有一句话叫‘不战而屈人之兵，善之善者也’。打仗要死人要花钱要消耗国力。而婚姻不需要死一个人，不需要花一分钱，只要把你的女儿嫁给对方的继承人，等对方没有儿子的时候，你的外孙就可以继承对方的领土。这样你不用打仗，就能获得大片土地。这不是比打仗更高明吗？”","腓特烈愣住了。他盯着朱允炆看了很久，忽然哈哈大笑起来。","“好！好一个‘不战而屈人之兵’！”他拍着桌子说，“应文先生，你说得太对了！我们哈布斯堡家族，一直就是这么做的！但从来没有人把它总结成一套理论。你今天这一番话，让我茅塞顿开！”","他站起来，走到朱允炆面前，郑重地说：“应文先生，你愿意留在我的宫廷里，做我的顾问吗？我需要你这样的人才。”朱允炆看着这个年轻的公爵，心里百感交集。他想起了朱元璋，想起了朱棣，想起了那些在靖难之役中死去的人。他本来是大明的皇帝，现在却要在一个欧洲小国的宫廷里，做一个顾问。","但他没有拒绝。","“好。”他说，“我愿意。”"]},{"t":"第八章 · 羊皮纸上的密码","ps":["从永乐七年开始，朱允炆在腓特烈三世的宫廷里，做了一名“东方顾问”。他的工作很杂：给公爵和贵族们看病，给公爵的孩子们讲授东方的历史和文化，给公爵的外交政策出谋划策。他的拉丁语越来越好，还学会了德语和希腊语。他在维也纳的贵族圈子里，渐渐有了名气——大家都知道，公爵的宫廷里，有一个来自“契丹”的神秘学者，医术高明，学识渊博，还懂治国之道。","但朱允炆心里，一直有一个念头。他要写一本书。一本把华夏文明和西方文明结合起来的书。一本记录他流亡以来所见所闻的书。一本把大明皇家的本草、星象、礼制、治国术，和古希腊的哲学、数学、天文学，和阿拉伯的医学、化学，和印度的数学、天文学，融合在一起的书。","他要把这本书，用一种只有他自己能读懂的密码写下来。原因很简单：他是建文皇帝，是朱棣通缉的要犯。如果他用中文写书，一旦被发现，不仅他自己会死，他身边的人也会受到牵连。而且，这本书里包含了太多的“秘密”——大明皇家的秘术，哈布斯堡家族的权谋，东西方文明的融合。这些东西，不能让外人知道。","所以，他要创造一套全新的文字。永乐八年，朱允炆开始了这项伟大的工程。他首先创造了一套字母。这套字母，既不是汉字，也不是拉丁字母，也不是阿拉伯字母，而是他自己发明的。他参考了汉字的偏旁部首，参考了拉丁字母的发音，参考了阿拉伯字母的书写方式，创造了一套全新的、有规律的字母系统。这套字母一共有三十六个，每个字母都有固定的发音和写法，可以组合成任何词语。","然后，他创造了一套加密规则。他用“替换法”和“移位法”相结合的方式，把明文转换成密文。替换法，就是把每个字母替换成另一个字母；移位法，就是把字母的顺序打乱。两种方法结合起来，即使有人拿到了这本书，也不可能读懂。","最后，他开始写书。他用的是中欧产的犊皮羊皮纸——这种纸质地坚韧，可以保存上千年。他用的是铁胆墨水——这种墨水颜色深，不易褪色，可以长期保存。他还用了矿物颜料——红、蓝、绿、黄，用来绘制插图。","书的内容，分为六个部分：第一部分，草药。他画了几百种草药的插图，每种草药都有详细的说明——产地、形态、性味、功效、用法。这些草药，有大明的，有南洋的，有印度的，有波斯的，有欧洲的。他把《本草集要》和他在流亡途中收集的草药知识，全部整合在了一起。","第二部分，天文。他画了星图，记录了各种星座和行星的运行规律。他把《天文祥异赋》和波斯、阿拉伯的天文学知识，结合在了一起。他还记录了他在流亡途中观察到的各种天象——日食、月食、彗星、流星雨。","第三部分，生物。他画了各种动物和植物的插图，有大象、长颈鹿、犀牛、鳄鱼，还有各种热带植物。这些都是他在流亡途中见到的，很多是欧洲人从来没有见过的。","第四部分，宇宙。他画了宇宙的结构图，解释了他对宇宙的理解——天圆地方？不，他已经从希腊人那里知道了地球是圆的。他结合了中国的“浑天说”和希腊的“地心说”，提出了自己的宇宙模型。","第五部分，制药。他记录了各种药物的制作方法——丸剂、散剂、膏剂、丹剂。他把中医的制药方法和阿拉伯的炼金术结合在了一起。第六部分，配方。这是最神秘的一部分。他记录了各种“秘方”——有治病的，有养生的，有炼金的，还有一些……他自己也不知道有没有用的“秘术”。","写书的过程，是漫长而孤独的。每天晚上，当维也纳的市民们都入睡之后，朱允炆就会点起蜡烛，在书房里，一笔一划地写着那些无人能懂的符号。程济有时候会陪在他身边，帮他研磨，帮他整理资料。杨应能和叶希贤已经去世了——他们在流亡途中染上了疾病，死在了印度。现在，陪在他身边的，只有程济一个人。","“陛下，”有一天晚上，程济看着他写的那些符号，忍不住问，“您写这些，到底是为了什么？”","朱允炆放下笔，看着窗外的月亮，沉默了很久。","“为了留下火种。”他说，“程济你想想如果有一天我死了你也死了，我们带出来的这些书也丢了那华夏的文脉，是不是就断了？”","“可是……”程济说，“大明还在朱棣的子孙还在华夏的文脉，怎么会断呢？”","“朱棣的子孙？”朱允炆苦笑了一下，“朱棣能造反，他的子孙就不会造反吗？大明能推翻元朝，别人就不能推翻大明吗？历史上没有不灭的王朝。秦朝灭了汉朝灭了唐朝灭了宋朝灭了，元朝灭了大明……也迟早会灭。”","他顿了顿，声音低了下来：“王朝会灭，但文脉不能断。只要文脉还在华夏就不会亡。我写这本书，就是要把华夏的文脉，藏在一个谁也找不到的地方，等后世有缘人，把它找出来，传承下去。”","程济看着他，忽然泪如雨下。","“陛下……”","“别哭。”朱允炆拍了拍他的肩膀，“我们做的是大事。五百年后，会有人记得我们的。”"]},{"t":"第九章 · 龙与鹰的初遇","ps":["朱允炆在腓特烈三世的宫廷里，待了整整三十年。三十年里，他见证了哈布斯堡家族的崛起。腓特烈三世，这个当年只有二十多岁的年轻公爵，在朱允炆的辅佐下，一步步走上了权力的巅峰。他用联姻的方式，获得了匈牙利和波希米亚的王位继承权；他用外交的手段，在神圣罗马帝国的诸侯中纵横捭阖；他用耐心和毅力，等待着最佳的时机。","1440年，腓特烈三世被选为德意志国王。1452年，腓特烈三世在罗马被教皇加冕为神圣罗马帝国皇帝。哈布斯堡家族，从此成为了神圣罗马帝国的皇族。而这一切的背后，都有朱允炆的影子。","每一次联姻的策划，每一次外交的谈判，每一次权力的博弈，腓特烈三世都会找朱允炆商量。朱允炆用他的东方智慧，用他的帝王心术，用他对人性的深刻理解，一次又一次地帮助腓特烈三世化险为夷，取得胜利。","“应文先生，”有一次腓特烈三世喝醉了拉着朱允炆的手说，“你知道吗？如果没有你，就没有今天的我。你是我的老师，是我的朋友，是我最信任的人。”","“陛下过奖了。”朱允炆淡淡地说，“我只是一个顾问，做我该做的事。”","“不你不只是顾问。”腓特烈三世说，“你是一个智者。我见过很多学者，很多贵族，很多国王，但从来没有一个人，像你这样，看透了权力的本质，看透了人性的弱点。你到底是什么人？”","朱允炆沉默了。三十年了，他从来没有告诉过任何人他的真实身份。狄奥多西不知道，腓特烈三世不知道，甚至连程济，也只知道他是“建文朝的翰林”，不知道他就是建文帝本人。","但现在，腓特烈三世问了。","“陛下，”朱允炆想了想说，“我确实不是一个普通的学者。在我的国家我曾经……是一个皇帝。”","“皇帝？”腓特烈三世吃了一惊，“你是你们国家的皇帝？那你为什么会流亡到这里？”","“因为我的叔叔造反，推翻了我。”朱允炆平静地说，“我的国家叫大明。我是大明的第二代皇帝，年号建文。我的叔叔叫朱棣是燕王。他以‘清君侧’为名，发动了叛乱，攻破了我的首都。我在大火中假死出逃，流亡到了海外。”","腓特烈三世愣住了。他盯着朱允炆看了很久，忽然哈哈大笑起来。","“我就知道！我就知道你不是普通人！”他拍着朱允炆的肩膀说，“一个普通的学者，怎么可能有你这样的气质，这样的见识，这样的权谋！原来你是一个皇帝！一个流亡的皇帝！”","他顿了顿，忽然严肃起来：“应文先生……不，建文皇帝。你放心我不会出卖你的。你在我的宫廷里，是安全的。而且，”他的眼睛里闪着光，“我们都是皇帝，都是被命运捉弄的人。我们应该互相帮助。”","“多谢陛下。”朱允炆行了一个礼。","“不用谢。”腓特烈三世说，“对了建文皇帝，你有儿子吗？”","“有。”朱允炆说，“我有一个儿子，叫朱文奎。他今年……应该有四十多岁了。”","“他在哪里？”","“在三佛齐。”朱允炆说，“我出逃的时候，他只有七岁。我把他托付给了三佛齐的一个华人首领。后来，我在君士坦丁堡的时候，他派人来找过我，说他已经长大了，在三佛齐做了商人，娶了当地的一个女子。”","“好。”腓特烈三世说，“建文皇帝，我有一个提议。我们联姻吧。”","“联姻？”朱允炆吃了一惊。","“对。”腓特烈三世说，“我的孙女，今年十六岁，是一个聪明美丽的姑娘。我把她嫁给你的儿子朱文奎。这样我们哈布斯堡家族，就和你们大明的皇族，结成了亲家。我们的血脉，就融合在了一起。”","朱允炆沉默了。他想起了朱元璋。朱元璋为了巩固皇权，把自己的女儿嫁给功臣的儿子，把自己的儿子娶功臣的女儿。联姻，从来都是政治的工具。而现在腓特烈三世要把他的孙女，嫁给自己的儿子。这意味着哈布斯堡家族和建文秘脉，从此绑定在了一起。","“好。”朱允炆说，“我同意。”","1442年，朱文奎从三佛齐来到维也纳，与腓特烈三世的孙女结婚。婚礼很盛大，维也纳的贵族们都来了。他们好奇地看着这个来自“契丹”的年轻人——他有着黑色的头发，黄色的皮肤，说着一口流利的马来语和阿拉伯语，还会一点拉丁语。他的妻子，是一个金发碧眼的奥地利姑娘，美丽而温柔。","朱允炆站在婚礼的现场，看着他的儿子和儿媳，心里百感交集。五十年前，他是大明的皇帝，住在南京的皇宫里，身边是文武百官，是后宫佳丽。五十年后，他是一个流亡的老人，住在维也纳的公爵宫殿里，身边是欧洲的贵族，是异国的风情。","他的儿子，娶了一个奥地利姑娘。他的孙子，将会是一个混血儿——一半是华夏的血脉，一半是欧洲的血脉。这就是命运吧。","“陛下，”程济站在他身边低声说，“您看小皇子和公主，多般配啊。”","“是啊。”朱允炆笑了笑，“般配。”","他顿了顿，声音低了下来：“程济，从今天起，我们朱家的血脉，就留在欧洲了。五百年后，会有人记得我们曾经是大明的皇族吗？”","“会的。”程济说，“一定会的。”"]},{"t":"第十章 · 伏尼契成书","ps":["1438年，朱允炆六十一岁。他已经很老了。三十年的流亡生涯，三十年的伏案写作，耗尽了他的精力。他的头发已经全白了眼睛也花了写字的时候，手会发抖。","但他的书，终于要写完了。最后一页，是一个空白页。朱允炆坐在书桌前拿着笔犹豫了很久。他要在最后一页，写下他的名字。用密码写。他深吸一口气，开始写。那些他创造的符号，一个一个地落在羊皮纸上，像一串串神秘的咒语。","“吾乃大明建文皇帝朱允炆。”","“国破家亡，流落西土。”","“历时三十载，著成此书。”","“存华夏文脉，传后世有缘。”","“若有后人能解此书，当知吾心。”","“建文四年出逃，正统三年成书。”","“应文绝笔。”","写完最后一个字，朱允炆放下笔，长长地舒了一口气。他看着面前的这本书——两百四十页羊皮纸，几百幅彩色插图，几万个神秘符号。这是他三十年的心血，是他一生的总结，是他留给后世的火种。","“程济。”他叫了一声。","“陛下。”程济走了进来。他也老了头发白了背也驼了。","“书，写完了。”朱允炆指了指桌上的手稿。","程济走过去，小心翼翼地拿起手稿翻看着。那些神秘的符号，那些精美的插图，在烛光下闪烁着奇异的光芒。","“陛下……”程济的声音颤抖了，“这就是……您写了三十年的书？”","“是。”朱允炆说，“这本书我给它起了个名字，叫《应文秘典》。但后世的人，不会知道这个名字。他们会把它当成一本神秘的天书，猜测它的内容，猜测它的作者。但他们永远不会知道这本书是一个流亡的中国皇帝，用了三十年的时间，一笔一划写出来的。”","“陛下，”程济说，“这本书我们要藏在哪里？”","“藏在一个安全的地方。”朱允炆说，“我已经跟腓特烈三世说好了，这本书，会藏在哈布斯堡家族的秘密图书馆里。只有哈布斯堡家族的族长，才知道它的存在。五百年后，会有人把它找出来的。”","“五百年……”程济喃喃地说，“五百年后，是什么样子？”","“我不知道。”朱允炆笑了笑，“但我知道，五百年后，大明可能已经不在了。但华夏的文脉不会断。因为这本书，会把我们的文脉传下去。”","他顿了顿，忽然咳嗽起来。程济赶紧走过去，帮他捶背。","“陛下，您没事吧？”","“没事。”朱允炆摆了摆手，“人老了就是这样。程济你跟了我多少年了？”","“从建文四年到现在，三十六年了。”","“三十六年……”朱允炆叹了口气，“时间过得真快啊。我还记得在南京的时候，你还是一个年轻的翰林，跟在我身边，帮我起草诏书。现在我们都老了。”","“陛下……”程济的眼睛红了。","“别哭。”朱允炆拍了拍他的手，“我们做了大事。我们把华夏的文脉，带到了西方，藏在了一个安全的地方。五百年后，会有人记得我们的。”","他站起来走到窗前。窗外维也纳的夜色很美，月光洒在屋顶上，像一层银霜。远处教堂的钟声传来，悠扬而深远。","“程济，”他忽然说，“你说五百年后，会不会有一个人，能读懂这本书？”","“会的。”程济说，“一定会的。”","“嗯。”朱允炆点了点头，“我也相信。”","1438年冬天，朱允炆在维也纳去世，享年六十一岁。他去世的时候，手里握着那本书——《应文秘典》，也就是五百年后，被人们称为“伏尼契手稿”的那本神秘天书。","腓特烈三世为他举行了隆重的葬礼。维也纳的贵族们都来了，他们为这个来自“契丹”的神秘学者送行。他们不知道，这个老人，曾经是一个皇帝，是大明的建文皇帝。他们只知道，他是一个智者，一个医者，一个帮助哈布斯堡家族崛起的功臣。","朱允炆被葬在了维也纳郊外的一座小教堂里。墓碑上没有名字，只有一行用希腊文写的字：“一个来自东方的智者。”而那本《应文秘典》，被藏进了哈布斯堡家族的秘密图书馆里。从此，它在黑暗中沉睡了五百年。","五百年后，一个叫伏尼契的波兰书商，在意大利的一座修道院中，发现了这本神秘的手稿。他把它带到了美国，卖给了耶鲁大学。从此全世界的学者都开始研究它，猜测它的内容，猜测它的作者。但没有人知道这本书是一个流亡的中国皇帝，用了三十年的时间，一笔一划写出来的。","没有人知道，在那些神秘的符号背后，藏着一个王朝的覆灭，一个皇帝的流亡，一个文明的火种。五百年的时光，足以改变一切。但有些东西，永远不会变。比如，文明的火种。","比如，一个人对故土的思念。比如一个皇帝在异国他乡，用三十年的时间，写下的那本无人能懂的书。（第一卷·完）"]},{"t":"第十一章 · 君士坦丁堡的陷落","ps":["1453年4月，君士坦丁堡。朱瞻垣站在狄奥多西城墙的瞭望塔上，望着城外黑压压的奥斯曼大军，手心全是汗。他今年二十三岁，是朱文奎的长子，建文帝的长孙。他的母亲是腓特烈三世的孙女，一个金发碧眼的奥地利女人。他继承了父亲的黑发和母亲的蓝眼，在维也纳的贵族圈子里，被称为“蓝眼睛的东方人”。","三个月前，他奉父亲之命，带着一批书籍和物资，从维也纳出发，前往君士坦丁堡。他的任务是：协助狄奥多西家族，把君士坦丁堡图书馆里最珍贵的古希腊手稿，转移到维也纳。","“拜占庭要亡了。”父亲朱文奎在他出发前说，“奥斯曼人的大炮，已经不是城墙能挡住的了。那些书，是人类文明的火种，不能跟着城市一起毁灭。”","朱瞻垣当时还不太理解。他从小在维也纳长大，读的是拉丁文和希腊文的典籍，学的是欧洲的骑士礼仪。他对父亲口中的“华夏文脉”，只有模糊的概念——他只知道，祖父是一个来自遥远东方的皇帝，用一种谁也看不懂的文字，写了一本神秘的书。","那本书，被父亲锁在庄园地下室的铁柜里。父亲每年都会在特定的日子，独自下去，在那本书前坐一整夜。朱瞻垣问过那是什么，父亲只说：“那是你祖父的遗作，也是我们家族的根。等你准备好了，我会告诉你一切。”","现在，站在君士坦丁堡的城墙上，看着城外奥斯曼人的大炮，朱瞻垣忽然明白了父亲的话。文明是脆弱的。一座千年的城市，一个千年的帝国，可能在一夜之间灰飞烟灭。而那些书，那些承载着人类智慧的纸页，才是文明真正的火种。只要火种还在，文明就不会死。","“朱公子！”一个声音从身后传来。","朱瞻垣回头，看见狄奥多西的孙子，小狄奥多西，气喘吁吁地跑上来。小狄奥多西和他同岁，是个典型的希腊人黑头发黑眼睛高鼻梁。","“怎么样了？”朱瞻垣问。","“第一批书已经装船了！”小狄奥多西说，“一共两百三十箱，都是最珍贵的手稿——柏拉图、亚里士多德、欧几里得、托勒密，还有查士丁尼法典的抄本。船在金角湾等着，今晚就出发，走黑海，绕道基辅，然后去维也纳。”","“好。”朱瞻垣松了一口气，“第二批呢？”","“第二批还在整理，大概还要三天。”小狄奥多西说，“但是……朱公子，我们可能没有三天了。奥斯曼人的大炮，已经在城墙轰开了好几个缺口。皇帝陛下说，最多还能守十天。”","朱瞻垣沉默了。他看着城外的奥斯曼军营，军营里灯火通明，像一片星海。他知道，那片星海的中心，是一个二十一岁的年轻人——穆罕默德二世，奥斯曼帝国的苏丹。这个年轻人发誓要拿下君士坦丁堡，把圣索菲亚大教堂变成清真寺。","“十天……”朱瞻垣喃喃地说，“够了。”","接下来的十天，是朱瞻垣一生中最漫长的十天。他和小狄奥多西一起，日夜不停地整理手稿。他们在君士坦丁堡图书馆的地下室里，借着烛光，一本一本地挑选，一箱一箱地打包。空气中弥漫着旧书的霉味和羊皮纸的气味，还有远处传来的炮声。","炮声越来越近，越来越密。城墙的缺口越来越大，城里的守军越来越少。第五天，皇帝君士坦丁十一世亲自来到图书馆，看望他们。皇帝穿着一身铠甲，铠甲上满是灰尘和血迹。他才四十九岁，但看上去像六十多岁的老人。他的眼睛里布满血丝，但眼神依然坚定。","“孩子们，”皇帝说，“你们在做一件伟大的事。这些书比这座城市，比这个帝国更重要。城市可以被摧毁，帝国可以灭亡，但只要这些书还在罗马就没有死。”","“陛下……”小狄奥多西的眼睛红了。","“不要哭。”皇帝笑了笑，“我已经做好了准备。如果城市陷落，我会战死在城墙上。这是我的命运，也是罗马皇帝的命运。但你们不一样，你们还年轻，你们要活下去，把这些书带到安全的地方。”","他从怀里掏出一个小盒子，递给朱瞻垣。","“这是……”朱瞻垣接过盒子。","“这是东罗马帝国的皇冠碎片。”皇帝说，“1204年，十字军洗劫君士坦丁堡的时候，皇冠被打碎了。这是其中一片，一直藏在皇宫的密室里。你把它带到维也纳，交给哈布斯堡的皇帝。告诉他，罗马的火种，传到了他的手里。”","朱瞻垣捧着那个小盒子，感觉沉甸甸的。他知道，他接过的不是一块金子，而是一个千年帝国的遗愿。","“陛下，”他说，“我一定带到。”","第十天，凌晨。炮声忽然停了。朱瞻垣从地下室走出来，看见城墙上的守军，全都静静地站着，望着城外。城外的奥斯曼军营里，传来了祈祷声——那是穆斯林在做晨礼。","然后，炮声响了。这一次，不是零星的炮击，而是所有大炮同时开火。整个大地都在颤抖，城墙在炮声中呻吟。朱瞻垣看见，主城墙的一个巨大的缺口，在炮击中轰然倒塌。","奥斯曼士兵发出震天的呐喊，像潮水一样涌了进来。","“走！”小狄奥多西一把拉住朱瞻垣，“快走！第二批书已经装船了！”","他们跑向金角湾。路上，他们看见守军在和奥斯曼士兵巷战，看见平民在尖叫着逃跑，看见教堂的钟在疯狂地敲响。他们跑到金角湾的时候，船已经准备好了。最后一批手稿，刚刚搬上船。","“快上船！”船长喊道。","朱瞻垣跳上船，回头望了一眼君士坦丁堡。他看见圣索菲亚大教堂的穹顶，在晨光中闪闪发光。他看见城市的上空，升起了黑烟。他看见一个穿着紫色铠甲的身影，站在倒塌的城墙缺口处，挥舞着剑，冲向涌来的奥斯曼士兵。","那是皇帝君士坦丁十一世。船开动了。朱瞻垣站在船尾，看着君士坦丁堡越来越远，最后消失在海平线上。他没有哭。他只是紧紧地握着怀里的那个小盒子，感觉那块皇冠碎片，在他的胸口发烫。","“罗马没有死。”他低声说，“罗马的火种，会传下去的。”","三个月后，这批手稿抵达了维也纳。腓特烈三世亲自迎接了他们。当他看到那两百三十箱古希腊手稿时，这个六十岁的老皇帝，激动得浑身发抖。","“这是……这是人类文明的宝藏啊！”他抚摸着一箱手稿，喃喃地说，“有了这些书，维也纳就会成为新的雅典！”","朱瞻垣把皇冠碎片交给了他。腓特烈三世捧着那块皇冠碎片，沉默了很久。然后，他把碎片戴在了自己的脖子上。","“从今天起，”他说，“哈布斯堡家族，就是罗马的继承者。”","这批手稿，被安置在维也纳大学的图书馆里。很快，全欧洲的学者，都涌向了维也纳。他们在这里，读到了失传已久的古希腊典籍，读到了完整的罗马法，读到了精确的天文学和数学。","而在这些学者中，有一个来自佛罗伦萨的年轻人，叫马尔西利奥·费奇诺。他在维也纳待了三年，翻译了柏拉图的全部著作。回到佛罗伦萨后，他在美第奇家族的支持下，创办了柏拉图学园。","文艺复兴的火焰，就这样被点燃了。但没有人知道，在这两百三十箱手稿的旁边，还有一个铁柜。铁柜里，锁着一本用谁也看不懂的文字写成的书。那是建文帝的遗作，《应文秘典》。"]},{"t":"第十二章 · 美第奇的暗线","ps":["1462年，佛罗伦萨。科西莫·德·美第奇坐在他的书房里，手里拿着一本刚刚从维也纳送来的手抄本，眉头紧锁。他已经七十三岁了，是美第奇家族的族长，佛罗伦萨的实际统治者。他一生积累了巨额的财富，赞助了无数的艺术家和学者，被称为“佛罗伦萨之父”。但最近，他被一件事困扰着。","维也纳送来的这批古希腊手稿，确实是无价之宝。但在这批手稿中，夹着一本奇怪的书——这本书用的不是希腊文，不是拉丁文，也不是阿拉伯文，而是一种谁也没见过的文字。书上画满了奇怪的插图，有草药，有星星，有裸体的女人在水池里洗澡，还有一些看不懂的宇宙结构图。","“这是什么？”科西莫问他的图书管理员。","“不知道，老爷。”图书管理员说，“维也纳大学的学者们研究了三年，没人能看懂。有人说这是一本炼金术的书，有人说这是一本异教徒的邪典，还有人说……这是一本来自东方的神秘著作。”","“东方？”科西莫的眼睛亮了。","他对东方，一直有一种特殊的迷恋。他收藏了大量的中国瓷器和丝绸，他的宫殿里，有一个专门的“中国房间”，墙上挂着中国的墙纸，桌上摆着中国的瓷器。他读过马可·波罗的游记，对那个遥远的东方帝国，充满了向往。","“这本书，是从哪里来的？”科西莫问。","“据说是哈布斯堡家族的秘密图书馆里的藏品。”图书管理员说，“维也纳大学的学者说，这本书是一个来自‘契丹’的神秘学者留下的。那个学者，在一百多年前，曾经是腓特烈三世皇帝的顾问。”","“契丹的学者？”科西莫站了起来，“腓特烈三世的顾问？这怎么可能？一百多年前，欧洲根本没有契丹人！”","“学者们也觉得不可思议。”图书管理员说，“但维也纳大学的档案里，确实有记载。那个学者叫‘应文’，自称是来自东方的僧人。他在维也纳待了三十年，给皇帝做顾问。他去世后，留下了这本书。哈布斯堡家族把它锁在秘密图书馆里，不许外人看。这次君士坦丁堡的手稿运到维也纳，这本书才被一起拿了出来。”","科西莫沉默了。他走到窗前，看着窗外佛罗伦萨的街景。他想起了他的朋友，教皇庇护二世。庇护二世曾经告诉他，在教廷的秘密档案里，有一份13世纪的报告，是一个叫柏朗嘉宾的传教士写的。柏朗嘉宾曾经奉教皇之命，出使蒙古帝国，在哈剌和林见到了蒙古大汗。报告里说，在蒙古帝国的东边，有一个伟大的帝国，叫“契丹”，那里的人聪明、勤劳、富有，有自己的文字和文明。","“契丹……”科西莫喃喃地说，“真的有这样一个国家吗？”","他转过身，对图书管理员说：“把费奇诺叫来。”马尔西利奥·费奇诺，今年二十九岁，是佛罗伦萨最有才华的年轻学者。他刚刚翻译完柏拉图的《理想国》，正在翻译普罗提诺的著作。他是科西莫最器重的学者，也是柏拉图学园的创始人。","费奇诺来了。他拿起那本奇怪的书，翻了翻，眉头越皱越紧。","“老爷，”他说，“这本书……很不寻常。”","“怎么不寻常？”","“您看这些插图。”费奇诺指着书上的草药图，“这些草药，有很多是欧洲没有的。比如这一种叶子是心形的花是黄色的——我在维也纳的时候，见过一个来自波斯的商人，他说这种草药叫‘大黄’，生长在遥远的东方。还有这一种果实是红色的像小灯笼——波斯商人说，这叫‘枸杞’，也是东方的草药。”","“东方的草药……”科西莫说。","“还有这些星图。”费奇诺翻到天文部分，“您看，这些星座的划分，和我们欧洲的星座不一样。我们欧洲的星座，是从古希腊传下来的，四十八个星座。但这本书里，有二十八个星座，排列成一个圆环——这像是……把天空分成二十八个区域，每个区域对应一个月份。”","“二十八个星座？”科西莫吃了一惊。","“我在维也纳的时候，读过一本阿拉伯文的书，叫《印度星象学》。”费奇诺说，“那本书里提到在遥远的东方，有一个国家，用二十八个星座来划分天空，叫‘二十八宿’。这本书里的星图，和那本书里描述的几乎一模一样！”","科西莫的呼吸急促了起来。","“你的意思是……这本书，真的来自东方？”","“很有可能。”费奇诺说，“老爷，您再看这些文字。这些文字，虽然我们看不懂，但它们的结构很有规律——每个字都是由几个偏旁组成的，像是一种象形文字。这和我们欧洲的拼音文字完全不同，反而像是……汉字。”","“汉字……”科西莫喃喃地说。","“老爷，”费奇诺抬起头，眼睛里闪着光，“如果这本书真的来自东方，那它的价值，可能比所有古希腊手稿加起来还要大！因为这意味着在遥远的东方，有一个和我们欧洲一样发达的文明。他们有自己的医学，自己的天文学，自己的哲学。如果我们能读懂这本书，我们就能了解那个文明！”","科西莫沉默了很久。然后他说：“费奇诺这件事不要告诉任何人。”","“为什么？”","“因为这本书，可能会颠覆整个欧洲的认知。”科西莫说，“我们一直以为欧洲是世界的中心，基督教是唯一的真理。如果人们知道，在遥远的东方，有一个同样发达的文明，有自己的文字和哲学，那教会的权威，就会动摇。”","他顿了顿，继续说：“而且，哈布斯堡家族把这本书锁在秘密图书馆里，不许外人看，说明他们也知道这本书的价值。如果我们公开研究这本书，哈布斯堡家族会不高兴的。”","“那……我们怎么办？”费奇诺问。","“秘密研究。”科西莫说，“你找几个最信任的学者，组成一个秘密小组，专门研究这本书。不要在公开场合讨论，不要留下书面记录。我会给你们提供资金和场地。你们的任务，就是搞清楚这本书到底写了什么。”","“是，老爷。”费奇诺说。","“还有，”科西莫说，“如果你们能搞清楚这本书的内容，不要全部公开。只公开那些对我们有用的部分——比如医学、天文学、数学。至于那些关于政治、历史、哲学的部分，先封存起来，等时机成熟了再说。”","费奇诺愣了一下：“为什么？”","“因为知识就是力量。”科西莫笑了笑，“有些知识，公开了，就是全人类的财富。但有些知识，只有掌握在少数人手里，才能发挥最大的作用。美第奇家族，要做掌握这些知识的人。”","就这样一个秘密的研究小组，在佛罗伦萨成立了。这个小组，被称为“柏拉图学园的密室”。表面上，它是研究古希腊哲学的学术团体。实际上，它的核心任务，是研究那本来自东方的神秘著作。","小组成员，都是费奇诺最信任的学者。他们中有语言学家，有天文学家，有医生，有数学家。他们用了整整二十年的时间，才勉强读懂了这本书的一部分。他们发现，这本书的医学部分，记载了几百种草药的功效和用法，很多是欧洲医学从未见过的。他们把这些草药知识，翻译成拉丁文，融入了欧洲的医学体系。","他们发现，这本书的天文学部分，记载了精确的星表和历法，比欧洲当时使用的儒略历，还要精确。他们把这些天文知识，翻译成拉丁文，提供给了欧洲的天文学家。","他们发现，这本书的数学部分，记载了一种先进的计算方法叫“珠算”，还有一种解方程组的方法，叫“天元术”。他们把这些数学知识，翻译成拉丁文，融入了欧洲的数学体系。","但这本书的核心部分——关于政治、历史、哲学的部分，他们始终没有完全读懂。那些文字，像是被加密了一样，无论他们怎么努力，都只能看懂只言片语。他们不知道，这本书的作者，在写这本书的时候，用了一种自创的加密文字。除非知道加密的规则，否则永远不可能完全读懂。","而知道加密规则的人，只有建文帝的后裔。1492年，科西莫·德·美第奇去世。他去世前，把费奇诺叫到床前。","“那本书，研究得怎么样了？”科西莫问。","“医学、天文学、数学的部分，我们已经搞清楚了。”费奇诺说，“但核心部分，还是看不懂。”","“没关系。”科西莫笑了笑，“有些知识，不是一代人能搞懂的。把这本书传下去，让后世的人继续研究。总有一天，会有人能读懂它的。”","他顿了顿，继续说：“费奇诺，你记住，这本书，是美第奇家族最大的秘密。无论发生什么，都不能让它落入外人之手。它是我们家族的力量源泉。”","“我记住了，老爷。”费奇诺说。","科西莫去世后，那本神秘的书，被美第奇家族的继任者，洛伦佐·德·美第奇，锁进了家族的秘密图书馆。洛伦佐是科西莫的孙子，被称为“豪华者洛伦佐”。他比祖父更加热爱艺术和学术，他赞助了达芬奇、米开朗基罗、波提切利等一大批艺术家。他的宫廷，是文艺复兴的中心。","但很少有人知道，在洛伦佐的秘密图书馆里，锁着一本来自东方的神秘著作。这本书里的知识，通过各种隐秘的渠道，一点点地流入了欧洲的学术体系，滋养着文艺复兴的成长。","1517年，马丁·路德在维滕贝格教堂的大门上，贴出了《九十五条论纲》，宗教改革爆发。很少有人知道，马丁·路德的思想，受到了一本神秘著作的影响。那本书里，记载了一种东方的政治哲学——“皇权高于教权”。这种思想，通过隐秘的渠道，传到了德意志，成为了世俗王权对抗教皇的思想武器。","1543年，哥白尼发表了《天体运行论》，提出了日心说。很少有人知道，哥白尼的天文学研究，参考了一本神秘著作里的星表和历法。那本书里的天文数据，比欧洲当时的任何数据都要精确。","1687年，牛顿发表了《自然哲学的数学原理》，建立了经典力学体系。很少有人知道，牛顿的炼金术研究，参考了一本神秘著作里的化学配方。那本书里的制药方法，包含了丰富的化学知识。","这些知识，都来自那本神秘的书——建文帝的《应文秘典》。它在黑暗中沉睡了五百年，却在不知不觉中，改变了整个欧洲。"]},{"t":"第十三章 · 哈布斯堡的联姻帝国","ps":["1477年，勃艮第第戎。马克西米利安骑着马，走进第戎城的时候，心里五味杂陈。他今年十八岁，是腓特烈三世的儿子，哈布斯堡家族的继承人。他高大英俊，金发碧眼，穿着华丽的铠甲，腰佩宝剑，是一个典型的德意志骑士。","但他现在不是来打仗的而是来结婚的。他的新娘，是勃艮第公爵的独女，玛丽。玛丽今年十九岁，是欧洲最富有的女继承人——她的父亲，大胆的查理，在上个月的南锡战役中战死，没有留下儿子。整个勃艮第公国，包括尼德兰、卢森堡、弗朗什-孔泰，全都归玛丽继承。","谁娶了玛丽，谁就能得到整个勃艮第。法国国王路易十一也想娶玛丽——或者说，想让他的王太子娶玛丽。但玛丽拒绝了。她不愿意嫁给法国人，因为法国一直想吞并勃艮第。她选择了马克西米利安——哈布斯堡家族的继承人，神圣罗马帝国皇帝的儿子。","这桩婚姻，是马克西米利安的祖父朱瞻垣一手策划的。朱瞻垣今年四十七岁，是哈布斯堡家族的“隐秘帝师”。他的父亲朱文奎，是建文帝的儿子，娶了腓特烈三世的孙女。朱瞻垣从小在维也纳的宫廷里长大，受过最好的教育。他精通拉丁文、希腊文、德文、法文，还懂一点阿拉伯文和波斯文。他熟读历史，精通权谋，是腓特烈三世最信任的顾问。","“联姻，是最高明的征服。”这是朱瞻垣常说的话，“打仗要死人，要花钱，要消耗国力。但联姻不需要。只要把你的女儿嫁给对方的继承人，等对方没有儿子的时候，你的外孙就可以继承对方的领土。不战而屈人之兵，善之善者也。”","这段话，是建文帝当年对腓特烈三世说的。朱瞻垣把它记在了心里，并且贯彻到了哈布斯堡家族的每一次联姻中。马克西米利安和玛丽的婚姻，就是朱瞻垣的杰作。","“记住，”出发前朱瞻垣对马克西米利安说，“你到了第戎，不要像一个征服者，要像一个丈夫。对玛丽要温柔，对勃艮第的贵族要尊重。你要让他们觉得你不是来吞并勃艮第的，你是来保护勃艮第的。”","“我知道了，老师。”马克西米利安说。","他一直叫朱瞻垣“老师”。从他六岁起，朱瞻垣就开始教他读书、写字、骑马、射箭，教他历史、地理、政治、军事。在马克西米利安的心里，朱瞻垣比他的父亲腓特烈三世，更像是一个父亲。","婚礼在第戎的教堂里举行。玛丽穿着白色的婚纱，戴着金色的王冠，美丽得像一个天使。马克西米利安穿着黑色的礼服，胸前别着金羊毛骑士团的徽章，英俊潇洒。他们在教堂里宣誓，交换戒指，接受了神父的祝福。","婚礼结束后，是盛大的宴会。勃艮第的贵族们，全都来了。他们看着这对年轻的新人，心里各有打算——有些人高兴，因为哈布斯堡家族可以保护勃艮第不受法国的侵略；有些人担忧，因为哈布斯堡家族的势力越来越大，可能会威胁到勃艮第的独立。","马克西米利安按照朱瞻垣的嘱咐，对每一个贵族都彬彬有礼。他用流利的法语和他们交谈，称赞勃艮第的繁荣和美丽，承诺会保护勃艮第的自由和权利。贵族们对这个年轻的女婿，印象都很好。","宴会结束后，马克西米利安回到了新房。玛丽已经坐在床上了，她的婚纱已经换成了一件丝绸的睡袍。她看着马克西米利安，眼神里有一丝紧张，也有一丝期待。","“你……你好。”玛丽用法语说。","“你好，玛丽。”马克西米利安也用法语回答。他在她身边坐下，握住了她的手，“你今天真美。”","玛丽的脸红了。她低下头，小声说：“谢谢你……马克西米利安。”","“叫我马克斯。”马克西米利安笑了笑，“我的朋友都叫我马克斯。”","“好的马克斯。”玛丽抬起头，看着他的眼睛，“你……你会对我好吗？”","“我发誓，”马克西米利安郑重地说，“我会用我的一生，来保护你爱你。”","玛丽的眼睛里，泛起了泪光。她靠在马克西米利安的怀里，轻声说：“我父亲死了，我没有其他亲人了。你是我唯一的依靠。”","“我会的。”马克西米利安紧紧地抱住她，“我会的。”","这一夜，他们成了真正的夫妻。但他们不知道，这桩婚姻，将改变整个欧洲的历史。婚后马克西米利安和玛丽，在第戎住了下来。马克西米利安按照朱瞻垣的教导，小心翼翼地处理着和勃艮第贵族的关系。他尊重勃艮第的法律和传统，不干涉地方政务，只在外交和军事上，行使公爵的权力。他还把哈布斯堡家族的一些学者和艺术家，带到了第戎，促进了勃艮第和德意志之间的文化交流。","玛丽也很爱马克西米利安。她为他生了三个孩子——一个儿子，两个女儿。儿子叫腓力，后来被称为“美男子腓力”。大女儿叫玛格丽特，小女儿叫萨宾。但幸福的时光，总是短暂的。","1482年，玛丽在一次骑马打猎中，从马上摔了下来，受了重伤。几天后她在第戎去世，年仅二十五岁。马克西米利安悲痛欲绝。他在玛丽的葬礼上，哭得像个孩子。他为玛丽修建了一座华丽的陵墓，在第戎的修道院教堂里。陵墓上，刻着玛丽的雕像，还有他们的爱情故事。","玛丽死后，勃艮第的贵族们，开始蠢蠢欲动。他们觉得马克西米利安是一个德意志人，不是勃艮第人，没有资格统治勃艮第。他们想拥立玛丽的儿子，年仅四岁的腓力，为新的勃艮第公爵，然后由贵族组成摄政委员会实际统治勃艮第。","法国国王路易十一，也趁机插手。他支持勃艮第的贵族，想把马克西米利安赶出勃艮第，然后把勃艮第并入法国。马克西米利安陷入了困境。他写信给维也纳，向父亲腓特烈三世和老师朱瞻垣求助。","朱瞻垣收到信后，立刻赶到了第戎。","“不要慌。”朱瞻垣对马克西米利安说，“勃艮第的贵族，只是想保住自己的权力。法国人，只是想趁火打劫。我们只要分化他们，就能稳住局面。”","“怎么分化？”马克西米利安问。","“贵族们不是铁板一块。”朱瞻垣说，“有些人是真心想维护勃艮第的独立，有些人只是想为自己捞好处。我们可以拉拢前者，打击后者。至于法国人——路易十一已经老了，他活不了几年了。他的儿子，查理八世，还是个孩子。法国国内，也有很多矛盾。我们只要拖下去，法国人自己就会乱。”","“那……具体怎么做？”","“首先，”朱瞻垣说，“你要公开宣布，承认腓力为勃艮第公爵，你自己只做摄政。这样贵族们就没有借口反对你了。然后你要召开三级会议，让贵族、教士、市民，都有发言权。让他们觉得你是在和他们共治勃艮第，而不是在独裁。”","“其次，你要和法国的反对派秘密接触。”朱瞻垣继续说，“路易十一的弟弟，贝里公爵，一直和路易十一不和。还有布列塔尼公爵，也害怕法国吞并。你可以和他们结盟，共同对抗路易十一。”","“最后，”朱瞻垣说，“你要为腓力，安排一桩好婚事。”","“婚事？腓力才四岁啊！”马克西米利安吃了一惊。","“正是因为才四岁，才好安排。”朱瞻垣笑了笑，“你想想欧洲有哪个国家的女继承人，是和腓力年龄相仿的？”","马克西米利安想了想，忽然眼睛一亮：“卡斯蒂利亚的……胡安娜？”","“对。”朱瞻垣点点头，“卡斯蒂利亚国王恩里克四世，没有儿子，只有一个女儿胡安娜。胡安娜今年三岁，和腓力年龄相仿。如果腓力娶了胡安娜那将来卡斯蒂利亚的王位，就会落到你的孙子手里。”","“卡斯蒂利亚……”马克西米利安喃喃地说，“那可是伊比利亚半岛上最强大的国家啊！”","“不仅如此。”朱瞻垣说，“卡斯蒂利亚和阿拉贡，已经通过联姻，组成了共主邦联。阿拉贡的国王斐迪南二世，是胡安娜的外祖父。如果你的孙子继承了卡斯蒂利亚，那阿拉贡，也迟早会落到他手里。到时候，整个伊比利亚半岛，都是哈布斯堡家族的。”","马克西米利安的呼吸急促了起来。","“老师，”他说，“你的意思是……我们哈布斯堡家族，要通过联姻，统治整个欧洲？”","“不是统治整个欧洲。”朱瞻垣摇了摇头，“是通过联姻，把欧洲的主要国家，都纳入哈布斯堡家族的体系。这样，就不需要打仗了。欧洲的和平，就有了保障。”","他顿了顿，声音低了下来：“这是你曾外祖父，建文帝的理想。他说，战争是人类最大的罪恶。如果能通过联姻和血缘，让各国的统治者都成为一家人，那战争就会消失。”","“建文帝……”马克西米利安喃喃地说。他从小就听朱瞻垣讲过建文帝的故事——那个来自遥远东方的皇帝，国破家亡，流亡到欧洲，用三十年的时间，写了一本神秘的书。他一直以为，那只是一个传说。但现在，他忽然觉得，那个传说，可能是真的。","“老师，”他说，“建文帝的那本书……到底写了什么？”","朱瞻垣沉默了很久。然后他说：“等你准备好了我会告诉你的。”1496年，腓力和胡安娜，在荷兰的利尔举行了婚礼。腓力今年十八岁，英俊潇洒，被称为“美男子腓力”。胡安娜今年十七岁，是卡斯蒂利亚的公主，美丽而热情。他们的婚姻，是欧洲历史上最重要的联姻之一。","婚后腓力和胡安娜，去了卡斯蒂利亚，拜见了胡安娜的母亲，卡斯蒂利亚女王伊莎贝拉一世。伊莎贝拉一世，是欧洲历史上最伟大的女王之一。她和丈夫斐迪南二世一起，完成了收复失地运动，统一了西班牙。她还赞助了哥伦布的航海，开启了大航海时代。","伊莎贝拉一世，对这个女婿，非常满意。她觉得腓力英俊、高贵、有教养，配得上她的女儿。但她不知道，这桩婚姻，将把整个西班牙，都纳入哈布斯堡家族的版图。","1504年，伊莎贝拉一世去世。胡安娜继承了卡斯蒂利亚王位。但胡安娜的精神状态不太稳定——她后来被称为“疯女胡安娜”。腓力以摄政的名义，实际统治了卡斯蒂利亚。","1506年，腓力去世，年仅二十八岁。他和胡安娜的儿子查理继承了卡斯蒂利亚王位。1516年，斐迪南二世去世。查理又继承了阿拉贡王位。就这样查理这个年仅十六岁的少年，成为了卡斯蒂利亚和阿拉贡的共主，也就是西班牙国王。他的领地包括西班牙、尼德兰、奥地利、勃艮第，还有整个美洲殖民地。","他是欧洲历史上，第一个“日不落帝国”的皇帝。而这一切，都始于一桩又一桩的联姻。1519年，查理被选为神圣罗马帝国皇帝，即查理五世。他的祖父，马克西米利安一世，在一年前去世了。去世前马克西米利安对查理说：“孩子，你拥有的一切，都是联姻带来的。记住不要轻易打仗。能用联姻解决的问题，就不要用战争。”","查理记住了祖父的话。他一生，都在通过联姻，巩固哈布斯堡家族的霸权。他娶了葡萄牙的伊莎贝拉，获得了葡萄牙的继承权。他把自己的妹妹，嫁给了匈牙利和波希米亚的国王。他把自己的女儿，嫁给了葡萄牙国王和法国国王。","哈布斯堡家族，成为了欧洲最强大的家族。但很少有人知道，在这一切的背后，有一个来自东方的家族，在暗中操控着一切。那就是建文帝的后裔。他们隐姓埋名，不争夺王位，不掌握实权。他们只是作为“隐秘帝师”，一代又一代地，为哈布斯堡家族出谋划策。他们用东方的智慧，滋养着欧洲的霸权。","而他们的家族信物，就是那本神秘的书——《应文秘典》。每一代“隐秘帝师”，在去世前，都会把那本书，传给下一代。并且把书中的秘密，口耳相传。这个秘密，已经传了五代人。","还会继续传下去。"]},{"t":"第十四章 · 龙族的变异","ps":["1555年，维也纳霍夫堡宫。鲁道夫二世，站在镜子前，看着镜中的自己，眉头紧锁。他今年十七岁，是查理五世的孙子，斐迪南一世的儿子。他有着哈布斯堡家族标志性的大下巴——下唇肥厚，下巴突出，这是几代近亲通婚留下的遗传特征。但和其他哈布斯堡家族的成员不同，他的眼睛，是紫色的。","不是蓝色不是灰色，而是一种奇异的、淡淡的紫色。像紫水晶像紫罗兰，像黄昏时分的天空。","“又是一个紫眼睛的。”他的母亲，安娜皇后，在他身后叹了口气，“这已经是第三代了。”","鲁道夫二世转过身，看着母亲。","“母亲，”他说，“为什么我的眼睛是紫色的？其他家族的人，眼睛都是蓝色或者灰色的。”","安娜皇后沉默了很久。然后，她说：“这是……家族的秘密。”","“什么秘密？”","“你曾祖母，”安娜皇后说，“也就是你祖父查理五世的祖母，不是纯粹的德意志人。她的身上，流着东方人的血。”","“东方人？”鲁道夫二世吃了一惊。","“对。”安娜皇后说，“一百多年前，有一个来自东方的神秘学者，来到了维也纳，做了你高祖父腓特烈三世的顾问。那个学者，有一个儿子，娶了你高祖父的孙女。从那以后，我们哈布斯堡家族的血脉里，就混入了东方人的血。”","“那个学者……叫什么名字？”","“他叫‘应文’。”安娜皇后说，“但那不是他的真名。据说，他的真名，是一个东方帝国的皇帝。他因为国破家亡，流亡到了欧洲。”","“皇帝？”鲁道夫二世的眼睛瞪得更大了，“一个东方的皇帝，流亡到了欧洲？这怎么可能？”","“这是真的。”安娜皇后说，“这个秘密，在哈布斯堡家族里，只有皇帝和皇后才知道。你现在已经长大了是帝国的继承人，我应该告诉你了。”","她顿了顿，继续说：“那个东方皇帝，在维也纳待了三十年，写了一本神秘的书。那本书，用一种谁也看不懂的文字写成，记载了东方的医学、天文学、数学、哲学。那本书，被锁在家族的秘密图书馆里，只有皇帝才能看。”","“那本书……和我的紫眼睛，有什么关系？”","“据说，”安娜皇后说，“那个东方皇帝的家族，有一种特殊的体质。他们的眼睛，在特定的情况下，会变成紫色。而且他们的寿命比普通人长，体质比普通人好，不容易生病。这种体质通过血脉，一代代地传了下来。”","“所以我的紫眼睛，是因为我流着那个东方皇帝的血？”","“对。”安娜皇后点点头，“你的祖父查理五世，眼睛也是紫色的。你的父亲斐迪南一世，眼睛也是紫色的。现在，轮到你了。”","鲁道夫二世沉默了。他走到窗前，看着窗外维也纳的街景。阳光照在他的脸上，他的紫色眼睛，在阳光下闪烁着奇异的光芒。","“那个东方皇帝的后裔，现在还在吗？”他问。","“在。”安娜皇后说，“他们隐姓埋名，住在维也纳的郊外。每一代都会有一个人，进入宫廷，做皇帝的‘隐秘顾问’。他们不掌握实权，不参与政治，只是在皇帝需要的时候，提供建议。”","“他们……为什么不公开身份？”","“因为他们的祖先，是一个流亡的皇帝。”安娜皇后说，“如果他们公开身份，可能会引来麻烦。而且，他们的祖先留下了遗训——‘不争夺王位，不掌握实权，只做文明的守护者’。他们一直遵守着这个遗训。”","“文明的守护者……”鲁道夫二世喃喃地说。","“对。”安娜皇后说，“他们认为文明比权力更重要。他们的祖先，把东方的文明带到了欧洲，他们的使命，就是守护这些文明的火种，让它们在欧洲生根发芽。”","鲁道夫二世转过身，看着母亲。","“母亲，”他说，“我能见见他们吗？”","安娜皇后犹豫了一下。","“可以。”她说，“但你要记住这件事不能告诉任何人。这是哈布斯堡家族最大的秘密。”","“我记住了。”","三天后鲁道夫二世，在母亲的带领下，来到了维也纳郊外的一座庄园。这座庄园，外表看起来很普通——灰色的石墙，红色的屋顶，周围是葡萄园和橄榄树。但走进去，才发现里面别有洞天——庄园的图书馆里，收藏着成千上万册书籍，有拉丁文的有希腊文的有阿拉伯文的，还有一些谁也看不懂的文字。","一个老人，站在图书馆的门口，迎接他们。老人今年七十多岁，头发已经全白了但精神矍铄。他的眼睛，也是紫色的——和鲁道夫二世的眼睛，一模一样。","“陛下，皇后殿下。”老人微微鞠躬，“欢迎来到寒舍。我是朱载堉，是这个家族的第七代传人。”","“朱载堉……”鲁道夫二世重复着这个名字，“这是东方的名字？”","“对。”朱载堉笑了笑，“我的祖先，来自遥远的东方。我们家族，一直保留着东方的名字。”","他把他们引进了图书馆。图书馆里，弥漫着旧书的霉味和羊皮纸的气味。书架从地板一直延伸到天花板，上面摆满了书籍。墙上挂着一些画像——有穿着东方服饰的男人，有穿着欧洲贵族服饰的女人，还有一些混血的孩子。","“这些都是我们家族的祖先。”朱载堉指着那些画像说，“最左边的那个，就是第一代祖先建文帝。他旁边的那个女人，是他的妻子，拜占庭的公主。”","鲁道夫二世走到那幅画像前，仔细地看着。画中的男人，穿着东方的龙袍，戴着皇冠面容清瘦眼神深邃。他的旁边，站着一个女人，穿着拜占庭的礼服，戴着珠宝金发碧眼美丽动人。他们的中间，站着一个小男孩——黑发蓝眼是一个混血儿。","“这就是……我的祖先？”鲁道夫二世喃喃地说。","“对。”朱载堉说，“你的身上，流着他的血。哈布斯堡家族的每一代皇帝，身上都流着他的血。只是，你们自己不知道而已。”","鲁道夫二世沉默了很久。然后，他说：“那本神秘的书……我能看看吗？”朱载堉看了看安娜皇后。安娜皇后点了点头。","“跟我来。”朱载堉说。","他带着鲁道夫二世，走进了图书馆深处的一个密室。密室的墙上，挂着一幅巨大的星图。星图的中间，是一个铁柜。朱载堉打开铁柜，从里面拿出了一本书。那是一本用羊皮纸装订的书，封面是黑色的，没有任何文字。书的厚度，大约有一个拳头那么厚。书页已经泛黄了，但保存得很好。","“这就是……”鲁道夫二世的呼吸急促了起来。","“对。”朱载堉说，“这就是建文帝的遗作，《应文秘典》。后世的人，叫它‘伏尼契手稿’。”","他把书递给鲁道夫二世。鲁道夫二世小心翼翼地接过书，翻开了第一页。书页上画满了奇怪的符号——那些符号，既不是拉丁文，也不是希腊文，也不是阿拉伯文。它们像是一种象形文字，每个字都由几个偏旁组成，排列得整整齐齐。书页的旁边，画着彩色的插图——有草药有星星有裸体的女人在水池里洗澡。","“这……这写的是什么？”鲁道夫二世问。","“这是建文帝自创的加密文字。”朱载堉说，“除非知道加密的规则，否则永远不可能读懂。”","“那……你能读懂吗？”","“能。”朱载堉说，“加密的规则，在我们家族里，口耳相传，已经传了七代。”","“那……这本书里，到底写了什么？”","朱载堉沉默了一会儿。然后他说：“这本书，分为六个部分。第一部分是草药记载了几百种草药的功效和用法。第二部分是天文记载了精确的星表和历法。第三部分是生物记载了各种动物和植物的形态和习性。第四部分是宇宙记载了建文帝对宇宙的理解。第五部分是制药记载了各种药物的制作方法。第六部分是配方记载了各种秘方——有治病的，有养生的有炼金的。”","“就这些？”鲁道夫二世有些失望，“我还以为，里面有什么惊天动地的秘密。”","朱载堉笑了笑。","“这些还不够惊天动地吗？”他说，“你想想一百多年前，欧洲的医学，还停留在放血疗法的阶段。而这本书里，已经记载了几百种草药的精确用法。欧洲的天文学，还在用儒略历，误差很大。而这本书里，已经有了精确的星表和历法。欧洲的数学，还在使用罗马数字，计算困难。而这本书里，已经有了珠算和天元术。”","他顿了顿，继续说：“这些知识，通过各种隐秘的渠道，一点点地流入了欧洲的学术体系。文艺复兴的爆发，宗教改革的兴起，科学革命的发生，背后都有这本书的影子。”","鲁道夫二世愣住了。","“你的意思是……这本书，改变了整个欧洲？”","“可以这么说。”朱载堉说，“当然不是直接改变。而是通过一代代的学者，把书里的知识，翻译成欧洲的文字，融入欧洲的学术体系。这个过程，持续了一百多年。到现在书里的大部分知识，已经成为了欧洲学术的一部分。只是没有人知道它们的真正来源。”","鲁道夫二世沉默了很久。他看着手里的这本书，感觉它沉甸甸的。他知道他手里捧着的不是一本书，而是一个文明的火种。","“那……”他说，“这本书的核心部分，关于政治、历史、哲学的部分，写了什么？”","朱载堉的表情，变得严肃了起来。","“那部分，”他说，“是建文帝对人类文明的思考。他认为战争是人类最大的罪恶。他认为最好的统治方式，不是武力征服，而是文化融合。他认为人类的未来，是天下大同——所有的民族，所有的国家，都成为一家人，没有战争没有仇恨，只有和平与合作。”","“天下大同……”鲁道夫二世喃喃地说。","“对。”朱载堉说，“这是建文帝的理想也是我们家族的使命。我们隐姓埋名，不争夺权力，就是为了守护这个理想。我们相信总有一天，人类会实现天下大同。”","鲁道夫二世看着朱载堉，看着他紫色的眼睛，忽然觉得自己的紫眼睛，不再是一个奇怪的变异，而是一种使命的象征。","“我明白了。”他说。","他把书还给了朱载堉。","“这本书，”他说，“还是由你们家族来守护吧。我相信你们会比我做得更好。”","朱载堉接过书，微微鞠躬。","“多谢陛下。”他说。","从那以后，鲁道夫二世，变了一个人。他不再像以前那样，沉迷于宫廷的享乐。他开始热心于学术和艺术。他赞助了无数的学者和艺术家，把布拉格变成了欧洲的文化中心。他收藏了大量的书籍和艺术品，建立了欧洲最大的图书馆和艺术馆。","他对炼金术和占星术，有着特殊的迷恋。他花了大量的时间，研究炼金术和占星术。很多人觉得，他是一个怪人，一个不务正业的皇帝。但只有他自己知道，他在寻找什么。","他在寻找，那本神秘的书里，记载的“天下大同”的秘密。他相信那个秘密，就藏在炼金术和占星术里。他花了一生的时间，去寻找那个秘密。但直到他去世，他也没有找到。","1612年，鲁道夫二世去世，享年六十岁。他去世前，把他的儿子，马蒂亚斯叫到床前。","“孩子，”他说，“你要记住，我们哈布斯堡家族的血脉里，流着一个东方皇帝的血。我们的使命，不是征服世界，而是守护文明。总有一天，人类会实现天下大同。在那一天到来之前，我们要做的就是守护文明的火种。”","马蒂亚斯点了点头。但他没有完全理解父亲的话。他只记住了紫眼睛是家族的标志。从那以后，哈布斯堡家族的每一代皇帝，都有紫眼睛。但他们中的大多数人，都不知道紫眼睛的真正含义。","他们只知道，那是家族的标志。只有少数人，知道那个秘密。那个关于建文帝，关于《应文秘典》，关于天下大同的秘密。"]},{"t":"第十五章 · 宗教改革的暗手","ps":["1517年10月31日，维滕贝格。马丁·路德，站在维滕贝格教堂的大门前，手里拿着一张羊皮纸，深吸了一口气。他今年三十四岁，是维滕贝格大学的神学教授。他穿着黑色的修士袍，面容清瘦，眼神坚定。他的手里，拿着的，是他刚刚写好的《九十五条论纲》。","这篇论纲，是他对罗马教廷兜售赎罪券的抗议。他认为赎罪券是对上帝的亵渎，是对信徒的欺骗。他认为真正的救赎，不是靠购买赎罪券，而是靠对上帝的信仰。他知道这篇论纲，会引起轩然大波。","但他已经做好了准备。他把论纲，钉在了教堂的大门上。然后他转身离开了。他不知道这一钉将改变整个欧洲的历史。《九十五条论纲》，像一颗投入平静湖面的石子，激起了千层浪。","很快这篇论纲，就传遍了整个德意志。人们争相传抄，议论纷纷。很多人对罗马教廷的腐败，早就不满了。路德的论纲，说出了他们的心声。罗马教廷，震怒了。教皇利奥十世，宣布路德的论纲是异端邪说，要求路德公开认错。","路德拒绝了。1521年，神圣罗马帝国皇帝查理五世，在沃尔姆斯召开帝国会议，要求路德出席，为自己的观点辩护。路德出席了。在帝国会议上，路德面对皇帝和诸侯，毫不畏惧。他说：“我站在这里，我别无选择。上帝保佑我。阿门。”","查理五世，宣布路德是异端，下令逮捕他。但路德，被萨克森选帝侯腓特烈三世，保护了起来。腓特烈三世，把路德藏在了瓦特堡里。在瓦特堡里，路德用了十个月的时间，把《圣经》从希伯来文和希腊文，翻译成了德文。","德文版《圣经》的出版，让普通的德意志人，也能直接阅读《圣经》，而不需要通过神父。这，进一步动摇了罗马教廷的权威。宗教改革的火焰就这样在德意志燃烧了起来。","很快宗教改革，就蔓延到了整个欧洲。瑞士有茨温利和加尔文。法国有胡格诺派。英国有亨利八世的英国国教。北欧有路德宗。整个欧洲，都陷入了宗教分裂的混乱之中。","但很少有人知道，在这一切的背后，有一只看不见的手，在暗中推动着。那只手，来自建文帝的后裔。1510年，也就是宗教改革爆发的七年前，朱载堉的父亲朱厚炜作为哈布斯堡家族的“隐秘顾问”，曾经给查理五世的祖父，马克西米利安一世，写过一份秘密报告。","报告的标题，是《论教权与王权的关系》。在报告里，朱厚炜写道：","“罗马教廷，已经腐败不堪。教皇和主教们，沉迷于享乐，搜刮民脂民膏。他们打着上帝的旗号，行的却是魔鬼的勾当。他们兜售赎罪券，贩卖神职，干涉各国内政。他们的权力，已经凌驾于各国国王之上。这是对王权的最大威胁。”","“在遥远的东方，有一个伟大的帝国叫中国。在中国皇帝是最高的统治者，教会必须服从皇帝。中国的皇帝，从来不会允许教会凌驾于王权之上。因此中国的政治，比欧洲稳定得多。”","“我建议，陛下应该利用德意志诸侯对教廷的不满，暗中支持宗教改革。让宗教改革，削弱教廷的权力。这样，王权就能凌驾于教权之上。哈布斯堡家族，就能成为欧洲真正的统治者。”","这份报告，被马克西米利安一世，锁在了秘密档案馆里。他没有完全采纳朱厚炜的建议——他是一个虔诚的天主教徒，不愿意公开反对教廷。但他的孙子，查理五世，在沃尔姆斯帝国会议上，对路德的处理，却显得有些“心慈手软”。","他宣布路德是异端，但却没有真正逮捕他。他默许了萨克森选帝侯腓特烈三世，保护路德。很多人觉得，查理五世是迫于诸侯的压力，才不得不这样做。但只有查理五世自己知道，他的祖父，马克西米利安一世，在去世前，曾经对他说过一句话：","“孩子，教廷的权力太大了。我们需要一个人，来削弱教廷的权力。那个人，可能就是路德。”","查理五世，记住了祖父的话。所以他对路德网开一面。所以宗教改革，才能在德意志，生根发芽。1555年，《奥格斯堡和约》签订。和约规定，德意志的每个诸侯，都有权选择自己领地的宗教——天主教或者路德宗。这，正式承认了路德宗的合法地位。","罗马教廷的权威，受到了致命的打击。王权，终于凌驾于教权之上。朱厚炜在报告里的预言，实现了。但朱厚炜，没有看到这一天。他在1540年，就去世了。他去世前，把那本《应文秘典》，传给了他的儿子朱载堉。","并且，告诉了他一个秘密。","“孩子，”朱厚炜说，“宗教改革，只是第一步。我们的最终目标，是天下大同。在天下大同实现之前，我们要做的就是不断地削弱战争的根源。宗教战争，是战争的根源之一。削弱宗教的权力，就是削弱战争的根源。”","“我明白了，父亲。”朱载堉说。","朱厚炜笑了笑，闭上了眼睛。宗教改革，带来了宗教战争。1562年，法国胡格诺战争爆发。1568年，尼德兰革命爆发。1618年，三十年战争爆发。整个欧洲，都陷入了战火之中。","但朱载堉知道，这是必经之路。旧的秩序，必须被打破。新的秩序，才能建立起来。战争，是痛苦的。但战争之后，是和平。他相信总有一天，人类会实现天下大同。","在那一天到来之前，他要做的就是守护文明的火种。"]},{"t":"第十六章 · 三十年战争","ps":["1618年5月23日，布拉格。一群波希米亚的新教贵族，冲进了布拉格城堡，把神圣罗马帝国皇帝的两名钦差，从窗户里扔了出去。这，就是著名的“掷出窗外事件”。","三十年战争，由此爆发。战争的起因，是宗教矛盾。神圣罗马帝国皇帝马蒂亚斯，是一个天主教徒。他想在波希米亚，恢复天主教的统治，限制新教的自由。波希米亚的新教贵族，不满皇帝的政策，发动了叛乱。","他们选举普法尔茨选帝侯腓特烈五世，为波希米亚国王。皇帝马蒂亚斯大怒。他派他的堂弟，斐迪南二世，率军镇压叛乱。战争，就这样开始了。但很快，战争就超出了宗教的范围。","欧洲的各个国家，都卷入了进来。西班牙支持天主教同盟。法国虽然是天主教国家，但为了削弱哈布斯堡家族，支持新教同盟。瑞典支持新教同盟。丹麦支持新教同盟。荷兰支持新教同盟。英国支持新教同盟。","整个欧洲，都打成了一锅粥。1620年，白山战役。天主教同盟的军队，在蒂利伯爵的指挥下，大败波希米亚和普法尔茨的联军。腓特烈五世，被赶出了波希米亚，逃到了荷兰。","波希米亚，重新被天主教控制。但战争，没有结束。1625年，丹麦国王克里斯蒂安四世，率军入侵德意志，支持新教诸侯。皇帝斐迪南二世，任命华伦斯坦为帝国军队统帅。华伦斯坦，是一个军事天才。他率军大败丹麦军队，把丹麦人赶出了德意志。","1629年，丹麦被迫求和。但战争，还是没有结束。1630年，瑞典国王古斯塔夫二世，率军入侵德意志。古斯塔夫二世，是欧洲历史上最伟大的军事统帅之一。他改革了瑞典的军队，发明了线性战术，提高了军队的机动性和火力。他的军队装备精良训练有素，战斗力极强。","瑞典军队，一路势如破竹，大败帝国军队。1632年，吕岑战役。瑞典军队，和帝国军队，展开了激战。古斯塔夫二世，身先士卒冲锋陷阵。但在战斗中，他不幸中弹身亡。","瑞典军队，虽然失去了统帅，但仍然打赢了这场战役。华伦斯坦，在战役后，被皇帝斐迪南二世，解除了兵权。因为皇帝怀疑，华伦斯坦有二心。1634年，华伦斯坦，被皇帝派人暗杀。","但战争，仍然没有结束。1635年，法国正式参战。法国首相黎塞留，是一个政治天才。他虽然是天主教的红衣主教，但为了法国的国家利益，他毫不犹豫地支持新教同盟，对抗哈布斯堡家族。","法国军队，在蒂雷纳子爵和大孔代亲王的指挥下，大败帝国军队和西班牙军队。战争，又打了十三年。1648年，《威斯特伐利亚和约》签订。三十年战争，终于结束了。","这场战争，给德意志带来了毁灭性的打击。德意志的人口，减少了三分之一。很多城市和村庄，被夷为平地。农业和商业，遭到了严重的破坏。神圣罗马帝国，名存实亡。","皇帝的权力，被大大削弱。德意志的诸侯，获得了几乎完全的独立。哈布斯堡家族的霸权，被打碎了。1648年，维也纳霍夫堡宫。皇帝斐迪南三世，站在窗前，看着窗外维也纳的街景，眉头紧锁。","他今年三十九岁，是斐迪南二世的儿子。他继承了父亲的皇位，也继承了父亲的烂摊子。三十年战争，把帝国打烂了。他的祖父，鲁道夫二世，曾经是一个热爱学术和艺术的皇帝。他的父亲，斐迪南二世，是一个虔诚的天主教徒，为了天主教的信仰，不惜发动战争。","但现在，一切都完了。帝国名存实亡。哈布斯堡家族的霸权，被打碎了。天主教的统一，被打破了。他不知道，未来在哪里。","“陛下。”一个声音从身后传来。","斐迪南三世回头，看见一个老人，站在书房的门口。老人今年八十多岁，头发已经全白了但精神矍铄。他的眼睛，是紫色的。他是朱载堉，建文帝的第七代传人，哈布斯堡家族的“隐秘顾问”。","“朱先生。”斐迪南三世说，“你来了。”","“陛下，”朱载堉走到他面前，“我听说《威斯特伐利亚和约》，已经签订了？”","“是啊。”斐迪南三世叹了口气，“签订了。三十年战争，终于结束了。”","“陛下，您应该高兴才对。”朱载堉说。","“高兴？”斐迪南三世苦笑了一下，“帝国被打烂了，哈布斯堡的霸权被打碎了，我有什么可高兴的？”","“陛下，”朱载堉说，“您看到的是失去。但我看到的是得到。”","“得到？”斐迪南三世皱起了眉头，“我们得到了什么？”","“和平。”朱载堉说，“三十年的战争，终于结束了。欧洲终于迎来了和平。这难道不是最大的得到吗？”","斐迪南三世沉默了。","“陛下，”朱载堉继续说，“您的祖父，鲁道夫二世，曾经跟我说过一句话。他说‘我们哈布斯堡家族的使命，不是征服世界，而是守护文明。’我觉得他说得对。”","“守护文明……”斐迪南三世喃喃地说。","“对。”朱载堉说，“战争是文明的敌人。每一次战争，都会摧毁无数的生命，无数的财富，无数的文化成果。三十年战争，把德意志打烂了。但也正因为如此欧洲人终于认识到了战争的可怕。《威斯特伐利亚和约》，建立了一套新的国际秩序——主权国家，平等相待，互不干涉内政。这套秩序，虽然还不完善，但它为欧洲的和平，奠定了基础。”","他顿了顿，继续说：“陛下，哈布斯堡家族的霸权，被打碎了。但这不一定是坏事。霸权会带来战争。没有霸权，才会有和平。欧洲需要的不是一个霸主，而是一群平等的国家。”","斐迪南三世，看着朱载堉，看着他紫色的眼睛，忽然觉得自己好像明白了什么。","“朱先生，”他说，“你的祖先建文帝是不是也是这样想的？”","“对。”朱载堉笑了笑，“我的祖先建文帝他的理想是天下大同。他认为人类的未来，是所有的民族，所有的国家，都成为一家人，没有战争没有仇恨，只有和平与合作。为了这个理想他放弃了皇位，流亡到了欧洲。他用了三十年的时间，写了一本书，把东方的文明，带到了欧洲。”","“天下大同……”斐迪南三世喃喃地说。","“对。”朱载堉说，“陛下这个理想虽然还很遥远。但我相信，总有一天，它会实现的。在那一天到来之前，我们要做的就是守护和平，守护文明。”","斐迪南三世，沉默了很久。然后，他说：“我明白了。”他走到窗前，看着窗外维也纳的街景。夕阳西下，金色的阳光，洒在维也纳的屋顶上。街道上人们在和平地生活。孩子们在街头玩耍。商人们在店铺里忙碌。","这，就是和平。这，就是文明。斐迪南三世，忽然觉得自己失去的那些霸权，那些领土那些权力，都不重要了。重要的，是和平。重要的，是文明。重要的，是天下大同的理想。","1657年，斐迪南三世去世，享年四十八岁。他去世前，把他的儿子，利奥波德一世，叫到床前。","“孩子，”他说，“你要记住，我们哈布斯堡家族的使命，不是征服世界，而是守护文明。霸权会带来战争。和平才是文明的基础。总有一天，人类会实现天下大同。在那一天到来之前，我们要做的就是守护和平，守护文明。”","利奥波德一世，点了点头。但他没有完全理解父亲的话。他只记住了紫眼睛是家族的标志。从那以后，哈布斯堡家族的每一代皇帝，都有紫眼睛。但他们中的大多数人，都不知道紫眼睛的真正含义。","他们只知道，那是家族的标志。只有少数人，知道那个秘密。那个关于建文帝，关于《应文秘典》，关于天下大同的秘密。"]},{"t":"第十七章 · 科学革命的火种","ps":["1687年，伦敦。艾萨克·牛顿，站在他的书房里，手里拿着一本刚刚出版的书，深吸了一口气。这本书的名字，叫《自然哲学的数学原理》。他今年四十四岁，是剑桥大学的数学教授，皇家学会的会员。他穿着朴素的黑色长袍，面容清瘦眼神深邃。他的手里拿着的是他花了十八年时间，写成的巨著。","在这本书里，他提出了万有引力定律，三大运动定律，建立了经典力学的体系。他用数学的语言，描述了宇宙的运行规律。从天上的行星，到地上的苹果，都遵循着同样的物理定律。","这本书，将改变人类对宇宙的认识。但很少有人知道，在这本书的背后，有一个来自东方的神秘火种。牛顿从小就对炼金术，有着浓厚的兴趣。他花了大量的时间，研究炼金术。他相信炼金术里，藏着宇宙的终极秘密。","他收藏了大量的炼金术书籍，做了无数的炼金术实验。他的炼金术笔记，有几百万字。但很少有人知道，他的炼金术研究，参考了一本神秘的著作。那本著作，是他的朋友波义耳借给他的。","波义耳，是英国著名的化学家，皇家学会的创始人之一。他也是一个炼金术的爱好者。波义耳的炼金术知识，来自他的老师，哈特利布。哈特利布，是一个来自德意志的学者，是“玫瑰十字会”的成员。","玫瑰十字会，是一个秘密的神秘学团体。他们相信，宇宙中，存在着一种神秘的知识，可以让人获得永恒的生命和无限的智慧。玫瑰十字会的知识，来自一本神秘的著作。","那本著作，就是建文帝的《应文秘典》。1614年，一本叫《玫瑰十字会宣言》的小册子，在德意志出版。小册子宣称，有一个叫克里斯蒂安·罗森克鲁兹的人，曾经到东方旅行，从东方的智者那里，学到了神秘的知识。他回到欧洲后，创立了玫瑰十字会守护这些神秘的知识。","小册子出版后，在欧洲引起了巨大的轰动。很多人，都相信玫瑰十字会的存在。很多学者，都加入了玫瑰十字会。但很少有人知道，玫瑰十字会的真正创始人，不是克里斯蒂安·罗森克鲁兹。","而是建文帝的后裔。1590年，朱载堉的儿子朱翊镠作为哈布斯堡家族的“隐秘顾问”，曾经给皇帝鲁道夫二世，写过一份秘密报告。报告的标题，是《论神秘知识的传播》。","在报告里，朱翊镠写道：","“《应文秘典》里的知识，是人类文明的瑰宝。但这些知识，不能公开传播。因为如果公开传播，会引起教会的恐慌，会被教会视为异端邪说。我们需要一个秘密的团体，来守护和传播这些知识。”","“我建议，创立一个秘密的神秘学团体。这个团体，以‘玫瑰十字’为标志。玫瑰，象征着神秘和美丽。十字，象征着牺牲和救赎。这个团体的成员，都是欧洲最优秀的学者。他们在秘密的状态下，研究和传播《应文秘典》里的知识。”","“这样既可以避免教会的迫害，又可以让这些知识，在欧洲的学者中，秘密地传播。总有一天这些知识，会开花结果，改变整个欧洲。”","这份报告，被鲁道夫二世批准了。鲁道夫二世，本身就是一个神秘学的爱好者。他对炼金术和占星术，有着浓厚的兴趣。他赞助了无数的炼金术士和占星家。他批准了朱翊镠的建议。","于是玫瑰十字会就这样在布拉格，秘密地成立了。朱翊镠，是玫瑰十字会的第一任“隐形大师”。玫瑰十字会成立后很快就在欧洲的学者中，秘密地传播开来。德意志、荷兰、英国、法国，都有玫瑰十字会的成员。","他们中的很多人，都是欧洲历史上著名的学者和科学家。波义耳，是玫瑰十字会的成员。牛顿，是玫瑰十字会的成员。莱布尼茨，是玫瑰十字会的成员。笛卡尔，是玫瑰十字会的成员。斯宾诺莎，是玫瑰十字会的成员。","他们在秘密的状态下，研究和传播《应文秘典》里的知识。《应文秘典》里的数学知识，启发了笛卡尔的解析几何，莱布尼茨的微积分。《应文秘典》里的天文学知识，启发了哥白尼的日心说，开普勒的行星运动定律。《应文秘典》里的化学知识，启发了波义耳的元素说，拉瓦锡的氧化理论。《应文秘典》里的物理学知识，启发了伽利略的自由落体定律，牛顿的经典力学。","科学革命的火种就这样在欧洲秘密地燃烧了起来。1687年，牛顿的《自然哲学的数学原理》出版。这本书，标志着经典力学体系的建立，标志着科学革命的高潮。","牛顿在这本书的序言里写道：","“我之所以能看得更远，是因为我站在巨人的肩膀上。”","很多人以为，牛顿说的“巨人”，是指哥白尼、开普勒、伽利略这些欧洲的科学家。但只有牛顿自己知道，他说的“巨人”，还包括一个来自遥远东方的神秘学者。","那个学者，叫建文帝。牛顿在他的炼金术笔记里，曾经写过一句话：","“东方的智者，已经把宇宙的秘密，写在了一本神秘的书里。我所做的只是把那些秘密，用数学的语言，重新描述了一遍。”","这句话被牛顿的后人，锁在了秘密档案馆里。直到三百年后，才被人发现。1727年，牛顿去世，享年八十四岁。他去世后，被安葬在威斯敏斯特大教堂。他的墓碑上，刻着：","“艾萨克·牛顿爵士，安葬在这里。他以几乎神一般的思维力，最先说明了行星的运动和图像，彗星的轨道和大海的潮汐。他孜孜不倦地研究光线的各种不同的折射角，颜色所产生的种种性质。对于自然、考古和圣经，他是一个勤勉、敏锐而忠实的诠释者。他在他的哲学中证明了上帝的庄严，并在他的举止中表现了福音的纯朴。让人类欢呼曾经存在过这样伟大的一位人类之光。”","但很少有人知道，在牛顿的私人图书馆里，藏着一本神秘的书。那本书，就是建文帝的《应文秘典》的抄本。那本书是波义耳，在去世前，留给牛顿的。波义耳在留给牛顿的信里写道：","“艾萨克这本书里，藏着宇宙的终极秘密。我研究了一辈子，也只读懂了其中的一小部分。现在我把它留给你。我相信你能读懂更多。但记住不要公开这本书的存在。因为这个世界，还没有准备好，接受这些知识。”","牛顿，记住了波义耳的话。他一辈子，都没有公开这本书的存在。他只是把书里的知识，融入了自己的研究。然后用数学的语言，重新描述了一遍。科学革命的火种就这样在秘密中，燃烧了起来。","卷末伏笔：1700年，西班牙王位继承战争1700年11月1日，马德里。西班牙国王卡洛斯二世，在他的皇宫里，咽下了最后一口气。他今年三十九岁，是西班牙哈布斯堡家族的最后一位国王。","他一生，体弱多病，精神不正常。他有着哈布斯堡家族标志性的大下巴——大到他无法咀嚼食物。他的舌头，大到他说话含糊不清。他的腿，畸形到他无法正常行走。","这是几代近亲通婚，留下的恶果。他结过两次婚，但没有留下任何子嗣。他的去世，标志着西班牙哈布斯堡家族的绝嗣。也标志着一场席卷整个欧洲的大战，即将爆发。","卡洛斯二世，在去世前，立下了遗嘱。他把西班牙的王位，传给了他的侄孙，安茹公爵腓力。腓力，是法国国王路易十四的孙子。路易十四，是欧洲历史上最强大的国王之一。他统治法国长达七十二年，把法国建设成了欧洲最强大的国家。他的梦想，是让法国，成为欧洲的霸主。","如果腓力继承了西班牙王位，那法国和西班牙，就会合并成一个国家。那将是一个，比哈布斯堡家族的日不落帝国，还要强大的帝国。整个欧洲，都会在法国的统治之下。","这是其他欧洲国家，绝对不能接受的。神圣罗马帝国皇帝利奥波德一世，第一个站出来反对。利奥波德一世，是奥地利哈布斯堡家族的皇帝。他的妻子，是卡洛斯二世的姐姐。他认为西班牙的王位，应该传给他的儿子，卡尔大公。","英国和荷兰，也站在了奥地利一边。他们害怕，法国和西班牙合并会打破欧洲的均势。于是一场大战爆发了。这，就是西班牙王位继承战争。战争从1701年，一直打到了1714年。","英国、荷兰、奥地利，组成了反法同盟。法国、西班牙，组成了法西同盟。整个欧洲，都卷入了战争。战争中，涌现出了两位伟大的军事统帅。一位，是英国的马尔伯勒公爵。一位，是法国的维拉尔元帅。","他们在战场上，斗智斗勇，打了无数场精彩的战役。1713年，《乌得勒支和约》签订。1714年，《拉什塔特和约》签订。西班牙王位继承战争，终于结束了。","战争的结果是：腓力继承了西班牙王位，即腓力五世。但他必须放弃，他和他的后代，对法国王位的继承权。法国和西班牙，不能合并。奥地利，获得了西属尼德兰、米兰、那不勒斯、撒丁岛。英国，获得了直布罗陀、米诺卡岛，还有西班牙美洲殖民地的黑奴贸易垄断权。荷兰，获得了在南尼德兰的驻军权。","哈布斯堡家族，虽然失去了西班牙，但获得了意大利和尼德兰的大片领土。奥地利哈布斯堡家族，仍然是欧洲最强大的家族之一。1714年，维也纳霍夫堡宫。皇帝查理六世，站在窗前，看着窗外维也纳的街景，眉头紧锁。","他今年三十岁，是利奥波德一世的儿子。他继承了哥哥约瑟夫一世的皇位。西班牙王位继承战争，终于结束了。奥地利虽然获得了大片领土，但也付出了巨大的代价。","而且，他有一个巨大的烦恼。他没有儿子。他只有一个女儿，叫玛丽亚·特蕾西亚。哈布斯堡家族，已经没有男性继承人了。如果他去世了哈布斯堡家族，就会绝嗣。","他的领地，就会被其他国家瓜分。这，是他绝对不能接受的。","“陛下。”一个声音从身后传来。","查理六世回头，看见一个老人，站在书房的门口。老人今年七十多岁，头发已经全白了但精神矍铄。他的眼睛，是紫色的。他是朱翊镠的儿子朱常洛建文帝的第九代传人，哈布斯堡家族的“隐秘顾问”。","“朱先生。”查理六世说，“你来了。”","“陛下，”朱常洛走到他面前，“我听说您在为继承人的问题烦恼？”","“是啊。”查理六世叹了口气，“我没有儿子。只有一个女儿，玛丽亚·特蕾西亚才七岁。如果我去世了哈布斯堡家族，就绝嗣了。”","“陛下，”朱常洛说，“您为什么不立您的女儿，为继承人呢？”","“女儿？”查理六世皱起了眉头，“哈布斯堡家族，从来没有女性继承人。而且神圣罗马帝国的皇位，只能由男性继承。”","“陛下，”朱常洛说，“规矩是可以改的。在遥远的东方，有一个伟大的帝国叫中国。在中国曾经有一个女人，做了皇帝叫武则天。她统治了中国几十年，把国家治理得井井有条。女人也可以做统治者。”","“武则天……”查理六世喃喃地说。","“对。”朱常洛说，“陛下您可以发布一份《国事诏书》，宣布您的女儿，玛丽亚·特蕾西亚，有权继承您的所有领地。您可以让欧洲的各个国家，都承认这份诏书。这样即使您去世了您的女儿，也可以顺利地继承您的领地。”","“那……神圣罗马帝国的皇位呢？”","“神圣罗马帝国的皇位，”朱常洛说，“可以由您的女婿来继承。您可以为您的女儿，选一个合适的丈夫。您的女婿，可以做神圣罗马帝国的皇帝。您的女儿，可以做奥地利、匈牙利、波希米亚的女王。这样，哈布斯堡家族，就不会绝嗣了。”","查理六世，眼睛一亮。","“朱先生，”他说，“你的意思是……让我的女儿做女王？”","“对。”朱常洛笑了笑，“陛下您的女儿，玛丽亚·特蕾西亚我见过。她虽然只有七岁，但聪明伶俐有主见有魄力。她将来一定会成为一个伟大的女王。”","查理六世，沉默了很久。然后，他说：“我明白了。”他走到窗前，看着窗外维也纳的街景。夕阳西下，金色的阳光，洒在维也纳的屋顶上。他想起了他的父亲，利奥波德一世。他想起了他的哥哥，约瑟夫一世。他想起了哈布斯堡家族，几百年的辉煌。","他不能让哈布斯堡家族，在他的手里绝嗣。他要让他的女儿，继承他的一切。他要让哈布斯堡家族，继续辉煌下去。1713年，查理六世，发布了《国事诏书》。","诏书宣布，玛丽亚·特蕾西亚，有权继承查理六世的所有领地。欧洲的各个国家，都先后承认了这份诏书。但很少有人知道，这份诏书的背后，有一个来自东方的神秘建议。","那个建议，来自建文帝的后裔朱常洛。1740年，查理六世去世，享年五十五岁。他的女儿，玛丽亚·特蕾西亚，继承了奥地利、匈牙利、波希米亚的王位。她今年二十三岁，美丽、聪明、有魄力。","她是哈布斯堡家族历史上第一位女性统治者。她的丈夫，弗朗茨一世，被选为神圣罗马帝国皇帝。哈布斯堡家族，没有绝嗣。相反在玛丽亚·特蕾西亚的统治下奥地利，迎来了一个新的黄金时代。","她改革了行政，发展了经济，加强了军队。她赞助了艺术和科学，把维也纳，变成了欧洲的文化中心。她生了十六个孩子，把她的女儿们，嫁给了欧洲各个国家的国王。","她被称为“欧洲的丈母娘”。哈布斯堡家族的联姻传统，在她的手里，发扬光大。但很少有人知道，在玛丽亚·特蕾西亚的血脉里，流着建文帝的血。她的眼睛，也是紫色的。","只是，她自己不知道。她只知道紫眼睛是家族的标志。1780年，玛丽亚·特蕾西亚去世，享年六十三岁。她去世前，把她的儿子，约瑟夫二世，叫到床前。","“孩子，”她说，“你要记住，我们哈布斯堡家族的使命，不是征服世界，而是守护文明。联姻是我们家族的传统。但联姻不是为了扩张领土，而是为了维护和平。总有一天，人类会实现天下大同。在那一天到来之前，我们要做的就是守护和平，守护文明。”","约瑟夫二世，点了点头。但他没有完全理解母亲的话。他只记住了紫眼睛是家族的标志。从那以后，哈布斯堡家族的每一代统治者，都有紫眼睛。但他们中的大多数人，都不知道紫眼睛的真正含义。","他们只知道，那是家族的标志。只有少数人，知道那个秘密。那个关于建文帝，关于《应文秘典》，关于天下大同的秘密。（第二卷·完）第三卷：鹰龙共生（1700–1850）"]},{"t":"第十八章 · 启蒙运动的东方影子","ps":["1751年，巴黎。德尼·狄德罗，站在他的书房里，手里拿着一本刚刚出版的书，深吸了一口气。这本书的名字，叫《百科全书，或科学、艺术和工艺详解词典》。","他今年三十八岁，是法国著名的哲学家、作家。他穿着朴素的黑色外套，面容清瘦眼神锐利。他的手里拿着的是他花了五年时间，组织编写的巨著的第一卷。在这本书里，他和他的合作者们，把人类所有的知识——科学、艺术、工艺、历史、哲学——都系统地整理了出来。","他们相信知识可以让人摆脱愚昧和迷信。他们相信理性可以让人获得自由和幸福。他们相信人类可以通过自己的努力，创造一个更美好的世界。这，就是启蒙运动。","但很少有人知道，在启蒙运动的背后，有一个来自东方的神秘影子。狄德罗从小就对中国，有着浓厚的兴趣。他收藏了大量的关于中国的书籍。他读过《论语》《孟子》《大学》《中庸》的法文译本。他读过马可·波罗的游记。他读过传教士写的关于中国的报告。","他对中国的科举制度，赞不绝口。他对中国的开明君主制，推崇备至。他对中国的儒家伦理，深以为然。他认为中国是一个由哲学家统治的国家。他认为中国的皇帝，是开明的君主，是哲学家王。他认为中国的制度，是人类最完美的政治制度。","他在《百科全书》里，专门写了一个条目叫“中国”。在这个条目里，他写道：","“中国，是世界上最古老、最广阔、最美丽、最富饶、最人口众多的王国。中国的政府，是世界上最好的政府。中国的法律，是世界上最完善的法律。中国的道德，是世界上最纯洁的道德。”","“中国的皇帝，不是暴君，而是父亲。他像父亲爱护孩子一样，爱护他的人民。中国的官员，不是贵族，而是学者。他们通过科举考试，选拔最有才华的人，来管理国家。”","“中国的儒家思想不是宗教，而是道德。它教导人们，要孝顺父母，要尊敬长辈，要忠诚君主，要爱护朋友。它教导人们，要修身齐家治国平天下。”","“中国，是人类的希望。如果欧洲能够学习中国的制度和道德，欧洲就会变得更加美好。”","这个条目，在法国引起了巨大的轰动。很多人都被狄德罗描绘的中国，深深地吸引了。他们开始学习中文。他们开始收藏中国的艺术品。他们开始模仿中国的建筑和园林。","中国热在法国席卷了整个上流社会。但很少有人知道，狄德罗关于中国的知识有很多来自一本神秘的著作。那本著作，就是建文帝的《应文秘典》。狄德罗，是玫瑰十字会的秘密成员。","玫瑰十字会，在17世纪的欧洲，秘密地传播着《应文秘典》里的知识。到了18世纪，玫瑰十字会的成员，已经遍布欧洲的学术界。他们中的很多人，都是启蒙运动的领袖。","伏尔泰，是玫瑰十字会的成员。孟德斯鸠，是玫瑰十字会的成员。卢梭，是玫瑰十字会的成员。狄德罗，是玫瑰十字会的成员。达朗贝尔，是玫瑰十字会的成员。霍尔巴赫，是玫瑰十字会的成员。","他们在秘密的状态下，研究和传播《应文秘典》里的知识。《应文秘典》里的政治哲学，启发了孟德斯鸠的三权分立，卢梭的社会契约论。《应文秘典》里的伦理思想，启发了伏尔泰的开明君主制，狄德罗的百科全书派。《应文秘典》里的历史观，启发了维柯的历史哲学，赫尔德的历史主义。《应文秘典》里的教育思想，启发了洛克的白板说，卢梭的自然教育。","启蒙运动的火种就这样在秘密中，燃烧了起来。1754年，法国凡尔赛宫。国王路易十五，站在他的书房里，手里拿着一封信，眉头紧锁。信是他的情妇，蓬巴杜夫人，写给他的。","蓬巴杜夫人，在信里说，她最近认识了一个神秘的学者，叫朱聿键。朱聿键，自称来自东方，是一个旅行家。他精通拉丁文、法文、德文、英文，还懂一点中文。他学识渊博，对历史、哲学、政治、经济，都有深刻的见解。","蓬巴杜夫人，被朱聿键的学识，深深地吸引了。她邀请朱聿键，到凡尔赛宫，做她的私人顾问。路易十五，对这个神秘的东方学者，也产生了兴趣。他决定，见一见这个朱聿键。","三天后凡尔赛宫镜厅。路易十五，坐在他的王座上，看着站在他面前的这个东方人。朱聿键今年四十多岁，中等身材，穿着一身法国式的礼服，但他的面容，是典型的东方人——黑发黑眼黄皮肤。他的眼睛，是紫色的——一种奇异的、淡淡的紫色。","“你就是朱聿键？”路易十五问。","“是的陛下。”朱聿键微微鞠躬，“我是朱聿键，来自遥远的东方。”","“你来自东方？”路易十五好奇地问，“东方的哪个国家？”","“中国。”朱聿键说，“我是中国明朝皇室的后裔。”","“明朝皇室的后裔？”路易十五吃了一惊，“明朝？我听说中国现在是清朝，不是明朝。”","“是的陛下。”朱聿键说，“明朝在一百多年前，就被清朝推翻了。我的祖先，在明朝灭亡的时候，逃到了欧洲。我们家族在欧洲已经生活了一百多年了。”","“原来如此。”路易十五点了点头，“那你……为什么要回到法国？”","“因为，”朱聿键说，“我想把东方的知识，带到欧洲。我想让欧洲人，了解东方的文明。我想让东西方的文明，融合在一起。”","路易十五，看着朱聿键，看着他紫色的眼睛，忽然觉得这个人不简单。","“朱先生，”他说，“你愿意留在凡尔赛宫，做我的顾问吗？”","“我愿意，陛下。”朱聿键微微鞠躬。","就这样朱聿键留在了凡尔赛宫，做了路易十五的私人顾问。他在凡尔赛宫，待了十年。他给路易十五，讲中国的历史、政治、经济、文化。他给蓬巴杜夫人，讲中国的艺术、文学、哲学。他给法国的学者们，讲中国的科学、技术、医学。","他把《应文秘典》里的知识，一点点地，传播给了法国的上流社会。启蒙运动的火焰，在他的推动下，燃烧得更加猛烈了。1764年，朱聿键离开了凡尔赛宫。他走的时候，给路易十五，留下了一封信。","信里写道：","“陛下我在凡尔赛宫，待了十年。这十年，是我一生中，最美好的时光。我感谢陛下，对我的信任和礼遇。”","“我走了因为我还有更重要的事情要做。我要去英国去荷兰去德意志，去把东方的知识，传播给更多的人。”","“陛下我想告诉您一个秘密。这个秘密，在我们家族里，已经传了一百多年了。”","“我的祖先，不是普通的明朝皇室后裔。我的祖先，是明朝的第二位皇帝，建文帝朱允炆。他因为叔叔朱棣造反，国破家亡，流亡到了欧洲。他在欧洲，用了三十年的时间，写了一本神秘的书，叫《应文秘典》。”","“这本书里，记载了东方的医学、天文学、数学、哲学、政治、历史。这本书里的知识，通过各种隐秘的渠道，已经在欧洲，传播了一百多年。文艺复兴的爆发，宗教改革的兴起，科学革命的发生，启蒙运动的发展，背后都有这本书的影子。”","“陛下这本书的终极理想是天下大同。我的祖先相信，人类的未来，是所有的民族，所有的国家，都成为一家人，没有战争没有仇恨，只有和平与合作。”","“我相信这个理想总有一天，会实现的。在那一天到来之前，我要做的就是传播知识，促进东西方文明的融合。”","“陛下再见了。愿上帝保佑您，保佑法国。”","路易十五，读完这封信，沉默了很久。他把信，锁在了他的秘密档案馆里。他没有告诉任何人，这个秘密。但他知道，他的一生，已经被这个神秘的东方人改变了。","1778年，伏尔泰去世，享年八十四岁。他去世前，把他的秘书，叫到床前。","“孩子，”他说，“我要告诉你一个秘密。这个秘密，我保守了一辈子。”","“什么秘密？”秘书问。","“我，”伏尔泰说，“是玫瑰十字会的成员。”","“玫瑰十字会？”秘书吃了一惊。","“对。”伏尔泰说，“玫瑰十字会是一个秘密的团体。我们守护着一本神秘的书，叫《应文秘典》。这本书是一个来自东方的皇帝写的。那个皇帝叫建文帝。他因为国破家亡，流亡到了欧洲。他把东方的文明，带到了欧洲。”","“这本书里的知识，已经在欧洲，传播了几百年。文艺复兴、宗教改革、科学革命、启蒙运动，背后都有这本书的影子。”","“孩子，”伏尔泰说，“我所做的一切，都只是把这本书里的知识，用我自己的语言，重新描述了一遍。我不是什么天才，我只是一个传播者。”","“真正的天才，是那个来自东方的皇帝建文帝。”","说完伏尔泰闭上了眼睛。他的秘书，把这个秘密，记录了下来。但这份记录，被锁在了秘密档案馆里。直到三百年后，才被人发现。"]},{"t":"第十九章 · 工业革命的暗线","ps":["1769年，格拉斯哥。詹姆斯·瓦特，站在他的工作室里，手里拿着一个刚刚改进的蒸汽机模型，深吸了一口气。他今年三十三岁，是格拉斯哥大学的仪器制造师。他穿着朴素的工装，面容清瘦眼神专注。他的手里拿着的是他花了五年时间，改进的蒸汽机模型。","这个蒸汽机，比原来的纽科门蒸汽机，效率提高了四倍。它，将改变人类的历史。它，将开启工业革命。但很少有人知道，在瓦特改进蒸汽机的背后，有一个来自东方的神秘火种。","瓦特从小就对机械，有着浓厚的兴趣。他的父亲，是一个造船工人。他从小，就在父亲的船厂里，看着工人们制造船只和机器。他十八岁的时候，去了伦敦，学习仪器制造。一年后他回到了苏格兰，在格拉斯哥大学，找到了一份仪器制造师的工作。","在格拉斯哥大学，他认识了很多著名的科学家。其中对他影响最大的是约瑟夫·布莱克教授。布莱克教授，是著名的化学家，发现了二氧化碳，提出了潜热的概念。","布莱克教授，是瓦特的良师益友。他经常和瓦特，讨论科学问题。有一天布莱克教授，给了瓦特一本书。","“詹姆斯，”布莱克教授说，“这本书你拿去看看。我相信它会对你的蒸汽机研究，有帮助的。”","瓦特接过书看了看封面。书的封面，是黑色的没有任何文字。","“这是什么书？”瓦特问。","“一本神秘的书。”布莱克教授说，“这本书是我的老师，留给我的。我的老师，是玫瑰十字会的成员。他说这本书里，记载了东方的工艺和技术。他说这本书里的知识，会改变人类的历史。”","“玫瑰十字会？”瓦特皱起了眉头，“那不是一个神秘学团体吗？”","“表面上是。”布莱克教授笑了笑，“但实际上，他们守护着很多古老的知识。这本书，就是其中之一。你拿去看看吧。记住，不要告诉任何人，这本书的存在。”","瓦特点了点头。他把书，带回了他的工作室。那天晚上瓦特在他的工作室里，点起蜡烛，翻开了那本神秘的书。书里的文字，是一种他从来没有见过的文字。那些文字，像是象形文字，每个字都由几个偏旁组成。","但书里的插图，他看得懂。那些插图，画的是各种机器和工具。有抽水机，有鼓风机有车床有织布机，有印刷机，有起重机有水泵有风车有水车。每一种机器，都有详细的结构图和工作原理说明。","虽然文字看不懂但插图已经足够让瓦特，理解这些机器的工作原理了。瓦特被这些插图，深深地吸引了。他发现这些机器，比欧洲当时的机器，要先进得多。特别是其中有一个抽水机的插图，让他眼前一亮。","那个抽水机，用的是蒸汽作为动力。它的结构，比纽科门蒸汽机，要复杂得多，也要先进得多。它有一个分离的冷凝器，有一个双动气缸，有一个飞轮，有一个离心调速器。","这些结构正是瓦特，一直在思考，但还没有想出来的。瓦特看着这个插图，感觉像是有一道闪电，击中了他的大脑。他忽然明白了蒸汽机应该怎么改进。他拿起笔在纸上飞快地画了起来。","那天晚上，他一夜没睡。他画了一张又一张的设计图。他设计了分离的冷凝器。他设计了双动气缸。他设计了飞轮。他设计了离心调速器。这些设计，比他原来的设计，要先进得多。","他知道他的蒸汽机，将会改变世界。1769年，瓦特获得了他的第一项蒸汽机专利。这项专利，是关于分离冷凝器的。分离冷凝器，是瓦特蒸汽机，最核心的发明。","它让蒸汽机的效率，提高了四倍。它让蒸汽机，从矿井里的抽水机，变成了可以驱动各种机器的通用动力机。工业革命，由此开始。但很少有人知道，瓦特的分离冷凝器的灵感，来自一本神秘的书。","那本书，就是建文帝的《应文秘典》。《应文秘典》里的工艺部分，记载了几百种机器和工具的设计图和工作原理。这些机器和工具有很多是中国古代的发明。有活字印刷术，有指南针有火药有造纸术。有水排有风箱有翻车有筒车。有提花机，有缫丝机，有织布机，有染布机。有冶铁炉，有炼钢炉，有铸造机，有锻造机。","这些发明比欧洲早了几百年，甚至上千年。这些知识，通过玫瑰十字会，秘密地传播给了欧洲的工匠和工程师。工业革命的火种就这样在秘密中，燃烧了起来。1776年，瓦特和马修·博尔顿合作成立了博尔顿-瓦特公司。","他们开始，大规模地生产蒸汽机。他们的蒸汽机，被用在了矿井里，用在了工厂里，用在了纺织厂里，用在了炼铁厂里。英国的工业，开始了爆炸式的增长。纺织业用蒸汽机驱动织布机，产量提高了几十倍。冶铁业用蒸汽机驱动鼓风机，铁的产量提高了几十倍。采矿业用蒸汽机驱动抽水机，矿井的深度增加了几十倍。运输业用蒸汽机驱动火车和轮船，运输的速度提高了几十倍。","英国从一个农业国，变成了一个工业国。英国，成为了“世界工厂”。英国，成为了“日不落帝国”。但很少有人知道，在这一切的背后，有一个来自东方的神秘火种。","那个火种，就是建文帝的《应文秘典》。1819年，瓦特去世，享年八十三岁。他去世后，被安葬在威斯敏斯特大教堂。他的墓碑上，刻着：","“詹姆斯·瓦特，安葬在这里。他以几乎神一般的思维力，最先说明了蒸汽机的原理。他孜孜不倦地改进和完善了蒸汽机，让它成为了驱动各种机器的通用动力机。他的发明，改变了人类的生产方式，开启了工业革命的时代。让人类欢呼曾经存在过这样伟大的一位人类之光。”","但很少有人知道，在瓦特的私人图书馆里，藏着一本神秘的书。那本书，就是建文帝的《应文秘典》的抄本。那本书是布莱克教授，在去世前，留给瓦特的。布莱克教授，在留给瓦特的信里写道：","“詹姆斯这本书里，藏着人类文明的终极秘密。我研究了一辈子，也只读懂了其中的一小部分。现在我把它留给你。我相信你能读懂更多。但记住不要公开这本书的存在。因为这个世界，还没有准备好，接受这些知识。”","瓦特，记住了布莱克教授的话。他一辈子，都没有公开这本书的存在。他只是把书里的知识，融入了自己的发明。然后用他自己的语言，重新描述了一遍。工业革命的火种就这样在秘密中，燃烧了起来。"]},{"t":"第二十章 · 大清的黄昏","ps":["1793年，北京圆明园。乾隆皇帝，坐在他的龙椅上，看着站在他面前的这个英国人，眉头紧锁。这个英国人，叫马戛尔尼。他今年五十六岁，是英国国王乔治三世，派来的特使。","他率领着一支庞大的使团，乘坐着英国最先进的军舰，经过了九个月的航行，来到了中国。他的使命，是和中国，建立外交关系，开放通商口岸，降低关税，允许英国商人，在中国自由贸易。","但乾隆皇帝，对马戛尔尼的请求，不感兴趣。他认为中国是天朝上国，无所不有。他认为英国是蛮夷小邦，不值一提。他认为和英国通商，是对英国的恩赐，而不是中国的需要。","他给英国国王乔治三世，写了一封敕谕。敕谕里写道：","“奉天承运皇帝，敕谕英吉利国王知悉：咨尔国王，远在重洋倾心向化，特遣使恭赍表章，航海来廷叩祝万寿，并备进方物，用将忱悃。朕披阅表文，词意肫恳，具见尔国王恭顺之诚，深为嘉许。”","“至尔国王表内，恳请派一尔国之人，住居天朝，照管尔国买卖一节，此则与天朝体制不合，断不可行。”","“天朝物产丰盈，无所不有原不藉外夷货物，以通有无。特因天朝所产茶叶、瓷器、丝斤，为西洋各国及尔国必需之物，是以加恩体恤，在澳门开设洋行，俾得日用有资，并沾余润。”","“今尔国使臣，于定例之外，多有陈乞，大乖仰体天朝加惠远人、抚育四夷之道。”","“尔国王惟当善体朕意，益励款诚永矢恭顺，以保乂尔有邦，共享太平之福。”","“特此敕谕。”","这封敕谕，被马戛尔尼，带回了英国。它标志着中国拒绝了和世界的接轨。它标志着中国开始走向衰落。马戛尔尼在中国待了三个月。在这三个月里他看到了一个和他想象中，完全不一样的中国。","他想象中的中国，是《马可·波罗游记》里描绘的那个，繁华、富裕、文明的中国。他看到的中国，是一个贫穷、落后、愚昧的中国。他在他的日记里，写道：","“中国，是一个半野蛮的国家。它的人民，生活在最卑鄙的暴政之下。它的政府，是一个腐朽的、无能的、残暴的政府。它的军队，是一群装备落后、训练无素的乌合之众。它的科学，是一堆过时的、无用的、迷信的垃圾。”","“中国，就像是一艘破旧的大船。它之所以还没有沉没，只是因为它的体积庞大。但只要有一个稍微能干的船长，就可以轻易地把它击沉。”","“英国只需要几艘军舰，就可以征服中国。”","这篇日记在英国引起了巨大的轰动。很多英国人，开始改变了对中国的看法。他们不再认为，中国是一个文明的、富裕的国家。他们开始认为，中国是一个落后的、野蛮的国家。","他们开始，觊觎中国的财富和市场。他们开始，准备用武力，打开中国的大门。但很少有人知道，在马戛尔尼的使团里，有一个神秘的人。这个人，叫朱翊钧。他自称，是一个翻译。","但实际上，他是建文帝的后裔，玫瑰十字会的成员。他的任务，是跟着马戛尔尼的使团，回到中国，看看他的故土，现在是什么样子。他在中国，待了三个月。他看到了，乾隆皇帝的傲慢和无知。他看到了，清朝政府的腐败和无能。他看到了，中国人民的贫穷和愚昧。他看到了，中国科学技术的落后和停滞。","他的心里，充满了痛苦和悲哀。他的祖先建文帝在四百多年前，因为国破家亡，流亡到了欧洲。他的祖先，把东方的文明，带到了欧洲。他的祖先，用了三十年的时间，写了一本《应文秘典》。这本书里的知识在欧洲传播了四百多年。它催生了文艺复兴。它催生了宗教改革。它催生了科学革命。它催生了启蒙运动。它催生了工业革命。","欧洲因为这本书，变得强大了。而中国他的故土，却在这四百年里停滞了落后了衰落了。最讽刺的是欧洲人用他祖先带去的知识，制造出了坚船利炮，准备来攻打他的故土。","朱翊钧站在圆明园的门口，看着这座华丽的皇家园林眼泪流了下来。他知道这座园林，迟早有一天，会被欧洲人烧毁。他知道他的故土，迟早有一天，会被欧洲人欺凌。","他知道他的祖先的理想天下大同，还很遥远。但他相信，总有一天中国会重新崛起。他相信总有一天，东西方的文明，会真正地融合在一起。他相信总有一天人类会实现天下大同。","1794年，马戛尔尼的使团，离开了中国。朱翊钧也跟着使团，回到了欧洲。他回到欧洲后，写了一份秘密报告。报告的标题，是《关于中国现状的报告》。在报告里，他详细地描述了，中国的政治、经济、军事、文化、科技的现状。","他指出中国已经远远地落后于欧洲了。他指出，中国的政府，是一个腐朽的、专制的、无能的政府。他指出，中国的经济，是一个落后的、停滞的、农业的经济。他指出，中国的军队，是一支装备落后、训练无素、战斗力低下的军队。他指出，中国的文化，是一个保守的、僵化的、排外的文化。他指出，中国的科技，是一个停滞的、落后的、没有创新的科技。","他警告说如果欧洲，用武力攻打中国中国会不堪一击。他建议说欧洲应该用和平的方式和中国，建立外交关系和贸易关系。他建议说欧洲应该把先进的科学技术，传播给中国。他建议说欧洲应该帮助中国，进行改革和现代化。","他说只有这样，东西方的文明，才能真正地融合在一起。他说只有这样人类才能实现天下大同。这份报告，被玫瑰十字会的高层，锁在了秘密档案馆里。他们没有采纳朱翊钧的建议。","他们认为中国是一个落后的、野蛮的国家。他们认为和中国没有什么好谈的。他们认为用武力打开中国的大门，是最有效的方式。他们开始秘密地支持英国政府对中国发动战争。","鸦片战争的种子就这样被埋下了。"]},{"t":"第二十一章 · 茜茜公主的诞生","ps":["1837年12月24日，慕尼黑，维特尔斯巴赫家族的宫殿。伊丽莎白·亚美莉·欧根妮，出生了。她的父亲，是巴伐利亚的马克西米利安·约瑟夫公爵。她的母亲，是巴伐利亚的卢多维卡公主。","她是家里的第四个孩子，第三个女儿。她的家人，都叫她“茜茜”。茜茜出生的时候，和普通的婴儿，没有什么两样。她有着金色的头发，蓝色的眼睛，白皙的皮肤。","但她的眼睛，和普通的婴儿，不太一样。她的眼睛，是一种奇异的、淡淡的紫色。不是蓝色不是灰色，而是紫色。像紫水晶像紫罗兰，像黄昏时分的天空。她的母亲，卢多维卡公主，看到她的紫色眼睛，吃了一惊。","“这孩子的眼睛……”卢多维卡公主，喃喃地说。","“怎么了？”她的丈夫，马克西米利安公爵问。","“没什么。”卢多维卡公主，摇了摇头，“可能是光线的问题。”","但她知道，不是光线的问题。因为她的母亲，也就是茜茜的外祖母，巴登的卡罗琳公主，眼睛也是紫色的。而她的外祖母的母亲，也就是茜茜的曾外祖母，黑森-达姆施塔特的阿玛莉公主，眼睛也是紫色的。","紫色的眼睛，在她们家族里，已经传了好几代了。她们家族的人，都把紫色的眼睛，看作是一种特殊的标志。但她们不知道，紫色眼睛的真正来源。她们不知道，她们的血脉里，流着一个来自东方的皇帝的血。","那个皇帝，叫建文帝。茜茜从小就是一个与众不同的孩子。她不喜欢，宫廷里的繁文缛节。她不喜欢，穿着华丽的礼服，参加无聊的宴会。她不喜欢，和那些虚伪的、做作的贵族们打交道。","她喜欢大自然。她喜欢骑马。她喜欢在森林里，自由自在地奔跑。她喜欢在湖边静静地看着湖水。她的父亲，马克西米利安公爵，是一个热爱自由的人。他不喜欢，宫廷里的生活。他喜欢旅行。他喜欢和普通的老百姓打交道。他喜欢研究历史和文学。","他经常带着茜茜去旅行。他们去了瑞士，去了奥地利，去了意大利，去了希腊。在旅行中茜茜看到了一个和宫廷里完全不一样的世界。她看到了，阿尔卑斯山的壮丽。她看到了，地中海的蔚蓝。她看到了，古希腊的废墟。她看到了，普通老百姓的生活。","她的心灵，被大自然和自由深深地滋养了。她变成了一个，热爱自由、热爱自然、热爱生活的女孩。但她也变成了一个，孤独的、敏感的、忧郁的女孩。因为她觉得没有人真正地理解她。","她的母亲，卢多维卡公主，是一个传统的、保守的、注重礼仪的人。她希望茜茜能够变成一个标准的贵族公主。她希望茜茜能够嫁给一个有权有势的国王或者皇帝。她希望茜茜能够过上，荣华富贵的生活。","但茜茜，不想要这些。她想要的是自由。她想要的是爱情。她想要的是一个真正理解她、爱她的人。她和她的母亲经常因为这些事情吵架。她的母亲觉得她太任性太叛逆太不懂事。她觉得她的母亲太保守太虚伪太不理解她。","她们之间的关系，越来越紧张。茜茜十岁的时候发生了一件改变她一生的事情。那一年，她的曾外祖母，黑森-达姆施塔特的阿玛莉公主去世了。阿玛莉公主，在去世前把茜茜叫到了她的床前。","“孩子，”阿玛莉公主，用虚弱的声音说，“我要告诉你一个秘密。这个秘密，在我们家族里，已经传了好几代了。”","“什么秘密？”茜茜，好奇地问。","“你知道为什么我们家族的女人，眼睛都是紫色的吗？”阿玛莉公主问。","“不知道。”茜茜，摇了摇头。","“因为，”阿玛莉公主说，“我们的祖先，不是纯粹的欧洲人。我们的血脉里，流着一个来自东方的皇帝的血。”","“东方的皇帝？”茜茜，吃了一惊。","“对。”阿玛莉公主，点了点头，“那个皇帝，叫建文帝。他是中国明朝的第二位皇帝。四百多年前，他因为叔叔造反，国破家亡，流亡到了欧洲。他在欧洲，娶了一个拜占庭的公主。他们的后代，就是我们。”","“我们的紫色眼睛，就是从他那里，遗传下来的。”","茜茜，愣住了。她从来没有想过，她的身体里，竟然流着一个东方皇帝的血。","“那……”茜茜问，“那个建文帝，后来怎么样了？”","“他，”阿玛莉公主说，“在欧洲用了三十年的时间，写了一本神秘的书，叫《应文秘典》。这本书里，记载了东方的医学、天文学、数学、哲学、政治、历史。这本书里的知识，通过各种隐秘的渠道，已经在欧洲，传播了四百多年。”","“文艺复兴、宗教改革、科学革命、启蒙运动、工业革命，背后都有这本书的影子。”","“这本书的终极理想是天下大同。建文帝相信，人类的未来，是所有的民族，所有的国家，都成为一家人，没有战争没有仇恨，只有和平与合作。”","茜茜听着这个故事，感觉像是在听一个神话。但她知道，这不是神话。因为她的紫色眼睛，就是证明。","“孩子，”阿玛莉公主，从枕头底下，拿出了一个小盒子，递给茜茜，“这个是我留给你的。”","茜茜接过盒子打开了它。盒子里，是一本手抄本。手抄本的封面，是黑色的没有任何文字。","“这是……”茜茜，问。","“这是，”阿玛莉公主说，“《应文秘典》的抄本。这本书在我们家族里，已经传了好几代了。现在我把它传给你。”","“你要好好地守护它。”","“你要好好地研究它。”","“你要把它里面的知识，传播给更多的人。”","“你要帮助，建文帝的理想天下大同早日实现。”","说完阿玛莉公主，闭上了眼睛。她去世了，享年七十八岁。茜茜捧着那个小盒子眼泪流了下来。她知道她的一生，已经被改变了。她不再是，一个普通的贵族公主。","她是，建文帝的后裔。她是，《应文秘典》的守护者。她的使命，是传播知识，促进东西方文明的融合，帮助人类，实现天下大同。从那以后茜茜变了一个人。她不再是，那个只知道骑马和玩耍的小女孩了。","她开始认真地研究《应文秘典》。她学习了中文。她学习了历史。她学习了哲学。她学习了政治。她学习了经济。她学习了医学。她发现《应文秘典》里的知识，博大精深。","她发现她的祖先建文帝是一个伟大的思想家和政治家。她发现建文帝的理想天下大同是一个，值得用一生去追求的理想。她开始关注社会问题。她开始关注穷人的生活。她开始关注妇女的权利。她开始关注战争与和平。","她变成了一个，有思想、有理想、有担当的女人。但她也变成了一个，更加孤独、更加敏感、更加忧郁的女人。因为她觉得没有人真正地理解她。她的家人觉得她太奇怪太叛逆太不切实际。她的朋友觉得她太聪明太深刻太高不可攀。她的追求者觉得她太美丽太高贵太难以接近。","她觉得她就像是一只被关在笼子里的鸟。她渴望自由。她渴望爱情。她渴望一个真正理解她、爱她的人。她不知道那个人什么时候才会出现。"]},{"t":"第二十二章 · 朱宸的觉醒","ps":["1840年，维也纳一个普通的市民家庭。朱宸，出生了。他的父亲叫朱聿键，是一个底层的学者，靠给贵族家庭做家庭教师，维持生计。他的母亲叫玛丽亚，是一个奥地利的平民妇女，是一个裁缝。","朱宸，是家里的独子。他出生的时候，和普通的婴儿，没有什么两样。他有着黑色的头发，黄色的皮肤，黑色的眼睛。但他的眼睛，和普通的婴儿，不太一样。他的眼睛，是一种奇异的、淡淡的紫色。","不是黑色不是棕色，而是紫色。像紫水晶像紫罗兰，像黄昏时分的天空。他的父亲朱聿键看到他的紫色眼睛，欣慰地笑了。","“终于，”朱聿键喃喃地说，“终于又出现了。”","他的母亲玛丽亚好奇地问：“什么终于出现了？”","“没什么。”朱聿键摇了摇头，“只是我们家族的标志。”","他没有告诉玛丽亚，紫色眼睛的真正含义。因为他知道玛丽亚是一个普通的奥地利妇女。她不会理解，他们家族的秘密。她不会理解，他们家族的使命。他只是默默地把这个秘密，藏在了心里。","他决定等朱宸长大了再告诉他，这个秘密。朱宸从小就是一个与众不同的孩子。他聪明早慧记忆力惊人。他三岁的时候，就认识了几百个字。他五岁的时候，就能够阅读简单的书籍。他七岁的时候，就能够背诵，几十首诗歌。他十岁的时候，就已经掌握了，拉丁文、希腊文、法文、英文。","他的父亲朱聿键是他的启蒙老师。朱聿键教他读书教他写字教他历史教他哲学，教他数学教他科学。朱聿键发现朱宸对知识有着一种近乎贪婪的渴望。他总是不停地问问题。他总是不停地读书。他总是不停地思考。","朱聿键知道他的儿子，不是一个普通的孩子。他知道他的儿子，是被选中的人。他知道他的儿子将来会承担起，他们家族的使命。朱宸十岁的时候发生了一件改变他一生的事情。","那一年他的父亲朱聿键去世了。朱聿键是因为肺病去世的。他去世前把朱宸叫到了他的床前。","“孩子，”朱聿键用虚弱的声音说，“我要告诉你一个秘密。这个秘密，在我们家族里，已经传了十几代了。”","“什么秘密？”朱宸，好奇地问。","“你知道为什么你的眼睛，是紫色的吗？”朱聿键问。","“不知道。”朱宸，摇了摇头。","“因为，”朱聿键说，“我们的祖先，不是普通的人。我们的祖先，是中国明朝的第二位皇帝，建文帝朱允炆。”","“四百多年前，他因为叔叔朱棣造反，国破家亡，流亡到了欧洲。他在欧洲，娶了一个拜占庭的公主。他们的后代，就是我们。”","“我们的紫色眼睛，就是从他那里，遗传下来的。”","朱宸，愣住了。他从来没有想过，他的身体里，竟然流着一个中国皇帝的血。","“那……”朱宸问，“建文帝后来怎么样了？”","“他，”朱聿键说，“在欧洲用了三十年的时间，写了一本神秘的书，叫《应文秘典》。这本书里，记载了东方的医学、天文学、数学、哲学、政治、历史。这本书里的知识，通过各种隐秘的渠道，已经在欧洲，传播了四百多年。”","“文艺复兴、宗教改革、科学革命、启蒙运动、工业革命，背后都有这本书的影子。”","“这本书的终极理想是天下大同。建文帝相信，人类的未来，是所有的民族，所有的国家，都成为一家人，没有战争没有仇恨，只有和平与合作。”","朱宸听着这个故事，感觉像是在听一个神话。但他知道，这不是神话。因为他的紫色眼睛，就是证明。","“孩子，”朱聿键从枕头底下，拿出了一个小盒子，递给朱宸，“这个是我留给你的。”","朱宸接过盒子打开了它。盒子里，是一本手抄本。手抄本的封面，是黑色的没有任何文字。","“这是……”朱宸，问。","“这是，”朱聿键说，“《应文秘典》的原本。这本书在我们家族里，已经传了十几代了。现在我把它传给你。”","“你要好好地守护它。”","“你要好好地研究它。”","“你要把它里面的知识，传播给更多的人。”","“你要帮助，建文帝的理想天下大同早日实现。”","“还有，”朱聿键顿了顿继续说，“我们的故土中国现在正处于危难之中。英国已经对中国，发动了鸦片战争。中国会战败会被迫签订不平等条约。中国会陷入半殖民地半封建社会的深渊。”","“孩子你要记住你的根在中国。你的使命，不仅仅是传播知识，更是要帮助中国，重新崛起。”","“总有一天，你会回到中国。你会把你在欧洲学到的知识，带回中国。你会帮助中国，进行改革和现代化。你会帮助中国，重新成为，一个伟大的国家。”","说完朱聿键闭上了眼睛。他去世了，享年四十八岁。朱宸捧着那个小盒子眼泪流了下来。他知道他的一生，已经被改变了。他不再是，一个普通的奥地利男孩。他是，建文帝的后裔。","他是，《应文秘典》的守护者。他的使命，是传播知识，促进东西方文明的融合，帮助中国重新崛起，帮助人类，实现天下大同。从那以后朱宸变了一个人。他不再是，那个只知道读书和思考的小男孩了。","他开始认真地研究《应文秘典》。他学习了中文。他学习了中国历史。他学习了中国哲学。他学习了中国政治。他学习了中国经济。他学习了中国医学。他发现《应文秘典》里的知识，博大精深。","他发现他的祖先建文帝是一个伟大的思想家和政治家。他发现建文帝的理想天下大同是一个，值得用一生去追求的理想。他开始关注国际局势。他开始关注中国的命运。他开始关注战争与和平。他开始关注人类的未来。","他变成了一个，有思想、有理想、有担当的青年。但他也变成了一个，孤独的、敏感的、忧郁的青年。因为他觉得没有人真正地理解他。他的母亲玛丽亚是一个普通的奥地利妇女。她不会理解，他们家族的秘密。她不会理解，他们家族的使命。她只是希望朱宸能够找一份稳定的工作，过一个普通人的生活。","但朱宸，不想过普通人的生活。他想要做一些有意义的事情。他想要改变世界。他想要帮助人类，实现天下大同。他不知道，他的梦想什么时候，才能够实现。他只知道他要努力地学习努力地准备。","他相信总有一天他会回到中国。他相信总有一天他会把他学到的知识，带回中国。他相信总有一天他会帮助中国重新崛起。他相信总有一天人类会实现天下大同。1850年，朱宸十岁。","他站在维也纳的街头，看着来来往往的人群心里充满了对未来的憧憬和迷茫。他不知道他的未来，会是什么样子。他不知道，他什么时候，才能够回到中国。他不知道，他什么时候，才能够实现，他的梦想。","但他知道他要努力地走下去。因为他是建文帝的后裔。因为他是《应文秘典》的守护者。因为他的身上肩负着一个伟大的使命。他抬起头，看着远方的天空。天空是蓝色的。阳光是温暖的。风是轻柔的。","他相信未来会是美好的。他相信人类会实现天下大同。他相信他的梦想终有一天会实现。（第三卷·完）第四卷：万国伐夏（1850–1900）"]},{"t":"第二十三章 · 破译天书","ps":["1860年，维也纳朱宸的公寓。朱宸站在他的书房里，手里拿着那本黑色封面的手抄本，深吸了一口气。他今年二十岁，是维也纳大学的学生，主修历史和哲学。他穿着朴素的黑色外套，面容清瘦，眼神深邃。他的眼睛，是紫色的——一种奇异的、淡淡的紫色。","他的手里拿着的是那本《应文秘典》。这本书，他已经研究了十年了。十年前他的父亲朱聿键在去世前，把这本书，传给了他。并且告诉了他，他们家族的秘密。从那以后，他就开始，研究这本书。","但这本书用的是一种自创的加密文字。除非知道加密的规则否则永远不可能读懂。他的父亲，在去世前，没有来得及告诉他加密的规则。他的父亲，只是告诉他，加密的规则，在他们家族里，口耳相传。但他的父亲，在他十岁的时候，就去世了。他没有来得及，从父亲那里，学到加密的规则。","这十年来，他一直在试图破译，这本书的加密规则。他试了无数种方法。他试了替换法。他试了移位法。他试了维吉尼亚密码。他试了恩尼格玛密码。但都没有成功。","这本书的加密规则，比他想象的要复杂得多。但今天他忽然有了一个灵感。他想起了他的父亲，在去世前，曾经对他说过一句话。","“孩子，”他的父亲说，“这本书的加密规则，就在你的名字里。”","“我的名字？”朱宸当时疑惑地问。","“对。”他的父亲笑了笑，“你的名字朱宸。宸是帝王的意思。你的祖先建文帝是一个皇帝。他的加密规则，和皇帝有关。”","当时朱宸没有理解，他父亲的话。但今天他忽然理解了。皇帝，和什么有关？皇帝和年号有关。皇帝和庙号有关。皇帝和谥号有关。建文帝他的年号是建文。他的庙号是惠宗。他的谥号，是嗣天章道诚懿渊功观文扬武克仁笃孝让皇帝。","朱宸拿起笔在纸上写下了“建文”两个字。然后他把这两个字，转换成了数字。建是第几个字？文是第几个字？他用的是康熙字典的部首排序。建在康熙字典里，是第128个字。文在康熙字典里，是第67个字。","128，67。这两个数字，会是加密的钥匙吗？朱宸拿起那本《应文秘典》，翻到了第一页。第一页上，写满了神秘的符号。他用128和67，作为钥匙尝试着解密这些符号。","他用的是维吉尼亚密码的变种。128是第一个钥匙。67是第二个钥匙。两个钥匙交替使用。他一个符号，一个符号地解密。第一个符号解密后是“吾”。第二个符号解密后是“乃”。第三个符号解密后是“大”。第四个符号解密后是“明”。第五个符号解密后是“建”。第六个符号解密后是“文”。第七个符号解密后是“皇”。第八个符号解密后是“帝”。","“吾乃大明建文皇帝”。","朱宸看着这八个字手开始颤抖。他成功了。他破译了，这本书的加密规则。他的眼泪，流了下来。他知道他的祖先建文帝在四百多年前，用了三十年的时间，写下的这本书终于重见天日了。","那天晚上朱宸一夜没睡。他用了一整夜的时间，把这本书的第一部分，草药部分，全部解密了。他发现这本书里的知识，比他想象的还要博大精深。草药部分，记载了几百种草药的功效和用法。这些草药，有中国的有印度的有波斯的有阿拉伯的有欧洲的。每一种草药，都有详细的说明——产地、形态、性味、功效、用法。","这些知识，比当时欧洲的医学，要先进得多。朱宸被这些知识，深深地吸引了。他知道这本书将会改变人类的医学。但他也知道这本书不能公开。因为，这本书里，不仅有医学知识。还有天文学知识。还有数学知识。还有哲学知识。还有政治知识。还有历史知识。","这些知识有些在当时的欧洲，是颠覆性的。如果公开，会引起巨大的震动。而且这本书的作者，是建文帝。如果公开会暴露他们家族的秘密。他的祖先建文帝在这本书的最后，写下了遗训。","遗训里说：","“此书乃吾毕生心血。吾写此书非为扬名非为牟利，只为存华夏文脉，传后世有缘。”","“此书不可轻易示人。非我族类其心必异。若非我朱家血脉，不可传之。”","“若后世有我朱家子孙，能解此书，当以天下为己任，传播知识，促进东西方文明融合，帮助人类，实现天下大同。”","“若有外族得此书当以善意待之。不可用此书之知识行恶事害他人。”","“吾在天有灵，当护佑此书，护佑我朱家子孙，护佑天下苍生。”","“建文四年出逃，正统三年成书。应文绝笔。”","朱宸读完这段遗训，沉默了很久。他知道他的祖先建文帝是一个伟大的人。他知道他的使命，是沉重的。他知道他要做的事情，是艰难的。但他也知道他必须做下去。","因为他是建文帝的后裔。因为他是《应文秘典》的守护者。因为他的身上肩负着一个伟大的使命。从那以后朱宸开始系统地研究《应文秘典》。他用了五年的时间，把这本书，全部解密了。","他发现这本书分为六个部分。第一部分，草药。记载了几百种草药的功效和用法。第二部分，天文。记载了精确的星表和历法。第三部分，生物。记载了各种动物和植物的形态和习性。第四部分，宇宙。记载了建文帝对宇宙的理解。第五部分，制药。记载了各种药物的制作方法。第六部分，配方。记载了各种秘方——有治病的，有养生的，有炼金的。","这本书里的知识，博大精深。它包含了中国古代的科学技术。它包含了印度古代的科学技术。它包含了波斯古代的科学技术。它包含了阿拉伯古代的科学技术。它包含了欧洲古代的科学技术。","它，是东西方文明的结晶。朱宸被这本书里的知识，深深地震撼了。他知道他的祖先建文帝是一个超越了时代的人。他知道他的祖先的理想天下大同是一个伟大的理想。","他决定他要用他的一生去实现他的祖先的理想。他决定他要把这本书里的知识，传播给更多的人。他决定他要促进，东西方文明的融合。他决定他要帮助人类实现天下大同。","但他也知道这条路是艰难的。他知道他会遇到很多的困难和挫折。他知道他可能一辈子都看不到天下大同的实现。但他相信只要他努力地走下去。总有一天人类会实现天下大同。"]},{"t":"第二十四章 · 茜茜的婚礼","ps":["1854年4月24日维也纳奥古斯丁教堂。伊丽莎白·亚美莉·欧根妮，也就是茜茜，站在镜子前，看着镜中的自己，深吸了一口气。她今年十六岁，是巴伐利亚的马克西米利安·约瑟夫公爵的女儿。","她穿着一件华丽的白色婚纱。她的头上戴着一顶金色的王冠。她的脖子上戴着一串珍珠项链。她的手上戴着一副白色的手套。她美丽得，像是一个天使。但她的眼神里却没有新娘应有的喜悦。","只有迷茫和不安。因为她要嫁的人，是奥地利皇帝，弗朗茨·约瑟夫一世。她今年才十六岁。而他已经二十四岁了。他们才认识了不到一个月。她对他几乎一无所知。","她不知道，他是什么样的人。她不知道，他是不是真的爱她。她不知道她和他会不会幸福。她只知道她的母亲，卢多维卡公主，非常希望，她能够嫁给弗朗茨·约瑟夫一世。她只知道她的姐姐海伦娜本来是弗朗茨·约瑟夫一世的未婚妻。但弗朗茨·约瑟夫一世，在见到她之后，就改变了主意要娶她。她只知道这桩婚姻，是政治联姻。她只知道，她嫁给弗朗茨·约瑟夫一世之后，就会成为奥地利皇后。","她不知道，这对她来说是幸运还是不幸。茜茜，第一次见到弗朗茨·约瑟夫一世，是在1853年的夏天。那一年她十六岁。她的母亲，卢多维卡公主，带着她和她的姐姐海伦娜去了奥地利的伊舍尔。","在那里她们见到了奥地利皇帝，弗朗茨·约瑟夫一世。弗朗茨·约瑟夫一世是一个英俊的年轻人。他有着金色的头发，蓝色的眼睛，白皙的皮肤。他穿着一身，华丽的奥地利军装。他的气质高贵而又威严。","他本来是要和茜茜的姐姐海伦娜订婚的。但他在见到茜茜之后，就改变了主意。他被茜茜的美丽，深深地吸引了。茜茜有着金色的头发，紫色的眼睛，白皙的皮肤。她的美丽不是那种，标准的、贵族式的美丽。她的美丽是那种自然的、野性的、自由的美丽。","她像是一只从森林里飞出来的精灵。她像是一朵在山谷里盛开的野花。她像是一阵从湖面上吹过的清风。弗朗茨·约瑟夫一世，从来没有见过，这样的女孩。他，一见钟情。","他当场就宣布，他要娶茜茜。茜茜当时愣住了。她没有想到奥地利皇帝，会选择她。她没有想到她的人生会因为这一次见面，而彻底改变。她的母亲，卢多维卡公主，非常高兴。她的姐姐海伦娜非常失落。而她自己却不知道该高兴还是该难过。","她只知道，从那以后，她的人生，就不再是她自己的了。婚礼在奥古斯丁教堂举行。教堂里挤满了奥地利的贵族和官员。他们都穿着华丽的礼服。他们都带着好奇的、羡慕的、嫉妒的眼神。","教堂的外面挤满了维也纳的市民。他们都想看一看，他们的新皇后。他们都在欢呼，都在庆祝。但茜茜站在教堂里却感觉自己像是一个，被展示的物品。她感觉所有人都在看着她。她感觉所有人都在评价她。她感觉她的每一个动作，每一个表情，每一句话都被放大了 scrutinize了。","她感觉，窒息。她想要逃跑。她想要回到巴伐利亚的森林里。她想要回到那个自由自在的小女孩的生活。但她知道，她不能。因为她已经是奥地利皇后了。因为她的人生已经被注定了。","婚礼，结束了。茜茜成为了奥地利皇后。她搬进了，维也纳的霍夫堡宫。霍夫堡宫，是奥地利皇帝的皇宫。它华丽宏伟壮观。但它也冰冷刻板压抑。茜茜住在霍夫堡宫里感觉自己像是一只，被关在笼子里的鸟。","宫廷里的生活充满了繁文缛节。她每天都要按照严格的时间表起床穿衣，吃饭会客休息。她的每一个动作都要符合宫廷的礼仪。她的每一句话都要符合皇后的身份。","她不能随心所欲地做她想做的事情。她不能自由自在地去她想去的地方。她不能无拘无束地说她想说的话。她感觉她的自我正在一点点地消失。她感觉她不再是茜茜了。她只是奥地利皇后。","她开始怀念巴伐利亚的生活。她开始怀念她的父亲她的母亲，她的兄弟姐妹。她开始怀念森林湖泊骑马旅行。她开始变得忧郁孤独敏感。她和弗朗茨·约瑟夫一世的关系也开始变得紧张。","弗朗茨·约瑟夫一世是一个传统的、保守的、刻板的人。他热爱他的工作他的军队他的帝国。他不理解茜茜的自由的、浪漫的、感性的灵魂。他觉得茜茜太任性太叛逆太不懂事。他觉得茜茜应该做一个标准的、完美的皇后。","而茜茜觉得弗朗茨·约瑟夫一世太刻板，太冷漠太不理解她。她觉得弗朗茨·约瑟夫一世爱的只是她的美貌，而不是她的灵魂。她觉得她和弗朗茨·约瑟夫一世之间，有一道无法逾越的鸿沟。","他们开始吵架。他们开始冷战。他们开始疏远。茜茜开始频繁地离开维也纳。她去了匈牙利，去了意大利，去了瑞士去了希腊。她在旅行中寻找自由和自我。但她知道，无论她走到哪里她都逃不出她的身份。她知道无论她走到哪里她都是奥地利皇后。","她感觉她的人生是一个悲剧。但茜茜不知道在她的人生中有一个神秘的人，正在悄悄地接近她。那个人，叫朱宸。朱宸今年二十岁，是维也纳大学的学生。他是建文帝的后裔。他是《应文秘典》的守护者。","他一直在关注着茜茜。因为他发现茜茜的眼睛，也是紫色的。因为他怀疑茜茜也是建文帝的后裔。因为他想要找到他的同族。他一直在寻找机会接近茜茜。他知道茜茜是奥地利皇后。他知道接近她不是一件容易的事情。","但他相信，总有一天他会见到她。他相信总有一天他会告诉她他们家族的秘密。他相信总有一天他们会一起实现建文帝的理想天下大同。"]},{"t":"第二十五章 · 双脉相认","ps":["1855年，维也纳霍夫堡宫，皇家图书馆。茜茜站在图书馆的书架前，手里拿着一本书，心不在焉地翻看着。她今年十八岁，是奥地利皇后。她穿着一件简单的白色长裙。她的头发随意地披在肩上。她的脸上没有化妆。她的眼神里充满了忧郁和迷茫。","她不喜欢，宫廷里的宴会和舞会。她不喜欢，和那些虚伪的、做作的贵族们打交道。她喜欢一个人静静地待在图书馆里读书。图书馆是霍夫堡宫里她唯一能够感到自由的地方。","在这里没有人会盯着她看。在这里没有人会评价她的一举一动。在这里她可以做她自己。她喜欢历史书。她喜欢哲学书。她喜欢诗歌。她喜欢旅行记。她通过读书来了解这个世界。她通过读书来寻找生命的意义。","但今天她在读的是一本很奇怪的书。这本书的封面，是黑色的没有任何文字。这本书的内容是一种她从来没有见过的文字。这本书的插图画的是各种奇怪的草药，星星动物植物。","她不知道这本书是什么书。她不知道这本书是谁写的。她不知道这本书是什么时候被放进皇家图书馆的。她只是在今天偶然地在书架的最深处，发现了这本书。她被这本书，深深地吸引了。","她觉得这本书里藏着一个巨大的秘密。她觉得这本书和她有一种神秘的联系。她不知道为什么她会有这种感觉。她只是觉得这本书很熟悉。就像是她曾经在哪里见过它一样。","“皇后殿下。”","一个声音，从身后传来。茜茜回过头看见一个年轻的男人，站在图书馆的门口。他大约二十岁，中等身材穿着一身，简单的黑色外套。他有着黑色的头发，黄色的皮肤，黑色的眼睛。但他的眼睛，是紫色的——一种奇异的、淡淡的紫色。","茜茜看到他的紫色眼睛，吃了一惊。因为她的眼睛，也是紫色的。她从来没有见过，除了她家族的人之外，还有紫色眼睛的人。","“你是谁？”茜茜，问。","“我叫朱宸。”那个年轻人，微微鞠躬，“我是维也纳大学的学生。我今天是来皇家图书馆，查资料的。”","“朱宸……”茜茜重复着这个名字，“你是……中国人？”","“是的皇后殿下。”朱宸点了点头，“我的祖先，来自中国。我是中国明朝皇室的后裔。”","“明朝皇室的后裔？”茜茜吃了一惊，“明朝？我听说中国现在是清朝，不是明朝。”","“是的皇后殿下。”朱宸说，“明朝在两百多年前，就被清朝推翻了。我的祖先，在明朝灭亡的时候，逃到了欧洲。我们家族在欧洲已经生活了两百多年了。”","茜茜看着朱宸，看着他紫色的眼睛忽然有一种奇异的感觉。她觉得她和这个年轻人之间有一种神秘的联系。","“你的眼睛……”茜茜指了指自己的眼睛，“也是紫色的。”","“是的皇后殿下。”朱宸点了点头，“紫色的眼睛，是我们家族的标志。”","“我们家族？”茜茜疑惑地问，“什么意思？”","朱宸，沉默了一会儿。然后他说：“皇后殿下，我能问您一个问题吗？”","“什么问题？”","“您的曾外祖母，是不是，黑森-达姆施塔特的阿玛莉公主？”","茜茜，吃了一惊。","“你怎么知道？”她问。","“因为，”朱宸说，“阿玛莉公主也是我们家族的人。”","“什么？”茜茜瞪大了眼睛，“你是说……”","“是的皇后殿下。”朱宸点了点头，“您的血脉里也流着我们家族的血。您的紫色眼睛，就是证明。”","“我们的祖先，是同一个人。他叫建文帝朱允炆。他是中国明朝的第二位皇帝。四百多年前，他因为叔叔造反，国破家亡，流亡到了欧洲。他在欧洲，娶了一个拜占庭的公主。他们的后代，就是我们。”","茜茜，愣住了。她从来没有想过，她的身体里，竟然流着一个中国皇帝的血。她想起了她的曾外祖母，阿玛莉公主，在去世前，告诉她的那个秘密。她想起了阿玛莉公主，留给她的那本，黑色封面的手抄本。她想起了阿玛莉公主，对她说的话：“你要好好地守护它。你要好好地研究它。你要把它里面的知识，传播给更多的人。”","她一直以为那只是一个老人的胡言乱语。她一直以为那本手抄本只是一本普通的旧书。她一直以为她的紫色眼睛只是一个遗传的变异。但现在，她知道了。那不是胡言乱语。那不是普通的旧书。那不是遗传的变异。","那是一个伟大的秘密。那是一本伟大的著作。那是一个伟大的使命。","“那本书……”茜茜喃喃地说，“《应文秘典》……”","“您也有一本？”朱宸，吃了一惊。","“是的。”茜茜点了点头，“我的曾外祖母，在去世前，留给了我一本。她说那是《应文秘典》的抄本。”","“原来如此。”朱宸欣慰地笑了，“皇后殿下我们是同族。”","茜茜看着朱宸，看着他紫色的眼睛眼泪流了下来。她终于找到了一个真正理解她的人。她终于找到了一个和她有同样血脉的人。她终于找到了一个和她有同样使命的人。","她不再是，孤独的了。从那以后，朱宸和茜茜开始秘密地见面。他们在皇家图书馆里见面。他们在维也纳的郊外见面。他们在茜茜的私人公寓里见面。他们一起研究《应文秘典》。朱宸已经把这本书，全部解密了。他把书里的内容，讲解给茜茜听。","茜茜被书里的知识，深深地吸引了。她发现这本书里的知识，博大精深。她发现她的祖先建文帝是一个伟大的思想家和政治家。她发现建文帝的理想天下大同是一个，值得用一生去追求的理想。","她开始认真地学习中文。她开始认真地学习中国历史。她开始认真地学习中国哲学。她开始认真地学习中国政治。她发现
