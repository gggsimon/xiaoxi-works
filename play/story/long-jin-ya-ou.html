她的灵魂和中国有一种神秘的联系。她发现她的思想和中国的哲学有一种深刻的共鸣。她发现她的理想和建文帝的理想有一种强烈的契合。","她开始关注社会问题。她开始关注穷人的生活。她开始关注妇女的权利。她开始关注战争与和平。她开始关注中国的命运。她变成了一个，有思想、有理想、有担当的女人。","她和朱宸，之间的关系也变得越来越亲密。他们是同族。他们是同志。他们是知己。他们一起讨论《应文秘典》里的知识。他们一起讨论人类的未来。他们一起讨论天下大同的理想。","他们互相理解互相支持互相鼓励。茜茜觉得她的人生终于有了意义。她觉得她不再是一个被关在笼子里的鸟。她觉得她是一个有使命的人。但她也知道，她和朱宸，之间的关系不能被任何人知道。","因为她是奥地利皇后。因为朱宸是一个普通的平民。因为他们的关系，如果被人知道会引起巨大的丑闻。所以他们只能秘密地见面。所以他们只能秘密地交流。所以他们只能秘密地一起为了天下大同的理想而努力。","但他们相信，总有一天，他们的努力，会有回报。他们相信总有一天人类会实现天下大同。他们相信总有一天，他们的名字会被历史记住。"]},{"t":"第二十六章 · 普奥战争","ps":["1866年，维也纳霍夫堡宫。弗朗茨·约瑟夫一世，站在他的书房里，手里拿着一份电报脸色铁青。电报里说，普鲁士军队，在萨多瓦战役中，大败奥地利军队。","奥地利军队，伤亡了四万多人。普鲁士军队，只伤亡了一万多人。这是奥地利历史上最惨重的失败之一。弗朗茨·约瑟夫一世知道这场战争奥地利输了。他知道奥地利将被排除出德意志。他知道普鲁士将成为德意志的霸主。他知道哈布斯堡家族的霸权将一去不复返。","他感到愤怒屈辱绝望。他不知道，他该怎么办。茜茜站在他的身边看着他心里充满了复杂的感情。她今年二十九岁，是奥地利皇后。她穿着一件简单的黑色长裙。她的头发盘成了一个简单的发髻。她的脸上没有化妆。她的眼神里充满了平静和深邃。","这几年，她变了很多。她不再是，那个，忧郁的、迷茫的、小女孩了。她变成了一个，成熟的、睿智的、有担当的女人。她和朱宸一起研究《应文秘典》已经十一年了。在这十一年里，她学到了很多的知识。在这十一年里，她明白了很多的道理。在这十一年里，她找到了她的人生意义。","她知道这场战争，对奥地利来说是一个巨大的打击。但她也知道，这场战争，对欧洲来说可能是一个新的开始。因为她的祖先建文帝在《应文秘典》里，曾经预言过。","建文帝说欧洲将会经历，一系列的战争。这些战争将会打破旧的秩序。这些战争将会建立新的秩序。这些战争将会促进欧洲的统一。这些战争将会促进人类的融合。","建文帝说战争是痛苦的。但战争也是必要的。因为只有打破旧的秩序才能建立新的秩序。因为只有经历了战争的痛苦才能珍惜和平的珍贵。建文帝说最终人类会实现天下大同。但在那之前人类必须经历一系列的战争和苦难。","茜茜相信建文帝的预言。她知道普奥战争只是一个开始。她知道以后还会有更多的战争。她知道人类还会经历，更多的苦难。但她也相信，总有一天人类会实现天下大同。她也相信总有一天战争会从地球上消失。她也相信总有一天人类会永远地和平共处。","“陛下，”茜茜轻声说，“战争已经结束了。我们应该考虑战后的安排了。”","弗朗茨·约瑟夫一世回过头看着茜茜，眼神里充满了疲惫和无奈。","“战后的安排？”他苦笑了一下，“我们输了。我们能有什么安排？”","“陛下，”茜茜说，“输了战争不等于输了一切。奥地利虽然被排除出了德意志。但奥地利还有匈牙利捷克斯洛伐克克罗地亚，塞尔维亚意大利等等大片的领土。奥地利还是一个强大的帝国。”","“我们应该利用这次战败的机会进行改革。我们应该给予匈牙利更多的自治权。我们应该建立一个二元的帝国。我们应该让各个民族都有更多的话语权。”","“只有这样奥地利才能稳定。只有这样奥地利才能强大。只有这样奥地利才能在未来的欧洲，占有一席之地。”","弗朗茨·约瑟夫一世，看着茜茜愣住了。他从来没有想过茜茜会说出这样的话。在他的印象里茜茜只是一个喜欢骑马和旅行的，任性的、叛逆的、不懂事的女孩。但现在他发现他错了。","茜茜不是一个不懂事的女孩。她是一个有思想、有远见、有政治智慧的女人。他看着茜茜，看着她紫色的眼睛忽然觉得他好像从来没有，真正地了解过她。","“你……”弗朗茨·约瑟夫一世，喃喃地说，“你怎么会想到这些？”","茜茜，沉默了一会儿。然后她说：“陛下我读过很多的书。我从书里学到了很多的东西。”她没有告诉弗朗茨·约瑟夫一世，关于《应文秘典》的秘密。她没有告诉弗朗茨·约瑟夫一世，关于建文帝的秘密。她没有告诉弗朗茨·约瑟夫一世，关于朱宸的秘密。","因为她知道这些秘密不能被任何人知道。因为她知道这些秘密只会引起更多的麻烦。她只是用她自己的方式帮助弗朗茨·约瑟夫一世。她只是用她自己的方式帮助奥地利。她只是用她自己的方式帮助人类朝着，天下大同的方向前进。","1867年，奥地利帝国改组为奥匈帝国。弗朗茨·约瑟夫一世成为了奥匈帝国的皇帝。茜茜成为了奥匈帝国的皇后。奥匈帝国是一个二元的帝国。奥地利和匈牙利各自有自己的议会和政府。它们共同拥有一个皇帝，一个外交部，一个国防部。","这个改革，在一定程度上缓解了奥地利和匈牙利之间的矛盾。但它没有从根本上解决奥匈帝国的民族问题。奥匈帝国是一个多民族的帝国。它的境内有德意志人、匈牙利人、捷克人斯洛伐克人波兰人乌克兰人，罗马尼亚人，克罗地亚人，塞尔维亚人，斯洛文尼亚人，意大利人等等十几个民族。","这些民族都有自己的语言，自己的文化，自己的历史，自己的诉求。它们都希望获得更多的自治权甚至独立。奥匈帝国就像是一个拼凑起来的巨大的脆弱的拼图。它随时都可能因为一块拼图的脱落而分崩离析。","茜茜知道奥匈帝国的问题很严重。她知道奥匈帝国迟早会解体。她知道这是历史的必然。因为她的祖先建文帝在《应文秘典》里，曾经说过。建文帝说，多民族的帝国，是不稳定的。因为不同的民族，有不同的文化，不同的利益，不同的诉求。它们很难长期地和平共处。它们迟早会因为各种矛盾而分裂。","建文帝说，真正的稳定不是靠武力把不同的民族，强行地拼凑在一起。真正的稳定是靠文化把不同的民族自然地融合在一起。真正的稳定是天下大同。茜茜相信建文帝的话。","她知道奥匈帝国迟早会解体。她知道这是不可避免的。但她也知道，在奥匈帝国解体之前她可以做一些事情。她可以促进各个民族之间的理解和交流。她可以促进各个民族之间的文化融合。她可以为未来的欧洲统一，打下基础。","她决定她要用她的余生，去做这些事情。她相信她的努力不会白费。她相信总有一天欧洲会统一。她相信总有一天人类会实现天下大同。"]},{"t":"第二十七章 · 远东的炮声","ps":["1894年，维也纳茜茜的私人公寓。茜茜站在窗前，手里拿着一份报纸手在颤抖。报纸的头条，是：甲午中日战争，大清帝国惨败。报纸里说日本军队，在平壤战役中，大败清朝军队。报纸里说日本海军，在黄海海战中，大败清朝北洋水师。报纸里说日本军队已经攻入了中国的辽东半岛。报纸里说清朝政府已经被迫向日本求和。","茜茜看着这些文字眼泪流了下来。她今年五十七岁，是奥匈帝国的皇后。她穿着一件简单的白色长裙。她的头发已经有了几根白发。她的脸上有了几道皱纹。但她的眼神依然深邃而充满了感情。","她的身体里流着中国皇帝的血。她的祖先建文帝是中国明朝的第二位皇帝。她的根在中国。虽然她从来没有去过中国。虽然她从来没有见过她的中国亲人。虽然她从来没有体验过中国的生活。","但她对中国有一种深厚的神秘的感情。她觉得中国是她的故土。她觉得中国人民，是她的同胞。她觉得中国的命运和她息息相关。现在她的故土正在遭受日本的侵略。现在她的同胞正在遭受战争的苦难。现在她的国家正在走向衰落和屈辱。","她感到痛苦愤怒绝望。她不知道，她能做什么。","“皇后殿下。”","一个声音，从身后传来。茜茜回过头看见朱宸，站在公寓的门口。朱宸今年五十四岁。他穿着一身，简单的黑色外套。他的头发已经全白了。他的脸上有了很多的皱纹。但他的眼神依然锐利而充满了智慧。","他的手里，也拿着一份报纸。他的脸上充满了悲痛和愤怒。","“朱宸……”茜茜哽咽着说，“你看到了吗？”","“看到了。”朱宸点了点头，“甲午战争大清输了。”","“为什么……”茜茜喃喃地说，“为什么中国会变成现在这个样子？”","朱宸，沉默了很久。然后他说：“皇后殿下这是历史的必然。”","“历史的必然？”茜茜，疑惑地问。","“是的。”朱宸点了点头，“中国已经闭关锁国，两百多年了。在这两百多年里欧洲经历了文艺复兴、宗教改革、科学革命、启蒙运动、工业革命。欧洲已经从一个落后的、分裂的、农业的大陆，变成了一个先进的、统一的、工业的大陆。”","“而中国在这两百多年里停滞了。中国的政府是一个腐朽的、专制的、无能的政府。中国的经济是一个落后的、停滞的、农业的经济。中国的军队是一支装备落后、训练无素、战斗力低下的军队。中国的文化是一个保守的、僵化的、排外的文化。中国的科技是一个停滞的、落后的、没有创新的科技。”","“这样的中国，怎么可能打败已经经过了明治维新，全面西化的日本？”","“甲午战争的失败不是偶然的。它是必然的。它是中国两百多年来，停滞和落后的总爆发。”","茜茜听着朱宸的话眼泪流得更厉害了。","“那……”她问，“中国还有救吗？”","“有。”朱宸坚定地说，“中国还有救。”","“为什么？”","“因为中国有五千年的文明。”朱宸说，“中国的文明，是世界上，最古老、最连续、最深厚的文明。这样的文明有强大的生命力和强大的恢复力。它可能会暂时地衰落。但它不会永远地衰落。它迟早会重新崛起。”","“而且中国有四万万人民。”朱宸继续说，“四万万人民，是世界上，最大的人口群体。这样的人口群体有巨大的潜力和巨大的能量。只要他们被唤醒了被组织起来了他们，就能创造出巨大的奇迹。”","“而且中国有我们。”朱宸看着茜茜说，“我们是建文帝的后裔。我们的祖先，把中国的文明，带到了欧洲。现在是时候把欧洲的文明，带回中国了。”","“我们可以把我们在欧洲学到的知识，带回中国。我们可以帮助中国，进行改革和现代化。我们可以帮助中国重新崛起。”","茜茜看着朱宸，看着他紫色的眼睛忽然觉得心里充满了希望。她知道朱宸说得对。她知道中国还有救。她知道他们可以为中国做一些事情。","“朱宸，”茜茜说，“我们回中国吧。”","“回中国？”朱宸，吃了一惊。","“是的。”茜茜点了点头，“我们回中国。我们把我们学到的知识，带回中国。我们帮助中国，进行改革和现代化。我们帮助中国重新崛起。”","朱宸看着茜茜，沉默了很久。然后他说：“皇后殿下您是奥匈帝国的皇后。您不能轻易地离开奥地利。”","“我知道。”茜茜说，“但我可以以旅行的名义去中国。我可以以考察东方文明的名义去中国。我可以在那里待一段时间。我可以在那里做一些事情。”","“而且，”茜茜顿了顿继续说，“我已经厌倦了宫廷里的生活。我已经厌倦了那些繁文缛节。我已经厌倦了那些虚伪的贵族。我想要做一些有意义的事情。我想要为我的故土，做一些事情。我想要在我的有生之年看到中国重新崛起。”","朱宸看着茜茜，看着她坚定的眼神，欣慰地笑了。","“好。”他说，“皇后殿下我们一起回中国。”","但茜茜最终没有能够去成中国。因为1898年，她在日内瓦被一个意大利的无政府主义者刺杀了。她去世的时候只有六十岁。她到死都没有能够回到她的故土中国。","她到死都没有能够看到中国重新崛起。但她在去世前，把她的那本，《应文秘典》的抄本和一封信交给了她的侍女。信里，只有一句话：","“把它交给那个能读懂它的人。”","那个能读懂它的人就是朱宸。朱宸收到了茜茜的遗物和那封信。他捧着那本《应文秘典》的抄本眼泪流了下来。他知道茜茜的遗愿是回到中国。他知道茜茜的遗愿是帮助中国重新崛起。他知道茜茜的遗愿是实现天下大同。","他决定他要替茜茜、完成、她的遗愿。他决定他要回到中国。他决定他要把他学到的知识，带回中国。他决定他要帮助中国重新崛起。他决定他要实现天下大同。1900年，朱宸以奥匈帝国翻译官的身份跟随八国联军来到了中国。","他终于回到了他的故土。但他回到故土的方式却是以一个侵略者的翻译官的身份。他感到痛苦屈辱矛盾。但他知道这是唯一的能够回到中国的方式。他知道这是唯一的能够为中国做一些事情的方式。他知道这是唯一的能够实现茜茜的遗愿的方式。","他决定他要在中国待下来。他决定他要在中国做一些有意义的事情。他决定他要在中国实现他的和茜茜的，和建文帝的理想。"]},{"t":"第二十八章 · 八国联军","ps":["1900年8月14日，北京。朱宸站在北京的城墙上看着八国联军的军队，攻入了北京城。他今年六十岁，是奥匈帝国军队的翻译官。他穿着一身，奥匈帝国的军装。他的头发已经全白了。他的脸上有了很多的皱纹。但他的眼神依然锐利而充满了复杂的感情。","他的身边站着奥匈帝国的军官和士兵。他们都在兴奋地看着北京城。他们都在期待着进城之后的抢劫和掠夺。但朱宸没有兴奋。他只有痛苦、屈辱、愤怒。因为北京是他的故土。因为北京是他的祖先建文帝曾经生活过的地方。因为北京是他的同胞，中国人民，生活的地方。","现在这座城市正在被八国联军攻入。现在这座城市正在被八国联军抢劫和掠夺。现在这座城市正在遭受战争的苦难。他感到他的心里在流血。他想要阻止这一切。但他知道他阻止不了。","他只是一个普通的翻译官。他没有权力去阻止八国联军的侵略。他没有权力去阻止八国联军的抢劫。他没有权力去阻止八国联军的杀戮。他只能眼睁睁地看着这一切发生。","他只能默默地祈祷他的同胞能够少受一些苦难。八国联军攻入了北京城。他们在城里烧杀抢掠无恶不作。他们抢劫了皇宫颐和园王公大臣的府邸。他们掠夺了无数的金银财宝文物古董。他们烧毁了无数的房屋和建筑。他们杀害了无数的无辜的平民。","北京变成了一座人间地狱。朱宸跟随着奥匈帝国的军队进入了北京城。他亲眼看到了战争的残酷。他亲眼看到了侵略者的残暴。他亲眼看到了中国人民的苦难。他的心里充满了痛苦和愤怒。","但他，什么也做不了。他只能默默地跟随着军队。他只能默默地记录着这一切。他只能默默地祈祷这一切能够尽快地结束。8月16日，八国联军攻入了紫禁城。朱宸跟随着奥匈帝国的军官进入了紫禁城。","紫禁城是明清两代的皇宫。它宏伟壮丽壮观。它是中国古代建筑的巅峰之作。它是中国古代文明的象征。但现在这座宏伟的宫殿正在被八国联军占领。八国联军的军官和士兵，在紫禁城里到处乱跑。他们好奇地看着这座东方的宫殿。他们贪婪地盯着宫殿里的文物和财宝。他们随意地触摸和拿走宫殿里的物品。","朱宸走在紫禁城的宫殿里心里充满了复杂的感情。他的祖先建文帝曾经在这座宫殿里生活过。他的祖先建文帝曾经在这座宫殿里，做过皇帝。他的祖先建文帝曾经在这座宫殿里经历了，国破家亡的痛苦。","现在他回到了这座宫殿。但他是以一个侵略者的翻译官的身份，回到了这座宫殿。他感到讽刺屈辱痛苦。他走到了奉天殿也就是太和殿的面前。太和殿是紫禁城里，最大的宫殿。它是皇帝举行重大典礼的地方。它是中国古代皇权的象征。","朱宸站在太和殿的台阶上看着这座宏伟的宫殿，眼泪流了下来。他想起了他的祖先建文帝。他想起了建文帝在1402年，站在这座宫殿里看着燕军攻入了南京城。他想起了建文帝在大火中，假死出逃，流亡到了欧洲。他想起了建文帝在欧洲用了三十年的时间，写了《应文秘典》。他想起了建文帝的理想天下大同。","五百年了。五百年前他的祖先从这座宫殿里，逃了出去。五百年后他回到了这座宫殿。但五百年前，他的祖先逃出去是为了保存华夏的文脉。五百年后他回来却是跟着侵略者、回来、掠夺华夏的文明。","这是多么讽刺的一个轮回啊。朱宸站在太和殿的台阶上对着这座宏伟的宫殿，深深地鞠了一躬。他在心里默默地说：","“祖先我回来了。”","“我对不起您。”","“我没有能够保护好我们的故土。”","“我没有能够保护好我们的文明。”","“但我向您保证我会用我的余生去弥补这一切。”","“我会把我在欧洲学到的知识全部带回中国。”","“我会帮助中国，进行改革和现代化。”","“我会帮助中国重新崛起。”","“我会实现您的理想天下大同。”","“祖先请您保佑我。”","“祖先请您保佑中国。”","“祖先请您保佑天下苍生。”"]},{"t":"第二十九章 · 北京的灰烬","ps":["1900年8月28日北京翰林院。朱宸站在翰林院的废墟上手里拿着半本，烧焦的《永乐大典》手在颤抖。翰林院是中国古代最高的学术机构。它收藏了无数的珍贵的书籍和文献。其中就包括《永乐大典》的副本。","《永乐大典》，是中国古代最大的类书。它编纂于明朝永乐年间。它全书有一万一千多册，三亿七千多万字。它收录了中国古代、七八千种、典籍。它是中国古代文明的集大成之作。","但现在翰林院被八国联军烧毁了。《永乐大典》的副本大部分被烧毁了。剩下的一小部分被八国联军劫掠走了。朱宸站在翰林院的废墟上看着满地的，灰烬和残书、眼泪、流了下来。","他的手里拿着的那半本烧焦的《永乐大典》，是他在废墟里找到的。它已经被烧得面目全非了。它的大部分页面已经被烧掉了。只剩下最后的几十页还勉强能够辨认。","朱宸轻轻地抚摸着那半本烧焦的《永乐大典》，心里充满了痛苦和绝望。他想起了他的祖先建文帝。他想起了建文帝在出逃的时候带走了，《永乐大典》的初稿秘篇。他想起了建文帝在欧洲用了三十年的时间，把《永乐大典》的知识融入了《应文秘典》。他想起了《应文秘典》在欧洲传播了，四百多年催生了文艺复兴、宗教改革、科学革命、启蒙运动、工业革命。","欧洲因为《永乐大典》的知识变得强大了。而中国《永乐大典》的原本却被烧毁了被劫掠走了。最讽刺的是烧毁和劫掠，《永乐大典》的正是那些因为《永乐大典》的，知识而变得强大的欧洲人。","这是多么讽刺的一个历史闭环啊。朱宸站在翰林院的废墟上看着手里的，那半本烧焦的《永乐大典》忽然笑了。他的笑声很凄凉很痛苦很绝望。他笑历史的讽刺。他笑人类的愚蠢。他笑文明的脆弱。","他笑了很久，很久。然后他从怀里拿出了那本《应文秘典》。那本他的祖先建文帝用了三十年的时间，写的神秘的书。那本在欧洲传播了四百多年改变了整个欧洲的书。那本他守护了一辈子的书。","他把《应文秘典》和那半本烧焦的《永乐大典》放在了一起。两本书一本是完整的保存完好的来自欧洲的，《应文秘典》。一本是残缺的被烧焦的来自中国的《永乐大典》。","它们放在一起就像是两个久别重逢的兄弟。它们放在一起就像是两个文明的象征。它们放在一起就像是五百年的历史在这一刻闭环了。朱宸看着这两本书、眼泪、流了下来。","他在心里默默地说：","“五百年了。”","“五百年前您带着《永乐大典》的知识逃到了欧洲。”","“五百年后我带着《应文秘典》回到了中国。”","“五百年前您把华夏的文脉藏在了欧洲。”","“五百年后我把欧洲的文明带回了中国。”","“五百年的分离五百年的漂泊五百年的等待。”","“今天终于重逢了。”","“祖先您放心。”","“我会把这两本书都好好地守护起来。”","“我会把这两本书里的知识都传播给更多的人。”","“我会用这两本书里的知识帮助中国重新崛起。”","“我会用这两本书里的知识帮助人类实现天下大同。”","“祖先请您保佑我。”","“祖先请您保佑中国。”","“祖先请您保佑天下苍生。”","1901年9月7日，《辛丑条约》签订。清朝政府被迫向八国联军赔偿四亿五千万两白银。清朝政府被迫允许各国在北京东交民巷设立使馆区。清朝政府被迫允许各国在北京到山海关沿线驻军。清朝政府被迫拆毁大沽炮台。清朝政府被迫永远禁止中国人民成立，或参加反帝组织。","《辛丑条约》，是中国近代史上，最屈辱的不平等条约。它标志着中国完全沦为了半殖民地半封建社会。朱宸看着《辛丑条约》的文本心里充满了痛苦和愤怒。他知道中国已经到了最危险的时候。他知道中国已经到了最黑暗的时候。他知道中国已经到了必须改变的时候。","他决定他要留在中国。他决定他要辞去奥匈帝国的职务。他决定他要用他的余生去帮助中国进行改革和现代化。他决定他要用他的余生去帮助中国重新崛起。他相信中国不会永远地衰落下去。他相信中国迟早会重新崛起。他相信总有一天中国会再次成为一个伟大的国家。","他愿意用他的余生去等待那一天的到来。他愿意用他的余生去为那一天的到来做一些事情。他愿意用他的余生去实现他的祖先建文帝，的理想天下大同。（第四卷·完）","第五卷：龙烬归华（1900–1911）"]},{"t":"第三十章 · 茜茜之死","ps":["1898年9月10日日内瓦湖畔。茜茜站在日内瓦湖的岸边看着湖面上的，波光心里充满了平静。她今年六十岁，是奥匈帝国的皇后。她穿着一件简单的白色的连衣裙。她的头发已经有了很多的白发。她的脸上有了很多的皱纹。但她的眼神依然深邃而充满了智慧。","这一年，她已经在欧洲旅行了很多年。她离开了维也纳离开了霍夫堡宫离开了，那些繁文缛节。她在欧洲各地旅行寻找自由和自我。她去过了匈牙利去过了意大利去过了，瑞士去过了希腊。她在旅行中看到了不同的风景不同的，文化不同的人民。她在旅行中学到了很多的知识很多的，道理很多的智慧。","她觉得她的人生终于有了意义。她觉得她不再是一个被关在笼子里的鸟。她觉得她是一个自由的人。但她也知道她的生命已经快要走到尽头了。她已经六十岁了。她的身体已经不如以前了。她知道她可能没有太多的时间了。","她有一个最大的遗憾。那就是她从来没有能够回到她的故土中国。她的身体里流着中国皇帝的血。她的祖先建文帝是中国明朝的第二位皇帝。她的根在中国。她一直想要回到中国。她一直想要看看她的故土。她一直想要看看她的同胞。","但她一直没有能够成行。因为她是奥匈帝国的皇后。因为她的身份不允许她轻易地离开欧洲。因为各种原因她一直拖延着她的中国之行。现在她已经六十岁了。她不知道她还有没有机会回到中国。","她站在日内瓦湖的岸边看着湖面上的，波光心里默默地祈祷。她祈祷她能够有机会回到中国。她祈祷她能够有机会看看她的故土。她祈祷她能够有机会为她的故土、做一些、事情。","但她不知道她的生命已经进入了最后的倒计时。下午茜茜和她的侍女一起沿着日内瓦湖的岸边散步。她们准备去码头乘坐一艘轮船去法国的埃维昂。茜茜穿着一件简单的白色的连衣裙。她的头上戴着一顶简单的草帽。她的脖子上没有戴任何的珠宝。她看起来就像是一个普通的老年妇女。","但她不知道有一个人已经盯上了她。那个人叫路易吉·卢切尼。他是一个意大利的无政府主义者。他二十五岁是一个工人。他憎恨贵族和皇室。他认为贵族和皇室是压迫人民的敌人。他想要刺杀、一个、贵族、或者、皇室来表达他的抗议。","他本来想要刺杀法国的奥尔良公爵。但奥尔良公爵没有来日内瓦。他听说奥匈帝国的皇后茜茜在日内瓦。他决定刺杀茜茜。他觉得茜茜是皇室的代表。他觉得刺杀茜茜能够引起更大的轰动。他觉得刺杀茜茜能够表达他的无政府主义思想。","他悄悄地跟在茜茜的后面。他的手里拿着一把锋利的锉刀。他的心里充满了仇恨和狂热。茜茜和她的侍女走到了码头。她们准备登上轮船。就在这时、卢切尼、冲了上来。","他用他手里的锉刀狠狠地刺向了茜茜的胸口。茜茜感到一阵剧痛。她低头看了看她的胸口。她看到鲜血从她的胸口涌了出来。她没有尖叫。她只是轻轻地说了一句：“怎么回事？”","然后她倒了下去。她的侍女尖叫了起来。周围的人们都围了上来。卢切尼想要逃跑但被周围的人们抓住了。茜茜被抬到了附近的一家旅馆。医生赶来了。但一切都太晚了。","锉刀刺中了茜茜的心脏。她的伤势太重了。她已经没有救了。茜茜躺在旅馆的床上看着天花板心里非常的平静。她知道她快要死了。她没有恐惧。她没有痛苦。她只有遗憾。","她遗憾她没有能够回到中国。她遗憾她没有能够看看她的故土。她遗憾她没有能够为她的故土、做一些、事情。她从枕头底下拿出了一个小盒子。那个小盒子里装着那本《应文秘典》的抄本。","她把那个小盒子递给了她的侍女。","“把它，”茜茜用虚弱的声音说，“交给那个能读懂它的人。”","“那个能读懂它的人？”侍女疑惑地问。","“是的。”茜茜点了点头，“他叫朱宸。他在维也纳。他是我的同族。他能读懂这本书。”","“你把这本书交给他。告诉他我对不起他。我没有能够和他一起回到中国。”","“告诉他我的遗愿是回到中国。告诉他我的遗愿是帮助、中国、重新崛起。告诉他我的遗愿是实现天下大同。”","“告诉他我在天上会保佑他。我在天上会保佑中国。我在天上会保佑天下苍生。”","说完茜茜闭上了眼睛。她去世了享年六十岁。她到死都没有能够回到她的故土中国。她到死都没有能够看到中国重新崛起。她到死都没有能够看到天下大同的实现。","但她相信总有一天她的遗愿会实现。她相信总有一天中国会重新崛起。她相信总有一天人类会实现天下大同。她在天上会等待那一天的到来。茜茜去世的消息传到了维也纳。整个奥匈帝国都陷入了悲痛。弗朗茨·约瑟夫一世听到这个消息老泪纵横。他虽然和茜茜的关系一直不太好。但他依然深爱着茜茜。他为茜茜举行了隆重的葬礼。","茜茜被安葬在了维也纳的皇家墓穴。她的墓碑上刻着：","“伊丽莎白·亚美莉·欧根妮，奥匈帝国皇后。1837年12月24日出生，1898年9月10日去世。愿她的灵魂，在天堂，得到安息。”","但很少有人知道茜茜的真正的身份。很少有人知道茜茜的身体里流着中国皇帝的血。很少有人知道茜茜的遗愿是回到中国，帮助中国重新崛起实现天下大同。这些只有朱宸知道。","朱宸收到了茜茜的遗物和那封信。他捧着那本《应文秘典》的抄本眼泪流了下来。他知道茜茜的遗愿。他知道他必须替茜茜完成她的遗愿。他决定他要回到中国。他决定他要把他学到的知识带回中国。他决定他要帮助、中国、重新崛起。他决定他要实现天下大同。","1900年，朱宸以奥匈帝国翻译官的身份跟随八国联军来到了中国。他终于回到了他的故土。但他回到故土的方式却是以一个侵略者的翻译官的身份。他感到痛苦屈辱矛盾。","但他知道这是唯一的能够回到中国的方式。他知道这是唯一的能够为中国做一些事情的方式。他知道这是唯一的能够实现茜茜的遗愿的方式。他决定他要在中国待下来。他决定他要在中国做一些有意义的事情。他决定他要在中国实现他的和茜茜的，和建文帝的理想。"]},{"t":"第三十一章 · 留在中国","ps":["1901年，上海租界。朱宸站在他的公寓的窗前看着窗外的，上海街景心里充满了复杂的感情。他今年六十一岁。他已经辞去了奥匈帝国的职务。他现在是一个普通的平民。他化名为朱明远。他在上海租了一间公寓。他准备在中国待下来。","上海是中国最繁华的城市。但它也是中国最屈辱的城市。因为上海有很多的租界。这些租界是外国列强在中国的殖民地。在租界里外国人享有治外法权。他们可以不受中国法律的约束。他们可以随意地欺负中国人。","朱宸站在窗前看着窗外的上海街景。他看到外国的军舰在黄浦江里游弋。他看到外国的士兵在街道上巡逻。他看到外国的商人在商店里趾高气扬。他看到中国的老百姓在街道上低声下气。","他的心里充满了痛苦和愤怒。他知道中国已经到了最危险的时候。他知道中国已经到了最黑暗的时候。他知道中国已经到了必须改变的时候。他决定他要用他的余生去帮助中国进行，改革和现代化。他决定他要用他的余生去帮助中国重新崛起。他决定他要用他的余生去实现天下大同。","但他也知道这不是一件容易的事情。中国的问题太复杂了。中国的落后太严重了。中国的改革太艰难了。他知道他一个人的力量是有限的。他知道他不可能一下子就改变中国。他知道他只能一步一步地来。","他决定他先从教育做起。他决定他先创办一个学校。他决定他先教一些学生。他决定他先把他学到的知识传播给更多的人。他相信教育是改变中国的根本。他相信只有中国人的素质提高了中国，才能真正地崛起。他相信只有中国人的思想解放了中国，才能真正地进步。","他决定他要用他的余生去做这件事情。1902年，上海明夷学社。朱宸在上海的租界外面租了一间房子。他把这间房子改成了一个学校。他给这个学校起了一个名字叫明夷学社。","明夷是《易经》里的一个卦名。明夷卦的卦象是坤上离下。坤是地。离是火。火在地下就是明夷。明夷的意思是光明受损韬光养晦。朱宸觉得这个名字很适合现在的中国。现在的中国就像是明夷卦。光明受损了。中国需要韬光养晦。中国需要积蓄力量。中国需要等待时机。","他相信总有一天中国的光明会重新到来。他相信总有一天中国会重新崛起。他相信总有一天中国会再次成为一个伟大的国家。明夷学社，开学了。一开始只有几个学生。他们都是上海的一些穷苦的孩子。他们的家里很穷。他们没有钱去正规的学校读书。他们听说明夷学社是免费的就来了。","朱宸亲自教这些学生。他教他们语文数学历史地理科学。他教他们中文英文法文德文。他教他们中国的传统文化和西方的现代知识。他教他们做人的道理和做事的方法。","他对，这些学生非常的严格。他要求他们认真地学习。他要求他们努力地思考。他要求他们勇敢地探索。但他也对，这些学生非常的关心。他给他们提供免费的书本和文具。他给他们提供免费的午餐。他给他们提供免费的医疗。","他把这些、学生、当作自己的孩子。他希望这些学生能够学有所成。他希望这些学生能够成为中国的栋梁。他希望这些学生能够帮助中国重新崛起。慢慢地明夷学社的名声传开了。越来越多的学生来到了明夷学社。他们不只是上海的穷苦的孩子。还有一些外地的学生也慕名而来。还有一些有识之士也来到了明夷学社和朱宸交流。","明夷学社不再只是一个普通的学校。它变成了一个思想的中心。它变成了一个改革的阵地。它变成了一个革命的摇篮。很多后来在中国的历史上留下了名字的，人都曾经在明夷学社、学习、或者、交流过。","他们从明夷学社学到了知识和思想。他们从明夷学社学到了改革和革命的理念。他们从明夷学社学到了救国和救民的方法。他们后来都成为了中国近代史上的重要人物。他们后来都为中国的改革和革命做出了重要的贡献。他们后来都帮助中国走向了新的时代。","但很少有人知道他们的老师朱宸的真正的身份。很少有人知道朱宸是建文帝的后裔。很少有人知道朱宸的身体里流着中国皇帝的血。很少有人知道朱宸守护着一本神秘的，书《应文秘典》。","这些只有朱宸、自己、知道。他没有告诉任何人。他只是默默地做着他的事情。他只是默默地培养着中国的下一代。他只是默默地为中国的未来打下基础。他相信总有一天他的努力会有回报。他相信总有一天中国会重新崛起。他相信总有一天人类会实现天下大同。"]},{"t":"第三十二章 · 火种的传播","ps":["1905年，上海明夷学社。朱宸站在学社的教室里看着下面的学生，心里充满了欣慰。他今年六十五岁。他的头发已经全白了。他的脸上有了很多的皱纹。他的身体已经不如以前了。但他的眼神依然锐利而充满了智慧。","下面的学生有一百多人。他们都是明夷学社的学生。他们来自中国的各地。他们有的是穷苦的孩子。有的是富家的子弟。有的是读书人。有的是工人。有的是商人。","他们都怀着一颗救国救民的心。他们都想要为中国的未来做一些事情。他们都相信中国会重新崛起。朱宸今天要给他们讲最后一堂课。因为他知道他的身体已经不行了。他知道他可能没有太多的时间了。他想要在他去世之前把他最重要的东西，教给这些学生。","他想要把《应文秘典》里的知识教给这些学生。他想要把建文帝的思想教给、这些、学生。他想要把天下大同的理想教给、这些、学生。他相信这些学生会把这些知识思想理想传播下去。他相信这些学生会成为中国的火种。他相信这些火种会在中国的大地上燃烧起来，照亮中国的未来。","“同学们，”朱宸用洪亮的声音说，“今天我要给你们讲最后一堂课。”","下面的学生都安静了下来。他们都知道朱老师的身体不好。他们都知道这可能是朱老师的最后一堂课。他们都认真地听着。","“今天我要给你们讲一个故事。”朱宸说，“一个关于一个皇帝的故事。”","“五百多年前有一个皇帝叫建文帝。他是明朝的第二位皇帝。他年轻有为聪明仁慈。他想要做一个好皇帝。他想要让他的人民过上好日子。”","“但是他的叔叔燕王朱棣造反了。朱棣率领军队攻入了南京。建文帝被迫出逃。他剃度为僧流亡海外。”","“他在海外流亡了很多年。他去了南洋去了印度去了波斯去了阿拉伯，去了拜占庭最后到了欧洲。”","“在欧洲他用了三十年的时间写了一本书。这本书叫《应文秘典》。这本书里记载了中国的医学天文学数学，哲学政治历史。这本书里也记载了他对，人类文明的思考。”","“他写这本书不是为了扬名不是为了牟利。他写这本书只是为了保存华夏的文脉。他写这本书只是为了把中国的文明传播到西方。他写这本书只是为了促进东西方文明的融合。”","“他的理想是天下大同。他相信人类的未来是所有的民族所有的，国家都成为一家人没有战争没有仇恨，只有和平与合作。”","“他的这本书在欧洲传播了四百多年。它催生了文艺复兴、宗教改革、科学革命、启蒙运动、工业革命。它改变了整个欧洲。”","“但是在中国他的故土却在这四百多年里，停滞了落后了衰落了。现在中国已经到了最危险的时候。现在中国已经到了最黑暗的时候。”","“同学们，”朱宸看着下面的学生声音变得激动了起来，“我今天给你们讲这个故事不是为了让，你们去考证这个故事的真假。我今天给你们讲这个故事是为了让你们、明白、一个、道理。”","“文明是脆弱的。一个伟大的文明可能会因为各种原因而衰落。但是文明也是顽强的。一个伟大的文明只要它的火种还在它，就不会真正地灭亡。它迟早会重新燃烧起来。”","“中国的文明是世界上最古老最连续最深厚的文明。它已经存在了五千年。它经历了无数的磨难和挫折。但它从来没有真正地灭亡过。它总是能够在磨难中重生。它总是能够在挫折中崛起。”","“现在中国、虽然、衰落了。但中国的文明的火种还在。中国的人民还在。中国的未来还在。”","“同学们你们就是中国的火种。你们要把中国的文明的火种传承下去。你们要把中国的文明的火种燃烧起来。你们要用这火种照亮中国的未来。”","“你们要学习西方的先进的知识和技术。但你们也要保留中国的优秀的传统和文化。你们要把东西方的文明融合起来。你们要创造出一种新的文明。”","“你们要为中国的改革和革命、做出、贡献。你们要为中国的独立和富强、做出、贡献。你们要为中国的重新崛起做出贡献。”","“你们要记住天下大同的理想。你们要相信、总有一天、人类会实现天下大同。你们要为实现天下大同而努力。”","“同学们，”朱宸的声音变得哽咽了，“我已经老了。我可能看不到中国重新崛起的那一天了。我可能看不到天下大同实现的那一天了。”","“但是你们还年轻。你们还有很多的时间。你们还有很多的机会。我相信你们能够看到中国重新崛起的那一天。我相信你们能够看到天下大同实现的那一天。”","“同学们我把我的希望都寄托在你们身上了。我把我的理想都寄托在你们身上了。我把我的生命都寄托在你们身上了。”","“同学们努力吧。为了中国的未来。为了人类的未来。为了天下大同。”","说完朱宸深深地向下面的学生鞠了一躬。下面的学生都站了起来。他们都流下了眼泪。他们都深深地向朱宸鞠了一躬。他们都在心里默默地发誓。他们要记住朱老师的教导。他们要为中国的未来而努力。他们要为天下大同而努力。","他们知道这不只是一堂普通的课。这是一次火种的传递。这是一次理想的传承。这是一次生命的延续。从那以后明夷学社的学生就像是一颗颗，火种撒向了中国的各地。","他们有的去了北京投身于改革和革命。他们有的去了广州投身于教育和实业。他们有的去了武汉投身于新军和起义。他们有的去了海外投身于宣传和筹款。他们都在各自的岗位上为中国的未来做着贡献。他们都在各自的地方传播着新的思想和知识。他们都在各自的领域推动着中国的改革和进步。","他们就像是一颗颗火种在中国的大地上燃烧了起来。他们就像是一颗颗星星在中国的夜空中闪烁了起来。他们就像是一股股清泉在中国的土地上流淌了起来。慢慢地中国的思想开始解放了。慢慢地中国的人民开始觉醒了。慢慢地中国的革命开始酝酿了。","1911年，武昌起义爆发了。很多明夷学社的学生都参与了这次起义。他们有的在武昌、领导、起义。他们有的在各地响应起义。他们有的在海外、支持、起义。","武昌起义成功了。全国各地都响应了起义。清朝政府被迫退位。中国两千多年的封建帝制结束了。中国进入了一个新的时代。朱宸在上海听到了武昌起义成功的消息。他流下了眼泪。","他知道他的努力没有白费。他知道他的学生没有辜负他的期望。他知道中国的未来充满了希望。他相信总有一天中国会重新崛起。他相信总有一天人类会实现天下大同。他相信他的祖先建文帝的理想终有一天会实现。"]},{"t":"第三十三章 · 最后的哈布斯堡","ps":["1914年6月28日，萨拉热窝。奥匈帝国的皇储弗朗茨·斐迪南大公，和他的妻子索菲在萨拉热窝被一个塞尔维亚的，民族主义者刺杀了。这个事件成为了第一次世界大战的导火索。","一个月后奥匈帝国向塞尔维亚宣战。然后德国向俄国法国宣战。然后英国向德国宣战。第一次世界大战，全面爆发。整个欧洲都陷入了战争。整个世界都被卷入了战争。","1918年11月11日，第一次世界大战结束。德国投降了。奥匈帝国解体了。奥斯曼帝国解体了。俄罗斯帝国崩溃了。整个欧洲的政治版图都被重新划分了。奥匈帝国解体后分裂成了奥地利匈牙利，捷克斯洛伐克，南斯拉夫等多个国家。哈布斯堡家族的统治结束了。奥地利变成了一个共和国。哈布斯堡家族的成员被迫流亡海外。","这个统治了欧洲四百多年的家族终于走到了尽头。1918年11月上海明夷学社。朱宸站在学社的窗前看着窗外的上海，街景心里充满了感慨。他今年七十八岁。他的身体已经非常虚弱了。他已经很少出门了。他每天只是在学社里、看看书、写写字和学生们聊聊天。","他听到了第一次世界大战结束的消息。他听到了奥匈帝国解体的消息。他听到了哈布斯堡家族的统治结束的消息。他的心里充满了感慨。他的身体里流着哈布斯堡家族的血。他的祖先建文帝的儿子娶了哈布斯堡家族的公主。他的家族和哈布斯堡家族已经联姻了四百多年。他的家族一直作为哈布斯堡家族的，“隐秘帝师”，在暗中帮助哈布斯堡家族。","现在哈布斯堡家族的统治结束了。这个曾经统治了大半个欧洲的家族终于走到了尽头。朱宸的心里有一些伤感。但他也知道这是历史的必然。因为他的祖先建文帝在《应文秘典》里曾经说过。","建文帝说，多民族的帝国是不稳定的。因为不同的民族有不同的文化不同的，利益不同的诉求。它们很难长期地和平共处。它们迟早会因为各种矛盾而分裂。建文帝说真正的稳定不是靠武力把不同的，民族强行地拼凑在一起。真正的稳定是靠文化把不同的民族自然地融合在一起。真正的稳定是天下大同。","奥匈帝国就是一个多民族的帝国。它的境内有十几个民族。这些民族都有自己的语言自己的文化，自己的历史自己的诉求。它们一直都在争取更多的自治权甚至独立。","奥匈帝国就像是一个拼凑起来的巨大的脆弱的拼图。它随时都可能因为一块拼图的脱落而分崩离析。第一次世界大战只是加速了这个过程。即使没有第一次世界大战，奥匈帝国也迟早会解体。","这是历史的必然。朱宸看着窗外的天空心里默默地说：","“哈布斯堡家族的时代结束了。”","“鹰的帝国终于也落了。”","“五百年的鹰龙共生以鹰的陨落告终。”","“但是龙的火种还在。”","“龙的火种已经回到了中国。”","“龙的火种已经在中国的大地上燃烧了起来。”","“我相信总有一天龙会重新腾飞。”","“我相信总有一天中国会重新崛起。”","“我相信总有一天人类会实现天下大同。”","1922年，朱宸在上海、去世、享年、八十二岁。他去世前把他的学生叫到了他的床前。他把那本《应文秘典》交给了他的最得意的学生。他对，他的学生说：","“这本书是我的祖先建文帝用了三十年的时间写的。”","“这本书在欧洲传播了四百多年改变了整个欧洲。”","“现在我把它交给你。”","“你要好好地守护它。”","“你要好好地研究它。”","“你要把它里面的知识传播给更多的人。”","“你要帮助、中国、重新崛起。”","“你要帮助、人类、实现、天下大同。”","“记住文明是脆弱的但也是顽强的。”","“记住只要火种还在文明就不会灭亡。”","“记住天下大同是我们的终极理想。”","说完朱宸闭上了眼睛。他，去世了。他的学生把他安葬在了上海的一座公墓里。他的墓碑上没有刻他的真名。只刻了四个字：“明夷先生”。很少有人知道这个普通的老人的真正的身份。很少有人知道这个普通的老人是建文帝的后裔。很少有人知道这个普通的老人守护了，一本神秘的书《应文秘典》。很少有人知道这个普通的老人为中国的，近代化做出了巨大的贡献。","但他的学生知道。他的学生会把他的故事传承下去。他的学生会把他的理想传承下去。他的学生会把他的火种传承下去。他们相信总有一天中国会重新崛起。他们相信总有一天人类会实现天下大同。他们相信他们的老师在天上会看到那一天的到来。"]},{"t":"第三十四章 · 武昌枪响","ps":["1911年10月10日，武昌。晚上武昌城的新军工程第八营的营房里一片寂静。士兵们都已经睡下了。但营房里的几个士兵却没有睡。他们围坐在一起小声地商量着什么。","他们都是革命党人。他们已经秘密地准备了很久。他们决定在今天晚上、发动、起义。他们的计划是先占领武昌城的军火库。然后占领武昌城的各个重要据点。然后宣布独立脱离清朝政府。然后号召全国各地响应起义。","他们知道这次起义风险很大。他们知道这次起义可能会失败。他们知道这次起义可能会牺牲很多人。但他们也知道这次起义意义重大。他们知道这次起义可能会改变中国的命运。他们知道这次起义可能会开启中国的新的时代。","他们已经做好了牺牲的准备。他们已经做好了失败的准备。他们已经做好了为中国的未来献身的准备。晚上八点工程第八营的营房里突然响起了一声枪响。原来营房里的一个排长发现了这些革命党人的秘密会议。他冲了进来想要阻止他们。一个革命党人士兵熊秉坤果断地开枪，打死了这个排长。","这声枪响就是武昌起义的第一枪。枪声一响整个营房都骚动了起来。革命党人士兵们都拿起了武器冲出了营房。他们迅速地占领了工程第八营的营房。然后他们向武昌城的军火库进发。","一路上越来越多的新军士兵加入了起义的队伍。他们都是对，清朝政府不满的士兵。他们都是想要改变中国的命运的士兵。他们都是愿意为中国的未来献身的士兵。","起义的队伍越来越大。他们迅速地占领了武昌城的军火库。他们获得了大量的武器和弹药。然后他们向武昌城的各个重要据点进发。经过一夜的战斗起义的队伍成功地占领了整个武昌城。清朝政府在武昌城的统治被推翻了。","第二天起义的革命党人成立了湖北军政府。他们宣布湖北独立脱离清朝政府。他们号召全国各地响应起义。武昌起义，成功了。武昌起义的消息迅速地传遍了全国各地。","全国各地的革命党人都纷纷响应起义。湖南陕西江西山西云南贵州浙江江苏，广西安徽福建广东四川等十几个省份，都先后宣布独立脱离清朝政府。清朝政府的统治迅速地崩溃了。","清朝政府被迫起用袁世凯来镇压革命。但袁世凯已经和革命党人达成了协议。他逼迫清朝皇帝退位。1912年2月12日清朝的最后一个，皇帝溥仪颁布了退位诏书。清朝正式灭亡。中国两千多年的封建帝制正式结束。","中国进入了一个新的时代。1911年10月10日晚上上海明夷学社。朱宸站在学社的窗前看着窗外的上海，的夜空心里充满了激动。他刚刚收到了武昌起义成功的消息。他的很多学生都参与了这次起义。他的很多学生都在武昌、领导、起义。他的很多学生都为这次起义做出了重要的贡献。","他知道这次起义意义重大。他知道这次起义会改变中国的命运。他知道这次起义会开启中国的新的时代。他想起了五百年前。五百年前，1402年，他的祖先建文帝在南京经历了国破家亡的痛苦。五百年前，1402年，他的祖先建文帝在大火中假死出逃，流亡到了欧洲。五百年前，1402年，他的祖先建文帝带着华夏的文脉离开了中国。","五百年了。五百年前南京的火光中一个王朝覆灭了。五百年后武昌的枪声中一个旧的时代结束了。五百年前他的祖先带着华夏的文脉出逃。五百年后他带着欧洲的文明归来。","五百年前华夏的火种被带到了欧洲。五百年后欧洲的火种被带回了中国。五百年的分离五百年的漂泊五百年的等待。今天终于重逢了。今天终于闭环了。今天终于新生了。","朱宸站在窗前看着窗外的上海的夜空，眼泪流了下来。他在心里默默地说：","“祖先我回来了。”","“祖先我没有辜负您的期望。”","“祖先我把您的火种带回来了。”","“祖先您的理想天下大同终有一天会实现。”","“祖先请您保佑中国。”","“祖先请您保佑天下苍生。”","“祖先请您保佑人类的未来。”"]},{"t":"第三十五章 · 龙烬归华","ps":["1912年2月12日南京明孝陵。朱宸站在明孝陵的松柏间看着面前的，朱元璋的陵墓心里充满了复杂的感情。他今年七十二岁。他的头发已经全白了。他的脸上有了很多的皱纹。他的身体已经非常虚弱了。但他还是坚持来到了南京来到了明孝陵。","因为今天是清朝皇帝退位的日子。因为今天是中国两千多年的封建帝制结束的日子。因为今天是中国进入新的时代的日子。他想要在这个特殊的日子来到明孝陵，向他的祖先朱元璋报告这个消息。他想要在这个特殊的日子来到明孝陵，向他的祖先建文帝报告这个消息。他想要在这个特殊的日子完成一个五百年的轮回。","他的手里拿着一个铁匣。那个铁匣里装着《应文秘典》的完整，译本五百年家族流亡史以及他整理的，中西文明融合方案。他要把这个铁匣埋在明孝陵的朱元璋墓前。他要把他的祖先的火种归还给中华。他要把五百年的轮回在这里闭环。","朱宸走到了朱元璋的墓碑前。他深深地鞠了一躬。然后他在墓碑前挖了一个坑。他把那个铁匣放了进去。他用土把坑填了起来。他在上面种了一棵小松树。然后他站了起来看着那棵、小松树、心里充满了平静。","他在铁匣上刻了一行字：","“建文后裔朱宸，奉还火种于中华。”","这行字是他亲手刻的。这行字是他对，他的祖先的交代。这行字是他对，中华的交代。这行字是他对，历史的交代。五百年前他的祖先建文帝带着华夏的，火种离开了中国。五百年后他带着欧洲的文明回到了中国。五百年的分离五百年的漂泊五百年的等待。今天终于重逢了。今天终于闭环了。今天终于新生了。","朱宸站在明孝陵的松柏间看着那棵、小松树、眼泪、流了下来。他在心里默默地说：","“祖先我回来了。”","“祖先我把您的火种带回来了。”","“祖先您的理想天下大同终有一天会实现。”","“中华我回来了。”","“中华我把欧洲的文明带回来了。”","“中华您的未来充满了希望。”","“历史我回来了。”","“历史五百年的轮回终于闭环了。”","“历史新的时代已经开始了。”"]},{"t":"终章 · 五百年的轮回","ps":["朱宸站在明孝陵的松柏间回望来路。1402年，南京火光建文出逃带走华夏火种。1438年，维也纳伏尼契成书火种封存于中欧羊皮。1453年，君士坦丁堡陷落拜占庭覆灭双火种叠加，文艺复兴爆发。1517年，维滕贝格宗教改革爆发教权衰落王权崛起。1618年，三十年战争爆发欧洲陷入战火旧秩序被打破。1687年，伦敦牛顿发表《自然哲学的数学原理》，科学革命高潮。1769年，格拉斯哥瓦特改进蒸汽机工业革命开始。1789年，巴黎法国大革命爆发启蒙运动高潮。1837年，慕尼黑茜茜出生龙族末代原型降临。1840年，维也纳朱宸出生龙族末代传人降临。1854年，维也纳茜茜婚礼双脉相认宿命齿轮转动。1866年，普奥战争爆发奥地利战败被排除出德意志。1867年，奥匈帝国成立二元帝国建立鹰龙共生巅峰。1894年，甲午战争爆发大清惨败中国陷入深渊。1898年，日内瓦茜茜遇刺西方龙母陨落东方龙该醒了。1900年，北京八国联军攻入翰林院被焚永乐大典残卷流失。1901年，上海朱宸留下明夷学社创办火种开始传播。1911年，武昌枪响起义爆发旧王朝覆灭新文明诞生。1912年，南京清帝退位封建帝制结束龙烬归华火种归位。","五百年的流亡。五百年的蛰伏。五百年的文明暗战。终于在这一刻闭环了。朱宸转过身走向晨光中的南京城。他知道这不是结束。他知道这是新的开始。他知道龙烬已归中华待兴。","他的身后明孝陵的松柏在晨光中闪烁着金色的光芒。他的身后那棵小松树在晨光中挺立着稚嫩的身躯。他的身后五百年的历史在晨光中沉淀着厚重的底蕴。他的面前南京城在晨光中苏醒着古老的身躯。他的面前中华在晨光中酝酿着新生的力量。他的面前未来在晨光中展现着无限的可能。","他相信总有一天中国会重新崛起。他相信总有一天，东西方的文明会真正地融合。他相信总有一天人类会实现天下大同。他的祖先建文帝的理想终有一天会实现。他的妻子茜茜的遗愿终有一天会实现。他的学生们的努力终有一天会有回报。","他在天上会看到那一天的到来。他在天上会为那一天的到来而欢呼。他在天上会保佑那一天的到来。龙烬已归。中华待兴。天下大同。（全书完）"]}]}],"foot":"《龙烬亚欧》· 架空历史全本小说 · 建文秘脉五百年。部分内容由豆包生成。"};

      html.push('<section class="chap" id="' + id + '">');
      if (ci === 0) html.push('<span class="no">' + esc(part.name) + '</span>');
      html.push('<h2>' + esc(ch.t) + '</h2>');
      if (ch.sub) html.push('<h3>' + esc(ch.sub) + '</h3>');
      ch.ps.forEach(function(p){
        if (p === '---') { html.push('<p class="divider">· · ·</p>'); return; }
        if (typeof p === 'string') { html.push('<p>' + esc(p) + '</p>'); return; }
        var cls = 'flat' + (p.k ? ' ' + p.k : '');
        var num = p.n ? '<b>' + esc(p.n) + '</b>' : '';
        html.push('<p class="' + cls + '">' + num + esc(p.x) + '</p>');
      });
      html.push('</section>');
    });
  });
  art.innerHTML = html.join('');
  // 章间导航
  var again = [];
  flat.forEach(function(c, i){
    again.push('<div class="chapnav">' +
      (i ? '<button class="pv" data-go="' + (i-1) + '"><small>上一节</small>' + esc(flat[i-1].t) + '</button>'
         : '<button disabled><small>上一节</small>已是开头</button>') +
      '<button class="md" data-toc="1" title="目录">目录</button>' +
      (i < flat.length-1 ? '<button class="nx" data-go="' + (i+1) + '"><small>下一节</small>' + esc(flat[i+1].t) + '</button>'
         : '<button disabled class="nx"><small>下一节</small>已是结尾</button>') +
      '</div>');
  });
  document.querySelectorAll('.chap').forEach(function(sec, i){
    sec.insertAdjacentHTML('beforeend', again[i]);
  });
})();
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- 元信息 ---------- */
(function(){
  var chars = 0, ps = 0;
  BOOK.parts.forEach(function(p){ p.chapters.forEach(function(c){
    chars += c.t.length; c.ps.forEach(function(x){
      if (typeof x === 'string') { chars += x.length; ps++; }
      else { chars += x.x.length + (x.n ? x.n.length : 0); ps++; }
    });
  }); });
  var wan = (chars/10000);
  var m = document.getElementById('meta');
  m.innerHTML =
    '<span><b>' + flat.length + '</b> 节</span>' +
    '<span>约 <b>' + (wan >= 1 ? wan.toFixed(1) + ' 万字' : Math.round(chars/1000) + ' 千字') + '</b></span>' +
    (BOOK.tags || []).map(function(t){ return '<span>' + esc(t) + '</span>'; }).join('');
  document.getElementById('tocMeta').textContent = flat.length + ' 节 · 约 ' + (wan >= 1 ? wan.toFixed(1) + ' 万字' : Math.round(chars/1000) + ' 千字');
  document.getElementById('foot').innerHTML = BOOK.foot || '';
  document.title = BOOK.title + ' · 玄同宇宙';
})();

/* ---------- 目录 ---------- */
(function(){
  var box = document.getElementById('toc'), cur = -1, group = null, buf = [];
  flat.forEach(function(c, i){
    if (c.g !== group) {
      if (buf.length) box.insertAdjacentHTML('beforeend', buf.join(''));
      group = c.g; buf = [];
      box.insertAdjacentHTML('beforeend', '<h4>' + esc(group) + '</h4>');
    }
    buf.push('<button data-go="' + i + '"><i>' + String(i+1).padStart(2,'0') + '</i><span>' + esc(c.t) + '</span></button>');
  });
  if (buf.length) box.insertAdjacentHTML('beforeend', buf.join(''));

  function mark(i){
    if (i === cur) return; cur = i;
    box.querySelectorAll('button').forEach(function(b){
      b.classList.toggle('on', +b.dataset.go === i);
    });
    var on = box.querySelector('button.on');
    if (on && panelOpen()) on.scrollIntoView({ block:'nearest' });
  }
  window.__mark = mark;

  box.addEventListener('click', function(e){
    var b = e.target.closest('button[data-go]'); if (!b) return;
    go(+b.dataset.go);
  });
  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-go]'); if (!b) return;
    go(+b.dataset.go);
  });
  document.addEventListener('click', function(e){
    if (e.target.closest('[data-toc]')) { document.body.classList.add('toc'); }
  });
  function go(i){
    var el = document.getElementById(flat[i].id); if (!el) return;
    document.body.classList.remove('toc');
    window.scrollTo({ top: el.offsetTop - 62, behavior: 'smooth' });
    mark(i);
  }
  window.__go = go;
  function panelOpen(){ return document.body.classList.contains('toc'); }
  window.__panelOpen = panelOpen;
})();

/* ---------- 主题 / 字号 ---------- */
(function(){
  var root = document.documentElement;
  var saved = null; try { saved = localStorage.getItem('xt_read_theme'); } catch(e){}
  root.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'paper');
  document.getElementById('btnTheme').addEventListener('click', function(){
    var d = root.getAttribute('data-theme') === 'dark';
    root.setAttribute('data-theme', d ? 'paper' : 'dark');
    try { localStorage.setItem('xt_read_theme', d ? 'paper' : 'dark'); } catch(e){}
  });
  var fs = null; try { fs = parseFloat(localStorage.getItem('xt_read_fs')); } catch(e){}
  if (!fs || fs < 0.8 || fs > 1.7) fs = 1;
  var cur = fs;
  function apply(){ root.style.setProperty('--fs', (1.06 * cur).toFixed(2) + 'rem'); }
  window.addEventListener('DOMContentLoaded', apply); apply();
  document.getElementById('fsU').addEventListener('click', function(){ cur = Math.min(1.5, cur + .08); apply(); store(); });
  document.getElementById('fsD').addEventListener('click', function(){ cur = Math.max(.78, cur - .08); apply(); store(); });
  function store(){ try { localStorage.setItem('xt_read_fs', cur); } catch(e){} }
})();

/* ---------- 抽屉 / 进度 / 快捷键 ---------- */
(function(){
  document.getElementById('btnToc').addEventListener('click', function(){ document.body.classList.toggle('toc'); });
  document.getElementById('btnTocX').addEventListener('click', function(){ document.body.classList.remove('toc'); });
  document.getElementById('mask').addEventListener('click', function(){ document.body.classList.remove('toc'); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') document.body.classList.remove('toc');
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      var i = window.__cur === undefined ? 0 : window.__cur;
      window.__go(Math.max(0, Math.min(flat.length-1, i + (e.key === 'ArrowRight' ? 1 : -1))));
    }
  });
  var btnTop = document.getElementById('btnTop'), prog = document.getElementById('prog');
  var secs = [].slice.call(document.querySelectorAll('.chap'));
  var curIdx = -1;
  function onScroll(){
    var y = window.scrollY, h = document.documentElement.scrollHeight - window.innerHeight;
    prog.style.width = (h > 0 ? Math.min(100, y / h * 100) : 0) + '%';
    btnTop.classList.toggle('on', y > 700);
    var i = 0;
    for (var k = 0; k < secs.length; k++) if (secs[k].offsetTop - 90 <= y) i = k;
    curIdx = i;
    window.__cur = i;
    if (window.__mark) window.__mark(i);
    try { localStorage.setItem('xt_read_' + BOOK.slug, String(i)); } catch(e){}
  }
  window.addEventListener('scroll', onScroll, { passive:true });
  btnTop.addEventListener('click', function(){ window.scrollTo({ top:0, behavior:'smooth' }); });
  var last = -1; try { last = parseInt(localStorage.getItem('xt_read_' + BOOK.slug), 10); } catch(e){}
  onScroll();
  if (last > 0 && last < secs.length) {
    setTimeout(function(){
      var bar = document.getElementById('resume');
      if (bar) bar.remove();
      var el = secs[last];
      var d = document.createElement('div');
      d.id = 'resume';
      d.style.cssText = 'max-width:44rem;margin:0 auto;padding:0 20px;font-size:.8rem';
      d.innerHTML = '<button style="border:1px solid var(--line2);border-radius:9px;padding:7px 12px;color:var(--accent);background:var(--paper2)">继续上次读到 · ' + esc(flat[last] ? flat[last].t : '') + '</button>';
      d.querySelector('button').onclick = function(){ window.__go(last); };
      document.querySelector('main').insertBefore(d, document.getElementById('art'));
    }, 60);
  }
})();
</script>
</body>
</html>
