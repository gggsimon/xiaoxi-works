：面相","d":2,"brief":"五官三停十二宫的面相基本框架。","interactive":null},{"id":"kp_10_4","ch":"ch10","t":"太清神鉴","d":3,"brief":"《道藏》所收相术典籍的神气形色论。","interactive":null},{"id":"kp_11_1","ch":"ch11","t":"周易筮法","d":2,"brief":"大衍之数五十的揲蓍法：成卦、变卦与断辞。","interactive":null},{"id":"kp_11_2","ch":"ch11","t":"京房易：纳甲与六亲","d":3,"brief":"八宫卦序、纳甲装卦、六亲六神的体系。","interactive":null},{"id":"kp_11_3","ch":"ch11","t":"奇门遁甲","d":3,"brief":"三奇六仪、九宫八门、天地盘的时空格局。","interactive":null},{"id":"kp_11_4","ch":"ch11","t":"六壬","d":3,"brief":"四课三传、十二天将的课式推算。","interactive":null},{"id":"kp_11_5","ch":"ch11","t":"六爻","d":3,"brief":"以钱代蓍，装卦取用神、定应期的实用占法。","interactive":null},{"id":"kp_11_6","ch":"ch11","t":"太乙","d":3,"brief":"太乙九宫与神煞格局，古称「三式」之首。","interactive":null},{"id":"kp_12_1","ch":"ch12","t":"道法术器总纲","d":3,"brief":"道为体、法为则、术为用、器为载的四层总纲。","interactive":null},{"id":"kp_12_2","ch":"ch12","t":"法器：剑·印·旗","d":2,"brief":"斩妖剑、法印、令旗等法器的形制与用途。","interactive":null},{"id":"kp_12_3","ch":"ch12","t":"符箓：符头·符身·符脚","d":3,"brief":"符的结构与画符要义（作文化史研读）。","interactive":null},{"id":"kp_12_4","ch":"ch12","t":"鼎炉与图像","d":2,"brief":"「器以载道」：鼎炉、图像、法衣的象征体系。","interactive":null},{"id":"kp_13_1","ch":"ch13","t":"任继愈《中国道教史》","d":2,"brief":"以现代宗教学方法梳理道教发展脉络。","interactive":null},{"id":"kp_13_2","ch":"ch13","t":"卿希泰《中国道教史》","d":2,"brief":"道教通史的重镇：制度、经教、派系的系统史。","interactive":null},{"id":"kp_13_3","ch":"ch13","t":"汤用彤《魏晋玄学论稿》","d":3,"brief":"玄学与佛道交涉的学术经典。","interactive":null},{"id":"kp_13_4","ch":"ch13","t":"李养正《道教概说》","d":2,"brief":"道教知识的入门概览与术语厘清。","interactive":null},{"id":"kp_13_5","ch":"ch13","t":"道家与现代学术校准","d":3,"brief":"以学术方法防误读：不神化、不妄断、不伪科学化。","interactive":null}],"interactiveCount":9};
</script>
<script>
(function(){
  var KPS = DATA.kps, ST = DATA.stages;
  var byCh = {}; KPS.forEach(function(k){ (byCh[k.ch]=byCh[k.ch]||[]).push(k); });
  var DIRCOL = {"道":"#8b5e3c","法":"#9a6b3f","术":"#a9763f","器":"#7d6a4a","学术":"#6f7a5a"};
  function stars(d){ return "★★★".slice(0,d) + "☆☆☆".slice(0,3-d); }

  document.getElementById("bookTitle").textContent = DATA.book;
  document.getElementById("bookDesc").textContent =
    "把《道家正统修习》540 天课程（13 阶 · 道法术器 · 五术全口径）织成知识骨架：每阶一个知识簇，逐知识点可跳转互动讲解页。底本取自 IMA『道家经典 / 道家典籍 / 张至顺·中医·倪海厦』。";
  var nInt = KPS.filter(function(k){return k.interactive;}).length;
  document.getElementById("bookStat").innerHTML =
    "<span>阶段 <b>"+ST.length+"</b></span><span>知识点 <b>"+KPS.length+"</b></span>"+
    "<span>互动页 <b>"+(DATA.interactiveCount!=null?DATA.interactiveCount:nInt)+"</b></span>"+
    "<span>总课时 <b>540</b> 天</span>";
  document.getElementById("foot").textContent = "课织匠 CourseWeaver 生成 · " + (DATA.generated_at||"");

  // ---- tree ----
  var tv = document.getElementById("treeView");
  ST.forEach(function(s, i){
    var list = byCh[s.ch] || [];
    var el = document.createElement("div");
    el.className = "stage" + (i===0 ? " open" : "");
    var col = DIRCOL[s.dir] || "#8b5e3c";
    var kpsHtml = list.map(function(k){
      var slot = k.interactive
        ? '<a href="'+k.interactive+'">📱 互动讲解</a>'
        : '<span class="none">暂无互动页</span>';
      return '<div class="kp" data-kp-id="'+k.id+'">'+
        '<span class="dot" style="background:'+col+'"></span>'+
        '<div class="body"><div class="tt">'+k.t+
          '<span class="tag">'+s.dir+'</span></div>'+
          '<div class="br">'+k.brief+'</div></div>'+
        '<div class="stars" title="难度">'+stars(k.d)+'</div>'+
        '<span class="kp-link-slot" data-kp-id="'+k.id+'">'+slot+'</span>'+
      '</div>';
    }).join("");
    el.innerHTML =
      '<div class="stage-h">'+
        '<span class="stage-n serif" style="background:'+col+'">'+s.n+'</span>'+
        '<div class="stage-meta"><div class="nm">'+s.name+'</div>'+
        '<div class="ds">'+s.days+' · '+s.goal+'</div></div>'+
        '<span class="stage-cnt">'+list.length+' 个知识点</span>'+
      '</div>'+
      '<div class="kps">'+(kpsHtml||'<div class="kp"><div class="body br">—</div></div>')+'</div>';
    el.querySelector(".stage-h").addEventListener("click", function(){ el.classList.toggle("open"); });
    tv.appendChild(el);
  });

  // ---- graph ----
  var cx=490, cy=310, R=232;
  var svg = document.getElementById("gsvg");
  var NS="http://www.w3.org/2000/svg";
  function mk(n,a){ var e=document.createElementNS(NS,n); for(var k in a) e.setAttribute(k,a[k]); return e; }
  var hubPos = {};
  ST.forEach(function(s, i){
    var ang = -Math.PI/2 + i*(2*Math.PI/ST.length);
    var x = cx + R*Math.cos(ang), y = cy + R*Math.sin(ang);
    hubPos[s.ch] = {x:x,y:y,ang:ang,col:DIRCOL[s.dir]||"#8b5e3c",n:s.n,name:s.name};
  });
  var gLines = mk("g"), gNodes = mk("g");
  svg.appendChild(gLines); svg.appendChild(gNodes);

  Object.keys(byCh).forEach(function(ch){
    var hub = hubPos[ch]; if(!hub) return;
    var list = byCh[ch], m=list.length;
    list.forEach(function(k, j){
      var spread = 0.62;
      var a2 = hub.ang + (m>1 ? (j/(m-1)-0.5)*spread : 0);
      var r2 = 70 + (j%2)*16;
      var x = hub.x + r2*Math.cos(a2), y = hub.y + r2*Math.sin(a2);
      gLines.appendChild(mk("line",{x1:hub.x,y1:hub.y,x2:x,y2:y,stroke:hub.col,"stroke-opacity":.18,"stroke-width":1}));
      var c = mk("circle",{cx:x,cy:y,r:k.interactive?5.4:4,fill:k.interactive?hub.col:"#cfc6b6",
        stroke:"#fff","stroke-width":1.4,class:"gk"});
      c.addEventListener("click", function(){ showInfo(k, hub); });
      gNodes.appendChild(c);
    });
  });
  Object.keys(hubPos).forEach(function(ch){
    var h = hubPos[ch];
    gNodes.appendChild(mk("circle",{cx:h.x,cy:h.y,r:20,fill:h.col,class:"ghub"}));
    var t = mk("text",{x:h.x,y:h.y+5,"text-anchor":"middle",fill:"#fff","font-size":15,
      "font-family":"Noto Serif SC, serif","pointer-events":"none"});
    t.textContent = h.n; gNodes.appendChild(t);
    var lb = mk("text",{x:h.x,y:h.y+40,"text-anchor":"middle",fill:"#5d4322","font-size":11.5});
    lb.textContent = h.name.replace(/（.*/,""); gNodes.appendChild(lb);
  });

  var info = document.getElementById("ginfo");
  function showInfo(k, hub){
    document.getElementById("giT").textContent = k.t + "  (" + stars(k.d) + ")";
    document.getElementById("giB").textContent = k.brief;
    document.getElementById("giLk").innerHTML = k.interactive
      ? '<a href="'+k.interactive+'">📱 进入互动讲解</a>'
      : '<span style="color:#c9bfae;font-size:12px">暂无互动页</span>';
    info.classList.add("show");
  }

  document.getElementById("vtTree").addEventListener("click", function(){
    this.classList.add("on"); document.getElementById("vtGraph").classList.remove("on");
    document.getElementById("treeView").style.display="block"; document.getElementById("graphView").style.display="none";
  });
  document.getElementById("vtGraph").addEventListener("click", function(){
    this.classList.add("on"); document.getElementById("vtTree").classList.remove("on");
    document.getElementById("treeView").style.display="none"; document.getElementById("graphView").style.display="block";
  });
})();
</script>
</body>
</html>
