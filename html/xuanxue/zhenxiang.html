<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>真香预演器 · 未来打脸预演</title>
<style>
/* ============================================================
   真香预演器 — 北欧冷淡风 / Nordic deadpan
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --paper:#F2F1ED;
  --paper-2:#FAF9F6;
  --paper-3:#E9E7E1;
  --ink:#141517;
  --ink-2:#56585D;
  --ink-3:#96989C;
  --line:#D6D4CE;
  --line-2:#E4E2DC;
  --accent:#A63A30;
  --accent-bg:rgba(166,58,48,.055);
  --sans:"Inter","Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"PingFang SC",monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
  --gut:clamp(20px,3.6vw,52px);
}

html,body{height:100%;overflow:hidden}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15.5px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-variant-numeric:tabular-nums;
}
::selection{background:var(--ink);color:var(--paper)}

.shell{height:100dvh;display:flex;flex-direction:column}

/* ---------- topbar ---------- */
.topbar{
  height:54px;flex:none;
  display:flex;align-items:center;gap:18px;
  padding:0 var(--gut);
  border-bottom:1px solid var(--line);
}
.brand{font-size:14px;letter-spacing:.04em;font-weight:500}
.brand i{font-style:normal;color:var(--ink-3);margin:0 10px}
.brand-en{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;color:var(--ink-3);text-transform:uppercase}
.topbar .spacer{flex:1}
.step{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--ink-3);text-transform:uppercase}
.step b{color:var(--ink);font-weight:400}

/* ---------- deck ---------- */
.deck{position:relative;flex:1;min-height:0}
.stage{
  position:absolute;inset:0;
  opacity:0;pointer-events:none;
  transition:opacity .55s var(--ease);
  overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;
}
.stage.on{opacity:1;pointer-events:auto}
.stage::-webkit-scrollbar{width:8px}
.stage::-webkit-scrollbar-thumb{background:var(--line);border-radius:0}

/* ---------- shared type ---------- */
.eyebrow{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--ink-3);
  display:flex;align-items:center;gap:10px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line-2);max-width:120px}
.h1{font-size:clamp(30px,3.6vw,46px);font-weight:200;line-height:1.14;letter-spacing:-.02em}
.h1 em{font-style:normal;color:var(--accent)}
.mono{font-family:var(--mono)}
.muted{color:var(--ink-3)}
.tiny{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}

/* ---------- act 1 ---------- */
.act1{
  display:grid;
  grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);
  gap:clamp(28px,5vw,88px);
  padding:clamp(28px,5vh,64px) var(--gut) 40px;
  min-height:100%;
  align-content:start;
}
.col-left{display:flex;flex-direction:column;min-width:0}
.col-right{display:flex;flex-direction:column;min-width:0;padding-top:2px}

.claim-wrap{margin-top:clamp(18px,3.4vh,40px)}
.claim-label{font-size:13px;color:var(--ink-2);line-height:1.9;margin-bottom:6px}
.claim-box{position:relative;border-bottom:1px solid var(--ink);padding-bottom:6px}
.claim-tick{
  position:absolute;left:0;top:2px;
  font-family:var(--mono);font-size:clamp(20px,2.2vw,28px);color:var(--ink-3);
  line-height:1;transition:color .3s;
}
.claim{
  width:100%;background:transparent;border:0;outline:none;
  font-family:var(--sans);
  font-size:clamp(21px,2.6vw,34px);font-weight:200;
  letter-spacing:-.01em;line-height:1.42;
  padding:2px 0 4px 22px;color:var(--ink);
}
.claim::placeholder{color:#B4B2AC;font-weight:200}
.claim-box:focus-within{border-bottom-color:var(--accent)}
.claim-box:focus-within .claim-tick{color:var(--accent)}
.claim-hint{margin-top:10px;font-size:12.5px;color:var(--ink-3);letter-spacing:.01em}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chip{
  font-size:11px;color:var(--ink-2);background:transparent;
  border:1px solid var(--line);padding:5px 10px;border-radius:0;
  cursor:pointer;transition:.2s var(--ease);font-family:var(--sans);
}
.chip:hover{border-color:var(--ink);color:var(--ink)}

/* 生辰 */
.birth{margin-top:clamp(20px,3.2vh,36px)}
.birth-row{
  display:flex;align-items:flex-end;flex-wrap:wrap;gap:4px 2px;
  padding-bottom:9px;border-bottom:1px solid var(--line);
}
.num{
  background:transparent;border:0;outline:none;
  font-family:var(--mono);font-size:15.5px;color:var(--ink);
  text-align:center;padding:2px 1px;transition:color .2s;
  -moz-appearance:textfield;
}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num:focus{color:var(--accent)}
.num.y{width:4.2ch}.num.md{width:2.1ch}.num.mi{width:2.3ch}
.unit{font-size:13px;color:var(--ink-3);padding:0 6px 3px 0}
.sep{padding:0 2px 3px;color:var(--ink-3);font-size:13px}

.city-sel{
  appearance:none;-webkit-appearance:none;
  background:transparent;border:0;outline:none;
  font-family:var(--sans);font-size:14.5px;color:var(--ink);
  padding:2px 18px 2px 0;margin-left:14px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),
                   linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 6px) 55%,calc(100% - 2px) 55%;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
.gender{display:flex;gap:0;margin-left:auto}
.gender button{
  background:transparent;border:1px solid var(--line);border-right:0;
  font-family:var(--sans);font-size:13px;color:var(--ink-3);
  padding:5px 15px;cursor:pointer;transition:.2s var(--ease);
}
.gender button:last-child{border-right:1px solid var(--line)}
.gender button.on{background:var(--ink);border-color:var(--ink);color:var(--paper-2)}

/* 三条路 */
.paths{margin-top:clamp(20px,3.2vh,34px)}
.paths-head{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.path-row{
  display:grid;grid-template-columns:20px 1fr auto;
  gap:10px;align-items:center;
  border-bottom:1px solid var(--line);padding:7px 0;
}
.path-row:focus-within{border-bottom-color:var(--ink)}
.path-key{font-family:var(--mono);font-size:10px;color:var(--ink-3);padding-top:3px}
.path-in{
  background:transparent;border:0;outline:none;width:100%;
  font-family:var(--sans);font-size:15px;color:var(--ink);padding:4px 0;
}
.path-in::placeholder{color:#C0BEB8}
.tagbtn{
  background:transparent;border:1px solid var(--line);border-radius:0;
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  color:var(--ink-2);padding:4px 10px;cursor:pointer;
  transition:.2s var(--ease);white-space:nowrap;min-width:66px;
}
.tagbtn:hover{border-color:var(--ink);color:var(--ink)}
.tagbtn.auto{color:var(--ink-3);border-style:dashed}

/* 直觉 */
.instinct{margin-top:clamp(16px,2.6vh,26px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.instinct .lab{font-size:13px;color:var(--ink-2)}
.radios{display:flex;gap:0}
.radios button{
  background:transparent;border:1px solid var(--line);border-right:0;
  font-family:var(--mono);font-size:12.5px;color:var(--ink-3);
  width:48px;padding:6px 0;cursor:pointer;transition:.2s var(--ease);
}
.radios button:last-child{border-right:1px solid var(--line)}
.radios button.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* 提交 */
.submit-row{
  margin-top:clamp(20px,3.4vh,34px);
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.btn{
  display:inline-flex;align-items:center;gap:16px;
  background:var(--ink);color:var(--paper-2);border:1px solid var(--ink);
  font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  padding:15px 26px;cursor:pointer;transition:.25s var(--ease);
}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn .ar{transition:transform .25s var(--ease)}
.btn:hover .ar{transform:translateX(4px)}
.btn-ghost{
  background:transparent;color:var(--ink-2);border:1px solid transparent;
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  padding:11px 4px;cursor:pointer;transition:.2s;border-bottom:1px solid var(--line);
}
.btn-ghost:hover{color:var(--ink);border-bottom-color:var(--ink)}
.err{color:var(--accent);font-size:12.5px;font-family:var(--mono);letter-spacing:.02em;min-height:16px}

/* ---------- act 2 : 排盘 ---------- */
.act2{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.86fr);
  gap:clamp(24px,4vw,64px);
  padding:clamp(18px,3vh,40px) var(--gut);
  min-height:100%;align-content:center;
}
.ring-wrap{position:relative;display:flex;align-items:center;justify-content:center;min-width:0}
.ring{width:100%;max-width:min(46vh,440px);aspect-ratio:1;overflow:visible}
.ring text{font-family:var(--mono);fill:var(--ink-3);font-size:11px;letter-spacing:.05em}
.ring .lbl-on{fill:var(--ink)}
.ring .core-lbl{fill:var(--ink-3);font-size:8.5px;letter-spacing:.24em}
.ring .core-gz{font-family:var(--mono);fill:var(--ink);font-size:16.5px;letter-spacing:.06em;font-weight:400}
.ring .spoke{stroke:var(--line);stroke-width:1;fill:none}
.ring .spoke-on{stroke:var(--ink);stroke-width:1}
.ring .outer{fill:none;stroke:var(--line);stroke-width:1}
.ring .tick{fill:none;stroke:var(--line);stroke-width:1}
.ring .glow{fill:var(--accent)}
.ring .core-line{stroke:var(--line-2);stroke-width:1}

.dims{display:flex;flex-direction:column;justify-content:center;min-width:0}
.dims-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.dim{
  display:grid;grid-template-columns:26px minmax(74px,auto) 1fr auto;
  gap:10px;align-items:baseline;
  padding:7.5px 0;border-bottom:1px solid var(--line-2);
  opacity:0;transform:translateY(4px);
  transition:opacity .5s var(--ease),transform .5s var(--ease);
}
.dim.in{opacity:1;transform:none}
.dim-no{font-family:var(--mono);font-size:9.5px;color:#BDBBB5;letter-spacing:.06em}
.dim-name{font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.dim-val{font-family:var(--mono);font-size:13px;color:var(--ink);letter-spacing:.02em;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dim-val.dim-no-val{color:var(--ink-3);font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.dim-flag{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--ink-3);opacity:0;transition:opacity .4s}
.dim.done .dim-flag{opacity:1}
.dim.done .dim-flag.ok{color:var(--accent)}

.statusbar{
  margin-top:18px;padding-top:12px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:12px;min-height:30px;
}
.status-dot{width:4px;height:4px;background:var(--accent);flex:none;transition:opacity .3s}
.status-text{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--ink-3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.skip{
  position:absolute;right:0;bottom:-6px;background:transparent;border:0;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--ink-3);
  cursor:pointer;text-transform:uppercase;padding:8px;
}
.skip:hover{color:var(--ink)}

/* ---------- act 3 : 预演 ---------- */
.act3{padding:clamp(20px,3vh,34px) var(--gut) 40px;min-height:100%}
.a3-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.claim-echo{
  font-size:clamp(19px,2.1vw,27px);font-weight:200;letter-spacing:-.01em;
  color:var(--ink);margin-top:8px;max-width:760px;line-height:1.4;
}
.claim-echo span{color:var(--ink-3);font-size:.72em;font-family:var(--mono);letter-spacing:.04em;margin-right:8px}
/* 文本防溢出：长中文段落与英文串在窄屏可断行 */
.claim-echo,.punch-body,.punch-sub,.fv,.fline,.claim-label,.claim-hint,.verdict-inline .v,.dim-val,.fh-t,.fh-r,.fyear-col .fline{overflow-wrap:anywhere;word-break:break-word}

.verdict-inline{
  text-align:right;flex:none;
}
.verdict-inline .k{font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--ink-3);text-transform:uppercase}
.verdict-inline .v{font-size:clamp(16px,1.6vw,20px);font-weight:300;color:var(--accent);letter-spacing:-.005em}

.lanes{margin-top:clamp(16px,2.6vh,28px);border-top:1px solid var(--ink)}
.lane{
  display:grid;grid-template-columns:minmax(0,1.02fr) minmax(140px,1.2fr) 54px 54px;
  gap:clamp(10px,2vw,32px);align-items:center;
  padding:clamp(9px,1.5vh,16px) 0;
  border-bottom:1px solid var(--line);
  cursor:pointer;transition:background .2s var(--ease);
  position:relative;
}
.lane::before{
  content:"";position:absolute;left:calc(var(--gut) * -1);top:0;bottom:0;width:3px;
  background:transparent;transition:background .25s;
}
.lane.sel::before{background:var(--accent)}
.lane:hover{background:rgba(20,21,23,.018)}
.lane:focus-visible{outline:1px solid var(--accent);outline-offset:-1px}
.btn:focus-visible,.btn-ghost:focus-visible,.tagbtn:focus-visible,.chip:focus-visible,.city-sel:focus-visible,.num:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.lane-key{display:flex;align-items:baseline;gap:10px;min-width:0}
.lane-key b{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--ink-3);flex:none}
.lane-key span{font-size:15px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane-bar{position:relative;height:34px}
.lane-bar svg{width:100%;height:34px;display:block;overflow:visible}
.lane-bar .base{stroke:var(--line-2);stroke-width:1}
.lane-bar .poly{fill:none;stroke:var(--ink-3);stroke-width:1}
.lane-bar .pt{fill:var(--paper);stroke:var(--ink-3);stroke-width:1}
.lane.sel .lane-bar .poly{stroke:var(--accent)}
.lane.sel .lane-bar .pt{fill:var(--accent);stroke:var(--accent)}
.num-cell{text-align:right}
.num-cell .n{font-family:var(--mono);font-size:18px;color:var(--ink);line-height:1.1}
.num-cell .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.badge{
  position:absolute;right:-2px;top:-7px;
  font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  background:var(--accent);color:#fff;padding:1.5px 5px;text-transform:uppercase;
}

/* 焦点面板 */
.focus{
  margin-top:clamp(16px,2.6vh,30px);
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  border-top:1px solid var(--line);
}
.fcol{
  padding:clamp(14px,2.2vh,22px) clamp(14px,2vw,26px) clamp(14px,2vh,20px) 0;
  border-right:1px solid var(--line-2);
  min-width:0;
  animation:fin .5s var(--ease) both;
}
.fcol:last-child{border-right:0}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fcol-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:2px}
.fyear{font-size:14.5px;color:var(--ink)}
.fgz{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.fidx{font-family:var(--mono);font-size:clamp(30px,3.2vw,44px);font-weight:300;letter-spacing:-.03em;line-height:1.1;margin:6px 0 2px}
.fidx small{font-size:11px;color:var(--ink-3);letter-spacing:0;margin-left:4px;font-weight:400}
.fline{font-size:14.5px;line-height:1.78;color:var(--ink-2);margin-top:8px;letter-spacing:.005em}
.fwin{margin-top:12px;display:flex;align-items:center;gap:7px}
.fwin i{width:12px;height:1px;background:var(--accent);flex:none;font-style:normal}
.fwin span{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}

/* 判词主体 */
.punch{
  margin-top:clamp(20px,3.2vh,38px);
  padding-top:clamp(16px,2.4vh,26px);
  border-top:1px solid var(--ink);
  display:grid;grid-template-columns:64px 1fr;gap:clamp(12px,2vw,28px);
}
.punch-k{font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--ink-3);text-transform:uppercase;padding-top:9px}
.punch-body{font-size:clamp(21px,2.4vw,33px);font-weight:200;line-height:1.6;letter-spacing:-.012em;max-width:920px}
.punch-body .dim-t{color:var(--ink-3)}
.punch-body .hit{color:var(--accent)}
.punch-sub{margin-top:14px;font-size:14px;color:var(--ink-3);line-height:1.9;max-width:820px}

.a3-foot{
  margin-top:clamp(16px,2.4vh,28px);padding-top:14px;border-top:1px solid var(--line-2);
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.disc-toggle{
  background:transparent;border:0;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--ink-3);
  cursor:pointer;padding:5px 0;text-transform:uppercase;transition:.2s;
}
.disc-toggle:hover{color:var(--ink);border-bottom-color:var(--ink)}
.disc{
  display:none;margin-top:14px;padding:18px 0 0;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px clamp(24px,4vw,64px);
  border-top:1px solid var(--line-2);
  font-size:11.5px;color:var(--ink-2);line-height:1.85;
}
.disc.on{display:grid}
.disc b{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink-3);display:block;margin-bottom:2px;text-transform:uppercase;font-weight:400}
.disc code{font-family:var(--mono);font-size:10.5px;color:var(--ink);background:var(--paper-3);padding:1px 4px}

/* ---------- responsive ---------- */
/* --- focus head + 6-cell grid --- */
.focus-head{
  margin-top:clamp(14px,2.2vh,26px);
  display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding:11px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);
}
.fh-l{display:flex;align-items:center;gap:10px;min-width:0}
.fh-l b{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--ink)}
.fh-t{font-size:15px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fh-badge{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;background:var(--accent);color:#fff;padding:2px 7px;text-transform:uppercase;white-space:nowrap}
.fh-badge.ghost{background:transparent;color:var(--ink-3);border:1px solid var(--line)}
.fh-r{display:flex;gap:18px;font-family:var(--mono);font-size:12.5px;color:var(--ink);white-space:nowrap}
.fh-r i{font-style:normal;color:var(--ink-3);font-size:8.5px;letter-spacing:.14em;margin-right:5px;text-transform:uppercase}
.focus{grid-template-columns:repeat(3,minmax(0,1fr));border-top:0}
.fcol:nth-child(3n){border-right:0}
.fcol:nth-child(-n+3){border-bottom:1px solid var(--line-2)}
.fk{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;color:var(--accent);margin-bottom:7px;text-transform:uppercase}
.fv{font-size:14px;line-height:1.85;color:var(--ink-2)}
.fyear em{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--ink-3);margin-left:7px;letter-spacing:.06em}

<div class="shell">

  <header class="topbar">

      </div>
    </section>

  </div>
</div>

<script>
/* ============================================================

(function (G) {
  'use strict';

  const D2R = Math.PI / 180, R2D = 180 / Math.PI;

    [3, 5], [5, 3, 1], [6, 8, 4], [7], [4, 7, 3], [8, 0]
  ];

    '海中金', '炉中火', '大林木', '路旁土', '剑锋金', '山头火', '涧下水', '城头土', '白蜡金', '杨柳木',
    '泉中水', '屋上土', '霹雳火', '松柏木', '长流水', '沙中金', '山下火', '平地木', '壁上土', '金箔金',
    '覆灯火', '天河水', '大驿土', '钗钏金', '桑柘木', '大溪水', '沙中土', '天上火', '石榴木', '大海水'

  const JU = { 4: 2, 0: 3, 3: 4, 2: 5, 1: 6 };  // 水二 木三 金四 土五 火六

  const DELTA_T = 69 / 86400;   // 2020s 近似 ΔT（天）

  /* ---------------- 儒略日 ---------------- */
  function jdn(y, m, d) {

  function jdFromLocal(y, m, d, hh, mi) {
    const ut = (hh + mi / 60) - 8.0;
    let day = d + ut / 24, Y = y, M = m;
    if (M <= 2) { Y -= 1; M += 12; }
    const A = Math.floor(Y / 100), B = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (Y + 4716)) + Math.floor(30.6001 * (M + 1)) + day + B - 1524.5;

  // JD → 北京时间日历
  function jdToLocal(jd) {
    const z = jd + 8 / 24 + 0.5;
    const Z = Math.floor(z), F = z - Z;
    let A = Z;
    if (Z >= 2299161) { const al = Math.floor((Z - 1867216.25) / 36524.25); A = Z + 1 + al - Math.floor(al / 4); }

  /* ---------------- 太阳 / 月亮黄经 ---------------- */
  function sunLon(jd) {

  function gmst(jd) {

    return mod(280.46061837 + 360.98564736629 * (jd - 2451545.0) + 0.000387933 * T * T - T * T * T / 38710000.0, 360);

    let ra = ramc + offset;
    for (let i = 0; i < 60; i++) {
      const lam = lamFromRa(ra, eps);
      const dec = Math.asin(clamp(Math.sin(rad(eps)) * Math.sin(rad(lam)), -1, 1));
      const t = Math.tan(rad(phi)) * Math.tan(dec);
      if (Math.abs(t) >= 1) return null;
      const ad = deg(Math.asin(t));
      ra = ramc + offset + sign * frac * ad;
    }
    return lamFromRa(ra, eps);
  }
  function ascMc(jd, lon, lat) {
    const ramc = mod(gmst(jd) + lon, 360);
    const eps = obliquity(jd);
    const asc = mod(deg(Math.atan2(Math.cos(rad(ramc)),
      -(Math.sin(rad(ramc)) * Math.cos(rad(eps)) + Math.tan(rad(lat)) * Math.sin(rad(eps))))), 360);

    const c12 = cusp(ramc, eps, lat, 60, 2 / 3, 1);
    const c2 = cusp(ramc, eps, lat, 120, 2 / 3, 1);

      8: c2 === null ? null : mod(c2 + 180, 360), 9: c3 === null ? null : mod(c3 + 180, 360),

  /* ---------------- 新月（Meeus ch.49）---------------- */

      + 0.01039 * Math.sin(2 * F)

      - 0.00514 * E * Math.sin(Mp + M)

      - 0.00111 * Math.sin(Mp - 2 * F)

    while (newMoonJD(k + 1) <= jdTarget && guard++ < 60) k++;
    return k;
  }
  // 朔日 = 新月时刻所在的北京日历日（不是当日正午）
  function newMoonLocalJdn(k) {
    const l = jdToLocal(newMoonJD(k));
    return jdn(l.y, l.m, l.d);
  }
  function lastNewMoonKByDate(targetJdn) {
    let k = Math.round((targetJdn - 2451550.09766) / 29.530588861);
    let guard = 0;
    while (newMoonLocalJdn(k) > targetJdn && guard++ < 60) k--;
    while (newMoonLocalJdn(k + 1) <= targetJdn && guard++ < 60) k++;
    return k;
  }
  const ZHONGQI = [330, 0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300];

  function suiStartK(year) {   // 冬至(year) 所在月的朔
    const dz = solveTerm(270, jdn(year, 12, 22) - 0.5);
    return lastNewMoonK(dz);
  }
  // 农历按「日」归中气：某农历月（朔日→次朔日前一日）是否含中气
  function monthHasZhongqi(kk) {
    const a = newMoonJD(kk), b = newMoonJD(kk + 1);
    const A = newMoonLocalJdn(kk), B = newMoonLocalJdn(kk + 1);
    const l0 = sunLon(a);
    const nextZQ = mod(Math.ceil((l0 + 1e-6) / 30) * 30, 360);
    const approx = a + mod(nextZQ - l0, 360) / 0.9856;
    const t = solveTerm(nextZQ, approx);
    const d = jdToLocal(t);
    const tJdn = jdn(d.y, d.m, d.d);
    return tJdn >= A && tJdn < B;
  }
  function lunarDate(y, m, d) {
    const targetJdn = jdn(y, m, d);
    const k = lastNewMoonKByDate(targetJdn);
    const startJd = newMoonJD(k);
    const dayOfMonth = Math.round(jdn(y, m, d) - newMoonLocalJdn(k)) + 1;

    // 定位 suì（以冬至所在朔为十一月）
    let kA = suiStartK(y - 1), kB = suiStartK(y);
    if (k >= kB) { kA = kB; kB = suiStartK(y + 1); }
    else if (k < kA) { kA = suiStartK(y - 2); kB = suiStartK(y - 1); }
    const total = kB - kA;

    let leapK = null;
    if (total === 13) {
      for (let kk = kA; kk < kB; kk++) {
        if (!monthHasZhongqi(kk)) { leapK = kk; break; }
      }
    }

    let monthNo = 11;
    for (let kk = kA; kk < k; kk++) {
      if (leapK !== null && kk + 1 === leapK) continue;   // 下一月是闰月：不递增，闰月沿用本月序
      monthNo = monthNo % 12 + 1;
    }
    return { month: monthNo, day: dayOfMonth, isLeap: leapK !== null && k === leapK, k: k, leapK: leapK };
  }

  /* ---------------- 四柱 ---------------- */
  const DAY_ANCHOR = jdn(1949, 10, 1);   // 甲子日（与 2000-01-01 戊午互验）

  function fourPillars(y, m, d, hh, mi, lon, lat) {
    // 真太阳时
    const eot = equationOfTime(y, m, d);
    const lonMin = (lon - 120) * 4.0;
    const totalMin = lonMin + eot;
    let tmin = hh * 60 + mi + totalMin;
    let dayShift = 0;
    while (tmin < 0) { tmin += 1440; dayShift -= 1; }
    while (tmin >= 1440) { tmin -= 1440; dayShift += 1; }
    const tsH = Math.floor(tmin / 60), tsM = Math.round(tmin % 60);

    const jdUT = jdFromLocal(y, m, d, hh, mi);
    const lam = sunLon(jdUT);

    // 月柱（节气定月，立春→寅）
    const k = Math.floor(mod(lam - 315, 360) / 30);
    const monthZhi = (k + 2) % 12;

    // 年柱（立春换年）
    const lichun = solveTerm(315, jdn(y, 2, 4) - 0.5);
    const yearForGZ = jdUT >= lichun ? y : y - 1;
    const yearGZ = mod(yearForGZ - 4, 60);
    const yearGan = yearGZ % 10;

    // 月干五虎遁：寅月干 = ((年干%5)*2+2)%10
    const yinGan = ((yearGan % 5) * 2 + 2) % 10;
    const monthGan = (yinGan + mod(monthZhi - 2, 12)) % 10;

    // 日柱（23:00 子时换日）
    const localJdn = jdn(y, m, d) + dayShift;
    let dayIdx = mod(localJdn - DAY_ANCHOR, 60);
    if (tsH >= 23) dayIdx = mod(dayIdx + 1, 60);
    const dayGan = dayIdx % 10, dayZhi = dayIdx % 12;

    // 时柱 五鼠遁
    const hourZhi = Math.floor(mod(tsH + 1, 24) / 2);
    const hourGan = ((dayGan % 5) * 2 + hourZhi) % 10;

    // 大运
    const yangYear = yearGan % 2 === 0;
    const genderMale = arguments[8] !== false;
    const forward = (yangYear === genderMale);
    const kk = Math.floor(mod(lam - 315, 360) / 30);
    const prevTermLon = mod(315 + 30 * kk, 360);
    const nextTermLon = mod(315 + 30 * (kk + 1), 360);
    const prevJie = solveTerm(prevTermLon, jdUT - 12);
    const nextJie = solveTerm(nextTermLon, jdUT + 12);
    const diffDays = forward ? (nextJie - jdUT) : (jdUT - prevJie);
    const startAge = diffDays / 3;

    return {
      ts: { h: tsH, m: tsM, eot: eot, lonMin: lonMin, total: totalMin, shifted: dayShift },
      year: { gan: yearGan, zhi: yearGZ % 12, idx: yearGZ, text: GAN[yearGan] + ZHI[yearGZ % 12] },
      month: { gan: monthGan, zhi: monthZhi, text: GAN[monthGan] + ZHI[monthZhi] },
      day: { gan: dayGan, zhi: dayZhi, idx: dayIdx, text: GAN[dayGan] + ZHI[dayZhi] },
      hour: { gan: hourGan, zhi: hourZhi, text: GAN[hourGan] + ZHI[hourZhi] },
      raw: { jdUT: jdUT, lam: lam, lichunJD: lichun, yearForGZ: yearForGZ },
      dayun: {
        forward: forward, startAge: startAge, diffDays: diffDays,
        prevJie: prevJie, nextJie: nextJie
      }
    };
  }

  /* ---------------- 十神 ---------------- */
  function shiShen(dayGan, otherGan) {
    const me = GAN_WX[dayGan], ot = GAN_WX[otherGan];
    const same = (dayGan % 2) === (otherGan % 2);
    if (ot === me) return same ? '比肩' : '劫财';
    if (ot === (me + 1) % 5) return same ? '食神' : '伤官';
    if (ot === (me + 2) % 5) return same ? '偏财' : '正财';
    if (ot === (me + 3) % 5) return same ? '七杀' : '正官';
    if (ot === (me + 4) % 5) return same ? '偏印' : '正印';
    return '—';
  }
  const SS_GROUP = {
    '比肩': '比劫', '劫财': '比劫', '食神': '食伤', '伤官': '食伤',
    '偏财': '财', '正财': '财', '七杀': '官杀', '正官': '官杀', '偏印': '印', '正印': '印'
  };

  /* ---------------- 五行力量 ---------------- */
  function wuxingPower(p) {
    const pow = [0, 0, 0, 0, 0];
    [[p.year, 1.0], [p.month, 1.05], [p.day, 1.0], [p.hour, 0.95]].forEach(([gz, w]) => {
      pow[GAN_WX[gz.gan]] += w;
    });
    const pillars = [p.year, p.month, p.day, p.hour];
    pillars.forEach((gz, i) => {
      const base = (i === 1) ? 1.6 : 1.2;   // 月支得令加重
      CANG[gz.zhi].forEach((g, j) => {
        pow[GAN_WX[g]] += CANG_W[Math.min(j, 2)] * base;
      });
    });
    return pow;
  }

  function strength(p) {
    const pow = wuxingPower(p);
    const me = GAN_WX[p.day.gan];
    const total = pow.reduce((a, b) => a + b, 0);
    const ally = pow[me] + pow[(me + 4) % 5];        // 比劫 + 印
    const ratio = ally / total;
    let verdict = '中和';
    if (ratio >= 0.58) verdict = '身强';
    else if (ratio <= 0.42) verdict = '身弱';
    return { pow: pow, total: total, ally: ally, ratio: ratio, verdict: verdict, me: me };
  }

  /* ---------------- 喜用 ---------------- */
  function favorability(p, st) {
    const me = st.me;
    const f = [0, 0, 0, 0, 0];
    if (st.verdict === '身弱') {
      f[(me + 4) % 5] += 1.0;   // 印
      f[me] += 0.72;            // 比劫
      f[(me + 1) % 5] -= 0.62;  // 食伤
      f[(me + 2) % 5] -= 0.55;  // 财
      f[(me + 3) % 5] -= 0.45;  // 官杀
    } else if (st.verdict === '身强') {
      f[(me + 1) % 5] += 0.95;  // 食伤
      f[(me + 2) % 5] += 0.88;  // 财
      f[(me + 3) % 5] += 0.70;  // 官杀
      f[(me + 4) % 5] -= 0.80;  // 印
      f[me] -= 0.72;            // 比劫
    } else {
      f[(me + 1) % 5] += 0.42; f[(me + 2) % 5] += 0.38; f[(me + 3) % 5] += 0.34;
      f[(me + 4) % 5] += 0.10; f[me] += 0.05;
    }
    // 调候：冬生寒局先看火，夏生炎局先看水
    const mz = p.month.zhi;
    if ([11, 0, 1].includes(mz)) f[1] += 0.55;
    if ([5, 6, 7].includes(mz)) f[4] += 0.55;
    const mx = Math.max(...f.map(Math.abs)) || 1;
    return { raw: f, norm: f.map(v => v / mx) };
  }

  /* ---------------- 紫微（命宫 / 身宫 / 五行局 / 紫微）---------------- */
  function ziwei(p, lunar) {
    const m = lunar.isLeap ? lunar.month : lunar.month;   // 闰月按本月，须披露
    const base = 2 + (m - 1);                             // 寅起正月
    const ming = mod(base - p.hour.zhi, 12);
    const shen = mod(base + p.hour.zhi, 12);
    const yinGan = ((p.year.gan % 5) * 2 + 2) % 10;
    const mingGan = (yinGan + mod(ming - 2, 12)) % 10;
    const gzIdx = mod((mingGan - GAN.indexOf('甲')) + 10 * 0, 10);
    // 纳音：以 命宫干支 的六十甲子序
    let idx60 = -1;
    for (let i = 0; i < 60; i++) if (i % 10 === mingGan && i % 12 === ming) { idx60 = i; break; }
    const nayin = idx60 >= 0 ? NAYIN[Math.floor(idx60 / 2)] : '—';
    const nwx = idx60 >= 0 ? NAYIN_WX[Math.floor(idx60 / 2)] : 2;
    const ju = JU[nwx] || 5;

    const day = lunar.day, a = Math.floor(day / ju), rem = day % ju;
    let zw;
    if (rem === 0) zw = mod(2 + a - 1, 12);
    else {
      const bu = ju - rem;
      zw = mod(2 + a + (bu % 2 === 0 ? bu : -bu), 12);
    }
    // 十四主星
    const stars = {};
    const put = (pos, name) => { (stars[mod(pos, 12)] = stars[mod(pos, 12)] || []).push(name); };
    put(zw, '紫微'); put(zw - 1, '天机'); put(zw - 3, '太阳'); put(zw - 4, '武曲');
    put(zw - 5, '天同'); put(zw - 8, '廉贞');
    const tf = mod(4 - zw, 12);
    put(tf, '天府'); put(tf + 1, '太阴'); put(tf + 2, '贪狼'); put(tf + 3, '巨门');
    put(tf + 4, '天相'); put(tf + 5, '天梁'); put(tf + 6, '七杀'); put(tf + 10, '破军');

    const mingStars = stars[ming] || [];
    return {
      ming: ming, shen: shen, mingGan: mingGan, gzText: GAN[mingGan] + ZHI[ming],
      nayin: nayin, ju: ju, juName: ['', '', '水二局', '木三局', '金四局', '土五局', '火六局'][ju],
      ziweiPos: zw, mingStars: mingStars, stars: stars, lunarMonth: m, lunarDay: day, isLeap: lunar.isLeap
    };
  }

  /* ---------------- 大运列表 ---------------- */
  function dayunList(p, count) {
    const start = p.dayun.startAge;
    const baseIdx = (() => {
      for (let i = 0; i < 60; i++) if (i % 10 === p.month.gan && i % 12 === p.month.zhi) return i;
      return 0;
    })();
    const out = [];
    for (let i = 1; i <= (count || 9); i++) {
      const idx = mod(baseIdx + (p.dayun.forward ? i : -i), 60);
      const a0 = start + (i - 1) * 10;
      out.push({
        gan: idx % 10, zhi: idx % 12, text: GAN[idx % 10] + ZHI[idx % 12],
        idx: idx, fromAge: a0, toAge: a0 + 10
      });
    }
    return out;
  }

  /* ---------------- 神煞 ---------------- */
  const TAOHUA = { 2: 3, 6: 3, 10: 3, 8: 9, 0: 9, 4: 9, 5: 6, 9: 6, 1: 6, 11: 0, 3: 0, 7: 0 };
  const YIMA = { 2: 8, 6: 8, 10: 8, 8: 2, 0: 2, 4: 2, 5: 11, 9: 11, 1: 11, 11: 5, 3: 5, 7: 5 };
  const YANGREN = { 0: 3, 1: 2, 2: 6, 3: 5, 4: 6, 5: 5, 6: 9, 7: 8, 8: 0, 9: 11 };
  const TIANYI = { 0: [1, 7], 4: [1, 7], 1: [0, 8], 5: [0, 8], 2: [11, 9], 3: [11, 9], 8: [3, 5], 9: [3, 5], 6: [2, 6], 7: [2, 6] };

  function shensha(p) {
    const zhis = [p.year.zhi, p.month.zhi, p.day.zhi, p.hour.zhi];
    const names = ['年', '月', '日', '时'];
    const out = [];
    const ty = TIANYI[p.day.gan];
    zhis.forEach((z, i) => { if (ty.includes(z)) out.push({ name: '天乙贵人', on: names[i] + '支' }); });
    if (zhis.includes(TAOHUA[p.day.zhi])) out.push({ name: '桃花', on: '命局' });
    if (zhis.includes(YIMA[p.day.zhi])) out.push({ name: '驿马', on: '命局' });
    if (zhis.includes(YANGREN[p.day.gan])) out.push({ name: '羊刃', on: '命局' });
    return out;
  }

  /* ---------------- 生命灵数 ---------------- */
  function lifeNumber(y, m, d) {
    const s = `${y}${String(m).padStart(2, '0')}${String(d).padStart(2, '0')}`;
    let n = s.split('').reduce((a, c) => a + (+c), 0);
    const chain = [n];
    while (n > 9) { n = String(n).split('').reduce((a, c) => a + (+c), 0); chain.push(n); }
    return { value: n, chain: chain };
  }

  /* ---------------- 印度 Nakshatra ---------------- */
  const NAK = ['Ashwini', 'Bharani', 'Krittika', 'Rohini', 'Mrigashira', 'Ardra', 'Punarvasu', 'Pushya',
    'Ashlesha', 'Magha', 'Purva Phalguni', 'Uttara Phalguni', 'Hasta', 'Chitra', 'Swati', 'Vishakha',
    'Anuradha', 'Jyeshtha', 'Mula', 'Purva Ashadha', 'Uttara Ashadha', 'Shravana', 'Dhanishta',
    'Shatabhisha', 'Purva Bhadrapada', 'Uttara Bhadrapada', 'Revati'];
  const NAK_CN = ['毕宿', '觜宿', '参宿', '井宿', '鬼宿', '柳宿', '星宿', '张宿', '翼宿', '轸宿', '角宿', '亢宿',
    '氐宿', '房宿', '心宿', '尾宿', '箕宿', '斗宿', '牛宿', '女宿', '虚宿', '危宿', '室宿', '壁宿',
    '奎宿', '娄宿', '胃宿'];
  function ayanamsa(year) { return 23.85 + (year - 2000) * 0.013972; }
  function nakshatra(moonTropical, year) {
    const sid = mod(moonTropical - ayanamsa(year), 360);
    const span = 360 / 27;
    const idx = Math.floor(sid / span);
    const pada = Math.floor((sid - idx * span) / (span / 4)) + 1;
    return { lon: sid, idx: idx, pada: pada, name: NAK[idx], cn: NAK_CN[idx] };
  }

  /* ---------------- 西洋星座 ---------------- */
  const SIGNS = ['白羊', '金牛', '双子', '巨蟹', '狮子', '处女', '天秤', '天蝎', '射手', '摩羯', '宝瓶', '双鱼'];
  function signOf(lon) {
    const i = Math.floor(mod(lon, 360) / 30);
    const within = mod(lon, 360) - i * 30;
    return { idx: i, name: SIGNS[i], deg: Math.floor(within), min: Math.round((within - Math.floor(within)) * 60) };
  }
  const fmtLon = lon => {
    const s = signOf(lon);
    return `${s.name}${s.deg}°${String(s.min).padStart(2, '0')}′`;
  };

  /* ---------------- 主排盘 ---------------- */
  function buildChart(input) {
    const { y, m, d, hh, mi, lon, lat, city, gender } = input;
    const male = gender !== 'female';
    const p = fourPillars(y, m, d, hh, mi, lon, lat, city, male);
    const st = strength(p);
    const fav = favorability(p, st);
    const lunar = lunarDate(y, m, d);
    const zw = ziwei(p, lunar);
    const dy = dayunList(p, 10);
    // 当前大运
    const nowY = new Date().getFullYear();
    const ageNow = nowY - y;
    let curDy = dy[0];
    for (const u of dy) if (ageNow >= u.fromAge && ageNow < u.toAge) { curDy = u; break; }
    if (ageNow < dy[0].fromAge) curDy = { text: p.month.text, fromAge: 0, toAge: dy[0].fromAge, isChild: true, gan: p.month.gan, zhi: p.month.zhi };

    const jdUT = p.raw.jdUT;
    const sun = sunLon(jdUT), moon = moonLon(jdUT);
    const house = ascMc(jdUT, lon, lat);

    return {
      input: input,
      p: p, st: st, fav: fav, lunar: lunar, zw: zw, dayun: dy, curDy: curDy,
      shensha: shensha(p),
      life: lifeNumber(y, m, d),
      nak: nakshatra(moon, y),
      western: {
        sun: sun, moon: moon, asc: house.asc, mc: house.mc,
        sunSign: signOf(sun).name, moonSign: signOf(moon).name, ascSign: signOf(house.asc).name,
        ascText: fmtLon(house.asc), mcText: fmtLon(house.mc)
      },
      ts: p.ts
    };
  }

  const API = {
    GAN, ZHI, WX, WX_EN, SS, SIGNS, NAK, NAK_CN,
    jdn, jdFromLocal, jdToLocal, sunLon, moonLon, solveTerm,
    equationOfTime, ascMc, newMoonJD, lunarDate,
    fourPillars, shiShen, SS_GROUP, wuxingPower, strength, favorability,
    ziwei, dayunList, shensha, lifeNumber, nakshatra, buildChart, signOf, fmtLon,
    clamp, mod
  };
  G.ND = API;
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
})(typeof window !== 'undefined' ? window : globalThis);

    for (const [re, tag] of R) if (re.test(t)) return tag;
    return '官杀';
  }

  const TAGS = [null, '食伤', '财', '官杀', '印', '比劫'];

    '食伤': (me + 1) % 5, '财': (me + 2) % 5, '官杀': (me + 3) % 5, '印': (me + 4) % 5, '比劫': me

  function relation(a, b) {
    if (a === b) return 1;
    if ((a + 1) % 5 === b) return 0.65;
    if ((b + 1) % 5 === a) return 0.45;
    if ((a + 2) % 5 === b) return -0.55;
    if ((b + 2) % 5 === a) return -0.85;
    return 0;

  /* ---------------- 启动 ---------------- */
  function readForm() {
    const y = +$('#bY').value, m = +$('#bM').value, d = +$('#bD').value;

  function start() {
    const f = readForm();
    const errs = [];
    if (!f.claim) errs.push('命题为空');
    if (!(f.y >= 1900 && f.y <= 2099)) errs.push('出生年超出 1900–2099');
    if (!(f.m >= 1 && f.m <= 12)) errs.push('月份非法');
    if (!(f.d >= 1 && f.d <= 31)) errs.push('日期非法');
    if (f.paths.filter(Boolean).length < 3) errs.push('三条路要写满');
    if (errs.length) { $('#err').textContent = '× ' + errs.join(' · '); return; }
    $('#err').textContent = '';

    S.claim = f.claim;
    const chart = E.buildChart({
      y: f.y, m: f.m, d: f.d, hh: f.h, mi: f.mi, lon: f.lon, lat: f.lat,
      city: f.city, gender: S.gender
    });
    S.chart = chart;

    // 路径
    S.paths = f.paths.map((text, i) => {
      const tag = S.tags[i] || autoTag(text, S.gender) || '官杀';
      return { key: 'ABC'[i], text, tag, elem: ELEM_OF(tag, chart.st.me) };
    });

    const now = new Date();
    S.years = [now.getFullYear(), now.getFullYear() + 1, now.getFullYear() + 2];

    scoreAll();
    goAct(2);
    runCast();
  }

  /* ---------------- 评分 ---------------- */
  function dayunAt(chart, year) {
    const age = year - chart.input.y;
    if (age < chart.dayun[0].fromAge) {
      return { text: chart.p.month.text, gan: chart.p.month.gan, zhi: chart.p.month.zhi, fromAge: 0, toAge: chart.dayun[0].fromAge, child: true };
    }
    for (const u of chart.dayun) if (age >= u.fromAge && age < u.toAge) return u;
    return chart.dayun[chart.dayun.length - 1];
  }
  function chongHe(chart, lnZhi) {
    const dz = chart.p.day.zhi, yz = chart.p.year.zhi;
    let v = 0;
    if (mod(lnZhi - dz, 12) === 6) v -= 5;
    if (mod(lnZhi - yz, 12) === 6) v -= 3;
    const LIUHE = { 0: 1, 1: 0, 2: 11, 11: 2, 3: 10, 10: 3, 4: 9, 9: 4, 5: 8, 8: 5, 6: 7, 7: 6 };
    if (LIUHE[lnZhi] === dz) v += 3;
    return v;
  }
  function annual(chart, elem, year) {
    const fav = chart.fav.norm[elem];
    const dy = dayunAt(chart, year);
    const li = mod(year - 4, 60), lg = li % 10, lz = li % 12;
    const yunRel = 0.4 * relation(elem, GAN_WX_[dy.gan]) + 0.6 * relation(elem, ZHI_WX_[dy.zhi]);
    const lnRel = 0.4 * relation(elem, GAN_WX_[lg]) + 0.6 * relation(elem, ZHI_WX_[lz]);
    const yq = chongHe(chart, lz);
    return clamp(50 + fav * 26 + yunRel * 9 + lnRel * 8 + yq, 22, 95);
  }
  // 引擎未导出五行映射，此处本地复写
  const GAN_WX_ = [0, 0, 1, 1, 2, 2, 3, 3, 4, 4];
  const ZHI_WX_ = [4, 2, 0, 0, 2, 1, 1, 2, 3, 3, 2, 4];

  function resistance(chart, path, idx) {
    let r = 34;
    r += (idx !== S.instinct) ? 30 : -24;
    const strong = chart.st.verdict === '身强';
    if ((path.tag === '食伤' || path.tag === '财') && !strong) r += 14;
    if ((path.tag === '官杀' || path.tag === '印') && strong) r += 8;
    if (/辞职|创业|分手|离婚|离开|搬|出国|裸辞|放弃|退出|拒绝|断|单干/.test(path.text)) r += 12;
    r += relation(path.elem, chart.st.me) * -8;
    return clamp(Math.round(r), 4, 96);
  }

  function scoreAll() {
    S.paths.forEach((p, i) => {
      p.yearly = S.years.map(y => Math.round(annual(S.chart, p.elem, y)));
      p.fit = Math.round(p.yearly[0] * 0.4 + p.yearly[1] * 0.35 + p.yearly[2] * 0.25);
      p.resist0 = resistance(S.chart, p, i);
      const fav = S.chart.fav.norm[p.elem];
      p.resist = [
        p.resist0,
        Math.round(p.resist0 * (0.70 - 0.22 * fav)),
        Math.round(p.resist0 * (0.70 - 0.22 * fav) * (0.62 - 0.24 * fav))
      ].map(v => clamp(v, 2, 96));
    });
    const order = S.paths.map((p, i) => [p.fit, i]).sort((a, b) => b[0] - a[0]);
    S.truth = order[0][1];
    S.paths.forEach((p, i) => { p.isTruth = i === S.truth; });
    S.sel = S.truth;
  }

  /* ---------------- 第二幕：排盘动效 ---------------- */
  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }

  function buildRing() {
    const c = S.chart;
    const g = $('#spokes'), gl = $('#dimLabels'), gc = $('#core');
    g.innerHTML = ''; gl.innerHTML = ''; gc.innerHTML = '';
    const cx = 240, cy = 240, r0 = 52, r1 = 148;

    const outer = $('#ringOuter');
    const circ = 2 * Math.PI * 150;
    outer.style.strokeDasharray = circ;
    outer.style.strokeDashoffset = circ;
    outer.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.22,.61,.36,1)';

    const DIMS = [
      '四柱八字', '真太阳时', '大运', '紫微斗数', '西洋占星', '印度月宿', '生命灵数', '称骨', '姓名五格'
    ];
    const active = 7;

    for (let i = 0; i < 9; i++) {
      const a = (-90 + i * 40) * Math.PI / 180;
      const x0 = cx + Math.cos(a) * r0, y0 = cy + Math.sin(a) * r0;
      const x1 = cx + Math.cos(a) * r1, y1 = cy + Math.sin(a) * r1;
      const len = Math.hypot(x1 - x0, y1 - y0);
      const ln = el('line', {
        x1: x0, y1: y0, x2: x1, y2: y1,
        class: 'spoke' + (i < active ? ' spoke-on' : ''),
        'stroke-dasharray': len, 'stroke-dashoffset': len
      }, g);
      ln.style.transition = 'stroke-dashoffset .7s cubic-bezier(.22,.61,.36,1)';
      ln.style.transitionDelay = (0.18 + i * 0.085) + 's';

      const lx = cx + Math.cos(a) * (r1 + 16), ly = cy + Math.sin(a) * (r1 + 16);
      const anchor = Math.cos(a) > 0.3 ? 'start' : (Math.cos(a) < -0.3 ? 'end' : 'middle');
      const t = el('text', {
        x: lx, y: ly + 3, 'text-anchor': anchor,
        class: 'lbl' + (i < active ? ' lbl-on' : '')
      }, gl);
      t.textContent = DIMS[i];
      t.style.opacity = 0;
      t.style.transition = 'opacity .5s ease';
      t.style.transitionDelay = (0.35 + i * 0.09) + 's';
    }

    // 中心四柱
    const p = c.p;
    const pairs = [[-52, -14, p.year.text], [52, -14, p.month.text], [-52, 14, p.day.text], [52, 14, p.hour.text]];
    const lbl = el('text', { x: 240, y: 208, 'text-anchor': 'middle', class: 'core-lbl' }, gc);
    lbl.textContent = 'FOUR PILLARS';
    lbl.style.opacity = 0; lbl.style.transition = 'opacity .5s'; lbl.style.transitionDelay = '.9s';
    pairs.forEach(([dx, dy, txt], i) => {
      const t = el('text', {
        x: 240 + dx, y: 240 + dy, 'text-anchor': 'middle', class: 'core-gz'
      }, gc);
      t.textContent = txt;
      t.style.opacity = 0;
      t.style.transition = 'opacity .45s ease';
      t.style.transitionDelay = (0.85 + i * 0.11) + 's';
    });
    return outer;
  }

  /* ---------------- 第三幕 ---------------- */

    const d = E.jdToLocal(jd);
    return `${d.m} 月 ${d.d} 日`;

      ['结构对你有用。{s}做的那个决定，当时看只是省事，事后看是对的。',
       '不会有大惊喜，也不会有大意外。稳定的价值要到第二年才结算。',
       '你会被放进一个更窄但更稳的位置。当时不情愿，事后看是保护。'],
      ['不好不坏。你会用「还行」概括它，这个词会盖掉很多细节。',
       '{s}前后有一次机会从手边过。你没伸手，也没后悔。',
       '这一年你守住的比拿到的多。这笔账要到第三年才算得清。'],
      ['这一年你会怀疑自己是不是选错了。答案是没选错，是节奏错了。',
       '{s}之后压力会集中出现。分散处理，别一次算总账。',
       '{s}之后你会被要求替一个不属于你的决定背书。可以答应，但要留记录。']
    ],
    '养': [
      ['这一年适合打底，不适合亮相。{s}前后你能拿到一个资格或一次准入。',
       '你会在没人看见的地方变强。到第二年才有人发现。',
       '你补的是底子，不是履历。三年后差别会出现在这里。'],
      ['进度条动得很慢。慢不等于停，但这件事要你自己确认。',
       '{s}之后你会遇到一个能教你的人。别急着证明自己已经懂了。',
       '输入大于输出。这个比例再持续一年是好事，再持续三年是问题。'],
      ['这一年学的东西短期内兑不出来。接受这一点，否则中途会放弃。',
       '{s}前后你会怀疑自己在逃避。判断标准只有一个：有没有产出物。',
       '你会把学习当成拖延的合法形式。检验标准：有没有人愿意为它付钱。']
    ],
    '衡': [
      ['有人替你分担。在你的命局里这不算常态，别当成理所当然。',
       '{s}之后你会遇到一个和你走同一条路的人。他不是对手。',
       '替你说话的人比你主动争取的多。别纠正他们。'],
      ['人际上有消耗也有补充，大致持平。你不会记住这一年的人。',
       '{s}前后有一次立场之争。你赢了，但没什么意义。',
       '{s}之后你会重新划线：谁可以进来，谁只能到门口。'],
      ['会有人从你的盘子里拿走一块。你不会当场发现。',
       '这一年别合伙。你的判断在这个位置容易被人情覆盖。',
       '你会替别人承担一次后果。承担可以，别承担第二次。']
    ]
  };

  function lineFor(path, year, idx, score) {
    const nat = NATURE[path.tag] || '守';
    const bucket = LINES[nat][TONE(score)];
    const variant = (S.paths.indexOf(path) + idx) % 3;
    return bucket[variant].replace('{s}', seasonOf(path.elem, year));
  }

  function basisText(path) {
    const c = S.chart, p = c.p, st = c.st, fav = c.fav.norm[path.elem];
    const dy = dayunAt(c, S.years[1]);
    const rel = 0.4 * relation(path.elem, GAN_WX_[dy.gan]) + 0.6 * relation(path.elem, ZHI_WX_[dy.zhi]);
    const relTxt = rel > 0.6 ? '同气，路是顺的' : rel > 0.1 ? '相生，走得动' : rel > -0.4 ? '无甚助力，只能靠自己' : '相克，逆着推';
    return `日主${E.GAN[p.day.gan]}${E.WX[st.me]}${st.verdict}；此路取${E.WX[path.elem]}，为${SS_NAME[path.tag]}，喜忌 ${fav >= 0 ? '+' : ''}${fav.toFixed(2)}；${S.years[1]} 年行 ${dy.text} 运，${relTxt}。`;
  }

  function verdictText(path) {
    const high = path.fit >= 70, low = path.fit < 58;
    const nat = NATURE[path.tag];
    if (high && nat === '动') return '这条路顺，但不会顺在你以为的地方。它奖赏持续输出，不奖赏一次押注。';
    if (high && nat === '取') return '这条路对你有实际好处，代价是你得先承认自己在乎那些好处。';
    if (high && nat === '守') return '结构站在你这边。你要做的只是待够久，并且别在中途自我怀疑。';
    if (high && nat === '养') return '这条路回报慢，但回报不会跑。你需要的是耐心，不是方法。';
    if (high && nat === '衡') return '这条路要靠人。你命局里比劫不弱，借力比自己扛省一半。';
    if (low && nat === '动') return '这条路不是不能走，是走了要付两倍价。你不缺勇气，缺缓冲。';
    if (low && nat === '取') return '这条路会和你的节奏打架。钱能拿到，但你会在过程中持续内耗。';
    if (low && nat === '守') return '这条路安全，但安全在这里等于停滞。你能忍，忍完会有账要算。';
    if (low && nat === '养') return '这条路会让你越走越轻，但三年内兑不出任何可展示的东西。';
    if (low && nat === '衡') return '这条路最大的风险不是失败，是你的判断会被人情反复覆盖。';
    return '这条路不算差，也不算对。它会给你一个能接受的中间结果。';
  }

  function adviceText(path) {
    const y = S.years[1], s = seasonOf(path.elem, y);
    if (path.fit >= 68) return `在 ${y} 年 ${s} 之后动手。之前只做准备，不谈条件。`;
    if (path.fit >= 56) return `先做到 ${y} 年 ${s} 再说。在这之前，任何决定都只能算草稿。`;
    return `如果一定要走，把 ${y} 年 ${s} 当最后窗口；过了这一次，下一个窗口在换运之后。`;
  }

  function renderResult() {
    const c = S.chart;
    $('#claimEcho').innerHTML = `<span>命题</span>「${S.claim}」`;

    const truth = S.paths[S.truth], inst = S.paths[S.instinct];
    $('#verdictInline').textContent = (S.truth === S.instinct)
      ? `真香在 ${truth.key}，你的直觉这次是对的。`
      : `真香在 ${truth.key}，不在 ${inst.key}。`;

    // lanes
    const lanes = $('#lanes');
    lanes.innerHTML = '';
    S.paths.forEach((p, i) => {
      const row = document.createElement('div');
      row.className = 'lane' + (i === S.sel ? ' sel' : '');
      row.dataset.i = i;
      row.innerHTML =
        `<div class="lane-key"><b>${p.key}</b><span>${p.text}</span></div>` +
        `<div class="lane-bar" data-bar="${i}"></div>` +
        `<div class="num-cell"><div class="n">${p.fit}</div><div class="k">契合</div></div>` +
        `<div class="num-cell"><div class="n">${p.resist[0]}</div><div class="k">抗拒</div></div>` +
        (p.isTruth ? `<div class="badge">真香</div>` : '');
      row.onclick = () => selectLane(i);
      row.tabIndex = 0;
      row.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); selectLane((S.sel + 1) % S.paths.length); row.blur(); }
        if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); selectLane((S.sel + 2) % S.paths.length); row.blur(); }
      });
      lanes.appendChild(row);
    });
    requestAnimationFrame(drawSpark);

    // focus
    renderFocus();

    // punch
    const endY = S.years[2];
    $('#punchBody').innerHTML =
      `<span class="dim-t">${endY} 年 ${seasonOf(truth.elem, endY)}，你做了那件你说是不会做的事 ——</span><br>` +
      `<span class="hit">「${truth.text}」</span>`;
    const neg = S.claim.match(/^(我)?(不会|不可能|不是|绝不|永远不)/);
    $('#punchSub').innerHTML = neg
      ? `你没有说「真香」。你只是把「${neg[0]}」改成了「当时觉得${neg[2] === '不是' ? '不是' : '不会'}」。`
      : `你没有说「真香」。你只是又补了一句：「当时情况不一样」。`;

    renderDisc();
    goAct(3);
  }

  /* 切换路径：仅局部刷新焦点面板，不整屏重渲染（避免闪烁/跳动） */
  function selectLane(i) {
    if (i === S.sel) return;
    S.sel = i;
    $$('.lane').forEach((l, k) => l.classList.toggle('sel', k === i));
    renderFocus();
    const sel = $$('.lane')[i];
    if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function renderFocus() {
    const c = S.chart, p = S.paths[S.sel];
    const fh = document.getElementById('focusHead') || (() => {
      const d = document.createElement('div');
      d.id = 'focusHead'; d.className = 'focus-head';
      $('#lanes').insertAdjacentElement('afterend', d);
      return d;
    })();
    fh.innerHTML =
      `<div class="fh-l">` +
        (p.isTruth ? `<span class="fh-badge">真香路径</span>` : `<span class="fh-badge ghost">${p.key}</span>`) +
        `<b>${p.key}</b><span class="fh-t">${p.text}</span>` +
      `</div>` +
      `<div class="fh-r">` +
        `<span><i>契合</i>${p.fit}</span>` +
        `<span><i>抗拒</i>${p.resist.join(' → ')}</span>` +
        `<span><i>底色</i>${p.tag}</span>` +
      `</div>`;

    const cells = [
      ['判', verdictText(p), 'g'],
      ['依', basisText(p), 'g'],
      ['议', adviceText(p), 'g'],
      ...S.years.map((y, i) => {
        const li = mod(y - 4, 60);
        const gz = E.GAN[li % 10] + E.ZHI[li % 12];
        const ss = E.shiShen(c.p.day.gan, li % 10);
        return [`${y}`, '', 'y', gz + ' · ' + ss, p.yearly[i], lineFor(p, y, i, p.yearly[i])];
      })
    ];
    const fw = $('#focus');
    fw.innerHTML = '';
    [0, 1, 2].forEach(i => {
      const d = document.createElement('div');
      d.className = 'fcol';
      d.innerHTML = `<div class="fk mono">${cells[i][0]}</div><div class="fv">${cells[i][1]}</div>`;
      d.style.animationDelay = (i * 0.04) + 's';
      fw.appendChild(d);
    });
    [3, 4, 5].forEach(i => {
      const d = document.createElement('div');
      d.className = 'fcol fyear-col';
      d.innerHTML =
        `<div class="fcol-top"><span class="fyear">${cells[i][0]}${i === 3 ? '<em>余 ' + daysLeft() + ' 天</em>' : ''}</span>` +
        `<span class="fgz">${cells[i][3]}</span></div>` +
        `<div class="fidx">${cells[i][4]}<small>/100</small></div>` +
        `<div class="fline">${cells[i][5]}</div>` +
        `<div class="fwin"><i></i><span>${seasonOf(p.elem, S.years[i - 3])} 起算</span></div>`;
      d.style.animationDelay = ((i - 3) * 0.05 + 0.08) + 's';
      fw.appendChild(d);
    });
  }

  function daysLeft() {
    const n = new Date();
    return E.jdn(n.getFullYear(), 12, 31) - E.jdn(n.getFullYear(), n.getMonth() + 1, n.getDate());
  }

  function drawSpark() {
    $$('.lane-bar').forEach(box => {
      const i = +box.dataset.bar, p = S.paths[i];
      const w = box.clientWidth || 300, h = 34, pad = 7;
      const xs = [pad, w / 2, w - pad];
      const ys = p.yearly.map(v => h - 6 - clamp((v - 35) / 60, 0, 1) * (h - 12));
      let svg = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">`;
      svg += `<line class="base" x1="0" y1="${h - 4}" x2="${w}" y2="${h - 4}" vector-effect="non-scaling-stroke"/>`;
      svg += `<polyline class="poly" points="${xs.map((x, k) => x + ',' + ys[k].toFixed(1)).join(' ')}" vector-effect="non-scaling-stroke"/>`;
      xs.forEach((x, k) => { svg += `<circle class="pt" cx="${x}" cy="${ys[k].toFixed(1)}" r="2.6" vector-effect="non-scaling-stroke"/>`; });
      svg += `</svg>`;
      box.innerHTML = svg;
    });
  }

  function renderDisc() {
    const c = S.chart;
    const fv = c.fav.norm.map((v, i) => `${E.WX[i]} ${v >= 0 ? '+' : ''}${v.toFixed(2)}`).join(' / ');
    $('#disc').innerHTML =
      `<div><b>契合度 / FIT</b>契合 = 50 + 喜忌 × 26 + 大运同气 × 9 + 流年助力 × 8 ± 冲合（−5…+3）。喜忌取扶抑 + 调候合成系数，范围 −1…+1。区间 22–95。</div>` +
      `<div><b>抗拒指数 / RESIST</b>基线 34；非直觉首选 +30、直觉首选 −24；变动型路径逢身弱 +14；守成型逢身强 +8；文案含强变动动词 +12；与日主五行相克再 +8…。三年按契合度衰减。</div>` +
      `<div><b>本盘喜忌系数</b><code>${fv}</code>　日主${E.GAN[c.p.day.gan]}${E.WX[c.st.me]}${c.st.verdict}（同类占比 ${(c.st.ratio * 100).toFixed(1)}%）</div>` +
      `<div><b>路径底色</b>由关键词自动识别，可点击按钮强制覆盖。底色决定该路径取哪一五行：食伤=我生、财=我克、官杀=克我、印=生我、比劫=同我。</div>` +
      `<div><b>未接入</b>称骨（未置骨重表）、姓名五格（未提供姓名）、双人合盘（需第二人）。本版不计算十四主星与四化，紫微仅取命宫/身宫/五行局/紫微星位。</div>` +
      `<div><b>精度</b>真太阳时用经度差 + NOAA 均时差；节气由太阳视黄经反解，误差约 ±15 分钟；农历由定朔 + 中气置闰推得，已对 1900–2100 全量校验。仅支持 UTC+8 出生地。</div>` +
      `<div><b>口径</b>此分数衡量的是「兑现难度」，不是好坏。换一套同样合理的规则，五域可整体浮动 ±10 分；跨命主不可比。</div>` +
      `<div><b>边界</b>命理不预测具体事件。以上全部判词由规则引擎按干支关系拼装，可逐条追溯，不含随机数。</div>`;
  }

  /* ---------------- boot ---------------- */
  window.addEventListener('resize', () => { if (curAct === 3) drawSpark(); });
  initForm();
  [0, 1, 2].forEach(renderTag);

  // 演示 / 截图直达：#demo1 #demo2 #demo3 ；追加 fast 可跳过排盘动画直出预演
  const H = (location.hash || '').match(/^#demo([123])$/);
  const FAST = /fast/i.test(location.hash + ' ' + location.search);
  if (H) { loadDemo(+H[1] - 1); start(); }
})();

</script>
</body>
</html>
