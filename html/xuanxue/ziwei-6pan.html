<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紫微斗数 · 六层叠盘 · 活盘 v1.0（标准化产品版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 「道」风格设计令牌 —— 暖灰 / 米白 / 炭黑 / 东方禅意 */
  --bg-main:#efece6;          /* 暖灰米白底 */
  --bg-surface:#f7f5f0;       /* 卡片表面 */
  --bg-sunken:#e7e3db;        /* 凹陷表面（输入区/侧栏） */
  --ink:#2b2823;              /* 主文字 炭黑 */
  --ink-soft:#5a554c;         /* 次级文字 */
  --ink-muted:#928c80;        /* 弱化文字 */
  --accent:#8a5a2b;           /* 深棕主色（替代原 gold） */
  --accent-soft:#a9803f;      /* 浅棕强调 */
  --card-radius:10px;
  --ctrl-radius:8px;
  --btn-radius:999px;
  --card-bg:var(--bg-surface);
  --border-subtle:rgba(43,40,35,0.10);
  --border-strong:rgba(43,40,35,0.18);
  --shadow-soft:0 1px 3px rgba(43,40,35,0.06),0 6px 18px rgba(43,40,35,0.05);
  --shadow-card:0 2px 10px rgba(43,40,35,0.07);
  /* 六层区分色：低饱和温和色（在浅底上可辨识） */
  --layer1:#9c6b2f;
  --layer2:#b07d3a;
  --layer3:#7d9b6a;
  --layer4:#5f8aa6;
  --layer5:#8a6fae;
  --layer6:#b06b5a;
  --text-title:var(--ink);
  --text-body:var(--ink-soft);
  --text-muted:var(--ink-muted);
  --danger-red:#b34a3f;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Noto Sans SC",system-ui,sans-serif;
  background:var(--bg-main);
  color:var(--text-body);
  min-height:100vh;
  display:flex;flex-direction:column;
  overflow-x:hidden;position:relative;
}
/* 极弱化的纸纹底，替代原星空动画，保持「道」的静谧质感 */
.paper-grain{
  position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.5;
  background-image:radial-gradient(rgba(43,40,35,0.025) 1px,transparent 1px);
  background-size:22px 22px;
}
.wrapper{position:relative;z-index:1;display:flex;flex-direction:column;flex:1}

/* 合规开场声明 */
.compliance-banner{
  background:rgba(138,90,43,0.08);
  border-bottom:1px solid rgba(138,90,43,0.22);
  padding:6px 16px;font-size:10px;color:var(--ink-soft);
  text-align:center;letter-spacing:0.5px;line-height:1.6;
}
.compliance-banner b{color:var(--accent)}

/* 输入面板 */
.input-panel{
  background:var(--bg-sunken);
  border-bottom:1px solid var(--border-subtle);
  padding:10px 16px;
  display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;
  font-size:11px;
}
.input-group{display:flex;flex-direction:column;gap:3px}
.input-group label{color:var(--text-muted);font-size:9px;letter-spacing:1px}
.input-group select,.input-group input{
  background:var(--bg-surface);color:var(--ink);
  border:1px solid var(--border-strong);border-radius:var(--ctrl-radius);
  padding:4px 8px;font-size:11px;font-family:inherit;
  outline:none;cursor:pointer;box-shadow:var(--shadow-soft);
}
.input-group select:focus{border-color:var(--accent)}
.input-group select option{background:var(--bg-surface);color:var(--ink)}
/* 深色实心主按钮（排盘）——「道」主色 */
.btn-calc{
  border-radius:var(--btn-radius);border:1px solid var(--accent);
  color:#f3ede3;background:var(--accent);
  padding:5px 18px;font-size:11px;cursor:pointer;
  font-family:inherit;letter-spacing:2px;font-weight:500;
  transition:all 0.25s;box-shadow:var(--shadow-soft);
}
.btn-calc:hover{background:#7a4e25;border-color:#7a4e25}
/* 浅色描边次级按钮（生成报告 / 知识库） */
.btn-action{
  border-radius:var(--btn-radius);border:1px solid var(--border-strong);
  color:var(--ink-soft);background:var(--bg-surface);
  padding:5px 14px;font-size:10px;cursor:pointer;font-family:inherit;
  transition:all 0.25s;box-shadow:var(--shadow-soft);
}
.btn-action:hover{border-color:var(--accent);color:var(--accent)}

.header{text-align:center;padding:14px 16px 10px;border-bottom:1px solid var(--border-subtle)}
.header h1{font-family:"Noto Serif SC",serif;font-size:18px;color:var(--ink);letter-spacing:4px;font-weight:700}
.header .sub{color:var(--text-muted);font-size:11px;margin-top:3px;letter-spacing:0.5px}
.header .ver{color:var(--accent-soft);font-size:9px;margin-top:2px;letter-spacing:1px}

.layer-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 12px 4px;align-items:stretch}
.lbtn{padding:6px 4px;border-radius:var(--btn-radius);border:1px solid var(--border-strong);background:var(--bg-surface);color:var(--text-muted);font-size:12px;font-family:inherit;cursor:pointer;transition:all 0.25s;white-space:nowrap;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:var(--shadow-soft);line-height:1.25}
.lbtn .lname{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.lbtn .lsub{font-size:9px;opacity:0.75;transform:scale(0.92);transform-origin:center}
.lbtn .star{color:var(--accent);font-size:11px;margin-left:1px}
.lbtn.on{color:var(--ink)}
.lbtn.hi{color:#f3ede3;font-weight:600;border-color:transparent}
.lbtn.hi .ldot{box-shadow:0 0 0 2px rgba(255,255,255,0.35)}
.lbtn.hi .lsub{opacity:0.9}
.lbtn.off{color:var(--text-muted);opacity:0.6;border-style:dashed;border-color:var(--border-subtle);background:var(--bg-sunken)}
.lbtn.off .ldot{opacity:0.4}
.lbtn.off .lsub{opacity:0.55}
.lbtn:hover{transform:translateY(-1px)}
.lbtn.reset{grid-column:1 / -1;flex-direction:row;padding:5px;color:var(--accent);border-color:var(--accent);background:rgba(138,90,43,0.06);font-weight:600;font-size:11px}
.nav-hint{grid-column:1 / -1;text-align:center;font-size:9px;color:var(--text-muted);opacity:0.75;margin-top:2px;padding:0 4px}
.legend{display:flex;justify-content:center;gap:12px;padding:4px 12px 10px;font-size:10px;color:var(--text-muted);flex-wrap:wrap}
.lg-item{display:inline-flex;align-items:center;opacity:0.7;transition:opacity 0.2s}
.lg-item.hi{opacity:1;color:var(--ink);font-weight:600}
.lg-item.off{opacity:0.35;text-decoration:line-through}
.ldot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle;border:1px solid rgba(43,40,35,0.15)}

.main{display:flex;flex:1;gap:14px;padding:8px 16px 16px;min-height:0}
.rings{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
#ringCanvas{display:block;cursor:pointer;border-radius:var(--card-radius);max-width:100%;height:auto}
.readout{flex:1;min-width:260px;max-width:380px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:calc(100vh - 200px)}
.readout::-webkit-scrollbar{width:5px}
.readout::-webkit-scrollbar-track{background:transparent}
.readout::-webkit-scrollbar-thumb{background:rgba(43,40,35,0.15);border-radius:3px}

.rcard{background:var(--card-bg);border:1px solid var(--border-subtle);border-radius:var(--card-radius);padding:14px 16px;box-shadow:var(--shadow-card)}
.rcard h3{font-family:"Noto Serif SC",serif;color:var(--accent);font-size:13px;margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid var(--border-subtle);font-weight:600}
.ehint{color:var(--text-muted);font-size:11px;line-height:1.8}

.lstrip{margin-bottom:6px;border-radius:var(--card-radius);overflow:hidden;border:1px solid var(--border-subtle);border-left-width:3px;background:var(--bg-surface);box-shadow:var(--shadow-soft)}
.lhead{display:flex;align-items:center;gap:6px;padding:8px 11px 6px;cursor:pointer;user-select:none;flex-wrap:wrap}
.ltag{font-size:9px;font-weight:700;padding:1px 7px;border-radius:var(--btn-radius);color:#fff;flex-shrink:0}
.lp{font-size:10px;color:var(--text-muted)}
.ls{font-size:12px;font-weight:600;font-family:"Noto Serif SC",serif;color:var(--ink)}
.lexp{font-size:9px;color:var(--text-muted);margin-left:auto}
.lbody{padding:2px 11px 10px;font-size:11px;line-height:1.7;display:none}
.lstrip.open .lbody{display:block}
.lstrip:not(.open) .lexp::after{content:' ▼'}
.lstrip.open .lexp::after{content:' ▲'}
.sug{margin-top:6px;padding:7px 9px;border-radius:var(--ctrl-radius);background:rgba(138,90,43,0.06);border:1px solid rgba(138,90,43,0.12);font-size:11px;line-height:1.7;color:var(--ink-soft)}
.sug-mark{color:var(--accent);font-weight:600;margin-right:4px}

.resonance{background:rgba(179,74,63,0.08);border:1px solid var(--danger-red);border-radius:var(--card-radius);padding:9px 13px;font-size:11px;color:#9c4a40;line-height:1.7;display:none;box-shadow:var(--shadow-soft)}
.resonance.show{display:block}
.resonance strong{color:var(--danger-red);font-family:"Noto Serif SC",serif}

.cross{background:var(--card-bg);border:1px solid var(--border-subtle);border-radius:var(--card-radius);padding:14px 16px;box-shadow:var(--shadow-card)}
.cross h3{font-family:"Noto Serif SC",serif;color:var(--accent);font-size:13px;margin-bottom:8px;font-weight:600}
.cr{display:flex;align-items:center;gap:5px;padding:5px 0;font-size:11px;border-bottom:1px solid rgba(43,40,35,0.05)}
.cr:last-child{border:none}
.ctag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:var(--ctrl-radius);color:#fff;text-align:center;flex-shrink:0}
.carr{color:var(--text-muted);font-size:9px}
.cp{font-weight:600;font-family:"Noto Serif SC",serif;color:var(--ink)}
.cs{color:var(--text-muted);margin-left:auto;font-size:10px}

.info{text-align:center;padding:9px 12px;font-size:10px;color:var(--text-muted);border-top:1px solid var(--border-subtle);letter-spacing:0.5px;background:var(--bg-sunken)}
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(179,74,63,0.25)}50%{box-shadow:0 0 0 4px rgba(179,74,63,0.12)}}
.evil-pulse{animation:pulse-red 2.2s infinite}

/* 产品化外壳：侧边栏 / 浮层 */
.product-drawer{
  position:fixed;top:0;right:0;height:100%;width:400px;max-width:94vw;
  background:var(--bg-surface);border-left:1px solid var(--border-strong);
  transform:translateX(100%);transition:transform 0.35s ease;z-index:50;
  display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(43,40,35,0.12);
}
.product-drawer.open{transform:translateX(0)}
.product-drawer .ph{padding:16px 18px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between}
.product-drawer .ph h2{font-family:"Noto Serif SC",serif;color:var(--ink);font-size:15px;letter-spacing:2px}
.product-drawer .closex{cursor:pointer;color:var(--text-muted);font-size:18px;border:none;background:none}
.product-drawer .closex:hover{color:var(--accent)}
.product-drawer .pbody{padding:16px 18px;overflow-y:auto;flex:1;font-size:11px;line-height:1.8;color:var(--ink-soft)}
.product-drawer .pbody h4{color:var(--ink);font-size:12px;margin:14px 0 6px;font-family:"Noto Serif SC",serif;border-left:2px solid var(--accent);padding-left:7px}
.kb-item{background:var(--bg-main);border:1px solid var(--border-subtle);border-radius:var(--ctrl-radius);padding:9px 11px;margin-bottom:6px;cursor:pointer;transition:all 0.2s}
.kb-item:hover{border-color:var(--accent);background:rgba(138,90,43,0.04)}
.kb-item .kt{color:var(--accent);font-size:11px;font-weight:600}
.kb-item .kd{color:var(--text-muted);font-size:10px;margin-top:2px;line-height:1.6}
.tier-card{border:1px solid var(--border-subtle);border-radius:var(--card-radius);padding:11px 13px;margin-bottom:8px;background:var(--bg-main)}
.tier-card.t1{border-left:3px solid var(--layer4)}
.tier-card.t2{border-left:3px solid var(--accent)}
.tier-card.t3{border-left:3px solid var(--layer6)}
.tier-card .tn{font-size:11px;font-weight:600;color:var(--ink)}
.tier-card .tp{font-size:10px;color:var(--text-muted);margin-top:3px}
.hook-box{background:rgba(138,90,43,0.05);border:1px dashed var(--accent);border-radius:var(--card-radius);padding:11px 13px;margin-top:12px;font-size:10px;color:var(--ink-soft);line-height:1.7}
.mask{position:fixed;inset:0;background:rgba(43,40,35,0.32);z-index:40;opacity:0;pointer-events:none;transition:opacity 0.3s}
.mask.show{opacity:1;pointer-events:auto}

/* ===== 报告卡片化排版（Task 2/3） ===== */
.report-wrap{font-size:11px;line-height:1.7;color:var(--ink-soft)}
.report-head{background:var(--bg-main);border:1px solid var(--border-subtle);border-radius:var(--card-radius);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow-soft)}
.report-head h3{font-family:"Noto Serif SC",serif;color:var(--accent);font-size:13px;font-weight:600;margin-bottom:6px}
.report-head p{color:var(--ink-soft);line-height:1.8}
.report-meta{margin-top:8px;font-size:9px;color:var(--text-muted);letter-spacing:0.5px}
.sec-title{color:var(--ink);font-size:12px;margin:16px 0 8px;font-family:"Noto Serif SC",serif;border-left:2px solid var(--accent);padding-left:7px}
.palace-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.pcard{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--card-radius);padding:10px 11px;transition:border-color 0.2s,transform 0.2s;box-shadow:var(--shadow-soft)}
.pcard:hover{transform:translateY(-1px)}
.pcard.hl{border-color:rgba(179,74,63,0.5);background:rgba(179,74,63,0.05)}
.pc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.pc-name{font-family:"Noto Serif SC",serif;font-weight:700;color:var(--ink);font-size:12px}
.pc-sihua{font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;color:#fff}
.pc-sihua.s-ji{background:#b34a3f}.pc-sihua.s-lu{background:#5f8a4e}.pc-sihua.s-quan{background:#b07d3a}.pc-sihua.s-ke{background:#5f8aa6}
.pc-kw{font-size:10px;color:var(--accent);margin-bottom:4px;min-height:14px;font-family:"Noto Serif SC",serif}
.pc-concl{font-size:10px;color:var(--ink-soft);line-height:1.6}
.resonance-box{display:flex;flex-direction:column;gap:6px}
.res-item{font-size:10px;padding:8px 11px;border-radius:var(--ctrl-radius);line-height:1.6}
.res-item b{font-family:"Noto Serif SC",serif;margin-right:4px}
.res-item.ji{background:rgba(179,74,63,0.08);border:1px solid rgba(179,74,63,0.35);color:#9c4a40}
.res-item.lu{background:rgba(95,138,78,0.08);border:1px solid rgba(95,138,78,0.32);color:#4e7340}
.res-item{background:var(--bg-surface);border:1px solid var(--border-subtle);color:var(--ink-soft)}
/* 行动清单 */
.actions-block{margin-top:16px;border-top:1px dashed var(--border-subtle);padding-top:14px}
.act-title{color:var(--accent);font-size:12px;font-family:"Noto Serif SC",serif;margin-bottom:9px}
.act-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.act-card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--card-radius);padding:9px 10px;box-shadow:var(--shadow-soft)}
.act-head{font-family:"Noto Serif SC",serif;font-weight:700;color:var(--ink);font-size:12px;margin-bottom:7px;display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding-bottom:5px}
.act-sub{font-size:8px;color:var(--text-muted);font-weight:400;font-family:"Noto Sans SC",sans-serif}
.act-list{list-style:none}
.act-list li{display:flex;align-items:flex-start;gap:5px;font-size:9.5px;color:var(--ink-soft);margin-bottom:5px;line-height:1.5}
.act-flag{flex:0 0 auto;width:15px;height:15px;border-radius:4px;font-size:9px;font-weight:700;color:#fff;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.act-flag.f-避{background:#b34a3f}.act-flag.f-进{background:#5f8a4e}.act-flag.f-主{background:#b07d3a}.act-flag.f-学{background:#5f8aa6}.act-flag.f-做{background:#8a6fae}
.act-pal{flex:0 0 auto;color:var(--accent);font-weight:600;font-family:"Noto Serif SC",serif}
.act-txt{flex:1}
.act-empty{color:var(--text-muted);font-style:italic}
.act-note{margin-top:9px;font-size:9px;color:var(--text-muted);line-height:1.7;background:rgba(138,90,43,0.04);border:1px solid var(--border-subtle);border-radius:var(--card-radius);padding:8px 10px}
.act-note b{color:var(--accent)}

/* ===== 打印 / 导出 PDF 独立排版（Task 2） ===== */
@media print{
  @page{margin:14mm}
  body{background:#fff!important;color:#1a1a1a!important;overflow:visible!important}
  .paper-grain,.mask,.product-drawer .ph .closex,.rotate-tip,.layer-nav,.legend,.main,.info,.btn-action,.hook-box{display:none!important}
  .product-drawer{position:static!important;transform:none!important;width:100%!important;max-width:none!important;background:#fff!important;border:none!important;box-shadow:none!important;height:auto!important}
  .product-drawer .pbody{padding:0!important;overflow:visible!important;color:#1a1a1a!important;font-size:11pt!important}
  .report-wrap,.report-head,.pcard,.act-card,.res-item,.kb-item,.lstrip,.tier-card{background:#fff!important;border-color:#ccc!important;color:#1a1a1a!important;box-shadow:none!important}
  .report-head h3,.sec-title,.act-title,.pc-name,.pc-kw{color:#7a4d00!important}
  .pc-concl,.act-txt,.report-head p,.report-meta{color:#333!important}
  .pcard.hl{border-color:#b34a3f!important;background:#fdf3f1!important}
  .palace-grid{grid-template-columns:repeat(3,1fr)!important}
  .act-grid{grid-template-columns:1fr 1fr 1fr!important}
  .act-flag{color:#fff!important}
  .pc-sihua{color:#fff!important}
  *{box-shadow:none!important;animation:none!important}
}

@media(max-width:1100px){
  .main{flex-direction:column;align-items:center}
  .rings{flex:none;max-width:100%}
  .readout{max-width:none;width:100%;max-height:none}
  #ringCanvas{max-width:min(500px,90vw)}
}
@media(max-width:600px){
  .header h1{font-size:16px;letter-spacing:2px}
  .layer-nav{grid-template-columns:repeat(2,1fr);gap:5px;padding:8px 10px 4px}
  .layer-nav::-webkit-scrollbar{display:none}
  .lbtn{padding:5px 2px;font-size:11px}
  .lbtn.reset{flex-direction:row}
  .nav-hint{white-space:normal;text-align:left;font-size:8px}
  .legend{gap:8px;font-size:9px}
  .main{flex-direction:column;align-items:center;padding:6px 8px 14px}
  .rings{flex:none;max-width:100%;width:100%}
  #ringCanvas{max-width:min(440px,94vw);margin:0 auto}
  .readout{max-width:none;width:100%;max-height:none;min-width:0}
  .input-panel{gap:6px 8px}
}
/* 手机竖屏：提示可横屏获得更大盘面；并排双视图由「圆盘 + 右侧六层清单」在横屏下自动切换 */
@media(max-width:600px) and (orientation:portrait){
  .rotate-tip{display:flex}
}
.rotate-tip{display:none;align-items:center;justify-content:center;gap:6px;font-size:9px;color:var(--ink-soft);
  background:rgba(138,90,43,0.05);border:1px dashed rgba(138,90,43,0.3);border-radius:var(--card-radius);
  padding:5px 10px;margin:0 8px 6px}
@media(max-width:600px) and (orientation:landscape){
  .main{flex-direction:row;align-items:flex-start;gap:8px}
  .rings{flex:0 0 auto}
  #ringCanvas{max-width:min(56vh,420px)}
  .readout{flex:1;max-height:88vh}
}
@media(prefers-reduced-motion:reduce){
  .evil-pulse{animation:none!important}
}




</style>
</head>
<body>
<div class="paper-grain"></div>
<div class="wrapper">

/* ================================================================

 * ================================================================ */
function ganzhiIdx(g,z){for(var n=0;n<60;n++){if(n%10===g&&n%12===z)return n;}return 0;}
function yearGanZhi(year){var g=((year-4)%10+10)%10;var z=((year-4)%12+12)%12;return{g:g,z:z};}
function calcLifePalace(month,hour){var monthPos=((2+month-1)%12+12)%12;return((monthPos-hour)%12+12)%12;}
function calcBodyPalace(month,hour){var monthPos=((2+month-1)%12+12)%12;return((monthPos+hour)%12+12)%12;}
function calcTwelvePalaces(lifeP){var arr=[];for(var i=0;i<12;i++){arr.push(((lifeP-i)%12+12)%12);}return arr;}
function calcPalaceGans(yearGan){var yinGan=WU_HU[yearGan];var gans=[];for(var i=0;i<12;i++){var zhiIdx=i;var steps=((zhiIdx-2)%12+12)%12;gans[zhiIdx]=(yinGan+steps)%10;}return gans;}
function calcWuxingJu(lifeGan,lifeZhi){var idx=ganzhiIdx(lifeGan,lifeZhi);var wx=NAYIN[idx];return{wx:wx,ju:JU_NUM[wx],name:JU_NAME[wx]};}
function calcZiwei(ju,day){var M=ju,D=day;var Q=Math.ceil(D/M);var R=Q*M-D;var pos=1+Q+(R%2===0?R:-R);return((pos%12)+12)%12;}
function calcTianfu(ziwei){return((4-ziwei)%12+12)%12;}
function calc14Stars(ziwei,tianfu){var stars={};stars['紫微']=ziwei;stars['天机']=((ziwei-1)%12+12)%12;stars['太阳']=((ziwei-3)%12+12)%12;stars['武曲']=((ziwei-4)%12+12)%12;stars['天同']=((ziwei-5)%12+12)%12;stars['廉贞']=((ziwei-8)%12+12)%12;stars['天府']=tianfu;stars['太阴']=(tianfu+1)%12;stars['贪狼']=(tianfu+2)%12;stars['巨门']=(tianfu+3)%12;stars['天相']=(tianfu+4)%12;stars['天梁']=(tianfu+5)%12;stars['七杀']=(tianfu+6)%12;stars['破军']=(tianfu+10)%12;return stars;}
function starsByPalace(stars){var map={};for(var i=0;i<12;i++)map[i]=[];for(var name in stars){var pos=stars[name];map[pos].push(name);}return map;}
function calcDaxian(lifeP,ju,gender,yearGan){var isYang=(yearGan%2===0);var dir=(isYang&&gender==='male')||(!isYang&&gender==='female')?1:-1;var palaces=[];for(var k=0;k<12;k++){var pos=((lifeP+k*dir)%12+12)%12;var ageStart=ju+k*10;var ageEnd=ageStart+9;palaces.push({pos:pos,ageStart:ageStart,ageEnd:ageEnd,ageStr:ageStart+'-'+ageEnd+'岁'});}return palaces;}
function findDaxianIdx(daxians,age){for(var i=0;i<daxians.length;i++){if(age>=daxians[i].ageStart&&age<=daxians[i].ageEnd)return i;}return 0;}
function calcLiuyuePalace(liunianP,birthMonth,birthHour,queryMonth){var monthPos=((liunianP-(birthMonth-1))%12+12)%12;var doujun=((monthPos+birthHour)%12+12)%12;return((doujun+(queryMonth-1))%12+12)%12;}
function calcLiuriPalace(liuyueP,queryDay){return((liuyueP+(queryDay-1))%12+12)%12;}
function calcLiushiPalace(liuriP,queryHour){return((liuriP+queryHour)%12+12)%12;}
function calcSiHua(ganIdx){var s=SIHUA[ganIdx];return{lu:s.lu,quan:s.quan,ke:s.ke,ji:s.ji,starMap:(function(){var m={};m[s.lu]='lu';m[s.quan]='quan';m[s.ke]='ke';m[s.ji]='ji';return m;})()};}

function generateChart(input){
  var by=input.birthYear,bm=input.birthMonth,bd=input.birthDay,bh=input.birthHour;
  var gender=input.gender;
  var qy=input.queryYear,qm=input.queryMonth,qd=input.queryDay,qh=input.queryHour;
  var bYZ=yearGanZhi(by);var qYZ=yearGanZhi(qy);
  var lifeP=calcLifePalace(bm,bh);var bodyP=calcBodyPalace(bm,bh);
  var twelve=calcTwelvePalaces(lifeP);
  var palaceGans=calcPalaceGans(bYZ.g);
  var wuxing=calcWuxingJu(palaceGans[lifeP],lifeP);
  var ziwei=calcZiwei(wuxing.ju,bd);var tianfu=calcTianfu(ziwei);
  var stars=calc14Stars(ziwei,tianfu);var starMap=starsByPalace(stars);
  var daxians=calcDaxian(lifeP,wuxing.ju,gender,bYZ.g);
  var age=qy-by;var dxIdx=findDaxianIdx(daxians,age);var curDx=daxians[dxIdx];
  var mpBenming=lifeP;var mpDaxian=curDx.pos;var mpLiunian=qYZ.z;var mpLiuyue=calcLiuyuePalace(mpLiunian,bm,bh,qm);var mpLiuri=calcLiuriPalace(mpLiuyue,qd);var mpLiushi=calcLiushiPalace(mpLiuri,qh);
  var ganBenming=bYZ.g;var ganDaxian=palaceGans[mpDaxian];var ganLiunian=qYZ.g;
  var liuyueYinGan=WU_HU[ganLiunian];var ganLiuyue=((liuyueYinGan+(qm-1))%10+10)%10;
  var solarDate=lunarToSolar(qy,qm,qd);var dayGZ=getDayGanZhi(solarDate.getFullYear(),solarDate.getMonth()+1,solarDate.getDate());var ganLiuri=dayGZ.g;
  var liushiZiGan=WU_SHU[ganLiuri];var ganLiushi=((liushiZiGan+qh)%10+10)%10;
  var huaBenming=calcSiHua(ganBenming);var huaDaxian=calcSiHua(ganDaxian);var huaLiunian=calcSiHua(ganLiunian);var huaLiuyue=calcSiHua(ganLiuyue);var huaLiuri=calcSiHua(ganLiuri);var huaLiushi=calcSiHua(ganLiushi);
  var layerMP=[mpBenming,mpDaxian,mpLiunian,mpLiuyue,mpLiuri,mpLiushi];
  var layerGan=[ganBenming,ganDaxian,ganLiunian,ganLiuyue,ganLiuri,ganLiushi];
  var layerHua=[huaBenming,huaDaxian,huaLiunian,huaLiuyue,huaLiuri,huaLiushi];
  var layerNames=['本命','大限','流年','流月','流日','流时'];
  var layerSub=[
    GAN[ganBenming]+'干·一辈子',
    GAN[ganDaxian]+'干·'+curDx.ageStr,
    GAN[ganLiunian]+'干·'+GAN[qYZ.g]+ZHI[qYZ.z]+'年',
    GAN[ganLiuyue]+'干·'+qm+'月',
    GAN[ganLiuri]+'干·'+qd+'日',
    GAN[ganLiushi]+'干·'+ZHI[qh]+'时'
  ];
  var layers=[];
  for(var li=0;li<6;li++){
    var layerData=[];var mp=layerMP[li];var hua=layerHua[li];
    for(var bp=0;bp<12;bp++){
      var palaceIdx=((mp-bp)%12+12)%12;var palaceName=PN[palaceIdx];
      var s=starMap[bp]?starMap[bp].slice():[];
      var sihua=null;
      for(var si=0;si<s.length;si++){if(hua.starMap[s[si]]){sihua={type:hua.starMap[s[si]],star:s[si]};break;}}
      layerData.push({palaceName:palaceName,stars:s,sihua:sihua});
    }
    layers.push(layerData);
  }
  return{
    input:input,bYZ:bYZ,qYZ:qYZ,lifeP:lifeP,bodyP:bodyP,twelve:twelve,palaceGans:palaceGans,
    wuxing:wuxing,ziwei:ziwei,tianfu:tianfu,stars:stars,starMap:starMap,daxians:daxians,curDx:curDx,dxIdx:dxIdx,age:age,
    layerMP:layerMP,layerGan:layerGan,layerHua:layerHua,layerNames:layerNames,layerSub:layerSub,layers:layers
  };
}

    meaning=lctx.prefix+'的'+pn+'（'+field+'）：'+main.core+'。'+main.trait+'。';advice=main.advice;

  }

      '流年':{lu:'今年禄到，顺势发财',quan:'今年权到，争抢加剧但有掌控',ke:'今年科照，名气提升',ji:'今年忌扰，此处需特别注意'},
      '流月':{lu:'本月禄到，进财顺利',quan:'本月权到，需主动争取',ke:'本月科照，学习展示有利',ji:'本月忌扰，短期注意'},
      '流日':{lu:'今日禄到，有小财运',quan:'今日权到，适合做决定',ke:'今日科照，适合考试展示',ji:'今日忌扰，当天小心'},
      '流时':{lu:'此时禄到，短期进财',quan:'此时权到，把握主动',ke:'此时科照，思路清晰',ji:'此时忌扰，暂避锋芒'}
    };
    var huaLayer=huaCtx[layerName]||huaCtx['流年'];
    meaning+=' '+sihua.star+HUA_LABEL[sihua.type]+'——'+huaLayer[sihua.type]+'。';
  }
  meaning+='（'+lctx.suffix+'）';
  return{meaning:meaning,advice:advice};
}

  var lines=[];
  lines.push('═══════ '+title+' ═══════');
  lines.push('生成时间：'+new Date().toLocaleString('zh-CN'));
  lines.push('');
  lines.push('【命盘总览 · 格局定性】');
  /* 开头段：学术化、去迷信的格局定性风格 */
  var mingStars=c.layers[0][c.layerMP[0]].stars;

  var shenStars=c.layers[0][c.bodyP].stars;

  lines.push(' '+ziwuDesc);
  lines.push('');
  lines.push('【基础信息】');
  lines.push(' 出生：'+GAN[c.bYZ.g]+ZHI[c.bYZ.z]+'年 · 五行局 '+c.wuxing.name+' · 命宫在'+ZHI[c.lifeP]);
  lines.push(' 紫微'+ZHI[c.ziwei]+' · 命宫'+PS[c.lifeP]+' · 身宫'+PS[c.bodyP]);
  lines.push(' 查询流年：'+GAN[c.qYZ.g]+ZHI[c.qYZ.z]+'年 · 当前大限 '+c.curDx.ageStr);
  lines.push('');
  lines.push('【一、本命格局底色】');
  lines.push(' '+genReading(c.layers[0][c.layerMP[0]],'本命').meaning);
  lines.push(' 建议：'+genReading(c.layers[0][c.layerMP[0]],'本命').advice);
  lines.push('');
  lines.push('【二、今年（'+GAN[c.qYZ.g]+ZHI[c.qYZ.z]+'年）重点宫位】');
  /* 流年命宫所在宫位的解读 */
  var liuMp=c.layerMP[2];
  for(var bp=0;bp<12;bp++){
    if(c.layers[2][bp].palaceName==='命宫'){
      lines.push(' 流年命宫落：'+c.layers[2][bp].stars.join('·')+'（'+genReading(c.layers[2][bp],'流年').meaning+'）');
    }
  }
  lines.push('');
  lines.push('【三、十二宫速览（今年）】');
  for(var i=0;i<12;i++){
    /* 固定宫位索引 i → 流年层实际位置 bp，确保标题 PN[i] 与数据对应 */
    var bp=((c.layerMP[2]-i)%12+12)%12;
    var pd=c.layers[2][bp];
    var r=genReading(pd,'流年');
    if(pd.stars.length===0){
      /* 空宫：借对宫星曜，给一句可懂的话 */
      var oppIdx=((bp+6)%12);
      var oppStars=c.layers[2][oppIdx].stars;
      var oppName=c.layers[2][oppIdx].palaceName;
      var oppR=genReading(c.layers[2][oppIdx],'流年');
      var oppMean=oppR.meaning.replace(/^今年/,'').replace(/（今年重点关注）$/,'');
      lines.push(' '+PN[i]+'：空宫（借对宫'+oppName+'之'+oppStars.join('·')+'）— 今年'+PN[i]+'的事宜，可参考对宫'+oppName+'的走势：'+oppMean);
    }else{
      var mean=r.meaning.replace(/（今年重点关注）$/,'').replace(/^今年/,'今年');
      lines.push(' '+PN[i]+'：'+pd.stars.join('·')+' — '+mean);
    }
  }
  lines.push('');
  lines.push('【四、化禄/化禄共振提示】');
  lines.push(' 「共振」好比同一层楼被几盏灯同时照亮：多层都在同一个宫位化禄，代表这个领域今年顺遂、进益、机会多，适合主动推进；多层都在同一个宫位化忌，代表这个领域今年压力、执念、反复纠结多，需要收着点、谨慎处理。');
  var st={};for(var L=0;L<3;L++){for(var b=0;b<12;b++){var p=c.layers[L][b];if(p.sihua){if(!st[p.sihua.type])st[p.sihua.type]=[];st[p.sihua.type].push(p.palaceName+'('+c.layerNames[L]+')');}}}
  if(st['lu'])lines.push(' 化禄：'+st['lu'].join('、')+' → 进益发散，机会叠加，宜把握推进');
  if(st['ji'])lines.push(' 化忌：'+st['ji'].join('、')+' → 内耗/课题，能量收紧，宜谨慎收束');
  if(!st['ji']&&!st['lu'])lines.push(' 本年无明显禄忌共振，整体平稳。');
  lines.push('');
  lines.push('【五、顺势建议】');
  lines.push(' 本报告基于确定性排盘规则生成，属趋势分析与心性解读，仅供参考与自我觉察。');
  lines.push(' 重大决策请结合现实多方考量，理性对待。');
  lines.push('════════════════════════════');
  return lines.join('\n');
}

    '子女':{ji:'晚辈、下属、创意项目别逼太紧',lu:'下属、晚辈、作品容易出成绩',quan:'主导项目推进，给团队定方向',ke:'展示作品/方案，适合面试、考试',empty:'多关注身边年轻人，别操之过急'},

    '交友':{ji:'社交别轻信，远离是非和利益纠葛',lu:'人脉活络，多参加社交活动',quan:'在社交场合主动牵头、组织',ke:'结交良师益友，拓展学习圈',empty:'精简社交，维护三五位核心关系'},
    '官禄':{ji:'工作上守成，新项目别冒进',lu:'事业顺，适合推进项目、争取资源',quan:'主动承担任务，主导项目',ke:'展示专业能力，利升职、考证、竞聘',empty:'梳理职业规划，主动学习一项新技能'},

  html+='</div>';
  return html;
}

cv.width=W*dpr;cv.height=H*dpr;
var sel=-1,hov=-1;
/* vis 两态：0=关（盘面环与下方叠读均不显示） 2=开（显示）。默认开启本命(0)与流年(2)，其余关闭。 */
var vis=[2,0,2,0,0,0];
var HILITE_DEFAULT=[0,2];
function bAng(p){return(270+p*30)*Math.PI/180;}
function draw(){
  if(!chart)return;
  cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);
  var ringW=[44,42,38,34,32,28];var rds=[IR];var acc=IR;
  for(var i=0;i<6;i++){if(vis[i]){acc+=2+ringW[i];rds.push(acc);}}
  var maxR=rds[rds.length-1];
  cx.fillStyle='#f7f5f0';cx.fillRect(0,0,W,H);
  var bg=cx.createRadialGradient(CX,CY,0,CX,CY,maxR+25);
  bg.addColorStop(0,'rgba(138,90,43,0.06)');bg.addColorStop(1,'rgba(138,90,43,0)');
  cx.fillStyle=bg;cx.fillRect(0,0,W,H);
  var ri=0;
  for(var li=0;li<6;li++){
    if(vis[li]===0)continue;
    var r0=rds[ri],r1=rds[ri+1];
    var hi=true;                              /* 进入此分支即“开”层，全部以实色渲染 */
    var Lc=LAYER_COLORS[li];
    var Lb=LAYER_BG[li];
    cx.beginPath();cx.arc(CX,CY,r1,0,Math.PI*2);cx.arc(CX,CY,r0,0,Math.PI*2,true);
    cx.fillStyle=Lb+'0.05)';cx.fill();
    cx.beginPath();cx.arc(CX,CY,r1,0,Math.PI*2);cx.strokeStyle=Lb+(hi?'0.32)':'0.14)');cx.lineWidth=hi?1.2:0.8;cx.stroke();
    for(var bp=0;bp<12;bp++){
      var a1=bAng(bp)-Math.PI/24,a2=bAng(bp)+Math.PI/24,am=bAng(bp);
      var s=bp===sel,h=bp===hov;var pd=chart.layers[li][bp];
      if(s||h){
        cx.beginPath();cx.arc(CX,CY,r1,a1,a2);cx.arc(CX,CY,r0,a2,a1,true);cx.closePath();
        cx.fillStyle=Lb+(s?(hi?'0.34)':'0.22)'):(hi?'0.12)':'0.08)'));cx.fill();
      }
      cx.beginPath();cx.moveTo(CX+r0*Math.cos(a1),CY+r0*Math.sin(a1));cx.lineTo(CX+r1*Math.cos(a1),CY+r1*Math.sin(a1));
      cx.strokeStyle='rgba(43,40,35,0.06)';cx.lineWidth=0.5;cx.stroke();
      var nr=r0+9;cx.save();cx.translate(CX+nr*Math.cos(am),CY+nr*Math.sin(am));
      var ta=am;if(ta>Math.PI/2&&ta<Math.PI*1.5)ta+=Math.PI;cx.rotate(ta);
      cx.fillStyle=s?Lc:(hi?'rgba(43,40,35,0.42)':'rgba(120,114,102,0.55)');cx.font='8px "Noto Serif SC",serif';cx.textAlign='center';cx.textBaseline='middle';
      cx.fillText(PS[chart.layerMP[li]===bp?0:((chart.layerMP[li]-bp)%12+12)%12],0,0);cx.restore();
      if(pd.stars.length>0){
        var tr=(r0+r1)/2+2;cx.save();cx.translate(CX+tr*Math.cos(am),CY+tr*Math.sin(am));
        var t2=am;if(t2>Math.PI/2&&t2<Math.PI*1.5)t2+=Math.PI;cx.rotate(t2);
        cx.fillStyle=Lc;cx.font='11px "Noto Serif SC",serif';cx.globalAlpha=1;cx.textAlign='center';cx.textBaseline='middle';
        cx.fillText(pd.stars.join('·'),0,0);cx.globalAlpha=1;cx.restore();
      }
      if(pd.sihua){var dr=r1-5;cx.beginPath();cx.arc(CX+dr*Math.cos(am),CY+dr*Math.sin(am),hi?3.5:2.6,0,Math.PI*2);
        var hc=pd.sihua.type;cx.fillStyle=hc==='ji'?'#b34a3f':hc==='lu'?'#5f8a4e':hc==='quan'?'#b07d3a':'#5f8aa6';cx.globalAlpha=1;cx.fill();cx.globalAlpha=1;}
    }
    ri++;
  }
  cx.beginPath();cx.arc(CX,CY,CR,0,Math.PI*2);cx.fillStyle='#efece6';cx.fill();
  cx.strokeStyle='rgba(138,90,43,0.4)';cx.lineWidth=1.2;cx.stroke();
  cx.fillStyle='#8a5a2b';cx.font='bold 13px "Noto Serif SC",serif';cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText('紫微叠盘',CX,CY-8);
  cx.fillStyle='#928c80';cx.font='9px "Noto Sans SC",sans-serif';
  cx.fillText(chart.qYZ?GAN[chart.qYZ.g]+ZHI[chart.qYZ.z]:'',CX,CY+8);
  var olr=maxR+16;
  for(var p=0;p<12;p++){var a=bAng(p);cx.fillStyle=(p===sel||p===hov)?'#8a5a2b':'#6b655a';cx.font='bold 13px "Noto Serif SC",serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(BR[p],CX+olr*Math.cos(a),CY+olr*Math.sin(a));}
  if(sel>=0){var am=bAng(sel);cx.beginPath();cx.moveTo(CX+IR*Math.cos(am-Math.PI/24),CY+IR*Math.sin(am-Math.PI/24));cx.lineTo(CX+maxR*Math.cos(am-Math.PI/24),CY+maxR*Math.sin(am-Math.PI/24));cx.moveTo(CX+IR*Math.cos(am+Math.PI/24),CY+IR*Math.sin(am+Math.PI/24));cx.lineTo(CX+maxR*Math.cos(am+Math.PI/24),CY+maxR*Math.sin(am+Math.PI/24));cx.strokeStyle='rgba(138,90,43,0.5)';cx.lineWidth=1.8;cx.stroke();}
}
function posFrom(e){
  var r=cv.getBoundingClientRect();var scaleX=W/r.width,scaleY=H/r.height;
  var mx=(e.clientX-r.left)*scaleX,my=(e.clientY-r.top)*scaleY;
  var dx=mx-CX,dy=my-CY,dist=Math.sqrt(dx*dx+dy*dy);
  var deg=((Math.atan2(dy,dx)*180/Math.PI)-270+360)%360;if(deg<0)deg+=360;
  var pos=Math.round(deg/30)%12;var rds=[IR];var acc=IR;
  for(var i=0;i<6;i++){if(vis[i]!==0){acc+=2+[44,42,38,34,32,28][i];rds.push(acc);}}
  if(dist<rds[0]||dist>rds[rds.length-1])return-1;return pos;
}
cv.addEventListener('click',function(e){var p=posFrom(e);if(p>=0){sel=(sel===p)?-1:p;draw();updateReadout();}});
cv.addEventListener('mousemove',function(e){var p=posFrom(e);if(p!==hov){hov=p;draw();}});
cv.addEventListener('mouseleave',function(){hov=-1;draw();});

function updateReadout(){
  if(!chart)return;
  var el=document.getElementById('mc');var ra=document.getElementById('ra'),rt=document.getElementById('rt');
  var cc=document.getElementById('cc'),cr=document.getElementById('cr');
  if(sel<0){
    el.innerHTML='<h3>点击圆盘上的格子</h3><p class="ehint">每层命宫位置不同，外层的宫名和内层<span style="color:var(--accent)">对不上</span>——这就是"转盘"。<br>改变上方查询时间，盘面会<span style="color:var(--accent)">实时变化</span>，这才是活盘。</p>';
    ra.classList.remove('show');cc.style.display='none';cv.classList.remove('evil-pulse');return;
  }
  var br=BR[sel],st={};var ch='';
  for(var i=0;i<6;i++){if(vis[i]===0)continue;var pd=chart.layers[i][sel];
    if(pd.sihua){var ht=pd.sihua.type;if(!st[ht])st[ht]=[];st[ht].push(chart.layerNames[i]);}
    var bd='';if(pd.sihua){var sc=pd.sihua.type==='ji'?'#b34a3f':pd.sihua.type==='lu'?'#5f8a4e':pd.sihua.type==='quan'?'#b07d3a':'#5f8aa6';bd=' <span style="background:'+sc+';color:#fff;padding:1px 5px;border-radius:3px;font-size:9px">'+HUA_LABEL[pd.sihua.type]+'</span>';}
    ch+='<div class="cr"><span class="ctag" style="background:'+LAYER_COLORS[i]+'">'+chart.layerNames[i]+'</span><span class="carr">'+GAN[chart.layerGan[i]]+'干</span><span class="cp" style="color:'+LAYER_COLORS[i]+'">'+pd.palaceName+'</span><span class="cs">'+(pd.stars.length?pd.stars.join('·'):'空')+(pd.sihua?' · '+pd.sihua.star+HUA_LABEL[pd.sihua.type]:'')+'</span></div>';
  }
  cc.style.display='block';cr.innerHTML=ch;
  var h='<h3>'+br+'宫 · 六层叠读</h3>';
  for(var i=0;i<6;i++){if(vis[i]===0)continue;var pd=chart.layers[i][sel];var reading=genReading(pd,chart.layerNames[i]);var ganName=GAN[chart.layerGan[i]];var hua=chart.layerHua[i];
    var bd='';if(pd.sihua){var sc=pd.sihua.type==='ji'?'#b34a3f':pd.sihua.type==='lu'?'#5f8a4e':pd.sihua.type==='quan'?'#b07d3a':'#5f8aa6';bd=' <span style="background:'+sc+';color:#fff;padding:1px 5px;border-radius:3px;font-size:9px">'+HUA_LABEL[pd.sihua.type]+'</span>';}
    var huaSummary='<span style="color:#5f8a4e">'+hua.lu+'禄</span> · <span style="color:#b07d3a">'+hua.quan+'权</span> · <span style="color:#5f8aa6">'+hua.ke+'科</span> · <span style="color:#b34a3f">'+hua.ji+'忌</span>';
    h+='<div class="lstrip'+(i===0?' open':'')+'" style="border-left-color:'+LAYER_COLORS[i]+';background:'+LAYER_BG[i]+'0.03)" onclick="this.classList.toggle(\'open\')">';
    h+='<div class="lhead"><span class="ltag" style="background:'+LAYER_COLORS[i]+'">'+chart.layerNames[i]+'</span><span class="lp" style="color:'+LAYER_COLORS[i]+'">'+ganName+'干</span><span class="lp">'+pd.palaceName+'</span><span class="ls" style="color:'+LAYER_COLORS[i]+'">'+(pd.stars.length?pd.stars.join('·'):'空')+bd+'</span><span class="lexp"></span></div>';
    h+='<div class="lbody"><div style="margin-bottom:3px;font-size:9px;color:var(--text-muted)">本层四化：'+huaSummary+'</div>';
    h+='<div style="margin-bottom:4px"><span style="color:var(--text-muted)">解读：</span>'+reading.meaning+'</div>';
    h+='<div class="sug"><span class="sug-mark">建议</span>'+reading.advice+'</div></div></div>';
  }
  el.innerHTML=h;
  var rh=[];var types=['ji','lu','quan','ke'];
  for(var k=0;k<4;k++){var ht=types[k];if(st[ht]&&st[ht].length>=2){var lb=ht==='ji'?'化忌':ht==='lu'?'化禄':ht==='quan'?'化权':'化科';var ef=ht==='ji'?'内耗加倍！':ht==='lu'?'福气加倍':ht==='quan'?'争抢加剧':'名气加持';rh.push('<b>'+lb+'共振</b>：'+st[ht].join(' + ')+' 同在'+br+'宫 → '+ef);}}
  if(rh.length){rt.innerHTML=rh.join('<br>');ra.classList.add('show');if(st['ji']&&st['ji'].length>=2)cv.classList.add('evil-pulse');else cv.classList.remove('evil-pulse');}
  else{ra.classList.remove('show');cv.classList.remove('evil-pulse');}
}
function navStateClass(v){return v===2?' on hi':' off';}
function navBg(v,i){return v===2?LAYER_COLORS[i]:'var(--bg-surface)';}
function buildNav(){
  var nav=document.getElementById('nav');var legend=document.getElementById('legend');
  nav.innerHTML='';legend.innerHTML='';
  for(var i=0;i<6;i++){
    var b=document.createElement('button');b.className='lbtn'+navStateClass(vis[i]);
    b.innerHTML='<span class="lname"><span class="ldot" style="background:'+LAYER_COLORS[i]+'"></span>'+chart.layerNames[i]+(vis[i]===2?'<span class="star">★</span>':'')+'</span><span class="lsub">'+chart.layerSub[i]+'</span>';
    b.style.borderColor=vis[i]===0?'var(--border-subtle)':'transparent';
    b.style.background=navBg(vis[i],i);
    (function(idx,btn){
      btn.onclick=function(){
        /* 两态开关：0=关（盘面与下方解读均不显示） → 2=开（显示） */
        vis[idx]=vis[idx]===0?2:0;
        btn.className='lbtn'+navStateClass(vis[idx]);
        btn.style.borderColor=vis[idx]===0?'var(--border-subtle)':'transparent';
        btn.style.background=navBg(vis[idx],idx);
        draw();updateReadout();
      };
    })(i,b);
    nav.appendChild(b);
    var lg=document.createElement('div');lg.className='lg-item'+(vis[i]===2?' hi':' off');
    lg.innerHTML='<span class="ldot" style="background:'+LAYER_COLORS[i]+'"></span>'+chart.layerNames[i]+' '+chart.layerSub[i];legend.appendChild(lg);
  }
  /* 全部开 / 全部关 切换 */
  var allOn=vis.every(function(v){return v===2;});
  var rb=document.createElement('button');rb.className='lbtn reset';
  rb.textContent=allOn?'☆ 全部关闭':'★ 全部开启';
  rb.onclick=function(){
    for(var i=0;i<6;i++)vis[i]=allOn?0:2;
    buildNav();draw();updateReadout();
  };
  nav.appendChild(rb);
  var hint=document.createElement('div');hint.className='nav-hint';
  hint.textContent='点击图层标签可开/关对应层级：开（★ 实色）→ 盘面与该层下方解读都显示；关（灰虚线）→ 这一层不显示。默认开启本命与流年。';
  nav.appendChild(hint);
}
function updateInfo(){
  var c=chart;var bGan=GAN[c.bYZ.g],bZhi=ZHI[c.bYZ.z];var qGan=GAN[c.qYZ.g],qZhi=ZHI[c.qYZ.z];var mp=c.layerMP;
  var isYangYear=(c.bYZ.g%2===0);var genderLabel=(isYangYear?'阳':'阴')+(c.input.gender==='male'?'男':'女');
  var dirLabel=isYangYear?(c.input.gender==='male'?'顺行':'逆行'):(c.input.gender==='male'?'逆行':'顺行');
  document.getElementById('subInfo').innerHTML=bGan+bZhi+'年'+ZHI[c.input.birthHour]+'时 · '+c.wuxing.name+' · 命宫在'+ZHI[c.lifeP]+(c.stars['紫微']===c.stars['天府']?' · 紫微天府同坐'+ZHI[c.ziwei]:' · 紫微在'+ZHI[c.ziwei])+' · '+genderLabel+dirLabel+' · '+qGan+qZhi+'流年';
  document.getElementById('infoBar').innerHTML='本命命宫'+ZHI[mp[0]]+' · 大限命宫'+ZHI[mp[1]]+'（'+c.curDx.ageStr+'） · 流年命宫'+ZHI[mp[2]]+' · 流月命宫'+ZHI[mp[3]]+' · 流日命宫'+ZHI[mp[4]]+' · 流时命宫'+ZHI[mp[5]];
}
function doChart(){
  var input={
    birthYear:parseInt(document.getElementById('in_birthYear').value),
    birthMonth:parseInt(document.getElementById('in_birthMonth').value),
    birthDay:parseInt(document.getElementById('in_birthDay').value),
    birthHour:parseInt(document.getElementById('in_birthHour').value),
    gender:document.getElementById('in_gender').value,
    queryYear:parseInt(document.getElementById('in_queryYear').value),
    queryMonth:parseInt(document.getElementById('in_queryMonth').value),
    queryDay:parseInt(document.getElementById('in_queryDay').value),
    queryHour:parseInt(document.getElementById('in_queryHour').value)
  };
  chart=generateChart(input);buildNav();updateInfo();draw();updateReadout();
}
function initInputs(){
  var hourNames=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  var monthNames=['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','冬月','腊月'];
  var bySel=document.getElementById('in_birthYear');var qySel=document.getElementById('in_queryYear');
  for(var y=1940;y<=2030;y++){var yz=yearGanZhi(y);var label=y+'年('+GAN[yz.g]+ZHI[yz.z]+')';bySel.add(new Option(label,y));qySel.add(new Option(label,y));}
  bySel.value=1996;qySel.value=2026;
  var bmSel=document.getElementById('in_birthMonth');for(var m=1;m<=12;m++)bmSel.add(new Option(monthNames[m-1],m));bmSel.value=7;
  var bdSel=document.getElementById('in_birthDay');for(var d=1;d<=30;d++)bdSel.add(new Option('初'+d,d));bdSel.value=15;
  var bhSel=document.getElementById('in_birthHour');var qhSel=document.getElementById('in_queryHour');
  for(var h=0;h<12;h++){bhSel.add(new Option(hourNames[h]+'时',h));qhSel.add(new Option(hourNames[h]+'时',h));}
  bhSel.value=0;qhSel.value=7;
  var qmSel=document.getElementById('in_queryMonth');for(var m=1;m<=12;m++)qmSel.add(new Option(monthNames[m-1],m));qmSel.value=5;
  var qdSel=document.getElementById('in_queryDay');for(var d=1;d<=30;d++)qdSel.add(new Option('初'+d,d));qdSel.value=1;
  document.getElementById('btnCalc').addEventListener('click',doChart);
  document.getElementById('btnReport').addEventListener('click',openReport);
  document.getElementById('btnKB').addEventListener('click',openKB);
  document.getElementById('drawerClose').addEventListener('click',closeDrawer);
  document.getElementById('mask').addEventListener('click',closeDrawer);
  var inputs=document.querySelectorAll('#inputPanel select');inputs.forEach(function(el){el.addEventListener('change',doChart);});
}
initInputs();doChart();
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){draw();});}





</script>
